<!DOCTYPE html>

<style>body{margin:0;background:#f4f6f9;font-family:Arial,Helvetica,sans-serif;color:#1f2a44}

<script>
(function(){
var CSS="\n:host{display:block;margin:9px 0;--card:#fff;--sunk:#f1f3f8;--line:#e3e7ee;--hair:#eef0f5;--ink:#1f2a44;--muted:#5b6472;--faint:#9aa6b4;--accent:#3f6f8f;\n--fh:Arial,Helvetica,sans-serif;--fm:Roboto,Arial,sans-serif;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.45;color:var(--ink)}\n*{box-sizing:border-box}button{font-family:inherit}\n.bn{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}\n.face{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:9px 12px 8px}\n.face:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}\n.fhead{display:flex;align-items:flex-start;gap:10px}.ftxt{min-width:0;flex:1 1 auto}\n.kick{font-family:var(--fm);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 1px}\nh2.ft{font-family:var(--fh);font-weight:700;font-size:21px;line-height:1.15;margin:0;letter-spacing:-.01em}\n.sub{margin:2px 0 0;font-style:italic;color:var(--faint);font-size:clamp(11px,2.5vw,14px);line-height:1.2}\n.chv{flex:none;width:22px;height:22px;display:grid;place-items:center;color:var(--faint);transition:transform .25s ease;margin-top:3px}\n.bn.open .chv{transform:rotate(180deg);color:var(--ink)}\n.openhint{font-family:var(--fm);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:4px 0 0;text-align:right}\n.bar svg{display:block;width:100%;height:auto;margin-top:2px}\n.mini{display:none;margin-top:8px}\n.mini .strip{display:flex;height:30px;border-radius:6px;overflow:hidden}\n.mini ul{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px}\n.mini li{display:flex;align-items:center;gap:6px}.mini i{width:11px;height:11px;border-radius:2px;flex:none}.mini b{margin-left:auto;font-variant-numeric:tabular-nums}\n.bn.narrow .bar{display:none}.bn.narrow .mini{display:block}\n.drop{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}\n.bn.open .drop{grid-template-rows:1fr}.drop>.in{overflow:hidden;min-height:0}\n.pad{padding:0 12px 11px;border-top:1px solid var(--line);margin-top:1px}\n@media(prefers-reduced-motion:reduce){.drop,.chv{transition:none}}\n.tabs{display:flex;gap:7px;flex-wrap:wrap;padding:9px 0 6px}\n.tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;color:var(--muted)}\n.tab[aria-selected=\"true\"]{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700}\n.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.scroll{overflow-x:auto}.scroll>.w{min-width:640px}\n.w svg{display:block;width:100%;height:auto}\n.leg{display:flex;flex-wrap:wrap;justify-content:center;gap:5px 11px;font-size:11.5px;color:#2b3446;padding:2px 0 5px}\n.leg span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.leg i{display:inline-block;width:12px;height:12px;border-radius:2px}.leg svg{width:18px;height:18px}\n.t-lab{font-size:10.5px;fill:#1f2a44;font-family:Arial,Helvetica,sans-serif}\n.t-day{font-family:var(--fm);font-size:12px;fill:#4b505d}\n.t-chip{font-size:10.5px;font-weight:700;fill:#fff;font-family:Arial,Helvetica,sans-serif}\n.row{cursor:pointer}\n.note{font-size:12px;color:var(--muted);margin:6px 0 0}\ntable{width:100%;border-collapse:collapse;font-size:14px}\nth{font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#7b8490;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:400}\ntd{padding:7px 10px;border-bottom:1px solid var(--hair)}tr:last-child td{border-bottom:0}\ntd i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:7px;vertical-align:-1px}\n";
var T={sleep:{c:'#d3d9e6',n:'Sleep'},work:{c:'#c9786a',n:'Day Job (Amazon)'},proj:{c:'#c9a23a',n:'Creative Time (Project YOU & TreadWell)'},mind:{c:'#6f9fd6',n:'Mind and cue cards'},move:{c:'#4f9a6d',n:'Walking'},social:{c:'#d58f9b',n:'Social'},free:{c:'#eef0f5',n:'Open time'}};
var HAB={mind:1,move:1,social:1};
var WEEK={label:'Nov 2 to Nov 8, 2026',days:[
{d:'Mon',dt:'Nov 2',rise:435,bed:1448,blocks:[
 {s:380,m:10,t:'mind',l:'Meditate'},{s:720,m:120,t:'work'},{s:870,m:75,t:'work'},{s:977,m:403,t:'work'},{s:955,m:22,t:'move',l:'Walk'},
 {s:1105,m:20,t:'mind',l:'Cue cards'},{s:1231,m:15,t:'mind',l:'Mental Fitness'},{s:1289,m:25,t:'mind',l:'Cue cards'}],miss:[]},
{d:'Tue',dt:'Nov 3',rise:395,bed:1458,blocks:[
 {s:380,m:10,t:'mind',l:'Meditate'},{s:420,m:60,t:'work'},{s:900,m:120,t:'work'},{s:1200,m:16,t:'move',l:'Walk'},{s:1286,m:7,t:'mind',l:'Cue cards'}],miss:[]},
{d:'Wed',dt:'Nov 4',rise:535,bed:1422,blocks:[
 {s:600,m:120,t:'work'},{s:720,m:150,t:'work'},{s:1161,m:15,t:'mind',l:'Mental Fitness'},{s:1176,m:30,t:'mind',l:'Cue cards'},{s:1332,m:4,t:'mind',l:'Cue cards'}],miss:[380]},
{d:'Thu',dt:'Nov 5',rise:364,bed:1428,blocks:[
 {s:380,m:10,t:'mind',l:'Meditate'},{s:442,m:29,t:'move',l:'Walk'},{s:540,m:15,t:'social',l:'Social'},{s:870,m:30,t:'work'},{s:1020,m:30,t:'work'},
 {s:1161,m:15,t:'mind',l:'Mental Fitness'},{s:1177,m:31,t:'mind',l:'Cue cards'},{s:1332,m:4,t:'mind',l:'Cue cards'}],miss:[]},
{d:'Fri',dt:'Nov 6',rise:365,bed:1403,blocks:[
 {s:370,m:10,t:'mind',l:'Meditate'},{s:449,m:17,t:'move',l:'Walk'},{s:630,m:225,t:'work'},{s:849,m:15,t:'mind',l:'Mental Fitness'},
 {s:864,m:30,t:'social',l:'Social'},{s:907,m:9,t:'mind',l:'Cue cards'},{s:930,m:330,t:'proj',l:'Project YOU'}],miss:[]},
{d:'Sat',dt:'Nov 7',rise:385,bed:1447,blocks:[
 {s:380,m:10,t:'mind',l:'Meditate'},{s:501,m:91,t:'move',l:'Walk'},{s:608,m:30,t:'social',l:'Social'},{s:879,m:15,t:'mind',l:'Mental Fitness'},{s:895,m:23,t:'mind',l:'Cue cards'}],miss:[]},
{d:'Sun',dt:'Nov 8',rise:499,bed:1416,blocks:[
 {s:515,m:30,t:'social',l:'Social'},{s:567,m:10,t:'mind',l:'Cue cards'},{s:585,m:135,t:'proj',l:'Project YOU'},{s:780,m:180,t:'proj',l:'TreadWell'},
 {s:911,m:7,t:'mind',l:'Cue cards'},{s:966,m:143,t:'move',l:'Walk'},{s:1281,m:8,t:'mind',l:'Cue cards'}],miss:[380]}
]};


var D=WEEK.days;
function fmt(m){m=((m%1440)+1440)%1440;var h=Math.floor(m/60),mm=m%60;return (h%12||12)+':'+(mm<10?'0':'')+mm+' '+(h>=12?'p.m.':'a.m.')}
function segs(i){var a=[{s:300,m:D[i].rise-300,t:'sleep'},{s:D[i].bed,m:1740-D[i].bed,t:'sleep'}],o={work:0,proj:1,move:2,social:3,mind:4};
 return a.concat(D[i].blocks.slice().sort(function(x,y){return o[x.t]-o[y.t]}))}
var xs=function(X0,X1){return function(m){return X0+(m-300)/1440*(X1-X0)}};
function chips(X0,X1,y){var f=xs(X0,X1),h=[360,540,720,900,1080,1260,1440,1620],L=['6 a.m.','9 a.m.','Noon','3 p.m.','6 p.m.','9 p.m.','Midnight','3 a.m.'],s='';
 h.forEach(function(v,k){var x=f(v);s+='<line x1="'+x+'" x2="'+x+'" y1="'+(y+18)+'" y2="'+(y+24)+'" stroke="#1f2a44"/><rect x="'+(x-27)+'" y="'+y+'" width="54" height="18" rx="3" fill="#111"/><text class="t-chip" x="'+x+'" y="'+(y+13)+'" text-anchor="middle">'+L[k]+'</text>'});return s}
function sun(x,y,r){var s='<g transform="translate('+x+' '+y+')"><circle r="'+r*0.5+'" fill="#111"/>';for(var k=0;k<8;k++){var a=k*Math.PI/4,c=Math.cos(a),n=Math.sin(a);s+='<line x1="'+(c*r*0.78)+'" y1="'+(n*r*0.78)+'" x2="'+(c*r*1.08)+'" y2="'+(n*r*1.08)+'" stroke="#111" stroke-width="'+(r*0.16)+'" stroke-linecap="round"/>'}return s+'</g>'}
function moon(x,y,r){return '<g transform="translate('+x+' '+y+')"><path d="M'+(r*0.35)+' '+(-r)+'A'+r+' '+r+' 0 1 0 '+(r*0.9)+' '+(r*0.6)+'A'+(r*0.85)+' '+(r*0.85)+' 0 0 1 '+(r*0.35)+' '+(-r)+'Z" fill="#111"/></g>'}
function strip(i,X0,X1,y,h,withIcons){var f=xs(X0,X1),s='<rect x="'+X0+'" y="'+y+'" width="'+(X1-X0)+'" height="'+h+'" fill="'+T.free.c+'"/>';
 segs(i).forEach(function(b){var x=f(b.s),w=Math.max(f(b.s+b.m)-x,2.6),ti=b.l?'<title>'+fmt(b.s)+' '+b.l+', '+b.m+' min</title>':'';
  s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+T[b.t].c+'"'+(HAB[b.t]?' stroke="#111" stroke-width="1.2"':'')+'>'+ti+'</rect>'});
 D[i].miss.forEach(function(m){s+='<circle cx="'+f(m)+'" cy="'+(y+h/2)+'" r="'+(h*0.22)+'" fill="#fff" stroke="#111" stroke-width="1.2"><title>Meditate skipped</title></circle>'});
 if(withIcons){s+='<g><title>Up at '+fmt(D[i].rise)+'</title>'+sun(f(D[i].rise),y+h/2,h*0.62)+'</g><g><title>Lights out '+fmt(D[i].bed)+'</title>'+moon(f(D[i].bed)-3,y+h/2,h*0.42)+'</g>'}return s}
var LB=26,LG=5;
function place(items,X0,X1){var slots=[],out=[],a=0,b=0,k;for(k=0;k<3;k++){slots.push({side:'a',k:k,r:-1e9});slots.push({side:'b',k:k,r:-1e9})}
 items.sort(function(p,q){return p.x-q.x});
 items.forEach(function(it){var w=Math.max(it.l1.length,it.l2.length)*5.6+6,x0=Math.min(it.x,X1-w+6),pick=null;
  for(var q=0;q<slots.length;q++){if(slots[q].r<x0-6){pick=slots[q];break}}if(!pick)return;pick.r=x0+w;
  if(pick.side==='a')a=Math.max(a,pick.k+1);else b=Math.max(b,pick.k+1);out.push({it:it,x0:x0,side:pick.side,k:pick.k})});return {list:out,a:a,b:b}}
var aH=function(p){return p.a?10+p.a*(LB+LG):0},bH=function(p){return p.b?10+p.b*(LB+LG):0};
function callouts(pl,top,bot){var L='',X='';pl.list.forEach(function(e){var it=e.it,yL=e.side==='a'?top-10-(e.k+1)*LB-e.k*LG:bot+10+e.k*(LB+LG),y1=e.side==='a'?top:bot,y2=e.side==='a'?yL+LB:yL;
 L+='<line x1="'+it.x+'" x2="'+it.x+'" y1="'+y1+'" y2="'+y2+'" stroke="#1f2a44"/>';
 X+='<text class="t-lab" x="'+e.x0+'" y="'+(yL+10)+'" stroke="#fff" stroke-width="3" paint-order="stroke"><tspan font-weight="700" x="'+e.x0+'">'+it.l1+'</tspan><tspan x="'+e.x0+'" dy="12">'+it.l2+'</tspan></text>'});return L+X}
var hrs=function(m){return (m/60).toFixed(1)};
function totals(){var out={sleep:0,work:0,proj:0,mind:0,move:0,social:0},order=['sleep','work','proj','move','social','mind'];
 for(var i=0;i<7;i++){var arr=new Array(1440).fill('');segs(i).sort(function(a,b){return (a.t==='sleep'?-1:0)-(b.t==='sleep'?-1:0)});
  order.forEach(function(t){D[i].blocks.concat([{s:300,m:D[i].rise-300,t:'sleep'},{s:D[i].bed,m:1740-D[i].bed,t:'sleep'}]).forEach(function(b){if(b.t!==t)return;for(var m=b.s;m<b.s+b.m;m++){if(m>=300&&m<1740)arr[m-300]=b.t}})});
  arr.forEach(function(v){if(v)out[v]++})}
 var tot=7*1440,a=[],u=0;['sleep','work','proj','mind','move','social'].forEach(function(k){a.push([k,out[k]]);u+=out[k]});a.push(['free',tot-u]);return {a:a,tot:tot}}
var TT=totals();
function legend(){var ic=function(f){return '<svg viewBox="-12 -12 24 24">'+f+'</svg>'},
 it=function(t){return '<span><i style="background:'+T[t].c+(HAB[t]?';outline:1.2px solid #111':'')+'"></i>'+T[t].n+'</span>'};
 return '<div class="leg"><span>'+ic(sun(0,0,10))+'Rise</span>'+['sleep','mind','move','social','work','proj','free'].map(it).join('')+'<span><i style="background:#fff;border-radius:50%;border:1.2px solid #111"></i>Skipped habit</span><span>'+ic(moon(0,0,9))+'Lights out</span></div>'}
function banner(){var X0=10,X1=990,h=52,x=X0,items=[],bars='';
 TT.a.forEach(function(p){var w=(X1-X0)*p[1]/TT.tot;bars+='<rect x="'+x+'" y="@@" width="'+w+'" height="'+h+'" fill="'+T[p[0]].c+'"'+(HAB[p[0]]?' stroke="#111" stroke-width="1.2"':'')+'/>';items.push({x:x+w/2,l1:hrs(p[1])+' hours',l2:T[p[0]].n});x+=w});
 var pl=place(items,X0,X1),top=10+aH(pl),bot=top+h,H=bot+bH(pl)+6;
 return '<svg viewBox="0 0 1000 '+H+'" role="img" aria-label="Where the week went, as one bar">'+bars.replace(/@@/g,top)+callouts(pl,top,bot)+'</svg>'}
function mini(){var s='<div class="strip">'+TT.a.map(function(p){return '<div style="flex:'+p[1]+';background:'+T[p[0]].c+'"></div>'}).join('')+'</div><ul>'+TT.a.map(function(p){return '<li><i style="background:'+T[p[0]].c+'"></i>'+T[p[0]].n.replace(/ \(.*\)| &.*$/,'')+'<b>'+hrs(p[1])+' h</b></li>'}).join('')+'</ul>';return s}
var sel=4;
function dayByDay(){var X0=40,X1=996,RH=20,G=9,top=34,s='<svg viewBox="0 0 1000 '+(top+7*(RH+G)+4)+'" role="img" aria-label="Seven day strips">'+chips(X0,X1,0);
 D.forEach(function(d,i){var y=top+i*(RH+G);s+='<g class="row" data-d="'+i+'"><rect x="0" y="'+(y-4)+'" width="1000" height="'+(RH+8)+'" fill="'+(i===sel?'rgba(63,111,143,.10)':'transparent')+'"/><text class="t-day" x="2" y="'+(y+14)+'" style="font-weight:'+(i===sel?700:400)+'">'+d.d+'</text>'+strip(i,X0,X1,y,RH,true)+'</g>'});
 var d=D[sel];return s+'</svg><p class="note"><b>'+d.d+' '+d.dt+':</b> up at '+fmt(d.rise)+', lights out '+fmt(d.bed)+'. Both times come from your Apple Watch.</p>'}
function medianStart(l){var st=[];D.forEach(function(d){var f=null;d.blocks.forEach(function(b){if(b.l===l&&(f===null||b.s<f))f=b.s});if(f!==null)st.push(f)});st.sort(function(a,b){return a-b});return {n:st.length,m:st[Math.floor(st.length/2)]}}
function rhythm(){var X0=60,X1=996,rh=24,gp=7,f=xs(X0,X1),items=[];
 [['Meditate'],['Walk'],['Social'],['Mental Fitness'],['Cue cards']].forEach(function(g){var r=medianStart(g[0]);if(r.n)items.push({x:f(r.m),l1:'About '+fmt(r.m),l2:g[0]+', '+r.n+' of 7 days'})});
 var pl=place(items,X0,X1),top=30+aH(pl),bot=top+3*rh+2*gp,H=bot+bH(pl)+8,w=(X1-X0)/96,sc=[],q,i;
 for(q=0;q<96;q++)sc.push({hab:{mind:0,move:0,social:0},wk:{work:0,proj:0},sl:0});
 for(i=0;i<7;i++){var g=segs(i);for(q=0;q<96;q++){var a=300+q*15,b=a+15,seen={};g.forEach(function(s){if(s.s<b&&s.s+s.m>a)seen[s.t]=1});for(var t in seen){if(HAB[t])sc[q].hab[t]++;else if(t==='work'||t==='proj')sc[q].wk[t]++;else if(t==='sleep')sc[q].sl++}}}
 var mx=function(o){var best=null,v=0;for(var k in o){if(o[k]>v){v=o[k];best=k}}return [best,v]};
 var s='<svg viewBox="0 0 1000 '+H+'" role="img" aria-label="Week rhythm">'+chips(X0,X1,0);
 [['Habits',0],['Work',1],['Sleep',2]].forEach(function(rw){var y=top+rw[1]*(rh+gp);s+='<text class="t-day" x="2" y="'+(y+16)+'">'+rw[0]+'</text><rect x="'+X0+'" y="'+y+'" width="'+(X1-X0)+'" height="'+rh+'" fill="#eef0f5"/>';
  for(var k=0;k<96;k++){var t,v,r;if(rw[1]===0){r=mx(sc[k].hab);t=r[0];v=r[1]}else if(rw[1]===1){r=mx(sc[k].wk);t=r[0];v=r[1]}else{t='sleep';v=sc[k].sl}
   if(v>0)s+='<rect x="'+(X0+k*w)+'" y="'+y+'" width="'+(w+0.4)+'" height="'+rh+'" fill="'+T[t].c+'" fill-opacity="'+(0.22+0.78*v/7).toFixed(2)+'"/>'}});
 return s+callouts(pl,top,bot)+'</svg><p class="note">Darker means more of the 7 days had something in that quarter hour. Pale means one day.</p>'}
function whereWent(){var h='<table><tr><th>Where it went</th><th>Hours</th><th>Share of the week</th><th>A day on average</th></tr>';
 TT.a.forEach(function(p){h+='<tr><td><i style="background:'+T[p[0]].c+'"></i>'+T[p[0]].n+'</td><td>'+hrs(p[1])+'</td><td>'+Math.round(100*p[1]/TT.tot)+'%</td><td>'+hrs(p[1]/7)+' h</td></tr>'});return h+'</table><p class="note">Sleep counts from lights out to getting up, so it runs a little longer than the hours the Watch scores as asleep.</p>'}
var host=document.getElementById('habitWeekHost'),root=host.attachShadow({mode:'open'});
var tab=1,open=false;
var chev='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
function body(){return tab===3?whereWent():legend()+'<div class="scroll"><div class="w">'+(tab===1?dayByDay():rhythm())+'</div></div>'}
function render(){root.innerHTML='<style>'+CSS+'</style><div class="bn'+(open?' open':'')+'" id="bn"><button class="face" type="button" aria-expanded="'+open+'" data-act="toggle"><div class="fhead"><div class="ftxt"><p class="kick">Habits dashboard &middot; Project YOU</p><h2 class="ft">Habit Week</h2><p class="sub">'+WEEK.label+' &middot; how the week was spent</p></div><span class="chv">'+chev+'</span></div><div class="bar">'+banner()+'</div><div class="mini">'+mini()+'</div><p class="openhint">'+(open?'Tap to close':'Tap to open the week')+'</p></button><div class="drop"><div class="in"><div class="pad"><div class="tabs" role="tablist">'+[[1,'Day by Day'],[2,'The Week&rsquo;s Rhythm'],[3,'Where it Went']].map(function(t){return '<button class="tab" role="tab" type="button" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>'+body()+'</div></div></div></div>';fit()}
function fit(){var b=root.getElementById('bn');if(b)b.classList.toggle('narrow',host.clientWidth<560)}
root.addEventListener('click',function(e){var el;
 if((el=e.target.closest('[data-tab]'))){tab=+el.getAttribute('data-tab');render();return}
 if((el=e.target.closest('[data-d]'))){sel=+el.getAttribute('data-d');render();return}
 if(e.target.closest('[data-act="toggle"]')){open=!open;render()}});
if(window.ResizeObserver)new ResizeObserver(fit).observe(host);
render();

})();
