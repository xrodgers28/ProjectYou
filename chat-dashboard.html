<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Dashboard</title>
<style>
:root{
  --ground:#eef1f5; --card:#ffffff; --head:#f3f5f8; --line:#e3e8ee; --line2:#cfd6df;
  --ink:#1c2733; --ink2:#5b6a79; --accent:#2f5d86;
  --green:#1f7a4d; --green-bg:#dcf0e4;
  --amber:#8a5a0a; --amber-bg:#fbeccb;
  --blue:#2f66a0; --blue-bg:#e1ebf6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12181f; --card:#1b242d; --head:#222d38; --line:#2c3947; --line2:#3b4a5a;
    --ink:#eaf0f6; --ink2:#a9b8c7; --accent:#8db9e6;
    --green:#7fcaa0; --green-bg:#1b2f25; --amber:#e8b062; --amber-bg:#35291a; --blue:#8db9e6; --blue-bg:#1d2d3f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#12181f; --card:#1b242d; --head:#222d38; --line:#2c3947; --line2:#3b4a5a;
  --ink:#eaf0f6; --ink2:#a9b8c7; --accent:#8db9e6;
  --green:#7fcaa0; --green-bg:#1b2f25; --amber:#e8b062; --amber-bg:#35291a; --blue:#8db9e6; --blue-bg:#1d2d3f;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.4}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.phead h1{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.phead .n{font-size:12px;color:var(--ink2)}
.phead .sub{flex-basis:100%;font-size:13px;color:var(--ink2)}
.phead .live{margin-left:auto;font-size:12px;color:var(--ink2)}
.tools{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp>span{font-size:12.5px;color:var(--ink2);margin-right:2px}
.chip{font:inherit;font-size:13px;padding:5px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
.search{margin-left:auto;font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--ink);width:260px;max-width:100%}
.bulkbtn{font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--ink);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:var(--card);z-index:2;text-align:left;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.day td{background:var(--head);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent);padding:7px 12px}
tr.day td span{float:right;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink2)}
.c-status{width:104px}.c-when{width:100px;color:var(--ink2);font-size:13.5px}.c-meta{width:108px;font-size:13px;color:var(--ink2)}.c-in{width:290px}.c-act{width:150px;white-space:nowrap}
.pill{font:inherit;font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:99px;border:0;cursor:pointer;background:var(--amber-bg);color:var(--amber)}
.pill.read{background:var(--blue-bg);color:var(--blue)} .pill.reacted{background:var(--green-bg);color:var(--green)}
.title{font-weight:700;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.title:hover{color:var(--accent);text-decoration:underline}
.gist{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;font-style:italic;color:var(--ink2);margin-top:2px}
.gist.open{-webkit-line-clamp:unset;cursor:pointer}.gist{cursor:pointer}
.note-in{width:100%;font:inherit;font-size:13.5px;padding:6px 9px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--ink);resize:vertical;min-height:34px}
.saved{font-size:11.5px;color:var(--green)}
.mt{display:block}.mt+.mt{margin-top:3px}
.lnk{font:inherit;font-size:13px;font-weight:700;color:var(--accent);background:none;border:0;padding:3px 6px;cursor:pointer}
.lnk.q{color:var(--ink2);font-weight:400}
tr.archived .title{color:var(--ink2)}
.empty,.err{padding:22px 18px;color:var(--ink2)}
.err{color:#b03a48}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 14px;border-radius:8px;display:flex;gap:12px;align-items:center;z-index:30;max-width:calc(100vw - 32px)}
.toast button{font:inherit;font-weight:700;background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 10px;cursor:pointer}
.foot{margin-top:14px;font-size:12px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:space-between}
[hidden]{display:none!important}
@media(max-width:820px){
  .search{margin-left:0;width:100%}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr.row{padding:12px 14px;border-bottom:1px solid var(--line)}
  tr.row td{border:0;padding:3px 0;width:auto}
  .c-status,.c-when,.c-meta,.c-in,.c-act{width:auto}
  .c-status{display:inline-block;width:auto;margin-right:8px}
  .c-when,.c-meta{display:inline-block;width:auto;margin-right:10px}
  tr.row td.c-chat{order:-1}
  tr.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
  tr.row td.c-chat,tr.row td.c-in{flex-basis:100%}
  tr.day td{padding:7px 14px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<div class="panel">
  <div class="phead"><h1>Chat Dashboard</h1><span class="n" id="count"></span><span class="live" id="live">Loading</span>
    <span class="sub">Your Project YOU chats from the Claude app, newest first. Type [ST] in a chat to refresh the list. The app does not share its own unread dot.</span></div>
  <div class="tools">
    <div class="grp" id="fstat"><span>Show</span>
      <button class="chip" data-f="all" aria-pressed="true">All</button>
      <button class="chip" data-f="new" aria-pressed="false">New</button>
      <button class="chip" data-f="read" aria-pressed="false">Read</button>
      <button class="chip" data-f="reacted" aria-pressed="false">Reacted</button>
    </div>
    <div class="grp"><span>Also</span>
      <button class="chip" id="hasnote" aria-pressed="false">Has my note</button>
      <button class="chip" id="arch" aria-pressed="false">Archived</button>
      <button class="bulkbtn" id="bulk">Mark shown as read</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Search: titles, what a chat was about, my notes" aria-label="Search chats" autocomplete="off">
  </div>
  <table>
    <thead><tr><th class="c-status">Status</th><th>Chat</th><th class="c-when">When</th><th class="c-meta">Model, min</th><th class="c-in">Your input</th><th class="c-act">Actions</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</div>
<div class="foot"><span>Project YOU &middot; Chat Dashboard v3.0 &middot; Oct 10, 2026</span><span id="src"></span></div>
</div>
<div class="toast" id="toast" hidden><span id="toastmsg"></span><button id="toastbtn">Undo</button></div>

<script>
(function(){
  var SB='https://arnjntspmrhigodlssbn.supabase.co/rest/v1';
  var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFybmpudHNwbXJoaWdvZGxzc2JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMTQ0NTgsImV4cCI6MjEwMTg5MDQ1OH0.UN4JMuoKaAWQfhiCstuoOJQ1sVU2hU5pK0tLBY60dfM';
  var H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
  var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var rows=[], f='all', showArch=false, onlyNote=false, query='', undoFn=null, toastT=null;
  var NEXT={'new':'read','read':'reacted','reacted':'new'}, LAB={'new':'New','read':'Read','reacted':'Reacted'};
  function $(id){return document.getElementById(id);}
  function el(t,c,x){var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;}
  function dayLabel(d){ if(!d) return 'Unknown day'; var p=String(d).split('-'); return MONTHS[+p[1]-1]+' '+(+p[2])+', '+p[0]; }
  var tf=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'});
  function timeLabel(ts){ return tf.format(new Date(ts)).replace(' AM','am').replace(' PM','pm'); }

  function load(){
    return fetch(SB+'/v_cowork_chats?select=*&order=last_activity.desc&limit=2000',{headers:H}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){ rows=d; $('live').textContent='Live'; render(); })
    .catch(function(e){ $('live').textContent='Offline'; var L=$('list'); L.textContent=''; var tr=el('tr'); var td=el('td','err','The chat list did not load. Reload the page. If it keeps happening, tell Claude: '+e.message); td.colSpan=6; tr.appendChild(td); L.appendChild(tr); });
  }
  function patch(id,body){ return fetch(SB+'/cowork_chats?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:Object.assign({Prefer:'return=minimal'},H),body:JSON.stringify(body)}).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); }); }
  function byId(id){ for(var i=0;i<rows.length;i++){ if(rows[i].id===id) return rows[i]; } return null; }
  function setRow(id,body,quiet){
    var r=byId(id); if(!r) return Promise.resolve(); var old={}; Object.keys(body).forEach(function(k){old[k]=r[k]; r[k]=body[k];});
    if(!quiet) render();
    return patch(id,body).catch(function(){ Object.keys(old).forEach(function(k){r[k]=old[k];}); render(); toast('That change did not save. Try again.'); });
  }
  function toast(msg,undo){ $('toastmsg').textContent=msg; $('toastbtn').hidden=!undo; undoFn=undo||null; $('toast').hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){ $('toast').hidden=true; undoFn=null; },10000); }
  $('toastbtn').addEventListener('click',function(){ var u=undoFn; $('toast').hidden=true; undoFn=null; if(u) u(); });

  function matches(r){
    if(showArch? !r.archived_at : !!r.archived_at) return false;
    if(f!=='all' && (r.read_state||'new')!==f) return false;
    if(onlyNote && !(r.scott_note||'').trim()) return false;
    if(query){ var hay=((r.title||'')+' '+(r.gist||'')+' '+(r.scott_note||'')).toLowerCase(); var ps=query.toLowerCase().split(/\s+/).filter(Boolean); for(var i=0;i<ps.length;i++){ if(hay.indexOf(ps[i])<0) return false; } }
    return true;
  }
  function counts(){
    var live=rows.filter(function(r){return !r.archived_at;});
    function n(s){ return live.filter(function(r){return (r.read_state||'new')===s;}).length; }
    var c={all:live.length,'new':n('new'),read:n('read'),reacted:n('reacted')};
    document.querySelectorAll('[data-f]').forEach(function(b){ var k=b.getAttribute('data-f'); b.textContent=(k==='all'?'All':LAB[k])+' '+c[k]; });
    var notes=live.filter(function(r){return (r.scott_note||'').trim();}).length;
    $('hasnote').textContent='Has my note '+notes;
    var last=rows.reduce(function(m,r){ return r.synced_at>m?r.synced_at:m; },'');
    $('src').textContent=last?('List last refreshed '+dayLabel(new Date(last).toLocaleDateString('en-CA',{timeZone:'America/New_York'}))+', '+timeLabel(last)+' Eastern. A day runs 2am to 2am.'):'';
  }

  function rowEl(r){
    var st=r.read_state||'new';
    var tr=el('tr','row '+st+(r.archived_at?' archived':''));
    var td=el('td','c-status'); var p=el('button','pill '+st,LAB[st]); p.title='Tap to change: New, Read, Reacted'; p.setAttribute('aria-label','Status: '+LAB[st]+'. Tap to change to '+LAB[NEXT[st]]);
    p.addEventListener('click',function(){ setRow(r.id,{read_state:NEXT[st]}); }); td.appendChild(p); tr.appendChild(td);
    td=el('td','c-chat'); var a=el('a','title',r.title); a.href=r.url; a.target='_blank'; a.rel='noopener'; a.addEventListener('click',function(){ if((r.read_state||'new')==='new') setRow(r.id,{read_state:'read'}); }); td.appendChild(a);
    if(r.gist){ var g=el('div','gist',r.gist); g.title='Tap to show all'; g.addEventListener('click',function(){ g.classList.toggle('open'); }); td.appendChild(g); }
    tr.appendChild(td);
    td=el('td','c-when'); td.appendChild(el('span','mt',timeLabel(r.last_activity))); tr.appendChild(td);
    td=el('td','c-meta'); var any=false;
    if(r.model){ td.appendChild(el('span','mt',r.model)); any=true; }
    if(r.minutes!=null){ td.appendChild(el('span','mt',r.minutes+' min')); any=true; }
    if(!any) td.appendChild(el('span','mt','Not reported'));
    tr.appendChild(td);
    td=el('td','c-in'); var ta=el('textarea','note-in'); ta.rows=1; ta.setAttribute('aria-label','Your input for: '+r.title); ta.placeholder='Your input'; ta.value=r.scott_note||''; td.appendChild(ta);
    var sv=el('span','saved','Saved'); sv.hidden=true; td.appendChild(sv); tr.appendChild(td);
    ta.addEventListener('blur',function(){ var v=ta.value.trim(); if(v===(r.scott_note||'').trim()) return; var cur=r.read_state||'new'; var body={scott_note:v||null,note_updated_at:new Date().toISOString()}; if(v&&cur!=='reacted') body.read_state='reacted';
      setRow(r.id,body,true).then(function(){ counts(); }); if(body.read_state){ tr.className='row reacted'+(r.archived_at?' archived':''); p.className='pill reacted'; p.textContent='Reacted'; st='reacted'; }
      sv.hidden=false; setTimeout(function(){ sv.hidden=true; },2500); });
    td=el('td','c-act');
    var go=el('button','lnk',ta.value.trim()?'Copy and open':'Open'); ta.addEventListener('input',function(){ go.textContent=ta.value.trim()?'Copy and open':'Open'; });
    go.addEventListener('click',function(){ var txt=ta.value.trim(); function open(){ window.open(r.url,'_blank','noopener'); } if(!txt){ open(); return; } if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){ toast('Copied. Paste it into the chat.'); open(); },function(){ ta.focus(); ta.select(); toast('Copy the selected text, then open the chat.'); }); } else { ta.focus(); ta.select(); toast('Copy the selected text, then open the chat.'); } });
    var x=el('button','lnk q',r.archived_at?'Restore':'Archive'); x.setAttribute('aria-label',(r.archived_at?'Restore chat: ':'Archive chat: ')+r.title);
    x.addEventListener('click',function(){ if(r.archived_at){ setRow(r.id,{archived_at:null}); toast('Restored.'); } else { setRow(r.id,{archived_at:new Date().toISOString()}); toast('Archived. It stays in the Archived view.',function(){ setRow(r.id,{archived_at:null}); }); } });
    td.appendChild(go); td.appendChild(x); tr.appendChild(td);
    return tr;
  }

  function render(){
    counts();
    var L=$('list'); L.textContent='';
    var shown=rows.filter(matches);
    $('count').textContent=shown.length+' of '+rows.length;
    var nn=shown.filter(function(r){return (r.read_state||'new')==='new';}).length;
    $('bulk').textContent='Mark '+nn+' shown as read';
    if(!shown.length){ var tr=el('tr'); var td=el('td','empty',rows.length?'No chats match. Clear the search or pick All.':'No chats yet.'); td.colSpan=6; tr.appendChild(td); L.appendChild(tr); return; }
    var last=null, cnt=null, k=0;
    shown.forEach(function(r){
      if(r.day!==last){ last=r.day; var h=el('tr','day'); var d=el('td'); d.colSpan=6; d.appendChild(document.createTextNode(dayLabel(r.day))); cnt=el('span'); d.appendChild(cnt); h.appendChild(d); L.appendChild(h); k=0; }
      k++; cnt.textContent=k+(k===1?' chat':' chats'); L.appendChild(rowEl(r));
    });
  }

  var qt=null; $('q').addEventListener('input',function(e){ clearTimeout(qt); var v=e.target.value; qt=setTimeout(function(){ query=v.trim(); render(); },120); });
  document.querySelectorAll('[data-f]').forEach(function(b){ b.addEventListener('click',function(){ f=b.getAttribute('data-f'); document.querySelectorAll('[data-f]').forEach(function(x){ x.setAttribute('aria-pressed',String(x===b)); }); render(); }); });
  $('arch').addEventListener('click',function(){ showArch=!showArch; $('arch').setAttribute('aria-pressed',String(showArch)); render(); });
  $('hasnote').addEventListener('click',function(){ onlyNote=!onlyNote; $('hasnote').setAttribute('aria-pressed',String(onlyNote)); render(); });
  var armed=false, armT=null;
  $('bulk').addEventListener('click',function(){
    var targets=rows.filter(matches).filter(function(r){return (r.read_state||'new')==='new';});
    if(!targets.length){ toast('Nothing new in this view.'); return; }
    if(!armed){ armed=true; $('bulk').textContent='Tap again to mark '+targets.length+' as read'; clearTimeout(armT); armT=setTimeout(function(){ armed=false; render(); },5000); return; }
    armed=false; clearTimeout(armT);
    var ids=targets.map(function(r){return '"'+r.id+'"';}).join(',');
    targets.forEach(function(r){ r.read_state='read'; }); render();
    function bulk(state){ return fetch(SB+'/cowork_chats?id=in.('+ids+')',{method:'PATCH',headers:Object.assign({Prefer:'return=minimal'},H),body:JSON.stringify({read_state:state})}); }
    bulk('read').then(function(r){ if(!r.ok) throw new Error(); toast('Marked '+targets.length+' as read.',function(){ targets.forEach(function(x){ x.read_state='new'; }); render(); bulk('new'); }); }).catch(function(){ load(); toast('That did not save. Reloaded the list.'); });
  });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden && document.activeElement.tagName!=='TEXTAREA') load(); });
  load();
})();
</script>
<script src="nav-config.js"></script><script src="navpatch.js"></script></body>
</html>
