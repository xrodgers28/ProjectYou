ABSVG = '<svg width=\"11\" height=\"11\" viewBox=\"0 0 14 14\">' +\n  '<rect class=\"gf\" x=\"1\" y=\"2.5\" width=\"12\" height=\"10.5\" rx=\"2\" fill=\"none\"/>' +\n  '<rect class=\"gs\" x=\"1\" y=\"2.5\" width=\"12\" height=\"10.5\" rx=\"2\" fill=\"none\" stroke-width=\"1.2\"/>' +\n  '<path class=\"gs\" d=\"M1 6h12\" stroke-width=\"1.2\"/>' +\n  '<path class=\"gs\" d=\"M4.5 1v2.6M9.5 1v2.6\" stroke-width=\"1.2\" stroke-linecap=\"round\"/><\/svg>';\n\nfunction cxHHMM(m) {\n  const h = Math.floor(m / 60), mm = m % 60, ap = h < 12 ? 'am' : 'pm', hh = h % 12 || 12;\n  return mm ? hh + ':' + String(mm).padStart(2, '0') + ap : hh + ap;\n}\nfunction cxDur(m) {\n  const h = Math.floor(m / 60), mm = m % 60;\n  return h && mm ? h + 'h ' + mm + 'm' : h ? h + 'h' : mm + 'm';\n}\nfunction cxY(m) { return (m - cxD0) * CX_PX; }\nfunction cxToMin(t) { if (!t) return null; const p = String(t).split(':'); return (+p[0]) * 60 + (+p[1]); }\nfunction cxNowMin() {\n  const s = new Intl.DateTimeFormat('en-GB', { timeZone: ET_TZ, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());\n  const p = s.split(':'); return (+p[0]) * 60 + (+p[1]);\n}\nfunction cxIsToday() { return cxDay === localDate(); }\nfunction cxClash(s, e) { return cxMeet.some(m => !m.skipped && s < m.e && e > m.s); }\n\n/* The day trims to what is actually in it, plus half an hour of room at each end\n   so there is always somewhere to drop something earlier or later. */\nfunction cxWindow() {\n  const starts = [], ends = [];\n  if (cxIsToday()) { const n = cxNowMin(); starts.push(n); ends.push(n + CX_PAD); }\n  /* Every meeting, skipped ones included. A skipped meeting is still DRAWN - it just\n     stops counting - so if the window ignored it the block rendered above the top of\n     the grid and sat on top of the Project You chip. */\n  cxMeet.forEach(m => { starts.push(m.s - CX_PAD); ends.push(m.e + CX_PAD); });\n  cxBlocks.forEach(b => { starts.push(b.start_min - CX_PAD); ends.push(b.start_min + b.mins + CX_PAD); });\n  if (!starts.length) { starts.push(540); ends.push(1020); }\n  let a = Math.min.apply(null, starts), b = Math.max.apply(null, ends);\n  a = Math.max(300, Math.floor(a / 30) * 30);\n  b = Math.min(1380, Math.ceil(b / 30) * 30);\n  if (b - a < 240) b = Math.min(1380, a + 240);\n  if (b - a < 240) a = Math.max(300, b - 240);\n  return [a, b];\n}\n\n/* ---------------------------------------------------------------- loading -- */\nasync function cxLoadDay(d) {\n  cxDay = d || cxDay || localDate();\n  const { data: ev } = await sb.from('calendar_events')\n    .select('id,title,start_time,end_time,loc,sub,is_work,skipped,hidden,pulled_at,source_calendar')\n    .eq('date', cxDay).order('start_time');\n  const rows = (ev || []).filter(r => !r.hidden && r.start_time && r.end_time);\n  const seen = new Map();\n  cxPulled = null;\n  rows.forEach(r => {\n    if (r.pulled_at) { const t = new Date(r.pulled_at); if (!cxPulled || t > cxPulled) cxPulled = t; }\n    const s = cxToMin(r.start_time), e = cxToMin(r.end_time);\n    const k = (r.title || '') + '|' + s + '|' + e;\n    if (seen.has(k)) { const g = seen.get(k); g.dup++; g.ids.push(r.id); }\n    else seen.set(k, { ids: [r.id], t: r.title || '(untitled)', s: s, e: Math.max(e, s + 5),\n                       sub: r.sub || r.loc || '', amz: !!r.is_work, skipped: !!r.skipped, dup: 1 });\n  });\n  cxMeet = Array.from(seen.values()).sort((a, b) => a.s - b.s);\n\n  const { data: bl } = await sb.from('day_blocks').select('*').eq('day', cxDay).order('start_min');\n  cxBlocks = bl || [];\n  cxSyncDone();\n}\n/* a block wears the strike-through of its own to-do, read fresh, never written back */\nfunction cxSyncDone() {\n  cxBlocks.forEach(b => {\n    if (!b.todo_id) return;\n    const t = (typeof todos !== 'undefined' && todos) ? todos.find(x => x.id === b.todo_id) : null;\n    if (t) b.done = !!t.done;\n  });\n}\n\n/* ------------------------------------------------------------ attribution -- */\n/* Every minute of the window belongs to exactly one bucket, so overlapping\n   bookings can never be counted twice. Rule 2 above. */\nfunction cxAttribute() {\n  const own = new Array(Math.max(0, cxD1 - cxD0)).fill('open');\n  const mark = (s, e, tag) => {\n    for (let m = Math.max(s, cxD0); m < Math.min(e, cxD1); m++) own[m - cxD0] = tag;\n  };\n  cxBlocks.forEach(b => mark(b.start_min, b.start_min + b.mins,\n    b.cat === 'py' ? 'py' : (b.cat === 'hab' ? 'hab' : (b.amz ? 'amz' : 'todo'))));\n  cxMeet.forEach(m => { if (!m.skipped) mark(m.s, m.e, m.amz ? 'amz' : 'other'); });\n  const c = { amz: 0, other: 0, py: 0, hab: 0, todo: 0, open: 0 };\n  own.forEach(t => c[t]++);\n  return c;\n}\n\n/* ---------------------------------------------------------------- drawing -- */\nfunction cxDrawWeek() {\n  const sel = ymdToDay(cxDay);\n  if (!cxWeek0) {\n    const mon = new Date(sel.getTime());\n    const dow = (mon.getUTCDay() + 6) % 7;          /* Monday = 0 */\n    mon.setUTCDate(mon.getUTCDate() - dow);\n    cxWeek0 = dayKey(mon);\n  }\n  const today = localDate();\n  let h = '<span class=\"cxwarr\" data-cxwk=\"-1\" title=\"Previous week\">&#9664;<\/span>';\n  for (let i = 0; i < 7; i++) {\n    const d = ymdToDay(cxWeek0); d.setUTCDate(d.getUTCDate() + i);\n    const k = dayKey(d);\n    const lbl = d.toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'narrow' });\n    h += '<div class=\"cxwd' + (k === today ? ' on' : '') + (k === cxDay && k !== today ? ' sel' : '') +\n         '\" data-cxday=\"' + k + '\"><span class=\"cxwdl\">' + lbl + '<\/span>' +\n         '<span class=\"cxwdn\">' + d.getUTCDate() + '<\/span><\/div>';\n  }\n  h += '<span class=\"cxwarr\" data-cxwk=\"1\" title=\"Next week\">&#9654;<\/span>';\n  document.getElementById('cxwk').innerHTML = h;\n}\n\nfunction cxDrawGrid() {\n  const grid = document.getElementById('cxgrid');\n  if (!cxMeet.length && !cxBlocks.length) {\n    grid.innerHTML = '<div class=\"cxempty\">Nothing on the calendar for this day yet.<br>' +\n t-weight=\"800\" fill=\"#c3a06a\" letter-spacing=\"0.5\">AMAZON<\/text>';\n  const sk = cxMeet.filter(m => m.skipped).length;\n  const dups = cxMeet.filter(m => m.dup > 1).length;\n  document.getElementById('cxtnote').textContent =\n    (dups ? dups + (dups === 1 ? ' double booking folded into one block. ' : ' double bookings folded into one block each. ') : '') +\n    'Counts wall-clock time across ' + cxHHMM(cxD0) + ' to ' + cxHHMM(cxD1) +\n    '. Amazon, Habits and Project You go to the wheel.' +\n    (sk ? '  ' + sk + ' taken out of the count.' : '');\n  document.getElementById('cxfree').textContent = cxDur(c.open) + ' free';\n}\n\nfunction cxStamp() {\n  const el2 = document.getElementById('cxstamp'); if (!el2) return;\n  if (!cxPulled) { el2.textContent = 'never pulled'; el2.classList.add('stale'); return; }\n  const mins = Math.round((Date.now() - cxPulled.getTime()) / 60000);\n  const t = new Intl.DateTimeFormat('en-US', { timeZone: ET_TZ, hour: 'numeric', minute: '2-digit' }).format(cxPulled);\n  const stale = mins >= 120;\n  el2.textContent = 'as of ' + t + (stale ? '  \u00b7  more than 2h old' : '');\n  el2.classList.toggle('stale', stale);\n}\n\nfunction cxDraw() {\n  if (!document.getElementById('calcol')) return;\n  const w = cxWindow(); cxD0 = w[0]; cxD1 = w[1];\n  const d = ymdToDay(cxDay);\n  document.getElementById('cxdate').firstChild.textContent =\n    d.toLocaleDateString('en-US', { timeZone: 'UTC', weekday: 'long', month: 'short', day: 'numeric' }) + ' ';\n  cxDrawWeek(); cxDrawGrid(); cxDrawTally(); cxStamp(); cxDecorate();\n}\n\n/* ------------------------------------------------- the mark on every row --- */\nfunction cxGrab(t) {\n  const s = el('span', 'cxgrab');\n  s.dataset.cxgrab = t.id;\n  s.dataset.cxmins = String(t.est_minutes || (t.is_habit ? CX_HAB_MINS : 15));\n  s.dataset.cxhab = t.is_habit ? '1' : '';\n  s.title = 'Drag onto the day';\n  s.innerHTML = CX_GRABSVG;\n  return s;\n}\n/* after every board render: light the marks that g = null, cxGhost = null, cxPrev = null;\nfunction cxGridMinute(cy) {\n  const inn = document.getElementById('cxgridinner'); if (!inn) return null;\n  const r = inn.getBoundingClientRect();\n  return Math.round((cxD0 + (cy - r.top) / CX_PX) / CX_SNAP) * CX_SNAP;\n}\nfunction cxOverGrid(x, y) {\n  const g = document.getElementById('cxgrid'); if (!g) return false;\n  const r = g.getBoundingClientRect();\n  return x >= r.left - 30 && x <= r.right + 30 && y >= r.top - 10 && y <= r.bottom + 10;\n}\nfunction cxShowPrev(start, mins) {\n  const inn = document.getElementById('cxgridinner'); if (!inn) return;\n  if (!cxPrev) { cxPrev = document.createElement('div'); cxPrev.className = 'cxprev';\n    cxPrev.innerHTML = '<span><\/span>'; inn.appendChild(cxPrev); }\n  const bad = cxClash(start, start + mins);\n  cxPrev.className = 'cxprev' + (bad ? ' clash' : '');\n  cxPrev.style.top = cxY(start) + 'px';\n  cxPrev.style.height = Math.max(9, mins * CX_PX) + 'px';\n  cxPrev.querySelector('span').textContent = cxHHMM(start) + (bad ? '  on a meeting' : '');\n}\nfunction cxKillPrev() { if (cxPrev) { cxPrev.remove(); cxPrev = null; } }\n\nfunction cxStartDrag(e, kind, id, opts) {\n  e.preventDefault();\n  opts = opts || {};\n  if (kind === 'chip') {\n    cxDrag = { kind: 'chip', mins: CX_PY_MINS, title: 'Project You' };\n  } else if (kind === 'new') {\n    cxDrag = { kind: 'new', id: id, mins: opts.mins || 15, title: opts.title || 'To-do',\n               hab: !!opts.hab, amz: !!opts.amz };\n  } else {\n    const src = cxBlocks.find(b => b.id === id); if (!src) return;\n    cxDrag = { kind: kind, id: id, mins: src.mins, title: src.title };\n  }\n  if (kind !== 'resize') {\n    cxGhost = document.createElement('div'); cxGhost.className = 'cxghost';\n    cxGhost.textContent = cxDrag.title + '  \u00b7  ' + cxDur(cxDrag.mins);\n    document.body.appendChild(cxGhost);\n    cxGhost.style.left = (e.clientX + 12) + 'px';\n    cxGhost.style.top = (e.clientY - 10) + 'px';\n  }\n  window.addEven
