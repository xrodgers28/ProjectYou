<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fill the Gaps · ProjectYou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#1f2a44;--muted:#5b6472;--faint:#9aa6b4;--line:#e3e7ee;--bg:#eef1f6;--card:#fff;--accent:#3f6f8f;--sand:#b8801f;--hot:#c0453b;--good:#3f7d5f;--sunk:#f3f5f9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#e6ebf3;--muted:#9aa6b6;--faint:#78839a;--line:#2c3644;--bg:#12171f;--card:#1a212c;--accent:#7fb0d0;--sand:#e0ab52;--hot:#e0776d;--good:#78bd97;--sunk:#141a23}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.wrap{max-width:860px;margin:0 auto;padding:14px 16px 90px}
h1{font-size:22px;margin:4px 0 2px;font-weight:900;letter-spacing:-.01em}
.ver{font-size:11.5px;font-weight:700;color:var(--muted);margin-left:6px;vertical-align:middle}
.intro{font-size:13px;color:var(--muted);line-height:1.55;margin:6px 0 14px;max-width:62ch}
.stat{display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.stat .s{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:11.5px;color:var(--muted);flex:1 1 auto;min-width:104px}
.stat .s b{color:var(--ink);font-size:19px;display:block;font-weight:700;line-height:1.2}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 14px}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s ease}
.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.tab{font:inherit;font-size:12.5px;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 15px;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dh{font-size:11px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.dh span{font-weight:700;letter-spacing:0;text-transform:none;font-size:11.5px}
.g{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sand);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.g.done{border-left-color:var(--good)}
.gt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.gt .sp{font-weight:700;font-size:15px}
.gt .ln{font-size:12px;color:var(--muted)}
.gt .sg{font-size:11.5px;color:var(--accent);font-weight:700;margin-left:auto}
.pl{display:flex;gap:6px;flex-wrap:wrap}
.p{font:inherit;font-size:12.5px;font-weight:500;color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.p:hover{border-color:var(--accent);color:var(--ink)}
.p.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.p.sug{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.nt{margin-top:8px;width:100%;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}
.nt::placeholder{color:var(--faint)}
.pat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:22px}
.pat h2{font-size:15px;font-weight:900;margin-bottom:4px}
.pat .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13px}
.row .nm{width:118px;flex:none;font-weight:500}
.row .bb{flex:1;height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.row .bb i{display:block;height:100%;background:var(--accent);border-radius:4px}
.row .vv{width:62px;text-align:right;flex:none;font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--faint);font-size:13px;padding:30px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
.warn{position:fixed;left:12px;bottom:12px;background:var(--sand);color:#fff;font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:8px;display:none;z-index:40}
</style>
</head>
<body>
<div class="wrap">
  <h1>Fill the Gaps<span class="ver">v1.1</span></h1>
  <p class="intro">Every stretch of your waking day with nothing against it, 60 minutes or longer. Tap what was actually happening. The more you tag, the better this guesses the next one for you, and the smaller your Unlogged band gets.</p>

  <div class="stat" id="stats"></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="tabs" id="filters"></div>
  <div id="list"><div class="empty">Loading your gaps...</div></div>

  <div class="pat" id="patterns"></div>
</div>
<div class="toast" id="toast"></div>
<div class="warn" id="warn"></div>

<script>
const SUPABASE_URL="https://arnjntspmrhigodlssbn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFybmpudHNwbXJoaWdvZGxzc2JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMTQ0NTgsImV4cCI6MjEwMTg5MDQ1OH0.UN4JMuoKaAWQfhiCstuoOJQ1sVU2hU5pK0tLBY60dfM";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const TAGS=["Getting ready","Eating","Commute","Family","Social","Downtime","Chores","Exercise","Project YOU","TreadWell","Day Job","Learning","Recreation","Travel"];
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let GAPS=[],FILTER='untagged',RANGE=30;

function hm(m){m=((m%1440)+1440)%1440;const h=Math.floor(m/60),x=m%60;return (h%12||12)+(x?':'+String(x).padStart(2,'0'):'')+(h>=12?'pm':'am')}
function dur(m){const h=Math.floor(m/60),x=m%60;return h?(h+'h'+(x?' '+x+'m':'')):(x+'m')}
function lab(ds){const d=new Date(ds+'T12:00:00');return DN[d.getDay()]+', '+MN[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()}
function isWknd(ds){const d=new Date(ds+'T12:00:00');return d.getDay()===0||d.getDay()===6}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)}

/* ---- the training bit: guess a tag from what he already tagged in the same slot ---- */
function suggest(g){
  if(g.tag) return null;
  const mid=g.start_min+g.mins/2, wk=isWknd(g.day), score={}, count={};
  GAPS.forEach(o=>{
    if(!o.tag) return;
    const om=o.start_min+o.mins/2, near=Math.abs(om-mid);
    if(near>120) return;
    let w=(120-near)/120;
    if(isWknd(o.day)===wk) w*=1.8;
    score[o.tag]=(score[o.tag]||0)+w; count[o.tag]=(count[o.tag]||0)+1;
  });
  let best=null,bv=0;
  for(const k in score){if(score[k]>bv){bv=score[k];best=k}}
  /* two examples minimum: one tagged gap is a coincidence, not a pattern */
  return (best&&count[best]>=2&&bv>=0.9)?best:null;
}

/* ---- screen first, save after (Nov 23 rule) ---- */
let pending=0;
function showWarn(){const w=document.getElementById('warn');
  if(pending>0){w.textContent='Weak connection. '+pending+' change'+(pending>1?'s':'')+' kept safe on this screen, still trying...';w.style.display='block'}
  else w.style.display='none'}
async function save(g,tries){
  tries=tries||0;pending++;showWarn();
  try{
    await sb.from('gap_tags').upsert({day:g.day,start_min:g.start_min,mins:g.mins,tag:g.tag,note:g.note||null,updated_at:new Date().toISOString()},{onConflict:'day,start_min'});
    pending--;showWarn();
  }catch(e){
    pending--;showWarn();
    if(tries<4){setTimeout(()=>save(g,tries+1),1200*(tries+1))}
    else toast('Could not save that one yet')
  }
}
function setTag(g,t){
  g.tag=(g.tag===t)?null:t;           // screen updates at once
  render();save(g);
}

function stats(){
  const tot=GAPS.length,done=GAPS.filter(g=>g.tag).length;
  const hrs=GAPS.reduce((a,g)=>a+g.mins,0)/60;
  const dh=GAPS.filter(g=>g.tag).reduce((a,g)=>a+g.mins,0)/60;
  document.getElementById('stats').innerHTML=
    '<div class="s"><b>'+tot+'</b>gaps to account for</div>'+
    '<div class="s"><b>'+hrs.toFixed(0)+' h</b>unaccounted time</div>'+
    '<div class="s"><b>'+done+'</b>tagged so far</div>'+
    '<div class="s"><b>'+dh.toFixed(0)+' h</b>hours recovered</div>';
  document.getElementById('prog').style.width=(tot?Math.round(done/tot*100):0)+'%';
}

function render(){
  stats();
  const show=GAPS.filter(g=>FILTER==='all'||(FILTER==='untagged'?!g.tag:!!g.tag));
  const L=document.getElementById('list');
  if(!show.length){L.innerHTML='<div class="empty">'+(FILTER==='untagged'?'Nothing left to tag in this stretch. Good going.':'Nothing here yet.')+'</div>';patterns();return}
  const by={};show.forEach(g=>{(by[g.day]=by[g.day]||[]).push(g)});
  let h='';
  Object.keys(by).sort().reverse().forEach(d=>{
    const mins=by[d].reduce((a,g)=>a+g.mins,0);
    h+='<div class="dh">'+lab(d)+'<span>'+dur(mins)+' across '+by[d].length+'</span></div>';
    by[d].sort((a,b)=>a.start_min-b.start_min).forEach(g=>{
      const sg=suggest(g);
      h+='<div class="g'+(g.tag?' done':'')+'">'+
         '<div class="gt"><span class="sp">'+hm(g.start_min)+' to '+hm(g.start_min+g.mins)+'</span>'+
         '<span class="ln">'+dur(g.mins)+'</span>'+
         (sg?'<span class="sg">Looks like '+sg+'</span>':'')+'</div>'+
         '<div class="pl">'+TAGS.map(t=>'<button class="p'+(g.tag===t?' on':(sg===t?' sug':''))+'" data-d="'+g.day+'" data-s="'+g.start_min+'" data-t="'+t+'">'+t+'</button>').join('')+'</div>'+
         (g.tag?'<input class="nt" data-nd="'+g.day+'" data-ns="'+g.start_min+'" placeholder="Any detail worth keeping? (optional)" value="'+(g.note||'').replace(/"/g,'&quot;')+'">':'')+
         '</div>';
    });
  });
  L.innerHTML=h;
  patterns();
}

function patterns(){
  const tg=GAPS.filter(g=>g.tag);
  const P=document.getElementById('patterns');
  if(tg.length<3){P.innerHTML='<h2>Patterns</h2><div class="sub">Tag a few gaps and this fills in. Once it sees a pattern it starts guessing the rest for you.</div>';return}
  const by={};tg.forEach(g=>{by[g.tag]=(by[g.tag]||0)+g.mins});
  const ord=Object.keys(by).sort((a,b)=>by[b]-by[a]),mx=by[ord[0]];
  let h='<h2>What was actually in those hours</h2><div class="sub">From the '+tg.length+' gaps you have tagged. This is what trains the guesses above.</div>';
  ord.forEach(k=>{h+='<div class="row"><span class="nm">'+k+'</span><span class="bb"><i style="width:'+Math.round(by[k]/mx*100)+'%"></i></span><span class="vv">'+(by[k]/60).toFixed(1)+' h</span></div>'});
  P.innerHTML=h;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('.p');if(!b)return;
  const g=GAPS.find(x=>x.day===b.dataset.d&&x.start_min==b.dataset.s);
  if(g)setTag(g,b.dataset.t);
});
document.addEventListener('change',e=>{
  const n=e.target.closest('.nt');if(!n)return;
  const g=GAPS.find(x=>x.day===n.dataset.nd&&x.start_min==n.dataset.ns);
  if(g){g.note=n.value;save(g);toast('Saved')}
});
document.getElementById('filters').addEventListener('click',e=>{
  const t=e.target.closest('.tab');if(!t)return;
  if(t.dataset.f){FILTER=t.dataset.f}else if(t.dataset.r){RANGE=+t.dataset.r;load();return}
  drawTabs();render();
});
function drawTabs(){
  document.getElementById('filters').innerHTML=
    [['untagged','To tag'],['tagged','Tagged'],['all','All']].map(x=>'<button class="tab'+(FILTER===x[0]?' on':'')+'" data-f="'+x[0]+'">'+x[1]+'</button>').join('')+
    '<span style="flex:1"></span>'+
    [[14,'2 weeks'],[30,'Month'],[90,'3 months']].map(x=>'<button class="tab'+(RANGE===x[0]?' on':'')+'" data-r="'+x[0]+'">'+x[1]+'</button>').join('');
}
async function load(){
  drawTabs();
  const to=new Date(),from=new Date(Date.now()-RANGE*864e5);
  const iso=d=>d.toISOString().slice(0,10);
  try{
    const{data,error}=await sb.rpc('py_gaps',{p_from:iso(from),p_to:iso(to),p_min:60});
    if(error)throw error;
    GAPS=(data||[]).map(r=>({day:r.day,start_min:r.start_min,mins:r.mins,tag:r.tag,note:r.note}));
    render();
  }catch(e){
    document.getElementById('list').innerHTML='<div class="empty">Could not load your gaps just now. Try the page again in a minute.</div>';
  }
}
load();
</script>
<script src="nav-config.js"></script><script src="navpatch.js"></script></body>
</html>
