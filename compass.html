<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compass · ProjectYou</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--ink:#1f2a44;--muted:#5b6472;--line:#e3e7ee;--bg:#eef1f6;--card:#fff;--accent:#3f6f8f;--accent2:#2f5a74;--chip:#eef2f8;--green:#1e8e5a;--gold:#c68a2e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
  .nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;align-items:center;padding:9px 14px;flex-wrap:wrap}
  .nav .brand{font-weight:800;color:var(--accent);margin-right:8px;font-size:14px}
  .nav a{font-size:12.5px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px}
  .nav a:hover{background:var(--chip);color:var(--accent)} .nav a.on{background:var(--accent);color:#fff}
  .nav .who{margin-left:auto;font-size:11.5px;color:var(--muted)}
  .stage{max-width:580px;margin:0 auto;padding:18px 16px 44px}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-bottom:6px}
  .bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px}
  .bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 26px;min-height:420px;display:flex;flex-direction:column;box-shadow:0 14px 40px rgba(31,42,68,.10)}
  .datestamp{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#9aa6b4;margin-bottom:10px}
  .kicker{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
  .time{float:right;font-size:11px;font-weight:800;color:var(--gold);background:#f7edd9;border-radius:999px;padding:3px 10px;text-transform:none;letter-spacing:0}
  .q{font-size:26px;line-height:1.24;margin-top:14px;font-weight:800}
  .ladder{margin-top:16px;flex:1}
  .step{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--muted);line-height:1.45}
  .step:last-child{border-bottom:none}
  .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--chip);color:var(--accent);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .ans{width:100%;font-family:inherit;font-size:15px;padding:12px;border:1px solid var(--line);border-radius:12px;resize:vertical;min-height:90px;margin-top:14px}
  .navbtns{display:flex;justify-content:space-between;margin-top:16px;gap:10px}
  .btn{font-family:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:12px;padding:12px 18px;cursor:pointer;font-size:15px}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .skip{background:none;border:none;color:var(--muted);text-decoration:underline;font-weight:700;cursor:pointer;font-size:13.5px;font-family:inherit;margin-top:12px;align-self:flex-start}
  #login{max-width:340px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 14px 40px rgba(31,42,68,.16)}
  #login h1{font-size:18px;color:var(--accent);margin-bottom:4px}#login p{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  #login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;font-size:14px;font-family:inherit}
  #login .err{color:#c0453b;font-size:12.5px;min-height:16px}
  .badge{position:fixed;right:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:11px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}.toast.show{opacity:1}
  .hidden{display:none}
  .confetti{position:fixed;top:-30px;font-size:22px;pointer-events:none;z-index:99;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.9}}
</style>
</head>
<body>
<div id="login">
  <h1>Compass</h1><p>Sign in to your ProjectYou account.</p>
  <input id="email" type="email" placeholder="email"><input id="pass" type="password" placeholder="password">
  <button class="btn primary" style="width:100%" onclick="signIn()">Sign in</button><div class="err" id="loginErr"></div>
</div>

<div id="app" class="hidden">
  <div class="nav"><a href="mission.html" class="brand" style="display:flex;align-items:center;margin-right:6px"><img src="project-you-logo.png" alt="Project YOU" style="height:30px;width:auto;display:block"></a><a href="index.html">CrushingIt</a><a href="ai.html">AI Deck ML Module</a><a href="quotes.html">Clever Phrases ML Module</a><a href="compass.html" class="on">Compass ML Module</a><a href="ai-tools.html">AI Tools</a><a href="mission.html">Mission Control</a><a href="qs-wheel.html">QS Dashboard</a><a href="build.html">Build Board</a><a href="dfd.html">Data Flow Diagram</a><span class="who" id="who"></span></div>
  <div class="stage">
    <div class="top"><span id="prog"></span><span>Year Compass · one a day</span></div>
    <div class="bar"><span id="barfill"></span></div>
    <div id="deck"></div>
  </div>
  <div class="badge">Compass ML Module v1.1</div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL="https://arnjntspmrhigodlssbn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFybmpudHNwbXJoaWdvZGxzc2JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMTQ0NTgsImV4cCI6MjEwMTg5MDQ1OH0.UN4JMuoKaAWQfhiCstuoOJQ1sVU2hU5pK0tLBY60dfM";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let QS=[], LOG={}, cur=null;
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function today(){return new Date().toISOString().slice(0,10);}
function dstamp(){return new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session)onLogin(session);}
async function signIn(){const email=document.getElementById('email').value.trim();const pass=document.getElementById('pass').value;
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){document.getElementById('loginErr').textContent=error.message;return;}onLogin(data.session);}
async function onLogin(session){try{await sb.realtime.setAuth(session.access_token);}catch(e){}
  document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
  document.getElementById('who').textContent=session.user.email;load();}
async function load(){
  const [{data:q},{data:l}]=await Promise.all([
    sb.from('compass_questions').select('*').order('ord'),
    sb.from('compass_log').select('*')
  ]);
  QS=q||[]; LOG={}; (l||[]).forEach(r=>LOG[r.question_id]=r);
  render();
}
function answered(){return QS.filter(q=>LOG[q.id]&&LOG[q.id].status==='answered').length;}
function eligible(){
  const t=today();
  return QS.find(q=>{const r=LOG[q.id];
    if(!r||r.status==='pending')return true;
    if(r.status==='parked'&&r.resurface_on&&r.resurface_on<=t)return true;
    return false;});
}
function progress(){
  const a=answered(), tot=QS.length;
  document.getElementById('prog').textContent=a+' of '+tot+' answered';
  document.getElementById('barfill').style.width=(tot?Math.round(a/tot*100):0)+'%';
}
function render(){
  progress();
  if(answered()===QS.length && QS.length){renderDone();return;}
  cur=eligible();
  if(!cur){
    document.getElementById('deck').innerHTML='<div class="card"><div class="datestamp">'+dstamp()+'</div><div class="kicker">All caught up</div><h2 class="q">Nothing waiting today.</h2><div class="ladder"><div class="step" style="border:none">A parked question will resurface here in a few days. Come back tomorrow.</div></div></div>';
    return;
  }
  const q=cur;
  let steps=q.ladder.map((s,i)=>'<div class="step"><span class="num">'+(i+1)+'</span><span>'+esc(s)+'</span></div>').join('');
  let inner='<div class="datestamp">'+dstamp()+'</div>';
  inner+='<div class="kicker">'+esc(q.category)+'<span class="time">'+q.time_min+' min</span></div>';
  inner+='<div class="q">'+esc(q.question)+'</div>';
  inner+='<div class="ladder">'+steps+'</div>';
  inner+='<textarea class="ans" id="ans" placeholder="🎤 Tap Speak and just talk, or type here. Voice is the easiest way in."></textarea>';
  inner+='<div class="navbtns"><button class="btn" id="cmic" type="button" style="background:#fff;border:1px solid var(--line);color:var(--accent);display:flex;gap:6px;align-items:center" onclick="toggleCmic()">🎤 <span id="cmicLbl">Speak</span></button><button class="btn primary" style="flex:1" onclick="saveAns()">Save reflection</button></div>';
  inner+='<button class="skip" onclick="skip()">Only have 5 minutes? Skip this, get it back later</button>';
  document.getElementById('deck').innerHTML='<div class="card">'+inner+'</div>';
  const r=LOG[q.id]; if(r&&r.answer)document.getElementById('ans').value=r.answer;
}
async function saveAns(){
  const a=document.getElementById('ans').value.trim();
  if(!a){toast('Write a little something first, or skip.');return;}
  await sb.from('compass_log').upsert({question_id:cur.id,status:'answered',answer:a,answered_on:today(),shown_on:today(),updated_at:new Date().toISOString()},{onConflict:'question_id'});
  LOG[cur.id]={question_id:cur.id,status:'answered',answer:a};
  toast('Saved. Nice work.');
  render();
}
let cmicRec=null, cmicOn=false;
function toggleCmic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const ta=document.getElementById('ans');
  const lbl=document.getElementById('cmicLbl'); const btn=document.getElementById('cmic');
  if(!SR){toast('Voice not supported in this browser. Type instead.');return;}
  if(cmicOn){try{cmicRec&&cmicRec.stop();}catch(e){}return;}
  cmicRec=new SR(); cmicRec.lang='en-US'; cmicRec.interimResults=true; cmicRec.continuous=true;
  let base=ta.value?ta.value.trim()+' ':'';
  cmicRec.onstart=()=>{cmicOn=true;if(lbl)lbl.textContent='Listening…';btn.style.background='#c0453b';btn.style.color='#fff';btn.style.borderColor='#c0453b';};
  cmicRec.onend=()=>{cmicOn=false;if(lbl)lbl.textContent='Speak';btn.style.background='#fff';btn.style.color='var(--accent)';btn.style.borderColor='var(--line)';};
  cmicRec.onerror=(e)=>{toast('Mic: '+(e.error||'error'));};
  cmicRec.onresult=(e)=>{let fin='',intr='';for(let i=e.resultIndex;i<e.results.length;i++){const tr=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=tr+' ';else intr+=tr;}if(fin)base+=fin;ta.value=(base+intr).trim();};
  try{cmicRec.start();}catch(e){toast('Could not start mic');}
}
async function skip(){
  const d=new Date(); d.setDate(d.getDate()+3);
  const res=d.toISOString().slice(0,10);
  await sb.from('compass_log').upsert({question_id:cur.id,status:'parked',resurface_on:res,shown_on:today(),updated_at:new Date().toISOString()},{onConflict:'question_id'});
  LOG[cur.id]={question_id:cur.id,status:'parked',resurface_on:res};
  toast('Parked. It comes back in a few days.');
  render();
}
function renderDone(){
  document.getElementById('deck').innerHTML='<div class="card" style="text-align:center;align-items:center;justify-content:center">'+
    '<div class="kicker">Year Compass complete</div>'+
    '<div style="font-size:56px;margin:14px 0">🧭</div>'+
    '<h2 class="q">You answered every question.</h2>'+
    '<div class="ladder" style="flex:none;max-width:420px"><div class="step" style="border:none;display:block;text-align:center">That is the whole reflection captured. Nothing gets added to Project YOU automatically. Claude will read your answers and hand you a summary of how to fold the learnings in, for you to review and decide.</div></div>'+
    '<div style="font-size:13px;color:var(--muted);margin-top:8px">Tell Claude "the Compass is done" for your summary.</div></div>';
  confetti();
}
function confetti(){
  const emo=['🎉','🧭','✨','🎊','⭐'];
  for(let i=0;i<28;i++){
    const s=document.createElement('div'); s.className='confetti'; s.textContent=emo[i%emo.length];
    s.style.left=(5+Math.floor((i*97)%90))+'%';
    s.style.animationDuration=(2.4+((i%5)*0.4))+'s';
    s.style.animationDelay=((i%7)*0.12)+'s';
    document.body.appendChild(s); setTimeout(()=>s.remove(),5000);
  }
}
boot();
</script>
</body>
</html>
