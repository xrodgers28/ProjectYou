<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Trackers · Project YOU OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--ink:#20242b;--muted:#6b7280;--line:#e7e9ee;--bg:#fbfbfa;--card:#fff;--accent:#3f6f8f;--hub:#2f5a74;
    --green:#1e8e5a;--amber:#c68a2e;--red:#c0453b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.3;padding:18px 16px 60px}
  .head{max-width:1160px;margin:0 auto}
  h1{font-size:22px;color:var(--hub);font-weight:800}
  .meta{color:var(--muted);font-size:13px;margin-top:2px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px;margin-top:7px;
    background:#eef7f1;color:var(--green);border:1px solid #cfe9db}
  .chip.off{background:#fbe7e5;color:var(--red);border-color:#f0cfcb}
  .sub{color:var(--muted);font-size:13px;margin-top:8px;line-height:1.45;max-width:840px}
  h2{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--hub);max-width:1160px;margin:22px auto 6px}
  .tbl{max-width:1160px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .r{display:grid;grid-template-columns:34px 1fr 190px 150px;align-items:center;border-bottom:1px solid var(--line)}
  .r:last-child{border-bottom:none}
  .r.hd{background:#f4f5f7;font-weight:800;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
  .c{padding:11px 14px}
  .c.lt{padding-left:12px}
  .dot{display:block;width:13px;height:13px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.04)}
  .dot.green{background:var(--green)} .dot.amber{background:#e08b1f}
  .tt{color:var(--accent);text-decoration:none;font-size:14.5px;font-weight:700;border-bottom:1px solid #cfdae5}
  .tt:hover{border-bottom-color:var(--accent)}
  .desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
  .proj{font-size:12px;color:var(--muted);font-weight:700}
  .open{font-size:12px;font-weight:800}
  .open.zero{color:#a7adb6;font-weight:700}
  .open.some{color:#b1721b}
  .empty{max-width:1160px;margin:0 auto;padding:22px;text-align:center;color:var(--muted);font-size:13.5px;
    background:var(--card);border:1px solid var(--line);border-radius:14px}
  @media(max-width:760px){
    .r{grid-template-columns:22px 1fr}
    .r .c:nth-child(3),.r .c:nth-child(4){grid-column:2;padding-top:0}
    .r.hd{display:none}
  }
</style>
</head>
<body>
<div class="head">
  <h1>Session Trackers</h1>
  <div class="meta">Every conversation, newest first</div>
  <div id="syncchip" class="chip">connecting...</div>
  <div class="sub">One page per chat. Nothing here overwrites anything else, and each tracker keeps its own answers. The light is green when nothing is waiting on you and amber when something is.</div>
</div>

<div id="out"></div>

<script>
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFybmpudHNwbXJoaWdvZGxzc2JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMTQ0NTgsImV4cCI6MjEwMTg5MDQ1OH0.UN4JMuoKaAWQfhiCstuoOJQ1sVU2hU5pK0tLBY60dfM';
let sb=null; try{ sb=window.supabase.createClient('https://arnjntspmrhigodlssbn.supabase.co',KEY); }catch(e){}
function chip(ok,msg){const c=document.getElementById('syncchip');
  if(ok){c.textContent=msg||'live';c.className='chip';}else{c.textContent=msg||'offline';c.className='chip off';}}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pretty(d){
  const p=String(d||'').split('-'); if(p.length!==3) return d||'';
  const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return M[(+p[1])-1]+' '+(+p[2])+', '+p[0];
}
function rowNode(t){
  const d=document.createElement('div'); d.className='r';
  const open=t.open_count||0;
  const lt=open>0?'amber':'green';
  d.innerHTML=
    '<div class="c lt"><span class="dot '+lt+'" title="'+(open>0?open+' waiting on you':'nothing waiting')+'"></span></div>'+
    '<div class="c"><a class="tt" href="'+esc(t.url||'#')+'">'+esc(t.title||t.slug)+'</a>'+
      (t.subtitle?'<div class="desc">'+esc(t.subtitle)+'</div>':'')+'</div>'+
    '<div class="c proj">'+esc(t.project||'')+'</div>'+
    '<div class="c"><span class="open '+(open>0?'some':'zero')+'">'+(open>0?open+' waiting on you':'nothing waiting')+'</span></div>';
  return d;
}
async function boot(){
  const out=document.getElementById('out');
  if(!sb){ chip(false,'cannot reach the database'); return; }
  let rows=[];
  try{
    const {data,error}=await sb.from('session_trackers').select('*').order('day',{ascending:false}).order('created_at',{ascending:false});
    if(error) throw error;
    rows=data||[];
    chip(true,rows.length+' tracker'+(rows.length===1?'':'s'));
  }catch(e){ chip(false,'cannot reach the database'); return; }
  if(!rows.length){
    out.innerHTML='<div class="empty">No trackers yet. Say <b>session tracker</b> in any chat and one appears here.</div>';
    return;
  }
  const days=[];
  rows.forEach(r=>{ if(!days.includes(r.day)) days.push(r.day); });
  days.forEach(day=>{
    const h=document.createElement('h2'); h.textContent=pretty(day); out.appendChild(h);
    const t=document.createElement('div'); t.className='tbl';
    const hd=document.createElement('div'); hd.className='r hd';
    hd.innerHTML='<div class="c lt"></div><div class="c">Session</div><div class="c">Project</div><div class="c">Your call</div>';
    t.appendChild(hd);
    rows.filter(r=>r.day===day).forEach(r=>t.appendChild(rowNode(r)));
    out.appendChild(t);
  });
}
boot();
</script>
<script src="nav-config.js"></script><script src="navpatch.js"></script></body>
</html>
