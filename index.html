<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrushingIt</title>
<style>
  :root{
    --ink:#4d4d4d;          /* body text */
    --ink-strong:#2b2b2b;   /* domain names */
    --muted:#9a9fa8;        /* notes / dates */
    --bullet:#b7bcc4;       /* resting bullet */
    --bullet-hover:#6b7180; /* hovered bullet */
    --guide:#eceef1;        /* indent guide line */
    --halo:#dfe3e8;         /* collapsed-node halo */
    --row:13px;             /* base font size (compact, Workflowy-like) */
    --lh:1.34;              /* tight line height */
    --indent:22px;          /* indent per level */
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    font-size:var(--row);
    line-height:var(--lh);
    background:#fff;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:26px 26px 120px}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
  .title{font-size:16px;font-weight:700;color:var(--ink-strong);letter-spacing:.2px}
  .hint{font-size:11px;color:var(--muted)}

  /* ---- outline ---- */
  ul.list{list-style:none;margin:0;padding:0}
  ul.list ul.list{margin-left:var(--indent);border-left:1px solid var(--guide)}
  li.node{position:relative;padding:0}
  .row{
    display:flex;align-items:flex-start;gap:6px;
    padding:1px 4px 1px 0;border-radius:4px;
    min-height:20px;
  }
  .row:hover{background:#f6f7f9}
  li.node.dragging > .row{opacity:.4}
  .sortable-ghost > .row{background:#eef3fb;outline:1px dashed #b9cdec}

  /* triangle (collapse): hidden until hover, only meaningful when node has children */
  .caret{
    flex:0 0 auto;width:12px;height:18px;margin-top:0;
    display:flex;align-items:center;justify-content:center;
    color:#c4c8ce;font-size:9px;cursor:pointer;user-select:none;
    opacity:0;transition:opacity .12s,transform .12s;
  }
  .row:hover .caret{opacity:1}
  li.has-children > .row .caret{opacity:.55}
  li.has-children > .row:hover .caret{opacity:1}
  li.collapsed > .row .caret{transform:rotate(-90deg)}
  li.collapsed > ul.list{display:none}

  /* bullet */
  .bullet{
    flex:0 0 auto;width:16px;height:18px;position:relative;cursor:grab;
    display:flex;align-items:center;justify-content:center;margin-top:0;
  }
  .bullet:active{cursor:grabbing}
  .bullet .dot{
    width:6px;height:6px;border-radius:50%;background:var(--bullet);
    transition:background .12s;z-index:2;
  }
  .bullet:hover .dot{background:var(--bullet-hover)}
  li.has-children.collapsed > .row .bullet::before{
    content:"";position:absolute;width:16px;height:16px;border-radius:50%;
    background:var(--halo);z-index:1;
  }
  /* colored domain dots */
  li.domain > .row .bullet .dot{width:8px;height:8px}

  .text{
    flex:1 1 auto;outline:none;padding:0 2px;
    word-break:break-word;white-space:pre-wrap;min-width:20px;
  }
  li.domain > .row .text{font-weight:700;color:var(--ink-strong)}
  .note{color:var(--muted);font-size:11px;padding:0 2px 3px 44px;margin-top:-1px}
  .date{color:var(--muted);font-size:10.5px;flex:0 0 auto;padding-top:1px;opacity:0;transition:opacity .12s}
  .row:hover .date{opacity:1}

  /* add-line control */
  .addrow{display:flex;align-items:center;gap:6px;padding:1px 4px 1px 22px;color:#c0c4cb;font-size:12px;cursor:pointer;border-radius:4px}
  .addrow:hover{background:#f6f7f9;color:#8a8f98}
  .addrow .plus{width:16px;text-align:center}

  /* ---- live export panel (always visible; clipboard API is blocked in-sandbox) ---- */
  .panel{margin-top:30px;border-top:1px solid #edeef0;padding-top:14px}
  .panel h2{font-size:12px;font-weight:700;color:var(--ink-strong);margin:0 0 6px;text-transform:uppercase;letter-spacing:.5px}
  .panel p{font-size:11px;color:var(--muted);margin:0 0 8px}
  .exportbox{
    width:100%;height:180px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px;line-height:1.5;color:#3a3f47;background:#fbfbfc;
    border:1px solid #e4e6ea;border-radius:6px;padding:10px;resize:vertical;
  }
  .btns{display:flex;gap:8px;margin-top:8px}
  .btn{font-size:11.5px;padding:5px 11px;border:1px solid #d9dce1;background:#fff;color:#444;border-radius:6px;cursor:pointer}
  .btn:hover{background:#f4f5f7}

  /* completion checkbox */
  .check{
    flex:0 0 auto;width:14px;height:14px;margin-top:2px;
    border:1.5px solid #cfd4da;border-radius:4px;background:#fff;
    cursor:pointer;position:relative;transition:background .12s,border-color .12s;
  }
  .check:hover{border-color:#9aa0a8}
  li.done > .row .check{background:#7bbf9e;border-color:#7bbf9e}
  li.done > .row .check::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  li.done > .row .text{text-decoration:line-through;color:#a8adb5}
  li.done > .row .date{text-decoration:none}
  .done-section > .row .text{color:#9a9fa8;font-weight:700}
  /* undo toast */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:#2b2b2b;color:#fff;font-size:12.5px;padding:9px 14px;border-radius:8px;
    display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;
    transition:opacity .18s,transform .18s;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .toast button{background:none;border:none;color:#8fc9ff;font-size:12.5px;font-weight:600;cursor:pointer;padding:0}
  li.date-group > .row .text{font-weight:600;color:#8a8f98}
  .count{color:#b0b4bb;font-weight:400;font-size:11px}
  .star{
    flex:0 0 auto;width:14px;height:18px;margin-top:1px;cursor:pointer;user-select:none;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#d3d6db;
    transition:color .12s;
  }
  .star:hover{color:#e0ab2c}
  li.starred > .row .star{color:#f0b429}
  li.done > .row .star{display:none}
  li.priority-group > .row .text{font-weight:700;color:#c07f10}
  .domain-badge{padding:1px 8px;border-radius:4px;display:inline-block}
  .section-total{display:flex;align-items:center;gap:6px;margin:3px 0 12px calc(var(--indent) + 4px);padding:3px 10px;background:#ffe95c;border:1px solid #e5cf3a;border-radius:6px;font-size:12.5px;font-weight:700;color:#4d4d4d;width:fit-content;}
  .section-total .total-val{font-variant-numeric:tabular-nums;}
  ul.list:empty{min-height:20px;}
  .estbox{flex:0 0 auto;width:34px;margin-left:6px;padding:1px 4px;border:1px solid #d9dce1;border-radius:5px;font:inherit;font-size:11px;text-align:center;color:#4d4d4d;background:#fff;}
  .estbox:focus{outline:none;border-color:#9aa0a8;background:#fffef2;}
  .actual-badge{flex:0 0 auto;margin-left:6px;font-size:11px;font-weight:700;color:#2f8f5b;}
  .actual-prompt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:2px 0 8px 40px;padding:5px 9px;background:#eefaf1;border:1px solid #bfe6cd;border-radius:7px;font-size:12px;color:#3a5;}
  .actual-prompt .ap-q{color:#356;font-weight:600;}
  .actual-prompt .ap-in{width:46px;padding:1px 4px;border:1px solid #cfd3d9;border-radius:5px;font-size:12px;text-align:center;}
  .actual-prompt .ap-btn{cursor:pointer;border:1px solid #cfd3d9;background:#fff;border-radius:5px;padding:2px 9px;font-size:11px;}
  .actual-prompt .ap-same{background:#2f8f5b;color:#fff;border-color:#2f8f5b;}
  .subtotal{flex:0 0 auto;margin-left:8px;padding:1px 8px;background:#ffe95c;border:1px solid #e5cf3a;border-radius:5px;font-size:11px;font-weight:700;color:#4d4d4d;font-variant-numeric:tabular-nums;}
  .actbox{flex:0 0 auto;width:34px;margin-left:6px;padding:1px 4px;border:1px solid #d9dce1;border-radius:5px;font:inherit;font-size:11px;text-align:center;color:#4d4d4d;background:#fff;}
  .actbox:focus{outline:none;border-color:#7bbf9e;background:#f2fbf5;}
  .section-total-grey{background:#e8eaed;border-color:#cfd3d9;color:#4d4d4d;}
  .done-section{ margin-top:14px; margin-bottom:34px; }
  .tmrw-btn{flex:0 0 auto;margin-left:6px;border:1px solid #d9dce1;background:#fff;border-radius:5px;font-size:12px;line-height:1;padding:2px 7px;cursor:pointer;color:#8a9098;}
  .tmrw-btn:hover{border-color:#5b6270;color:#5b6270;background:#f4f5f7;}
  .skipped > .row > .text{text-decoration:line-through;color:#a2a8b0;}
  .skip-btn{flex:0 0 auto;margin-left:6px;border:1px solid #d9dce1;background:#fff;border-radius:5px;font-size:12px;line-height:1;padding:2px 7px;cursor:pointer;color:#b0b5bc;}
  .skip-btn:hover{border-color:#c0492f;color:#c0492f;background:#fdf3f1;}

</style>
<style>
  body { margin:0; }
  #login { position:fixed; inset:0; background:#f4f5f7; display:flex; align-items:center; justify-content:center; z-index:50; }
  #login .box { background:#fff; border:1px solid #e2e4e8; border-radius:12px; padding:26px 24px; width:320px; box-shadow:0 6px 24px rgba(0,0,0,.06); font-family:Arial,Helvetica,sans-serif; }
  #login h1 { font-size:22px; margin:0 0 4px; color:#2b2b2b; }
  #login p { font-size:12.5px; color:#77797f; margin:0 0 16px; }
  #login input { width:100%; box-sizing:border-box; padding:10px 12px; margin:6px 0; border:1px solid #cfd4da; border-radius:7px; font-size:14px; font-family:inherit; }
  #login button { width:100%; padding:10px; margin-top:8px; background:#2b2b2b; color:#fff; border:none; border-radius:7px; font-size:14px; cursor:pointer; }
  #login .msg { font-size:12px; margin-top:10px; min-height:16px; }
  #login .msg.err { color:#c0492f; }
  .appbar { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid #eceef1; font-family:Arial,Helvetica,sans-serif; position:sticky; top:0; background:#fff; z-index:10; }
  .appbar .brand { font-weight:700; font-size:16px; color:#2b2b2b; }
  .appbar .who { font-size:11.5px; color:#9a9fa8; }
  .appbar .who a { color:#5b6270; cursor:pointer; margin-left:8px; }
  #app { display:none; }
  .synced { font-size:10.5px; color:#2f8f5b; }
  .star { flex:0 0 auto; cursor:pointer; font-size:14px; line-height:1; color:#d3d6db; margin-left:4px; user-select:none; }
  .star.on { color:#f0b429; }
  .bullet .dot { flex:0 0 auto; }   /* keep dots perfectly round even in tight space */
  .secdate { color:#b0b4bb; font-weight:400; font-size:12px; margin-left:8px; }
  .appbar .who a#undo { cursor:pointer; margin-right:10px; color:#5b6270; }
  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#2b2b2b; color:#fff; font-family:Arial; font-size:14px; padding:11px 18px; border-radius:9px; z-index:120; display:none; }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h1>CrushingIt</h1>
    <p>Sign in to your private list. First time: enter your email and pick a password, it makes your account.</p>
    <input id="email" type="email" placeholder="you@email.com" autocomplete="username">
    <input id="password" type="password" placeholder="password" autocomplete="current-password">
    <button id="signin">Enter</button>
    <div id="loginmsg" class="msg"></div>
  </div>
</div>

<div id="app">
  <div class="appbar">
    <span class="brand">CrushingIt <span class="synced">● live</span></span>
    <span class="who"><a id="undo" style="display:none">↶ undo</a><span id="whoami"></span><a id="signout">sign out</a></span>
  </div>
  <div class="wrap">
    <ul class="list" id="board"></ul>
  </div>
</div>
<div id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import Sortable from 'https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/+esm';

const SUPABASE_URL = 'https://arnjntspmrhigodlssbn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_c570L9svjlGd4bHyJClkFA_gNWv1b6v';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const SECTIONS = [
  ['📥 Inbox · uncategorized captures', '#b7bcc4'],
  ['Core To-Dos', '#5b6270'],
  ['⏳ Waiting Area', '#cbb0e0'],
  ["Tomorrow's Core To-Dos", '#5b6270'],
  ['After Core', '#f0c674'],
  ['✓ Completed Tasks', '#c7ccd3'],
  ['Not Urgent', '#b7bcc4'],
  ['Work/Amazon', '#b7bcc4'],
  ['Emotional Health', '#9db4e0'],
  ['Physical Health', '#e8a0b8'],
  ['Environmental Health', '#8fd0c4'],
  ['Social Well-Being', '#a9c8e8'],
  ['Recreational Health', '#f0b58f'],
  ['Sense of Purpose (Ikigai)', '#e0a9c0'],
  ['Mental Fitness', '#ead98f'],
  ['Tracking', '#7bbf9e'],
];
const COLOR = Object.fromEntries(SECTIONS);
const ORDER = SECTIONS.map(s => s[0]);
const TIMED = new Set(['Core To-Dos', "Tomorrow's Core To-Dos", 'After Core']);
const TOTAL_YELLOW = new Set(['Core To-Dos']);
const TOTAL_GREY = new Set(['After Core']);
const COMPLETED = '✓ Completed Tasks';
const TOP = '⭐ Top Priority';

let todos = [];
let sectionOrder = [];
const collapsed = {};
let habitsWereAllDone = false;

/* ---------- auth ---------- */
const loginEl = document.getElementById('login');
const appEl = document.getElementById('app');
const msg = (t, cls) => { const m = document.getElementById('loginmsg'); m.textContent = t; m.className = 'msg ' + (cls || ''); };

async function refreshAuth() {
  const { data } = await sb.auth.getSession();
  if (data.session) { showApp(data.session.user.email); }
  else { loginEl.style.display = 'flex'; appEl.style.display = 'none'; }
}
async function showApp(email) {
  loginEl.style.display = 'none';
  appEl.style.display = 'block';
  document.getElementById('whoami').textContent = email || '';
  const { data } = await sb.auth.getSession();
  if (data.session) sb.realtime.setAuth(data.session.access_token);
  await maybeRollover();
  await load();
  subscribe();
}
document.getElementById('signin').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password) { msg('Enter your email and password.', 'err'); return; }
  msg('Signing in...', '');
  let { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    const su = await sb.auth.signUp({ email, password });
    if (su.error) { msg(su.error.message, 'err'); return; }
    const si = await sb.auth.signInWithPassword({ email, password });
    if (si.error) { msg(si.error.message, 'err'); return; }
    data = si.data;
  }
  msg('', '');
  showApp(data.session.user.email);
};
document.getElementById('password').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('signin').click(); });
document.getElementById('signout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
document.getElementById('undo').onclick = doUndo;

/* ---------- daily rollover ---------- */
function effectiveDate(offset) {
  const d = new Date();
  if (d.getHours() < 3) d.setDate(d.getDate() - 1);   // before 3am still counts as the previous day
  if (offset) d.setDate(d.getDate() + offset);
  return d;
}
function localDate() { return effectiveDate(0).toLocaleDateString('en-CA'); } // YYYY-MM-DD, 3am-aware
function prettyDate(d) { return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }); }
async function maybeRollover() {
  const today = localDate();
  const { data } = await sb.from('app_meta').select('value').eq('key', 'last_rollover').maybeSingle();
  if (data && data.value === today) return;
  const now = new Date().toISOString();
  // 1) Tomorrow's Core becomes Today
  await sb.from('todos').update({ bucket: 'today', updated_at: now }).eq('bucket', 'tomorrow');
  // 2) finished non-habit tasks move into Completed (history preserved)
  await sb.from('todos').update({ section: COMPLETED, subsection: null, updated_at: now })
    .eq('done', true).eq('is_habit', false).neq('section', COMPLETED);
  // 3) habits reset fresh for the new day
  await sb.from('todos').update({ done: false, done_at: null, actual_minutes: null, skipped: false, status: 'todo', updated_at: now })
    .eq('is_habit', true);
  await sb.from('app_meta').upsert({ key: 'last_rollover', value: today, updated_at: now });
}

/* ---------- data ---------- */
async function load() {
  const { data, error } = await sb.from('todos').select('*').order('position', { ascending: true });
  if (error) { console.error(error); return; }
  todos = data || [];
  const so = await sb.from('app_meta').select('value').eq('key', 'section_order').maybeSingle();
  sectionOrder = (so.data && so.data.value) ? JSON.parse(so.data.value) : [];
  render();
}
function subscribe() {
  sb.channel('todos-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'todos' }, () => {
      const a = document.activeElement;
      if (a && (a.isContentEditable || a.tagName === 'INPUT')) return;
      load();
    })
    .subscribe();
}
async function patch(id, fields) {
  fields.updated_at = new Date().toISOString();
  const t = todos.find(x => x.id === id); if (t) Object.assign(t, fields);
  const { error } = await sb.from('todos').update(fields).eq('id', id);
  if (error) console.error(error);
}
async function addTask(section, subsection) {
  const pos = Math.max(0, ...todos.map(t => t.position || 0)) + 1;
  const isHabit = (subsection || '').toUpperCase().includes('HABIT BANDIT');
  const ins = { section, subsection: subsection || null, task: 'New task', position: pos,
                bucket: section === "Tomorrow's Core To-Dos" ? 'tomorrow' : 'today',
                is_habit: isHabit, category: isHabit ? 'HABIT BANDIT' : null };
  const { data, error } = await sb.from('todos').insert(ins).select().single();
  if (error) { console.error(error); return; }
  todos.push(data); render();
  const elx = document.querySelector('[data-id="' + data.id + '"] .text');
  if (elx) { elx.focus(); const r = document.createRange(); r.selectNodeContents(elx); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
}
async function removeTask(id) { todos = todos.filter(x => x.id !== id); render(); await sb.from('todos').delete().eq('id', id); }

const UNDO_FIELDS = ['position','section','subsection','is_habit','bucket','done','done_at','actual_minutes','starred','skipped','origin_section','origin_subsection','status'];
let undoState = null;
function snapshot() {
  undoState = { todos: todos.map(t => { const o = { id: t.id }; UNDO_FIELDS.forEach(f => o[f] = t[f]); return o; }), sectionOrder: [...sectionOrder] };
  const b = document.getElementById('undo'); if (b) b.style.display = 'inline';
}
async function doUndo() {
  if (!undoState) return;
  const snap = Object.fromEntries(undoState.todos.map(s => [s.id, s]));
  const changed = [];
  todos.forEach(t => { const s = snap[t.id]; if (!s) return; if (UNDO_FIELDS.some(f => t[f] !== s[f])) { UNDO_FIELDS.forEach(f => t[f] = s[f]); changed.push(t); } });
  const secChanged = JSON.stringify(sectionOrder) !== JSON.stringify(undoState.sectionOrder);
  sectionOrder = undoState.sectionOrder;
  undoState = null; const b = document.getElementById('undo'); if (b) b.style.display = 'none';
  render();
  const now = new Date().toISOString();
  for (const t of changed) {
    await sb.from('todos').update({ position: t.position, section: t.section, subsection: t.subsection, is_habit: t.is_habit, bucket: t.bucket, done: t.done, done_at: t.done_at, actual_minutes: t.actual_minutes, starred: t.starred, skipped: t.skipped, origin_section: t.origin_section, origin_subsection: t.origin_subsection, status: t.status, updated_at: now }).eq('id', t.id);
  }
  if (secChanged) await sb.from('app_meta').upsert({ key: 'section_order', value: JSON.stringify(sectionOrder), updated_at: now });
}

/* ---------- helpers ---------- */
function fmt(m) { if (!m) return '0m'; if (m < 60) return m + 'm'; const h = Math.floor(m/60), r = m%60; return r ? h+'h '+r+'m' : h+'h'; }
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
function escapeHtml(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function toast(t){ const e=document.getElementById('toast'); e.textContent=t; e.style.display='block'; setTimeout(()=>e.style.display='none',2600); }

function confetti(){
  const c=document.createElement('canvas'); c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:110'; document.body.appendChild(c);
  const x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#f0c674','#e8a0b8','#8fd0c4','#a9c8e8','#cbb0e0','#7bbf9e','#f0b58f'];
  const P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*13,vy:Math.random()*-13-4,c:cols[~~(Math.random()*cols.length)],s:6+Math.random()*6,r:Math.random()*6}));
  let t=0;(function f(){t++;x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s);x.restore();});if(t<130)requestAnimationFrame(f);else c.remove();})();
}
function checkHabitConfetti(){
  const habits = todos.filter(t => t.is_habit && !t.skipped && t.section !== COMPLETED);
  const allDone = habits.length > 0 && habits.every(h => h.done);
  if (allDone && !habitsWereAllDone) { confetti(); toast('Crushed it! Habits done 🎉'); }
  habitsWereAllDone = allDone;
}

/* ---------- row builders ---------- */
function taskRow(t) {
  const li = el('li', 'node task' + (t.done ? ' done' : '') + (t.skipped ? ' skipped' : ''));
  li.dataset.id = t.id;
  const row = el('div', 'row');
  row.appendChild(el('span', 'caret', '▾'));
  const bullet = el('span', 'bullet'); bullet.appendChild(el('span', 'dot')); row.appendChild(bullet);
  const check = el('span', 'check');
  check.onclick = () => {
    snapshot();
    const done = !t.done;
    if (done && !t.is_habit) {
      // completing a normal task sends it into Completed (remembering where it came from)
      patch(t.id, { done: true, status: 'done', done_at: new Date().toISOString(), actual_minutes: t.actual_minutes ?? t.est_minutes ?? null, origin_section: t.section, origin_subsection: t.subsection, section: COMPLETED, subsection: null });
    } else if (!done && !t.is_habit) {
      // un-completing sends it back to where it was
      patch(t.id, { done: false, status: 'todo', done_at: null, section: t.origin_section || 'Core To-Dos', subsection: t.origin_subsection ?? null });
    } else {
      // habits stay in place (they reset daily), so the confetti check still works
      patch(t.id, { done, status: done ? 'done' : 'todo', done_at: done ? new Date().toISOString() : null, actual_minutes: done ? (t.actual_minutes ?? t.est_minutes ?? null) : t.actual_minutes });
    }
    render(); checkHabitConfetti();
  };
  row.appendChild(check);
  const text = el('span', 'text', t.task); text.setAttribute('contenteditable', 'true');
  text.onblur = () => { const v = text.textContent.trim(); if (v && v !== t.task) patch(t.id, { task: v }); if (!v) removeTask(t.id); };
  text.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); text.blur(); } };
  row.appendChild(text);
  // star
  const star = el('span', 'star' + (t.starred ? ' on' : ''), t.starred ? '★' : '☆');
  star.title = 'Top Priority';
  star.onclick = () => { snapshot(); patch(t.id, { starred: !t.starred }); render(); };
  row.appendChild(star);
  // est/actual on timed sections
  if (TIMED.has(t.section)) {
    const est = el('input', 'estbox'); est.value = t.est_minutes ?? ''; est.title = 'estimate (min)';
    est.onchange = () => { const v = est.value === '' ? null : parseInt(est.value,10); patch(t.id, { est_minutes: v }); renderTotals(); };
    const act = el('input', 'actbox'); act.value = t.actual_minutes ?? (t.est_minutes ?? ''); act.title = 'actual (min), starts from the estimate';
    act.onchange = () => { const v = act.value === '' ? null : parseInt(act.value,10); patch(t.id, { actual_minutes: v }); };
    row.appendChild(est); row.appendChild(act);
  }
  // habits get a skip button; everything else gets delete
  if (t.is_habit) {
    const skip = el('span', 'skip-btn', '✕'); skip.title = 'skip today';
    skip.onclick = () => { snapshot(); patch(t.id, { skipped: true, skipped_at: new Date().toISOString() }); render(); };
    row.appendChild(skip);
  } else {
    const del = el('span', 'skip-btn', '×'); del.title = 'delete'; del.onclick = () => removeTask(t.id);
    row.appendChild(del);
  }
  li.appendChild(row);
  return li;
}

function subHeader(name, count) {
  const li = el('li', 'node has-children');
  const key = 'sub:' + name;
  if (collapsed[key]) li.classList.add('collapsed');
  const row = el('div', 'row');
  const caret = el('span', 'caret', '▾');
  caret.onclick = () => { collapsed[key] = !collapsed[key]; render(); };
  row.appendChild(caret);
  const bullet = el('span', 'bullet'); bullet.appendChild(el('span', 'dot')); row.appendChild(bullet);
  const text = el('span', 'text'); text.innerHTML = '<strong>' + escapeHtml(name) + '</strong>';
  row.appendChild(text);
  if (count) row.appendChild(el('span', 'count', String(count)));
  li.appendChild(row);
  return li;
}

function sectionNode(name, colorOverride) {
  const color = colorOverride || COLOR[name] || '#b7bcc4';
  const li = el('li', 'node domain has-children' + (name === COMPLETED ? ' done-section' : ''));
  li.style.setProperty('--bullet', color);
  li.style.setProperty('--bullet-hover', color);
  li.style.setProperty('--halo', color + '55');
  const key = 'sec:' + name;
  const startCollapsed = (name === COMPLETED && collapsed[key] === undefined) || collapsed[key];
  if (startCollapsed) li.classList.add('collapsed');
  const row = el('div', 'row');
  const caret = el('span', 'caret', '▾');
  caret.onclick = () => { collapsed[key] = !li.classList.contains('collapsed') ? true : false; render(); };
  row.appendChild(caret);
  const bullet = el('span', 'bullet sec-handle'); bullet.appendChild(el('span', 'dot')); row.appendChild(bullet);
  const text = el('span', 'text');
  const NO_BADGE = ['Inbox', 'Core To-Dos', 'Tracking', 'Completed', 'Done'];
  const excluded = !colorOverride && NO_BADGE.some(k => name.includes(k));
  if (excluded) {
    text.textContent = name;
  } else {
    const badge = el('span', 'domain-badge', name); badge.style.background = color; badge.style.color = '#2b2b2b';
    text.appendChild(badge);
  }
  row.appendChild(text);
  if (name === 'Core To-Dos' || name === "Tomorrow's Core To-Dos") {
    const d = prettyDate(effectiveDate(name === 'Core To-Dos' ? 0 : 1));
    row.appendChild(el('span', 'secdate', ' (' + d + ')'));
  }
  li.appendChild(row);
  return li;
}

function addRow(section, subsection) {
  const li = el('li', 'node addli');
  const row = el('div', 'addrow', '+ add');
  row.onclick = () => addTask(section, subsection);
  li.appendChild(row);
  return li;
}

/* ---------- render ---------- */
function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';

  // Top Priority (starred, active) pinned at very top
  const starred = todos.filter(t => t.starred && !t.done && !t.skipped).sort((a,b)=>(a.position||0)-(b.position||0));
  if (starred.length) {
    const li = sectionNode(TOP, '#f0c674'); li.dataset.virtual = '1';
    const list = el('ul', 'list'); list.dataset.virtual = '1';
    starred.forEach(t => list.appendChild(taskRow(t)));
    li.appendChild(list);
    board.appendChild(li);
  }

  const present = [...new Set(todos.map(t => t.section))];
  const inSaved = sectionOrder.filter(s => present.includes(s));
  const rest = present.filter(s => !inSaved.includes(s)).sort((a, b) => orderIndex(ORDER, a) - orderIndex(ORDER, b) || a.localeCompare(b));
  const ordered = [...inSaved, ...rest];

  for (const sec of ordered) {
    const secLi = sectionNode(sec); secLi.dataset.section = sec;
    const secList = el('ul', 'list'); secList.dataset.section = sec; secList.dataset.sub = '';
    // items in this section, minus ones pinned to Top Priority
    const items = todos.filter(t => t.section === sec && !t.skipped && !(t.starred && !t.done));
    const subs = [];
    for (const t of items) { const s = t.subsection || ''; if (!subs.includes(s)) subs.push(s); }
    for (const sub of subs) {
      const subItems = items.filter(t => (t.subsection || '') === sub).sort((a,b)=>(a.position||0)-(b.position||0));
      if (sub) {
        const subLi = subHeader(sub, subItems.length);
        const subList = el('ul', 'list'); subList.dataset.section = sec; subList.dataset.sub = sub;
        subItems.forEach(t => subList.appendChild(taskRow(t)));
        subList.appendChild(addRow(sec, sub));
        subLi.appendChild(subList);
        secList.appendChild(subLi);
      } else {
        subItems.forEach(t => secList.appendChild(taskRow(t)));
      }
    }
    secList.appendChild(addRow(sec, null));
    secLi.appendChild(secList);
    board.appendChild(secLi);

    if (TOTAL_YELLOW.has(sec) || TOTAL_GREY.has(sec)) {
      const sum = todos.filter(t => t.section === sec && !t.done && !t.skipped).reduce((a,t)=>a+(t.est_minutes||0),0);
      const tot = el('div', 'section-total');
      tot.dataset.sec = sec; tot.textContent = 'Total: ' + fmt(sum);
      board.appendChild(tot);
    }
  }
  initSortables();
}
function renderTotals() {
  document.querySelectorAll('.section-total').forEach(tot => {
    const sec = tot.dataset.sec;
    const sum = todos.filter(t => t.section === sec && !t.done && !t.skipped).reduce((a,t)=>a+(t.est_minutes||0),0);
    tot.textContent = 'Total: ' + fmt(sum);
  });
}

/* ---------- drag to reorder ---------- */
function initSortables() {
  document.querySelectorAll('ul.list[data-section]').forEach(ul => {
    if (ul._sortable) return;
    ul._sortable = new Sortable(ul, {
      group: 'todos', animation: 130, handle: '.bullet', draggable: 'li.task, li.has-children',
      ghostClass: 'sortable-ghost', dragClass: 'dragging', filter: '.addli',
      delay: 150, delayOnTouchOnly: true, touchStartThreshold: 6, fallbackTolerance: 6,
      onEnd: onDragEnd
    });
  });
  const board = document.getElementById('board');
  if (!board._sortable) {
    board._sortable = new Sortable(board, {
      group: 'sections', animation: 130, handle: '.sec-handle', draggable: 'li.domain',
      filter: '[data-virtual]', ghostClass: 'sortable-ghost', dragClass: 'dragging',
      delay: 150, delayOnTouchOnly: true, touchStartThreshold: 6, fallbackTolerance: 6,
      onEnd: onSectionEnd
    });
  }
}
async function onSectionEnd() {
  snapshot();
  const board = document.getElementById('board');
  const order = [...board.children]
    .filter(li => li.classList && li.classList.contains('domain') && !li.dataset.virtual)
    .map(li => li.dataset.section).filter(Boolean);
  sectionOrder = order;
  render();
  await sb.from('app_meta').upsert({ key: 'section_order', value: JSON.stringify(order), updated_at: new Date().toISOString() });
}
async function onDragEnd() {
  snapshot();
  const changes = [];
  let pos = 0;
  const assign = (li, section, sub) => {
    const t = todos.find(x => x.id === li.dataset.id); if (!t) return;
    const isHabit = (sub || '').toUpperCase().includes('HABIT BANDIT');
    const next = { position: pos, section, subsection: sub, is_habit: isHabit, category: isHabit ? 'HABIT BANDIT' : (t.category || null), bucket: section === "Tomorrow's Core To-Dos" ? 'tomorrow' : 'today' };
    if (t.position !== next.position || t.section !== next.section || (t.subsection || null) !== next.subsection || t.is_habit !== next.is_habit) { Object.assign(t, next); changes.push(t); }
    pos++;
  };
  // Walk each section top-down in visual order so a sub-list dragged above direct tasks sticks.
  const walk = (ul, section) => {
    [...ul.children].forEach(child => {
      if (child.classList.contains('task')) assign(child, section, ul.dataset.sub || null);
      else if (child.classList.contains('has-children')) {
        const subUl = child.querySelector(':scope > ul.list[data-section]');
        if (subUl) walk(subUl, section);
      }
    });
  };
  document.querySelectorAll('#board > li.domain').forEach(secLi => {
    const secList = secLi.querySelector(':scope > ul.list[data-section]');
    if (secList) walk(secList, secList.dataset.section);
  });
  render();
  const now = new Date().toISOString();
  for (const t of changes) {
    await sb.from('todos').update({ position: t.position, section: t.section, subsection: t.subsection, is_habit: t.is_habit, category: t.category, bucket: t.bucket, updated_at: now }).eq('id', t.id);
  }
}

refreshAuth();
</script>
