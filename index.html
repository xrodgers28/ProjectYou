<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CrushingIt</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f4f5f7; color: #1a1a1a; }
  header { position: sticky; top: 0; z-index: 5; background: #111; color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 19px; margin: 0; letter-spacing: 0.3px; }
  .live { font-size: 11px; background: #1e7e34; color: #fff; padding: 3px 8px; border-radius: 20px; display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #7CFFA0; display: inline-block; animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  .wrap { max-width: 720px; margin: 0 auto; padding: 12px 12px 60px; }
  .addbar { display: flex; gap: 6px; margin: 10px 0 16px; }
  .addbar input { flex: 1; padding: 11px 12px; border: 1px solid #cfd3da; border-radius: 8px; font-size: 15px; font-family: inherit; }
  .addbar select { border: 1px solid #cfd3da; border-radius: 8px; font-size: 13px; padding: 0 6px; background: #fff; font-family: inherit; max-width: 130px; }
  .addbar button { background: #111; color: #fff; border: none; border-radius: 8px; padding: 0 16px; font-size: 20px; cursor: pointer; }
  .section { margin-bottom: 18px; }
  .shead { display: inline-block; font-weight: bold; font-size: 15px; padding: 3px 10px; border-radius: 5px; color: #fff; }
  .stotal { font-size: 12px; color: #555; margin-left: 8px; background: #fff3bf; padding: 2px 7px; border-radius: 10px; }
  .subhead { font-size: 12px; font-weight: bold; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin: 12px 0 4px 2px; }
  .row { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #e6e8ec; border-radius: 8px; padding: 9px 10px; margin: 5px 0; }
  .row.done .task { text-decoration: line-through; color: #9aa0a6; }
  .cbox { width: 20px; height: 20px; flex: 0 0 auto; cursor: pointer; accent-color: #1e7e34; }
  .star { flex: 0 0 auto; cursor: pointer; font-size: 17px; color: #d0d3d8; background: none; border: none; padding: 0; }
  .star.on { color: #f4b400; }
  .task { flex: 1; font-size: 15px; border: none; background: transparent; font-family: inherit; padding: 2px; min-width: 0; }
  .task:focus { outline: none; background: #f0f6ff; border-radius: 4px; }
  .est { width: 52px; flex: 0 0 auto; text-align: center; font-size: 13px; border: 1px solid #e0e2e6; border-radius: 6px; padding: 5px 2px; font-family: inherit; color: #333; }
  .est:focus { outline: none; border-color: #4a90e2; }
  .del { flex: 0 0 auto; background: none; border: none; color: #c9ccd1; font-size: 16px; cursor: pointer; padding: 2px 4px; }
  .completed-toggle { cursor: pointer; font-weight: bold; font-size: 14px; color: #444; margin: 18px 0 6px; user-select: none; }
  .muted { color: #888; font-size: 13px; text-align: center; padding: 20px; }
  .foot { text-align: center; font-size: 11px; color: #9aa0a6; margin-top: 26px; }
  .err { background: #fdecea; color: #b3261e; border: 1px solid #f3caca; border-radius: 8px; padding: 10px; margin: 10px 0; font-size: 13px; display: none; }
</style>
</head>
<body>
<header>
  <h1>CrushingIt</h1>
  <span class="live"><span class="dot"></span>Live, synced</span>
</header>
<div class="wrap">
  <div id="err" class="err"></div>
  <div class="addbar">
    <input id="newtask" placeholder="Add a to-do (or tap the mic on your keyboard)" autocomplete="off">
    <select id="newsection"></select>
    <button id="addbtn" title="Add">+</button>
  </div>
  <div id="board"><p class="muted">Loading your list...</p></div>
  <div class="foot">CrushingIt, live version. Changes save instantly and sync across your devices.</div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://arnjntspmrhigodlssbn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_c570L9svjlGd4bHyJClkFA_gNWv1b6v';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const SECTION_ORDER = [
  'Core To-Dos', 'After Core',
  'Emotional Health', 'Physical Health', 'Environmental Health',
  'Social Well-Being', 'Recreational Health', 'Sense of Purpose', 'Mental Fitness',
  'Tracking', 'Inbox'
];
const SECTION_COLOR = {
  'Core To-Dos': '#111111', 'After Core': '#6b7280',
  'Emotional Health': '#d9488a', 'Physical Health': '#e0533d',
  'Environmental Health': '#2e9e5b', 'Social Well-Being': '#2f7ed8',
  'Recreational Health': '#8a5cd1', 'Sense of Purpose': '#d99b17',
  'Mental Fitness': '#189a9a', 'Tracking': '#6b7280', 'Inbox': '#6b7280'
};
const SUB_ORDER = ['Habit Bandit', 'Home Tasks', 'Errands'];

let todos = [];

function showErr(msg) {
  const e = document.getElementById('err');
  e.textContent = msg; e.style.display = 'block';
}

async function load() {
  const { data, error } = await sb.from('todos').select('*');
  if (error) { showErr('Could not load: ' + error.message); return; }
  todos = data || [];
  render();
}

function orderIndex(list, val) {
  const i = list.indexOf(val);
  return i === -1 ? list.length + 1 : i;
}

function sectionList() {
  const set = [...new Set(todos.map(t => t.section))];
  set.sort((a, b) => orderIndex(SECTION_ORDER, a) - orderIndex(SECTION_ORDER, b) || a.localeCompare(b));
  return set;
}

function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const active = todos.filter(t => !t.done);
  const doneList = todos.filter(t => t.done);

  fillSectionDropdown();

  if (active.length === 0 && doneList.length === 0) {
    board.innerHTML = '<p class="muted">Nothing here yet. Add one above, or tell Claude and it will appear.</p>';
    return;
  }

  sectionList().forEach(sec => {
    const items = active.filter(t => t.section === sec);
    if (items.length === 0) return;
    const secEl = document.createElement('div');
    secEl.className = 'section';

    const head = document.createElement('div');
    const total = items.reduce((s, t) => s + (t.est_minutes || 0), 0);
    const h = document.createElement('span');
    h.className = 'shead';
    h.style.background = SECTION_COLOR[sec] || '#6b7280';
    h.textContent = sec;
    head.appendChild(h);
    if (total > 0) {
      const tt = document.createElement('span');
      tt.className = 'stotal';
      tt.textContent = fmtMin(total);
      head.appendChild(tt);
    }
    secEl.appendChild(head);

    const subs = [...new Set(items.map(t => t.subsection || ''))];
    subs.sort((a, b) => orderIndex(SUB_ORDER, a) - orderIndex(SUB_ORDER, b) || a.localeCompare(b));
    subs.forEach(sub => {
      const subItems = items.filter(t => (t.subsection || '') === sub)
        .sort((a, b) => (a.position || 0) - (b.position || 0));
      if (sub) {
        const sh = document.createElement('div');
        sh.className = 'subhead';
        sh.textContent = sub;
        secEl.appendChild(sh);
      }
      subItems.forEach(t => secEl.appendChild(rowEl(t)));
    });
    board.appendChild(secEl);
  });

  if (doneList.length) {
    const tog = document.createElement('div');
    tog.className = 'completed-toggle';
    let open = false;
    const cont = document.createElement('div');
    cont.style.display = 'none';
    doneList.sort((a, b) => (b.completed_at || '').localeCompare(a.completed_at || ''));
    doneList.forEach(t => cont.appendChild(rowEl(t)));
    tog.textContent = '✓ Completed (' + doneList.length + ')';
    tog.onclick = () => { open = !open; cont.style.display = open ? 'block' : 'none'; tog.textContent = (open ? '▾' : '✓') + ' Completed (' + doneList.length + ')'; };
    board.appendChild(tog);
    board.appendChild(cont);
  }
}

function fmtMin(m) {
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60), r = m % 60;
  return r ? h + 'h ' + r + 'm' : h + 'h';
}

function rowEl(t) {
  const row = document.createElement('div');
  row.className = 'row' + (t.done ? ' done' : '');

  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.className = 'cbox'; cb.checked = !!t.done;
  cb.onchange = () => update(t.id, { done: cb.checked, completed_at: cb.checked ? new Date().toISOString() : null });
  row.appendChild(cb);

  const star = document.createElement('button');
  star.className = 'star' + (t.starred ? ' on' : '');
  star.textContent = t.starred ? '★' : '☆';
  star.onclick = () => update(t.id, { starred: !t.starred });
  row.appendChild(star);

  const task = document.createElement('input');
  task.className = 'task'; task.value = t.task;
  task.onblur = () => { if (task.value.trim() && task.value !== t.task) update(t.id, { task: task.value.trim() }); };
  task.onkeydown = (e) => { if (e.key === 'Enter') task.blur(); };
  row.appendChild(task);

  const est = document.createElement('input');
  est.className = 'est'; est.type = 'number'; est.min = '0'; est.placeholder = 'min';
  est.value = t.est_minutes == null ? '' : t.est_minutes;
  est.onblur = () => { const v = est.value === '' ? null : parseInt(est.value, 10); if (v !== t.est_minutes) update(t.id, { est_minutes: v }); };
  row.appendChild(est);

  const del = document.createElement('button');
  del.className = 'del'; del.textContent = '×'; del.title = 'Delete';
  del.onclick = () => { if (confirm('Delete this task?')) remove(t.id); };
  row.appendChild(del);

  return row;
}

function fillSectionDropdown() {
  const sel = document.getElementById('newsection');
  if (sel.dataset.filled) return;
  SECTION_ORDER.forEach(s => {
    const o = document.createElement('option');
    o.value = s; o.textContent = s;
    sel.appendChild(o);
  });
  sel.value = 'Core To-Dos';
  sel.dataset.filled = '1';
}

async function addTask() {
  const inp = document.getElementById('newtask');
  const sec = document.getElementById('newsection').value;
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  const { error } = await sb.from('todos').insert({ section: sec, task: text, position: Date.now() });
  if (error) { showErr('Could not add: ' + error.message); return; }
  await load();
}

async function update(id, fields) {
  fields.updated_at = new Date().toISOString();
  const { error } = await sb.from('todos').update(fields).eq('id', id);
  if (error) { showErr('Could not save: ' + error.message); return; }
  const t = todos.find(x => x.id === id);
  if (t) Object.assign(t, fields);
  render();
}

async function remove(id) {
  const { error } = await sb.from('todos').delete().eq('id', id);
  if (error) { showErr('Could not delete: ' + error.message); return; }
  todos = todos.filter(x => x.id !== id);
  render();
}

document.getElementById('addbtn').onclick = addTask;
document.getElementById('newtask').addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });

sb.channel('todos-live')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'todos' }, () => load())
  .subscribe();

load();
</script>
</body>
</html>
