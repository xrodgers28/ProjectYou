<style>
  :root{--ink:#1f2a44;--muted:#5b6472;--line:#e3e7ee;--bg:#eef1f6;--card:#fff;--key:#c2c8d1;--accent:#3f6f8f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  a{color:inherit}
  /* shared ProjectYou nav */
  .pynav{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #e3e7ee;display:flex;align-items:center;flex-wrap:nowrap;overflow-x:auto;padding:6px 12px;gap:1px}
  .pynav::-webkit-scrollbar{height:0}
  .pn-logo{display:flex;align-items:center;margin-right:5px;flex:none}
  .pn-logo img{height:28px;width:auto;display:block}
  .pn-group{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;padding:2px 7px;margin:2px 0;border-left:1px solid #edf0f4;flex:none}
  .pn-group.first{border-left:none}
  .pn-label{font-size:8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#aab2bd;white-space:nowrap;padding-left:3px}
  a.pn-label{text-decoration:none;cursor:pointer}a.pn-label:hover{color:var(--accent)}a.pn-label.on{color:var(--accent)}
  .pn-links{display:flex;gap:1px;align-items:stretch}
  .pn-link{font-size:11.5px;font-weight:700;color:#5b6472;text-decoration:none;padding:3px 6px;border-radius:7px;white-space:normal;text-align:center;line-height:1.08;display:inline-flex;align-items:center;flex:none}
  .pn-link:hover{background:#eef2f8;color:#3f6f8f}.pn-link.on{background:#3f6f8f;color:#fff}.pn-link.pn-solo{min-height:31px}
  .pn-ver{margin-left:auto;font-size:10.5px;font-weight:700;color:#9aa6b4;font-variant-numeric:tabular-nums;padding:0 6px;flex:none}
  .pn-user{display:flex;align-items:center;gap:8px;background:#f4f6f9;border:1px solid #e3e7ee;border-radius:999px;padding:3px 11px 3px 3px;margin-left:6px;flex:none}
  .pn-ava{width:30px;height:30px;border-radius:50%;overflow:hidden;border:2px solid #4cc07a;flex:none;background:#dfe7f0}
  .pn-ava img{width:100%;height:100%;object-fit:cover;display:block}
  .pn-uinfo{display:flex;flex-direction:column;line-height:1.05}
  .pn-uname{font-size:12px;font-weight:800;color:#1f2a44}
  .pn-usub{font-size:8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#2f8f5b}
  .pn-dot{width:9px;height:9px;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 2px #d7f0e0}
  .pn-drop{position:relative;display:inline-flex;align-items:stretch}.pn-dropbtn{cursor:pointer;user-select:none}
  .pn-menu{position:fixed;background:#fff;border:1px solid #e3e7ee;border-radius:9px;box-shadow:0 10px 28px rgba(31,42,68,.16);padding:5px;display:none;flex-direction:column;min-width:200px;z-index:60}
  .pn-menu.open{display:flex}.pn-menu .pn-link{white-space:nowrap;text-align:left;justify-content:flex-start;padding:6px 9px}
  .wrap{max-width:min(1480px,94vw);margin:0 auto;padding:26px 20px 90px}
  .pagehead{display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap}
  .pagehead h1{font-size:31px;margin:0;letter-spacing:.2px}
  .pagehead h1 .em{color:var(--accent)}
  .pagehead h1 .ver{display:inline-block;vertical-align:middle;margin-left:10px;font-size:11px;font-weight:800;letter-spacing:.04em;color:#8a93a0;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums;position:relative;top:-3px}
  .sortable-ghost{opacity:.35}
  .pj-off{display:none!important}
  .pjwrap{margin:26px 0 0}
  .pjgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,340px));gap:16px;justify-content:center}
  .pj{background:#fff;border:1px solid var(--key);border-top:3px solid var(--pa);border-radius:16px;overflow:hidden;box-shadow:0 8px 22px rgba(31,42,68,.07);display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .16s,box-shadow .16s}
  a.pj:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(31,42,68,.13)}
  a.pj:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .pjhero{height:104px;background:var(--pa);overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none}
  .pjhero img{width:100%;height:100%;object-fit:cover;display:block}
  .pjhero.none{background:repeating-linear-gradient(135deg,#f4f6f9,#f4f6f9 9px,#eef1f6 9px,#eef1f6 18px)}
  .pjhero.none span{font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#7c8695;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  .pjbody{padding:13px 15px 15px;display:flex;flex-direction:column;gap:8px;flex:1}
  .pjname{font-size:17px;font-weight:800;color:var(--ink)}
  .pjchip{align-self:flex-start;font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:3px 9px}
  .pjchip.good{color:#2f7d52}.pjchip.warn{color:#a8710f}.pjchip.note{color:#3f6f8f}
  .pjstat{font-size:13.5px;color:#4d5769;line-height:1.45}
  .pjstat b{color:var(--ink)}
  .pjfigs{display:flex;gap:15px;border-top:1px solid var(--line);padding-top:9px;margin-top:auto}
  .pjfig{display:flex;flex-direction:column;gap:1px}
  .pjfig .n{font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15}
  .pjfig .l{font-size:8.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:#7c8695}
  .pjlast{font-size:12px;color:#4d5769;border-top:1px solid var(--line);padding-top:9px;line-height:1.4}
  .pjlast .k{display:block;font-size:8.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:#7c8695;margin-bottom:2px}
  .pjfoot{margin:16px auto 0;text-align:center;font-size:12px;color:#4d5769;max-width:640px;line-height:1.5}
  .pjnote{background:#fff;border:1px solid var(--key);border-left:4px solid #b04a4a;border-radius:12px;padding:14px 16px;font-size:14px;color:#37404f;line-height:1.5}
  @media(max-width:640px){.pjgrid{grid-template-columns:1fr}}
  /* ===== PROJECTS BOARD, ROW 2 - Scott's own tiles (v1.1, Sep 27 2026) =====
     6 fixed slots he names and captions himself. Same card grammar as the
     .pj cards above (border-top accent, radius, shadow) but nothing here is
     generated: no hero pulled automatically, no figures, no status line. */
  .pjt2{margin:18px 0 0;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#7c8695;display:inline-block;border:1px solid transparent;border-radius:6px;padding:2px 4px;cursor:text}
  .pjt2:hover,.pjt2:focus{border-color:var(--line);background:#f7f8fa;outline:none}
  .pjt2:empty:before{content:attr(data-ph);color:#9aa4b2}
  .pjtgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
  @media(max-width:640px){.pjtgrid{grid-template-columns:repeat(3,1fr)}}
  .pjt{background:#fff;border:1px solid var(--key);border-top:2px solid #3f6f8f;border-radius:10px;overflow:hidden;box-shadow:0 4px 12px rgba(31,42,68,.07);display:flex;flex-direction:column}
  .pjthero{height:52px;background:repeating-linear-gradient(135deg,#f4f6f9,#f4f6f9 9px,#eef1f6 9px,#eef1f6 18px);flex:none;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pjthero img{width:100%;height:100%;object-fit:cover;display:block}
  .pjthero .pjtempty{font-size:7.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#7c8695;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 6px}
  .pjtbody{padding:7px 8px 7px;display:flex;flex-direction:column;gap:3px;flex:1}
  .pjtname{font-size:12.5px;font-weight:800;color:var(--ink);border:1px solid transparent;border-radius:6px;padding:2px 4px;margin:-2px -4px;line-height:1.25}
  .pjtname:empty:before{content:attr(data-ph);color:#9aa4b2;font-weight:600}
  .pjtname:hover,.pjtname:focus{border-color:var(--line);background:#f7f8fa;outline:none}
  .pjtcap{font-size:10.5px;color:#4d5769;line-height:1.35;border:1px solid transparent;border-radius:6px;padding:2px 4px;margin:-2px -4px;min-height:14px}
  .pjtcap:empty:before{content:attr(data-ph);color:#9aa4b2}
  .pjtcap:hover,.pjtcap:focus{border-color:var(--line);background:#f7f8fa;outline:none}
  .pjtname a,.pjtcap a{color:#3f6f8f;text-decoration:underline}
  .pjtlink{font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;margin-top:2px;display:none;background:#f7f8fa}
  .pjtlink.open{display:flex;flex-direction:column;gap:2px}
  .pjtlink input{width:100%;border:none;background:transparent;font-size:10.5px;font-family:inherit;outline:none}
  .pjtnote{font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;margin-top:2px;width:100%;font-family:inherit;resize:vertical;min-height:32px;display:none;color:#9aa4b2;background:#f7f8fa}
  .pjtnote.open{display:block}
  .pjticons{display:flex;gap:3px;margin-top:auto;padding-top:5px;border-top:1px solid var(--line)}
  .pjtico{flex:none;width:20px;height:20px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;opacity:.4;padding:0}
  .pjtico.on{opacity:1;border-color:#3f6f8f}
  .pjtico input[type=file]{display:none}

  /* ===== PROJECTS BOARD, 3 lists (v1.1, Sep 27 2026) =====
     Same grammar as "Your week, in your words" on the weekly review page:
     type a line, tap x to remove it. New here: the title and subtitle are
     his to set, the 3 columns drag left/right by their own header bar, and
     any line can also carry a note and a link, tucked behind one icon so
     the row stays a single line until he asks for more. */
  .pjlwrap{margin-top:14px}
  .pjlgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pjlcol{background:#fff;border:1px solid var(--key);border-radius:14px;padding:9px 12px 10px;box-shadow:0 6px 16px rgba(31,42,68,.07);display:flex;flex-direction:column}
  .pjlhead{cursor:grab;padding-bottom:4px;margin-bottom:5px;border-bottom:1px solid var(--line)}
  .pjlhead:active{cursor:grabbing}
  .pjltitle{font-size:16px;font-weight:800;color:var(--ink);border-radius:6px;padding:2px 4px;margin:-2px -4px}
  .pjltitle:empty:before{content:attr(data-ph);color:#9aa4b2;font-weight:600}
  .pjltitle:hover,.pjltitle:focus{background:#f7f8fa;outline:none}
  .pjlsub{font-size:11.5px;color:#7c8695;border-radius:6px;padding:2px 4px;margin:1px -4px 0}
  .pjlsub:empty:before{content:attr(data-ph);color:#b7bfca}
  .pjlsub:hover,.pjlsub:focus{background:#f7f8fa;outline:none}
  .pjlitems{display:flex;flex-direction:column;gap:2px;min-height:4px}
  .pjlrow{position:relative;padding-left:12px;border-radius:8px}
  .pjlrow>.rgrip{width:12px;left:-3px}
  .pjlmain{display:flex;align-items:center;gap:5px}
  .pjlmain .pjlt{flex:1;border:none;border-radius:8px;padding:3px 8px;font-size:12.5px;font-weight:400;color:var(--ink);font-family:inherit;min-width:0;line-height:1.25;outline:none;cursor:text}
  .pjlmain .pjlt:empty:before{content:attr(data-ph);color:#9aa4b2;font-weight:400}
  .pjlmain .pjlt a{color:#3f6f8f;text-decoration:underline;font-weight:400}
  .pjlmain .pjlt:hover,.pjlmain .pjlt:focus{background:#f7f8fa}
  .pjlico{flex:none;width:22px;height:22px;border:0;background:transparent;color:#b7bfca;font-size:12px;cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:0}
  .pjlico.on{color:#3f6f8f}
  .pjlmore{flex:none;width:22px;height:22px;border:0;background:transparent;color:#b7bfca;font-size:13px;cursor:pointer;border-radius:6px}
  .pjlmore.on{color:#3f6f8f}
  .pjldel{flex:none;width:22px;height:22px;border:0;background:transparent;color:#b7bfca;font-size:16px;line-height:1;cursor:pointer;border-radius:6px}
  .pjlextra{display:none;gap:6px;margin:2px 0 0 0}
  .pjlextra.open{display:flex;flex-wrap:wrap}
  .pjlextra input{flex:1;min-width:100px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12px;font-family:inherit}
  .pjlextra input.pjlnote{color:#9aa4b2;border:none;background:transparent;padding:5px 2px}
  .pjllinkbox{font-size:10.5px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;margin:5px 0 0 0;display:none;background:#f7f8fa}
  .pjllinkbox.open{display:block}
  .pjllinkbox input{width:100%;border:none;background:transparent;font-size:10.5px;font-family:inherit;outline:none}
  .pjladd{margin-top:4px;border:1px dashed var(--line);background:transparent;color:#b7bcc4;font-style:italic;font-weight:400;border-radius:8px;padding:3px 10px;font-size:12.5px;cursor:pointer;text-align:left;font-family:inherit}
  .pjladd:hover{color:#8a8f98}
  @media(max-width:760px){.pjlgrid{grid-template-columns:1fr}}
  /* ===== PROJECT CARD LISTS (v6.68, Oct 6 2026) =====
     A small list under each of the 3 project cards. Same rows, icons and
     saving as Your Lists, only tighter. Sits OUTSIDE the card link so typing
     never opens the project page. Saved in app_meta, one key per project. */
  .pjcol{display:flex;flex-direction:column;gap:6px;min-width:0}
  .pjlcol.pjplist{border-radius:12px;padding:6px 8px 7px;box-shadow:none;border-color:var(--line)}
  .pjplist .pjplhead{font-size:9.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#7c8695;margin:0 0 3px 2px}
  .pjplinks{display:flex;flex-direction:column;gap:6px;margin:0 0 8px}
  .pjplinks a{display:block;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:14px;font-weight:700;color:#3f6f8f;text-decoration:none}
  .pjplinks a:active{background:#eef3f7}
  .pjplist .pjlitems{gap:1px}
  .pjplist .pjlmain{gap:2px}
  .pjplist .pjlmain .pjlt{padding:2px 7px;font-size:12px;line-height:1.2;border:none;font-weight:400;border-radius:6px}
  .pjplist .pjlmain .pjlt a{font-weight:400}
  .pjplist .pjlmain .pjlt:empty:before{font-weight:400}
  .pjplist .pjlmain .pjlt:hover,.pjplist .pjlmain .pjlt:focus{border:none;background:#f7f8fa}
  .pjplist .pjlico,.pjplist .pjlmore,.pjplist .pjldel{width:20px;height:20px;font-size:11px}
  .pjplist .pjladd{margin-top:3px;padding:2px 8px;font-size:12px}
  .pjplist.pjwait{visibility:hidden}
</style>

<script>
/* ===== THE PROJECTS BOARD =====
   Paints three project cards read from projects-data.json. Nothing about a project is written into
   this page, so refreshing the board means republishing that one small file.

   Two deliberate choices:
   - the cue card parts are hidden with their OWN class (pj-off), never with
     the page's .hidden class, so this can never fight the sign-in gate or the
     Asleep shelf over who owns that class.
   - if the file cannot be read the board SAYS SO in plain words rather than
     drawing something out of date, and the "checked" line always comes from
     the file, never from new Date(). */
(function(){
  
  var box = document.getElementById('projects');
  if(!box) return;
  var loaded = false;
  var tilesBox = document.getElementById('pjtiles');
  var listsBox = document.getElementById('pjlists');
  var tilesLoaded = false, listsLoaded = false;
  var TILES = [], LISTS = [];
  var tSaveT = {}, lSaveT = {};
  var HEAD = {tiles:'Your Own Projects', lists:'Your Lists'};
  var hSaveT = {};
  function hSave(key, value){
    clearTimeout(hSaveT[key]);
    hSaveT[key] = setTimeout(async function(){
      if(!sb) return;
      await sb.from('app_meta').upsert({key:'pj_heading_' + key, value:value, updated_at:new Date().toISOString()});
    }, 700);
  }

  function esc(t){ return String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* status and the closing line are written by the refresh job and may carry a
     single <b>. Allow that one tag and nothing else. */
  function rich(t){ return esc(t).replace(/&lt;(\/?)b&gt;/g, '<$1b>'); }

  function card(p){
    var acc = /^#[0-9a-fA-F]{3,8}$/.test(p.accent || '') ? p.accent : '#3f6f8f';
    var hero = p.hero
      ? '<div class="pjhero"><img src="' + esc(p.hero) + '" alt="' + esc(p.name) + '"></div>'
      : '<div class="pjhero none"><span>No picture yet</span></div>';
    var tone = ({good:'good', warn:'warn', note:'note'})[p.tone] || 'note';
    var figs = (p.figures || []).slice(0,3).map(function(f){
      return '<div class="pjfig"><span class="n">' + esc(f.n) + '</span>' +
             '<span class="l">' + esc(f.l) + '</span></div>'; }).join('');
    var body =
      hero +
      '<div class="pjbody">' +
        '<div class="pjname">' + esc(p.name) + '</div>' +
        '<span class="pjchip ' + tone + '">' + esc(p.state) + '</span>' +
      '</div>';
    var safe = typeof p.url === 'string' && /^[a-zA-Z0-9._\-\/]+\.html(#.*)?$/.test(p.url);
    return safe
      ? '<a class="pj" style="--pa:' + acc + '" href="' + esc(p.url) + '">' + body + '</a>'
      : '<div class="pj" style="--pa:' + acc + '">' + body + '</div>';
  }

  var PLOADED = false;
  function pslug(p){ return String(p.slug || p.name || '').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
  var PROJ_LINKS = {
    'project-you': [
      {t:'Antigua Vacation Plans', u:'https://claude.ai/artifact/VvLHvzV5q7brFDDhVdEtTc'}
    ],
    'treadwell': [
      {t:'TreadWell Boston: Back Room', u:'https://claude.ai/artifact/Kap86f9YwRM3MGbmt2rMZZ'},
      {t:'TreadWell Antigua: Activities', u:'https://claude.ai/artifact/L9MU3CbtSgBkFRPmCRgqrS'},
      {t:"TreadWell Martha's Vineyard: Back Room", u:'https://claude.ai/artifact/A23yRyxMFDofStBkVMRr1N'}
    ]
  };
  function projLinks(p){
    var L = PROJ_LINKS[pslug(p)];
    if(!L) return '';
    return '<div class="pjplinks">' + L.map(function(l){
      return '<a href="' + esc(l.u) + '" target="_blank" rel="noopener">' + esc(l.t) + '</a>'; }).join('') + '</div>';
  }
  function projList(p){
    var id = 'p:' + pslug(p);
    return projLinks(p) + '<div class="pjlcol pjplist pjwait" data-listid="' + esc(id) + '">' +
      '<div class="pjplhead">' + esc(p.name) + ' list</div>' +
      '<div class="pjlitems" data-listid="' + esc(id) + '"></div>' +
      '<button type="button" class="pjladd" data-listid="' + esc(id) + '">+ Add an item</button>' +
    '</div>';
  }
  function loadProjLists(){
    PLOADED = false;
    if(!sb) return;
    sb.from('app_meta').select('key,value').like('key','pj_plist_%').then(function(r){
      if(r.error){ if(typeof toast === 'function') toast('Could not read the project lists: ' + r.error.message); return; }
      var saved = {};
      (r.data || []).forEach(function(row){ try{ saved[row.key.slice(9)] = JSON.parse(row.value) || []; }catch(e){} });
      box.querySelectorAll('.pjplist').forEach(function(col){
        var slug = col.getAttribute('data-listid').slice(2);
        col.querySelector('.pjlitems').innerHTML = (saved[slug] || []).map(itemRow).join('');
        col.classList.remove('pjwait');
      });
      PLOADED = true;
      initListSortables();
    });
  }

  function paint(d){
    var list = (d && d.projects || []).filter(function(p){ return p && p.name; });
    if(!list.length){ box.innerHTML = '<div class="pjnote">The projects file is there but has no projects in it. Nothing is being shown rather than something made up.</div>'; return; }
    box.innerHTML =
      '<div class="pjgrid">' + list.map(function(p){ return '<div class="pjcol" id="pj-' + pslug(p) + '">' + card(p) + projList(p) + '</div>'; }).join('') + '</div>' +
      '<p class="pjfoot">Nothing on this board is typed by you. It was last checked ' +
      esc(d.checked_label || 'at an unknown time') +
      ', reading your project folders, the live site, the to do list and the session records. The lists under each card are yours.</p>';
    loadProjLists();
    /* Nov 25 2026: the Projects drop-down in the top bar links to #pj-<project>; scroll to that card once it is drawn. */
    var hm = /^#pj-([a-z0-9-]+)$/.exec(location.hash || '');
    if(hm){ var tgt = document.getElementById('pj-' + hm[1]); if(tgt){ setTimeout(function(){ tgt.scrollIntoView({behavior:'smooth', block:'start'}); }, 60); } }
  }

  function load(){
    if(loaded) return;
    loaded = true;
    box.innerHTML = '<p class="pjfoot">Reading your projects...</p>';
    fetch('projects-data.json', {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(paint)
      .catch(function(){
        loaded = false;
        box.innerHTML = '<div class="pjnote"><b>Could not read the projects file.</b> ' +
          'Rather than show you something out of date, the board is showing nothing. ' +
          'Switch back to Cue Cards, or reload the page to try again.</div>';
      });
  }

  /* ---- inline text-linking, shared by the 6 tiles (name/caption) and
     the 3 lists (item text). Highlight some text, tap the link icon,
     paste a URL into the little box, press Enter. Only text nodes and
     validated http(s)/mailto <a> tags ever survive into saved HTML or
     back out onto the page: everything else a contenteditable field can
     introduce (stray <div>, <span>, <b>, <br>) is unwrapped down to its
     text. ---- */
  function sanitizeInline(raw){
    var div = document.createElement('div');
    div.innerHTML = raw || '';
    function walk(node){
      var out = '';
      for(var i = 0; i < node.childNodes.length; i++){
        var child = node.childNodes[i];
        if(child.nodeType === 3){ out += esc(child.nodeValue); continue; }
        if(child.nodeType !== 1) continue;
        var tag = child.tagName.toLowerCase();
        if(tag === 'a'){
          var href = child.getAttribute('href') || '';
          if(/^(https?:|mailto:)/i.test(href)){
            out += '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + walk(child) + '</a>';
            continue;
          }
        }
        out += walk(child);
      }
      return out;
    }
    return walk(div);
  }

  function normalizeUrl(u){
    u = (u || '').trim();
    if(!u) return '';
    if(/^(https?:|mailto:)/i.test(u)) return u;
    if(/^[\w.+-]+@[\w.-]+\.[a-z]{2,}$/i.test(u)) return 'mailto:' + u;
    return 'https://' + u;
  }

  var LINK_PENDING = null;

  function closeLinkBoxes(){
    document.querySelectorAll('.pjtlink.open, .pjllinkbox.open').forEach(function(b){ b.classList.remove('open'); });
  }

  function captureLinkSelection(fieldSelector, kind){
    var sel = window.getSelection();
    if(!sel || !sel.rangeCount || sel.isCollapsed) return null;
    var range = sel.getRangeAt(0);
    var anchor = range.commonAncestorContainer;
    var el = anchor.nodeType === 1 ? anchor : anchor.parentElement;
    var field = el ? el.closest(fieldSelector) : null;
    if(!field) return null;
    return {range: range.cloneRange(), field: field, kind: kind};
  }

  function openLinkBox(box2){
    closeLinkBoxes();
    box2.classList.add('open');
    var input = box2.querySelector('input');
    input.value = '';
    setTimeout(function(){ input.focus(); }, 0);
  }

  function applyPendingLink(url){
    if(!LINK_PENDING) return;
    var p = LINK_PENDING;
    LINK_PENDING = null;
    var clean = normalizeUrl(url);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(p.range);
    if(clean) document.execCommand('createLink', false, clean);
    else document.execCommand('unlink');
    p.field.innerHTML = sanitizeInline(p.field.innerHTML);
    if(p.kind === 'tile'){
      var card = p.field.closest('.pjt');
      var slot = +card.getAttribute('data-slot');
      tSave(slot, p.field.getAttribute('data-f'), p.field.innerHTML);
      card.querySelector('[data-act="link"]').classList.toggle('on',
        /<a /.test(card.querySelector('.pjtname').innerHTML) || /<a /.test(card.querySelector('.pjtcap').innerHTML));
    } else if(p.kind === 'listitem'){
      var row = p.field.closest('.pjlrow');
      var col = p.field.closest('.pjlcol');
      row.querySelector('.pjlico[data-act="link"]').classList.toggle('on', /<a /.test(p.field.innerHTML));
      saveListItems(col.getAttribute('data-listid'));
    }
    closeLinkBoxes();
  }

  /* ---- row 2: Scott's own 6 tiles. board_tiles, one row per slot,
     always present so every write here is an UPDATE, never a race on
     upsert. Tapping the name or caption edits it in place; the three small
     icons add a picture, a link (to a chat session or anything else), and
     a private note, each tucked away until tapped. ---- */
  function tSave(slot, field, value){
    var key = slot + ':' + field;
    clearTimeout(tSaveT[key]);
    tSaveT[key] = setTimeout(async function(){
      if(!sb) return;
      var patch = {updated_at: new Date().toISOString()};
      patch[field] = value;
      await sb.from('board_tiles').update(patch).eq('slot', slot);
    }, 700);
  }

  function tileCard(row){
    var slot = row.slot;
    var hero = row.image_url
      ? '<div class="pjthero"><img src="' + esc(row.image_url) + '" alt=""></div>'
      : '<div class="pjthero"><span class="pjtempty">No picture yet</span></div>';
    var nameHtml = sanitizeInline(row.name || '');
    var capHtml = sanitizeInline(row.caption || '');
    var hasLink = /<a /.test(nameHtml) || /<a /.test(capHtml);
    return '<div class="pjt" data-slot="' + slot + '">' + hero +
      '<div class="pjtbody">' +
        '<div class="pjtname" contenteditable="true" data-f="name" data-ph="Tap to name this project">' + nameHtml + '</div>' +
        '<div class="pjtcap" contenteditable="true" data-f="caption" data-ph="Add a short caption">' + capHtml + '</div>' +
        '<div class="pjtlink"><input type="text" placeholder="Paste a link, then press Enter"></div>' +
        '<textarea class="pjtnote" data-f="note" placeholder="A private note, only you see this">' + esc(row.note || '') + '</textarea>' +
        '<div class="pjticons">' +
          '<label class="pjtico" title="Add a picture"><input type="file" accept="image/*" data-slot="' + slot + '">&#128247;</label>' +
          '<button type="button" class="pjtico' + (hasLink ? ' on' : '') + '" data-act="link" title="Select some text, then tap here to link it">&#128279;</button>' +
          '<button type="button" class="pjtico' + (row.note ? ' on' : '') + '" data-act="note" title="Add a note">&#128221;</button>' +
        '</div>' +
      '</div></div>';
  }

  function paintTiles(){
    tilesBox.innerHTML = '<div class="pjt2" contenteditable="true" data-hk="tiles" data-ph="Your Own Projects">' + esc(HEAD.tiles) + '</div>' +
      '<div class="pjtgrid">' + TILES.map(tileCard).join('') + '</div>';
  }

  function loadTiles(){
    if(tilesLoaded || !tilesBox) return;
    tilesLoaded = true;
    if(!sb){ return; }
    Promise.all([
      sb.from('board_tiles').select('*').order('slot'),
      sb.from('app_meta').select('value').eq('key','pj_heading_tiles').maybeSingle()
    ]).then(function(res){
      var r = res[0], h = res[1];
      if(r.error){ tilesLoaded = false; tilesBox.innerHTML = '<div class="pjnote">Could not read your tiles: ' + esc(r.error.message) + '</div>'; return; }
      TILES = r.data || [];
      if(h && !h.error && h.data && h.data.value) HEAD.tiles = h.data.value;
      paintTiles();
    });
  }

  async function onTileFile(e){
    var slot = +e.target.getAttribute('data-slot');
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if(!file || !sb) return;
    var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
    var path = 't' + slot + '.' + ext;
    var up = await sb.storage.from('board_tiles').upload(path, file, {upsert:true, contentType:file.type || 'image/jpeg'});
    if(up.error){ if(typeof toast === 'function') toast('Could not save that picture: ' + up.error.message); return; }
    var pub = sb.storage.from('board_tiles').getPublicUrl(path);
    var url = pub.data.publicUrl + '?v=' + Date.now();
    await sb.from('board_tiles').update({image_url:url, updated_at:new Date().toISOString()}).eq('slot', slot);
    var row = TILES.filter(function(t){ return t.slot === slot; })[0];
    if(row) row.image_url = url;
    paintTiles();
    if(typeof toast === 'function') toast('Picture saved.');
  }

  if(tilesBox){
    tilesBox.addEventListener('input', function(e){
      var t = e.target;
      if(t.matches('[data-hk]')){ HEAD[t.getAttribute('data-hk')] = t.textContent.trim(); hSave(t.getAttribute('data-hk'), t.textContent.trim()); return; }
      var card = t.closest ? t.closest('.pjt') : null;
      if(!card) return;
      var slot = +card.getAttribute('data-slot');
      if(t.matches('[contenteditable][data-f]')){
        var html2 = sanitizeInline(t.innerHTML);
        tSave(slot, t.getAttribute('data-f'), html2);
        card.querySelector('[data-act="link"]').classList.toggle('on',
          /<a /.test(card.querySelector('.pjtname').innerHTML) || /<a /.test(card.querySelector('.pjtcap').innerHTML));
      }
      else if(t.matches('.pjtnote')){ tSave(slot, 'note', t.value); card.querySelector('[data-act="note"]').classList.toggle('on', !!t.value.trim()); }
    });
    tilesBox.addEventListener('click', function(e){
      var b = e.target.closest('.pjtico[data-act="note"]');
      if(!b) return;
      var card = b.closest('.pjt');
      var box2 = card.querySelector('.pjtnote');
      if(box2) box2.classList.toggle('open');
    });
    tilesBox.addEventListener('mousedown', function(e){
      var b = e.target.closest('.pjtico[data-act="link"]');
      if(!b) return;
      e.preventDefault();
      var card = b.closest('.pjt');
      var cap = captureLinkSelection('.pjtname, .pjtcap', 'tile');
      if(!cap){ if(typeof toast === 'function') toast('Select some text first, then tap the link icon.'); return; }
      LINK_PENDING = cap;
      openLinkBox(card.querySelector('.pjtlink'));
    });
    tilesBox.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && e.target.matches('.pjtlink input')){ e.preventDefault(); applyPendingLink(e.target.value); }
    });
    tilesBox.addEventListener('focusout', function(e){
      if(e.target.matches('.pjtlink input') && LINK_PENDING) applyPendingLink(e.target.value);
    });
    tilesBox.addEventListener('change', function(e){
      if(e.target.matches('input[type=file]')) onTileFile(e);
    });
  }

  /* ---- the 3 lists below the tiles. board_lists: one row per column,
     position sets left-to-right order (dragged by the column's own header),
     items is an ordered JSONB array of {t, note, link}, the same shape
     weekly_review.highlights already uses, just per list instead of per
     week. ---- */
  function lSave(id, field, value){
    var key = id + ':' + field;
    clearTimeout(lSaveT[key]);
    lSaveT[key] = setTimeout(async function(){
      if(!sb) return;
      var patch = {updated_at: new Date().toISOString()};
      patch[field] = value;
      await sb.from('board_lists').update(patch).eq('id', id);
    }, 700);
  }

  function itemRow(li){
    var tHtml = sanitizeInline(li.t || '');
    var hasLink = /<a /.test(tHtml);
    var hasNote = !!(li.note || '').trim();
    return '<div class="pjlrow">' +
      '<span class="rgrip" title="Drag to reorder"></span>' +
      '<div class="pjlmain">' +
        '<div class="pjlt" contenteditable="true" data-ph="Type an item">' + tHtml + '</div>' +
        '<button type="button" class="pjlico' + (hasLink ? ' on' : '') + '" data-act="link" title="Select some text, then tap here to link it">&#128279;</button>' +
        '<button type="button" class="pjlmore' + (hasNote ? ' on' : '') + '" title="Note">&#128221;</button>' +
        '<button type="button" class="pjldel" title="Remove this line">&times;</button>' +
      '</div>' +
      '<div class="pjlextra">' +
        '<input type="text" class="pjlnote" value="' + esc(li.note || '').replace(/"/g,'&quot;') + '" placeholder="Note">' +
      '</div>' +
      '<div class="pjllinkbox"><input type="text" placeholder="Paste a link, then press Enter"></div>' +
    '</div>';
  }

  function listCol(list){
    var items = list.items || [];
    return '<div class="pjlcol" data-listid="' + list.id + '">' +
      '<div class="pjlhead">' +
        '<div class="pjltitle" contenteditable="true" data-f="title" data-ph="Untitled list, tap to name">' + esc(list.title) + '</div>' +
        '<div class="pjlsub" contenteditable="true" data-f="subtitle" data-ph="Add a subtitle">' + esc(list.subtitle) + '</div>' +
      '</div>' +
      '<div class="pjlitems" data-listid="' + list.id + '">' + items.map(itemRow).join('') + '</div>' +
      '<button type="button" class="pjladd" data-listid="' + list.id + '">+ Add an item</button>' +
    '</div>';
  }

  function paintLists(){
    listsBox.innerHTML = '<div class="pjlwrap"><div class="pjt2" contenteditable="true" data-hk="lists" data-ph="Your Lists">' + esc(HEAD.lists) + '</div>' +
      '<div class="pjlgrid" id="pjlgrid">' +
        LISTS.slice().sort(function(a,b){ return a.position - b.position; }).map(listCol).join('') +
      '</div></div>';
    initListSortables();
  }

  function loadLists(){
    if(listsLoaded || !listsBox) return;
    listsLoaded = true;
    if(!sb){ return; }
    Promise.all([
      sb.from('board_lists').select('*').order('position'),
      sb.from('app_meta').select('value').eq('key','pj_heading_lists').maybeSingle()
    ]).then(function(res){
      var r = res[0], h = res[1];
      if(r.error){ listsLoaded = false; listsBox.innerHTML = '<div class="pjnote">Could not read your lists: ' + esc(r.error.message) + '</div>'; return; }
      LISTS = r.data || [];
      if(h && !h.error && h.data && h.data.value) HEAD.lists = h.data.value;
      paintLists();
    });
  }

  function readItemsFromDOM(colEl){
    return Array.prototype.slice.call(colEl.querySelectorAll('.pjlrow')).map(function(row){
      return {
        t: sanitizeInline(row.querySelector('.pjlt').innerHTML),
        note: row.querySelector('.pjlnote').value,
        link: ''
      };
    }).filter(function(li){ return li.t.replace(/<[^>]*>/g,'').trim() || li.note; });
  }

  function saveListItems(listId){
    listId = String(listId);
    var key = 'items:' + listId;
    clearTimeout(lSaveT[key]);
    lSaveT[key] = setTimeout(async function(){
      if(!sb) return;
      var colEl = document.querySelector('.pjlitems[data-listid="' + listId + '"]');
      if(!colEl) return;
      var items = readItemsFromDOM(colEl);
      if(listId.indexOf('p:') === 0){
        if(!PLOADED) return;
        await sb.from('app_meta').upsert({key:'pj_plist_' + listId.slice(2), value:JSON.stringify(items), updated_at:new Date().toISOString()});
        return;
      }
      var row = LISTS.filter(function(l){ return l.id === +listId; })[0];
      if(row) row.items = items;
      await sb.from('board_lists').update({items: items, updated_at: new Date().toISOString()}).eq('id', listId);
    }, 700);
  }

  function initListSortables(){
    if(typeof Sortable === 'undefined') return;
    var grid = document.getElementById('pjlgrid');
    if(grid && !grid._sortable){
      grid._sortable = new Sortable(grid, {
        animation:130, handle:'.pjlhead', draggable:'.pjlcol',
        ghostClass:'sortable-ghost', dragClass:'dragging',
        delay:150, delayOnTouchOnly:true, touchStartThreshold:6, fallbackTolerance:6,
        onEnd: onColReorder
      });
    }
    document.querySelectorAll('.pjlitems').forEach(function(el){
      if(el._sortable) return;
      el._sortable = new Sortable(el, {
        animation:130, handle:'.rgrip', draggable:'.pjlrow',
        ghostClass:'sortable-ghost', dragClass:'dragging',
        delay:150, delayOnTouchOnly:true, touchStartThreshold:6, fallbackTolerance:6,
        onEnd: function(){ saveListItems(el.getAttribute('data-listid')); }
      });
    });
  }

  async function onColReorder(){
    var cols = Array.prototype.slice.call(document.getElementById('pjlgrid').children);
    for(var i = 0; i < cols.length; i++){
      var id = +cols[i].getAttribute('data-listid');
      var pos = i + 1;
      var row = LISTS.filter(function(l){ return l.id === id; })[0];
      if(row && row.position !== pos){
        row.position = pos;
        if(sb) await sb.from('board_lists').update({position: pos, updated_at: new Date().toISOString()}).eq('id', id);
      }
    }
  }

  function lid(el){ var v = el.getAttribute('data-listid'); return v.indexOf('p:') === 0 ? v : +v; }
  [listsBox, box].forEach(function(LB){
    if(!LB) return;
    LB.addEventListener('input', function(e){
      var t = e.target;
      if(t.matches('[data-hk]')){ HEAD[t.getAttribute('data-hk')] = t.textContent.trim(); hSave(t.getAttribute('data-hk'), t.textContent.trim()); return; }
      var col = t.closest ? t.closest('.pjlcol') : null;
      if(!col) return;
      var id = lid(col);
      if(t.matches('[contenteditable][data-f]')) lSave(id, t.getAttribute('data-f'), t.textContent.trim());
      else if(t.matches('.pjlt')){
        var row0 = t.closest('.pjlrow');
        row0.querySelector('.pjlico[data-act="link"]').classList.toggle('on', /<a /.test(t.innerHTML));
        saveListItems(id);
      }
      else if(t.matches('.pjlnote')) saveListItems(id);
    });
    LB.addEventListener('click', function(e){
      var add = e.target.closest('.pjladd');
      if(add){
        var col = add.closest('.pjlcol');
        var id = lid(add);
        var itemsBox = col.querySelector('.pjlitems');
        itemsBox.insertAdjacentHTML('beforeend', itemRow({t:'',note:'',link:''}));
        var inputs = itemsBox.querySelectorAll('.pjlt');
        inputs[inputs.length - 1].focus();
        initListSortables();
        return;
      }
      var more = e.target.closest('.pjlmore');
      if(more){
        var row = more.closest('.pjlrow');
        var extra = row.querySelector('.pjlextra');
        extra.classList.toggle('open');
        more.classList.toggle('on', extra.classList.contains('open'));
        return;
      }
      var del = e.target.closest('.pjldel');
      if(del){
        var row2 = del.closest('.pjlrow');
        var col2 = del.closest('.pjlcol');
        var id2 = lid(col2);
        row2.parentNode.removeChild(row2);
        saveListItems(id2);
      }
    });
    LB.addEventListener('mousedown', function(e){
      var b = e.target.closest('.pjlico[data-act="link"]');
      if(!b) return;
      e.preventDefault();
      var row = b.closest('.pjlrow');
      var cap = captureLinkSelection('.pjlt', 'listitem');
      if(!cap){ if(typeof toast === 'function') toast('Select some text first, then tap the link icon.'); return; }
      LINK_PENDING = cap;
      openLinkBox(row.querySelector('.pjllinkbox'));
    });
    LB.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && e.target.matches('.pjlt')){ e.preventDefault(); var ad = e.target.closest('.pjlcol').querySelector('.pjladd'); if(ad) ad.click(); return; }
      if(e.key === 'Enter' && e.target.matches('.pjllinkbox input')){ e.preventDefault(); applyPendingLink(e.target.value); }
    });
    LB.addEventListener('focusout', function(e){
      if(e.target.matches('.pjllinkbox input') && LINK_PENDING) applyPendingLink(e.target.value);
    });
  });

  /* This board now lives on its own page (Nov 25, 2026), so there is no toggle and
     nothing to hide: it paints as soon as the page opens. */
  box.classList.remove('pj-off');
  if(tilesBox) tilesBox.classList.remove('pj-off');
  if(listsBox) listsBox.classList.remove('pj-off');
  load(); loadTiles(); loadLists();
})();
</script>
