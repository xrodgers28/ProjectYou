<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creativity</title>
<meta name="pn-ver" content="v1.2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --ground:#f0eeea; --surface:#ffffff; --surface-2:#f7f5f2;
  --line:#e0dcd6; --line-soft:#ebe7e2;
  --ink:#26313a; --ink-2:#4d5a64; --muted:#848d95;
  --blue:#3f6f8f; --blue-soft:#e3ecf2;
  --warm:#c06a35; --warm-soft:#f8e9dd;
  --good:#3f7d5f; --good-soft:#e2efe8;
  --on-dark:#ffffff;
  --paper:#ffffff; --pen:#26313a; --guide:#c9c3ba;
  --shadow:0 1px 2px rgba(38,49,58,.05), 0 14px 38px -24px rgba(38,49,58,.55);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#16191c; --surface:#1e2328; --surface-2:#242a30;
    --line:#333a41; --line-soft:#2b3138;
    --ink:#e8eaec; --ink-2:#bcc3c9; --muted:#8b949b;
    --blue:#8bbad8; --blue-soft:#22303a;
    --warm:#e29a63; --warm-soft:#33251a;
    --good:#7ec09a; --good-soft:#1d2b24;
    --on-dark:#14181b;
    --paper:#f4f1ec; --pen:#26313a; --guide:#b9b2a8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 38px -24px rgba(0,0,0,.95);
  }
}
:root[data-theme="dark"]{
  --ground:#16191c; --surface:#1e2328; --surface-2:#242a30;
  --line:#333a41; --line-soft:#2b3138;
  --ink:#e8eaec; --ink-2:#bcc3c9; --muted:#8b949b;
  --blue:#8bbad8; --blue-soft:#22303a;
  --warm:#e29a63; --warm-soft:#33251a;
  --good:#7ec09a; --good-soft:#1d2b24;
  --on-dark:#14181b;
  --paper:#f4f1ec; --pen:#26313a; --guide:#b9b2a8;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 38px -24px rgba(0,0,0,.95);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:calc(var(--navh,0px) + 34px) 20px 80px}

.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 20px;flex-wrap:wrap}
.head h1{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:800;font-size:26px;
  letter-spacing:-.02em;margin:0}
.head .date{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);letter-spacing:.04em}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.art{background:var(--surface-2);border-bottom:1px solid var(--line-soft);padding:14px 0 6px;
  display:flex;align-items:center;justify-content:center}
.art svg{width:100%;max-width:280px;height:auto;display:block}
.art .ln{fill:none;stroke:var(--ink-2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.art .ac{fill:none;stroke:var(--warm);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.art .fillsoft{fill:var(--blue-soft);stroke:none}
.art .fillwarm{fill:var(--warm-soft);stroke:none}
.art .dot{fill:var(--warm);stroke:none}

.body{padding:24px 24px 4px}
.chips{display:flex;gap:8px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
.chip{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;padding:4px 11px;border-radius:99px}
.chip.draw{background:var(--warm-soft);color:var(--warm)}
.chip.think{background:var(--blue-soft);color:var(--blue)}
.mins{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}
h2{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;
  font-size:clamp(23px,5.2vw,30px);line-height:1.14;letter-spacing:-.022em;margin:0 0 12px;text-wrap:balance}
.txt{font-size:17px;color:var(--ink-2);margin:0 0 4px}

/* ---------- the ten circles ---------- */
.sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 24px 4px}
@media (min-width:520px){ .sheet{grid-template-columns:repeat(3,1fr)} }
.cell{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;aspect-ratio:1}
.cell canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.cell .n{position:absolute;top:6px;left:8px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  color:var(--guide);pointer-events:none}
.cell .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;border-radius:50%;
  background:transparent;color:var(--guide);font-size:15px;line-height:1;cursor:pointer;padding:0;
  opacity:0;transition:opacity .12s ease}
.cell.done .x{opacity:1}
.cell .x:hover{color:var(--warm)}
.cell.done{border-color:var(--good)}

.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 24px 0}
.t{font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;border-radius:9px;padding:8px 12px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.t:hover{border-color:var(--blue);color:var(--blue)}
.t[disabled]{opacity:.45;cursor:default}
.count{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted);margin-left:auto}
.nudge{padding:10px 24px 0;font-size:15px;color:var(--warm);min-height:24px}

/* ---------- new uses ---------- */
.obj{margin:4px 24px 0;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;
  padding:16px 18px;display:flex;align-items:center;gap:14px}
.obj .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em}
.obj .em{font-size:30px;line-height:1}
.entry{display:flex;gap:8px;padding:14px 24px 0}
.entry input{flex:1;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font-size:16px;
  font-family:inherit;background:var(--surface-2);color:var(--ink)}
.entry input:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.entry button{padding:12px 16px;border:1px solid var(--blue);border-radius:10px;background:var(--blue);
  color:var(--on-dark);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.ideas{list-style:none;margin:14px 0 0;padding:0 24px;display:flex;flex-direction:column;gap:7px}
.ideas li{display:flex;align-items:flex-start;gap:10px;background:var(--surface-2);border:1px solid var(--line-soft);
  border-radius:10px;padding:9px 11px;font-size:15.5px}
.ideas li.bonus{background:var(--good-soft);border-color:var(--good)}
.ideas li .i{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);padding-top:3px;min-width:18px}
.ideas li .d{margin-left:auto;border:0;background:transparent;color:var(--guide);cursor:pointer;font-size:15px;padding:0 2px}
.ideas li .d:hover{color:var(--warm)}
.push{margin:16px 24px 0;background:var(--warm-soft);border:1px solid var(--warm);border-radius:12px;padding:16px 18px}
.push h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:17px;margin:0 0 6px;letter-spacing:-.01em}
.push p{margin:0 0 10px;font-size:15px;color:var(--ink-2)}
.push .clock{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:26px;color:var(--warm);margin:0 0 8px}

.took{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 24px 4px;
  font-size:14.5px;color:var(--ink-2)}
.took input{width:66px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;
  font-size:15px;font-family:inherit;text-align:center;background:var(--surface-2);color:var(--ink)}
.took input:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}

.acts{display:flex;gap:10px;padding:14px 24px 22px;flex-wrap:wrap}
.b{font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;border-radius:11px;padding:13px 18px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  transition:transform .08s ease,filter .12s ease}
.b:active{transform:scale(.97)}
.b:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.b[disabled]{opacity:.5;cursor:default}
.b.did{flex:1 1 170px;background:var(--good);border-color:var(--good);color:var(--on-dark)}
.b.did:hover{filter:brightness(1.07)}
.b.swap{color:var(--blue)}
.b.swap:hover{border-color:var(--blue)}

.notice{margin:0 24px 4px;background:var(--warm-soft);border:1px solid var(--warm);border-radius:11px;
  padding:11px 14px;font-size:14.5px;color:var(--ink-2)}
.notice b{color:var(--warm)}
.state{padding:0 24px 20px;margin:-10px 0 0;font-size:14.5px;color:var(--good);font-weight:600;min-height:22px}
.state.warn{color:var(--warm)}
.state.muted{color:var(--muted);font-weight:400}

.foot{margin:22px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted)}
.foot .pill{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px;
  font-family:"IBM Plex Mono",monospace;font-size:12px}
.foot a{color:var(--blue);text-decoration:none;font-weight:600}
.foot a:hover{text-decoration:underline}

.load{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:40px 24px;
  text-align:center;color:var(--muted);font-size:15px}
.err{background:var(--warm-soft);border:1px solid var(--warm);color:var(--ink);border-radius:var(--r);
  padding:18px 20px;font-size:15px}
.hidden{display:none!important}

.gate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:24px;margin:0 0 16px}
.gate h2{font-size:20px;margin:0 0 4px}
.gate p{font-size:14.5px;color:var(--ink-2);margin:0 0 16px}
.gate input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:16px;
  margin:0 0 10px;font-family:inherit;background:var(--surface-2);color:var(--ink)}
.gate button{width:100%;padding:12px;border:1px solid var(--blue);border-radius:10px;background:var(--blue);
  color:var(--on-dark);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.gate .msg{color:var(--warm);font-size:13.5px;margin-top:10px;min-height:18px}

.hist{margin:26px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.hist h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:16px;margin:0 0 3px;letter-spacing:-.01em}
.hist .sub{font-size:13.5px;color:var(--muted);margin:0 0 14px}
.body .src{font-size:11px;color:#8a93a0;margin-top:16px;font-style:italic}
.body .src a{color:inherit;text-decoration:underline}
.dots{display:grid;grid-template-columns:repeat(15,1fr);gap:6px;margin:0 0 14px}
.dots i{aspect-ratio:1;border-radius:5px;background:var(--line-soft);display:block}
.dots i.on{background:var(--good)}
.dots i.on.uses{background:var(--blue)}
.dots i.today{outline:2px solid var(--warm);outline-offset:1px}
.hist .tot{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.hist .tot b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;color:var(--ink);line-height:1}
.hist .tot span{font-size:13.5px;color:var(--ink-2)}
.strip{display:flex;gap:8px;overflow-x:auto;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line-soft)}
.strip figure{margin:0;flex:0 0 88px}
.strip img{width:88px;height:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper);display:block}
.strip figcaption{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);margin-top:4px;text-align:center}
</style>
</head>

</div>

var LKEY='creativity-'+DAY;
function stash(){
  try{
    localStorage.setItem(LKEY,JSON.stringify({
      mode:S.mode,strokes:S.strokes,object:S.object,ideas:S.ideas,phase:S.phase
    }));
  }catch(e){}

function unstash(){

var CTX=[], SIZE=[];
function circleGuide(ctx,w,h){
  var cs=getComputedStyle(document.documentElement);
  ctx.fillStyle=(cs.getPropertyValue('--paper')||'#fff').trim();

  c.strokeStyle=(cs.getPropertyValue('--pen')||'#26313a').trim();
  c.lineWidth=Math.max(2,w*0.014); c.lineCap='round'; c.lineJoin='round';
  S.strokes[i].forEach(function(p){
    if(!p.length) return;
    c.beginPath(); c.moveTo(p[0][0]*w,p[0][1]*h);
    for(var k=1;k<p.length;k++) c.lineTo(p[k][0]*w,p[k][1]*h);
    c.stroke();
  });
  var cell=document.querySelector('.cell[data-i="'+i+'"]');
  if(cell) cell.classList.toggle('done',S.strokes[i].length>0);
}
function filled(){ return S.strokes.filter(function(p){return p.length>0;}).length; }
function paintCount(){
  var n=filled(), c=el('cnt');
  if(c) c.textContent=n+' of 10 turned into something';
  hint();
}
function sizeCanvas(i,cv){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  var r=cv.getBoundingClientRect();
  var w=Math.max(80,Math.round(r.width)), h=Math.max(80,Math.round(r.height||r.width));
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  var ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  CTX[i]=ctx; SIZE[i]=[w,h];
  repaint(i);
}
function wireCanvas(i,cv){
  sizeCanvas(i,cv);
  var drawing=false, path=null;
  function pt(ev){
    var b=cv.getBoundingClientRect();
    return [ (ev.clientX-b.left)/b.width, (ev.clientY-b.top)/b.height ];
  }
  cv.addEventListener('pointerdown',function(ev){
    ev.preventDefault();
    try{ cv.setPointerCapture(ev.pointerId); }catch(e){}
    drawing=true; path=[pt(ev)]; S.strokes[i].push(path); repaint(i); paintCount();
  });
  cv.addEventListener('pointermove',function(ev){
    if(!drawing) return;
    ev.preventDefault();
    path.push(pt(ev)); repaint(i);
  });
  function up(){ if(!drawing) return; drawing=false; path=null; stash(); paintCount(); }
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  cv.addEventListener('pointerleave',up);
}
function undoLast(){
  for(var i=9;i>=0;i--){ if(S.strokes[i].length){ S.strokes[i].pop(); repaint(i); stash(); paintCount(); return; } }
}
function clearCell(i){ S.strokes[i]=[]; repaint(i); stash(); paintCount(); }
function clearAll(){
  for(var i=0;i<10;i++){ S.strokes[i]=[]; repaint(i); }
  stash(); paintCount();
}
/* One image of the whole sheet, two across and five down, for the strip below. */
function sheetPNG(){
  try{
    var cw=260, ch=260, out=document.createElement('canvas');
    out.width=cw*2; out.height=ch*5;
    var o=out.getContext('2d');
    o.fillStyle='#ffffff'; o.fillRect(0,0,out.width,out.height);
    for(var i=0;i<10;i++){
      var x=(i%2)*cw, y=Math.floor(i/2)*ch;
      o.save(); o.translate(x,y);
      o.strokeStyle='#c9c3ba'; o.lineWidth=1.4;
      o.beginPath(); o.arc(cw/2,ch/2,Math.min(cw,ch)*0.31,0,Math.PI*2); o.stroke();
      o.strokeStyle='#26313a'; o.lineWidth=3; o.lineCap='round'; o.lineJoin='round';
      S.strokes[i].forEach(function(p){
        if(!p.length) return;
        o.beginPath(); o.moveTo(p[0][0]*cw,p[0][1]*ch);
        for(var k=1;k<p.length;k++) o.lineTo(p[k][0]*cw,p[k][1]*ch);
        o.stroke();
      });
      o.restore();
    }
    return out.toDataURL('image/png');
  }catch(e){ return null; }
}
function renderCircles(){
  var cells='';
  for(var i=0;i<10;i++){
    cells+='<div class="cell" data-i="'+i+'"><canvas></canvas><span class="n">'+(i+1)+
           '</span><button class="x" data-clear="'+i+'" title="Clear this one" aria-label="Clear circle '+(i+1)+'">&times;</button></div>';
  }
  el('mount').innerHTML=
    '<div class="card">'+
      '<div class="art">'+ART.circles+'</div>'+
      '<div class="body">'+
        '<div class="chips"><span class="chip draw">Today&rsquo;s warm-up</span><span class="mins">five to ten minutes</span></div>'+
        '<h2>Turn ten circles into something else</h2>'+
        '<p class="txt">Draw inside the circle or straight over it, with your finger or the mouse. One of them could sprout legs and become a friendly spider. Nothing here is judged and nothing is kept unless you want it.</p>'+
        /* THE SOURCE LINE. This warm-up is a shortened Thirty Circles. */
        '<div class="src">Source &middot; the Thirty Circles exercise, Bob McKim, <a href="https://www.ted.com/talks/tim_brown_tales_of_creativity_and_play" target="_blank" rel="noopener">shown by Tim Brown at TED &#8599;</a></div>'+
      '</div>'+
      '<div class="notice" id="notice" style="display:none"></div>'+
      '<div class="sheet" id="sheet">'+cells+'</div>'+
      '<div class="tools">'+
        '<button class="t" id="undo">Undo</button>'+
        '<button class="t" id="wipe">Start again</button>'+
        '<button class="t" id="stuck">Stuck?</button>'+
        '<span class="count" id="cnt"></span>'+
      '</div>'+
      '<div class="nudge" id="nudge"></div>'+
      '<div class="took"><label for="mins">Took me</label>'+
        '<input type="number" id="mins" min="1" max="180" step="1" value="10" inputmode="numeric">'+
        '<span>minutes</span></div>'+
      '<div class="acts"><button class="b did" id="did">I&rsquo;m done</button></div>'+
      '<div class="state muted" id="state"></div>'+
    '</div>';

  var cvs=el('sheet').querySelectorAll('canvas');
  for(var j=0;j<cvs.length;j++) wireCanvas(j,cvs[j]);
  el('sheet').addEventListener('click',function(ev){
    var b=ev.target.closest?ev.target.closest('[data-clear]'):null;
    if(b) clearCell(+b.getAttribute('data-clear'));
  });
  el('undo').addEventListener('click',undoLast);
  el('wipe').addEventListener('click',clearAll);
  el('stuck').addEventListener('click',function(){
    el('nudge').textContent=NUDGES[Math.floor(Math.random()*NUDGES.length)];
  });
  el('did').addEventListener('click',finish);
  paintCount();
  var rz=null;
  window.addEventListener('resize',function(){
    clearTimeout(rz);
    rz=setTimeout(function(){
      var list=el('sheet')?el('sheet').querySelectorAll('canvas'):[];
      for(var k=0;k<list.length;k++) sizeCanvas(k,list[k]);
    },140);
  });
}

/* ==========================================================
   NEW USES  -  and the push that is the whole point of it
   ========================================================== */
function pickObject(recent){
  var avail=OBJECTS.filter(function(o){ return recent.indexOf(o.n)===-1; });
  if(!avail.length) avail=OBJECTS.slice();
  return avail[hash(DAY)%avail.length];
}
function bonusCount(){ return S.ideas.filter(function(x){return x.bonus;}).length; }
function ideaList(){
  return S.ideas.map(function(x,i){
    return '<li class="'+(x.bonus?'bonus':'')+'"><span class="i">'+(i+1)+'</span><span>'+esc(x.t)+'</span>'+
           '<button class="d" data-del="'+i+'" aria-label="Remove">&times;</button></li>';
  }).join('');
}
function paintIdeas(){
  var ul=el('ideas'); if(ul) ul.innerHTML=ideaList();
  var c=el('cnt');
  if(c) c.textContent=S.ideas.length+(S.ideas.length===1?' idea':' ideas')+(bonusCount()?' · '+bonusCount()+' after the break':'');
  var t=el('tapped');
  if(t) t.disabled=(S.phase!=='work'||S.ideas.length<1);
  hint();
}
function addIdea(){
  var inp=el('idea'); if(!inp) return;
  var v=(inp.value||'').trim();
  if(!v) return;
  S.ideas.push({t:v,bonus:(S.phase==='more')});
  inp.value=''; inp.focus();
  stash(); paintIdeas();
  if(S.phase==='more'&&bonusCount()>=2) closeOut();
}
function delIdea(i){ S.ideas.splice(i,1); stash(); paintIdeas(); }

function renderUses(){
  var o=S.object;
  el('mount').innerHTML=
    '<div class="card">'+
      '<div class="art">'+ART.uses+'</div>'+
      '<div class="body">'+
        '<div class="chips"><span class="chip think">Today&rsquo;s warm-up</span><span class="mins">five to ten minutes</span></div>'+
        '<h2>Find a new use for this</h2>'+
        '<p class="txt">The more far-fetched the better. Type one, press return, keep going. When you feel tapped out, say so.</p>'+
        /* THE SOURCE LINE. Guilford's Alternative Uses task, the standard test of
           divergent thinking. No stable public page worth linking, so no link. */
        '<div class="src">Source &middot; the Alternative Uses task, J.P. Guilford, 1967</div>'+
      '</div>'+
      '<div class="notice" id="notice" style="display:none"></div>'+
      '<div class="obj"><span class="em">'+o.e+'</span><span class="big">'+esc(o.n)+'</span></div>'+
      '<div class="entry">'+
        '<input id="idea" placeholder="It could also be&hellip;" autocomplete="off">'+
        '<button id="add">Add</button>'+
      '</div>'+
      '<ul class="ideas" id="ideas"></ul>'+
      '<div class="tools"><button class="t" id="tapped" disabled>That&rsquo;s all I&rsquo;ve got</button><span class="count" id="cnt"></span></div>'+
      '<div id="pushSlot"></div>'+
      '<div class="took"><label for="mins">Took me</label>'+
        '<input type="number" id="mins" min="1" max="180" step="1" value="10" inputmode="numeric">'+
        '<span>minutes</span></div>'+
      '<div class="acts"><button class="b did" id="did">I&rsquo;m done</button></div>'+
      '<div class="state muted" id="state"></div>'+
    '</div>';

  el('add').addEventListener('click',addIdea);
  el('idea').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addIdea(); } });
  el('ideas').addEventListener('click',function(ev){
    var b=ev.target.closest?ev.target.closest('[data-del]'):null;
    if(b) delIdea(+b.getAttribute('data-del'));
  });
  el('tapped').addEventListener('click',startWait);
  el('did').addEventListener('click',finish);
  paintIdeas();
  if(S.phase==='more') openMore();
  if(S.phase==='closed') closeOut(true);
}

var waitTimer=null;
function startWait(){
  if(S.phase!=='work') return;
  S.phase='wait'; S.waitLeft=60;
  el('tapped').disabled=true;
  el('idea').disabled=true; el('add').disabled=true;
  el('pushSlot').innerHTML=
    '<div class="push">'+
      '<h3>That is exactly where most people stop.</h3>'+
      '<p>Take a minute off it, then come back and give me two more. The ones that arrive after this point are usually the strange ones.</p>'+
      '<p class="clock" id="clock">1:00</p>'+
      '<button class="t" id="skip">I&rsquo;m ready now</button>'+
    '</div>';
  el('skip').addEventListener('click',openMore);
  clearInterval(waitTimer);
  waitTimer=setInterval(function(){
    S.waitLeft--;
    var c=el('clock');
    if(c) c.textContent='0:'+String(Math.max(0,S.waitLeft)).padStart(2,'0');
    if(S.waitLeft<=0) openMore();
  },1000);
}
function openMore(){
  clearInterval(waitTimer); waitTimer=null;
  S.phase='more'; stash();
  el('idea').disabled=false; el('add').disabled=false;
  el('idea').placeholder='Two more. Anything at all…';
  el('pushSlot').innerHTML=
    '<div class="push">'+
      '<h3>Two more.</h3>'+
      '<p>They do not have to be good. They have to exist.</p>'+
    '</div>';
  el('idea').focus();
  paintIdeas();
}
function closeOut(quiet){
  clearInterval(waitTimer); waitTimer=null;
  S.phase='closed'; stash();
  var b=bonusCount(), n=S.ideas.length;
  el('pushSlot').innerHTML=
    '<div class="push">'+
      '<h3>'+n+(n===1?' idea':' ideas')+'.</h3>'+
      '<p>'+(b? b+' of them arrived after you thought you were finished.' : 'Add more any time you like.')+'</p>'+
    '</div>';
  paintIdeas();
}

/* ==========================================================
   saving, and the row on the board
   ========================================================== */
function say(msg,cls){ var s=el('state'); if(s){ s.textContent=msg; s.className='state '+(cls||''); } }

/* WHY THE BUTTON WILL NOT TICK YET, in words, never as a silent grey button.
   Scott hit exactly that on the first day: a disabled button that refused and
   explained nothing. Returns null when it really is ready to tick. */
function notYet(){
  if(!sb) return 'This copy cannot record anything — it could not load its library. Open the card from your own site.';
  if(!signedIn) return 'You are not signed in, so this cannot tick. Sign in at the top of the page.';
  if(S.mode==='circles'&&filled()===0) return 'Draw on at least one circle first.';
  if(S.mode==='uses'&&S.ideas.length<1) return 'Add at least one idea first.';
  if(S.mode==='uses'&&S.phase!=='closed') return 'One step to go — press “That’s all I’ve got”.';
  return null;
}
/* The same sentence, sitting under the button before he presses it. */
function hint(){
  if(ticked) return;
  var s=el('state'); if(!s) return;
  if(s.className.indexOf('warn')>-1&&s.textContent.indexOf('did not save')>-1) return;
  var m=notYet();
  say(m||'Ready. Log the minutes and tick it off.','muted');
}
/* A standing notice at the top of the card whenever nothing can be recorded. */
function paintNotice(){
  var n=el('notice'); if(!n) return;
  if(!sb){
    n.innerHTML='<b>Nothing is being recorded.</b> This page could not load its library, so the exercise works but the tick cannot reach your board.';
  }else if(!signedIn){
    n.innerHTML='<b>Not signed in.</b> Have a go at the exercise by all means — but sign in at the top before you finish, or it will not tick off your board.';
  }else{
    n.innerHTML=''; n.style.display='none'; return;
  }
  n.style.display='';
}

async function saveWork(mins){
  if(!sb||!signedIn) return;
  var row={for_date:DAY, mode:S.mode, minutes:mins, updated_at:new Date().toISOString()};
  if(S.mode==='circles'){
    row.circles=filled();
    row.sheet=sheetPNG();
  }else{
    row.object=S.object?S.object.n:null;
    row.ideas=S.ideas.filter(function(x){return !x.bonus;}).map(function(x){return x.t;});
    row.extra_ideas=S.ideas.filter(function(x){return x.bonus;}).map(function(x){return x.t;});
  }
  await sb.from('creativity_log').upsert([row],{onConflict:'for_date'});
}

async function ensureRow(){
  var r=await sb.from('todos').select('id,done,actual_minutes,for_date')
    .eq('for_date',DAY).eq('tracker',TRACKER).limit(1);
  if(r.error) throw r.error;
  if(r.data&&r.data[0]) return r.data[0];

  var ins=await sb.from('todos').insert({
    task:HABIT,
    section:'Sense of Purpose', subsection:'Sharpening my creativity',
    category:'Sense of Purpose', qs_group:'Sense of Purpose',
    tracker:TRACKER,
    is_habit:true, done:false, staged:false,
    for_date:DAY, est_minutes:10,
    ws_id:WS_ID, source_project:'creativity'
  }).select('id,done,actual_minutes,for_date').single();
  if(ins.error) throw ins.error;
  return ins.data;
}

/* Insert first, THEN tick. The qs_log trigger is AFTER UPDATE only, so a row
   inserted already-done never reaches the wheel. */
async function finish(){
  if(ticked) return;
  var why=notYet();
  if(why){ say(why,'warn'); return; }
  el('did').disabled=true;
  say('Saving…','muted');
  try{
    var v=parseInt((el('mins')||{}).value,10);
    var mins=(v>0&&v<=180)?v:10;
    await saveWork(mins);
    var row=await ensureRow();
    var now=new Date().toISOString();
    var up=await sb.from('todos').update({
      done:true, status:'done', done_at:now, completed_at:now,
      actual_minutes:mins, for_date:DAY, updated_at:now
    }).eq('id',row.id);
    if(up.error) throw up.error;

    ticked=true;
    el('did').textContent='Done today';
    say('Creativity → wheel ✓, '+mins+' min','');
    drawHist();
    setTimeout(function(){ location.href='habit-modules.html?done=creativity'; },800);
  }catch(e){
    el('did').disabled=false;
    say('That did not save. Try again in a moment.','warn');
  }
}

/* ==========================================================
   history
   ========================================================== */
async function drawHist(){
  if(!sb||!signedIn) return;
  try{
    var from=new Date(); from.setDate(from.getDate()-29);
    var r=await sb.from('creativity_log')
      .select('for_date,mode,circles,ideas,extra_ideas,minutes')
      .gte('for_date',key(from)).order('for_date',{ascending:false});
    var rows=(r.data)||[];
    var by={}; rows.forEach(function(x){ by[x.for_date]=x; });

    var cells=[], hit=0, circles=0, uses=0, mins=0, streak=0;
    for(var i=29;i>=0;i--){
      var d=new Date(); d.setDate(d.getDate()-i);
      var k=key(d), x=by[k];
      if(x){
        hit++; mins+=(x.minutes||0);
        circles+=(x.circles||0);
        uses+=((x.ideas||[]).length+(x.extra_ideas||[]).length);
      }
      cells.push('<i class="'+(x?('on '+x.mode):'')+(k===DAY?' today':'')+'" title="'+k+(x?' – '+x.mode:'')+'"></i>');
    }
    var back=0;
    while(true){
      var d2=new Date(); d2.setDate(d2.getDate()-back);
      if(by[key(d2)]){ streak++; back++; continue; }
      if(back===0){ back++; continue; }
      break;
    }

    var strip='';
    var sheets=rows.filter(function(x){return x.mode==='circles';}).slice(0,6);
    if(sheets.length){
      var ids=sheets.map(function(x){return x.for_date;});
      var full=await sb.from('creativity_log').select('for_date,sheet').in('for_date',ids);
      var pics=((full.data)||[]).filter(function(x){return x.sheet;});
      if(pics.length){
        pics.sort(function(a,b){ return a.for_date<b.for_date?1:-1; });
        strip='<div class="strip">'+pics.map(function(x){
          return '<figure><img src="'+x.sheet+'" alt="Circles drawn on '+x.for_date+'">'+
                 '<figcaption>'+shortDate(x.for_date)+'</figcaption></figure>';
        }).join('')+'</div>';
      }
    }

    el('hist').innerHTML=
      '<h3>The last thirty days</h3>'+
      '<p class="sub">Orange outline is today. Green squares are drawing days, blue are new-use days.</p>'+
      '<div class="dots">'+cells.join('')+'</div>'+
      '<div class="tot">'+
        '<span><b>'+hit+'</b> of 30 days</span>'+
        '<span><b>'+streak+'</b> in a row</span>'+
        (circles?'<span><b>'+circles+'</b> circles</span>':'')+
        (uses?'<span><b>'+uses+'</b> new uses</span>':'')+
        (mins?'<span><b>'+mins+'</b> minutes</span>':'')+
      '</div>'+strip;
    el('hist').classList.remove('hidden');
  }catch(e){ }
}

function drawFoot(){
  el('foot').innerHTML=
    '<span class="pill">'+(S.mode==='circles'?'Drawing day':'New uses day')+'</span>'+
    '<span class="pill">'+(S.mode==='circles'?'New uses tomorrow':'Drawing tomorrow')+'</span>'+
    '<a href="habit-modules.html">All modules</a>';
}

/* ==========================================================
   sign in, same gate as the other cue cards
   ========================================================== */
async function doSignIn(){
  if(!sb) return;
  var email=(el('email').value||'').trim(), pass=el('pass').value||'';
  el('gateMsg').textContent='';
  var r=await sb.auth.signInWithPassword({email:email,password:pass});
  if(r.error){ el('gateMsg').textContent=r.error.message; return; }
  signedIn=true;
  el('gate').classList.add('hidden');
  await hydrate();
  paintNotice();
  hint();
  drawHist();
}
el('signin').addEventListener('click',doSignIn);
el('pass').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); doSignIn(); } });

/* Pull back anything already saved today, and pick a fresh object. */
async function hydrate(){
  if(!sb||!signedIn) return;
  try{
    var recent=await sb.from('creativity_log').select('for_date,object')
      .eq('mode','uses').order('for_date',{ascending:false}).limit(20);
    var names=((recent.data)||[]).filter(function(x){return x.for_date!==DAY;})
      .map(function(x){return x.object;});
    if(S.mode==='uses'&&!S.object){ S.object=pickObject(names); }

    var mine=await sb.from('creativity_log').select('*').eq('for_date',DAY).limit(1);
    var row=(mine.data&&mine.data[0])?mine.data[0]:null;
    if(row&&S.mode==='uses'){
      if(row.object){ S.object=OBJECTS.filter(function(o){return o.n===row.object;})[0]||S.object; }
      if(!S.ideas.length){
        (row.ideas||[]).forEach(function(t){ S.ideas.push({t:t,bonus:false}); });
        (row.extra_ideas||[]).forEach(function(t){ S.ideas.push({t:t,bonus:true}); });
        if(S.ideas.length) S.phase='closed';
      }
    }

    var t=await sb.from('todos').select('id,done').eq('for_date',DAY).eq('tracker',TRACKER).limit(1);
    if(t.data&&t.data[0]&&t.data[0].done) ticked=true;
  }catch(e){}
}

/* ==========================================================
   go
   ========================================================== */
(async function(){
  if(sb){
    try{
      var s=await sb.auth.getSession();
      signedIn=!!(s&&s.data&&s.data.session);
    }catch(e){ signedIn=false; }
  }
  if(!signedIn) el('gate').classList.remove('hidden');

  await hydrate();
  if(S.mode==='uses'&&!S.object) S.object=pickObject([]);

  if(S.mode==='circles') renderCircles(); else renderUses();
  drawFoot();
  paintNotice();

  if(ticked){
    var d=el('did'); if(d){ d.disabled=true; d.textContent='Done today'; }
    say('Already ticked today.','muted');
  }else{
    hint();
  }
  drawHist();
})();
})();
</script>
