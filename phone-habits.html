<style>
:root[data-theme="dark"]{
  --bg:#0F1013; --text:#F4F4F6; --muted:#A0A3AE; --line:#26282F; --gold:#E9C46A;
  --done:#4A4D56; --doneb:#5A5D67; --open:#FBFBF9; --chip:#1B1D23; --shadow:0 10px 28px rgba(0,0,0,.55);
}
:root[data-theme="light"]{
  --bg:#F3F1EC; --text:#17181C; --muted:#5B5D68; --line:#DAD7D0; --gold:#8A5A00;
  --done:#D3D0C8; --doneb:#C2BFB6; --open:#FFFFFF; --chip:#E7E4DD; --shadow:0 10px 28px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:430px;margin:0 auto;padding:10px 5px 70px;min-height:100vh}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;align-items:center;gap:0}
.lnk{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;min-height:44px;padding:0 9px;cursor:pointer;border-radius:8px}
.lnk:hover{color:var(--text)}
.lnk[aria-pressed="true"]{color:var(--text);font-weight:600}
.lnk:focus-visible,.key:focus-visible,.grip:focus-visible,.rm:focus-visible,.shade:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.sep{width:1px;height:16px;background:var(--line);margin:0 3px}
h1{margin:0;font-size:30px;line-height:1.1;font-weight:700}
.sub{font-size:13px;color:var(--muted);margin:2px 0 10px}
section.sec{margin:0 0 8px;padding:0;border-radius:14px;transition:background .15s}
section.sec.dragging{background:var(--chip);box-shadow:var(--shadow);padding:0 10px}
section.sec.target{background:var(--chip);outline:2px dashed var(--muted);outline-offset:-2px}
.sh{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:7px;min-height:24px}
.prev{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.prev button{font:inherit;font-size:12px;color:var(--text);background:transparent;border:1px solid var(--muted);border-radius:999px;padding:5px 10px;cursor:pointer}
.sh input.nm{flex:1;min-width:0;margin:0;font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text);background:transparent;border:0;border-bottom:1px dashed var(--muted);border-radius:0;padding:2px 0;outline:none}
.sh input.nm:focus{border-bottom:1px solid var(--text)}
.sh h2{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:1}
.sh .st{font-size:11.5px;color:var(--muted)}
.grip{display:none;background:none;border:0;width:44px;height:44px;margin:-14px 0 -14px -12px;cursor:grab;touch-action:none;align-items:center;justify-content:center;color:var(--muted)}
.editing .grip{display:flex}
.grip i{display:block;width:12px;height:16px;background-image:radial-gradient(currentColor 1.4px,transparent 1.6px);background-size:6px 6px;opacity:.8}
.body{display:grid;grid-template-columns:58px minmax(0,1fr);gap:0 6px;align-items:stretch}
#rail{border-right:1px solid var(--line);padding-right:5px}
#rail section.sec{margin:0;padding-top:31px}
#rail .grid{grid-template-columns:minmax(0,1fr);gap:8px 0}
#rail .sh{display:none}
#rail:empty{display:none}
.body.norail{grid-template-columns:minmax(0,1fr)}
.body.norail #rail{display:none}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 0;align-items:start}
.grid.small{margin-top:6px}
.shbody{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease,opacity .25s}
.shbody>.shin{overflow:hidden;min-height:0;padding:16px 16px 8px;margin:-16px -16px -8px}
section.sec.shut .shbody{grid-template-rows:0fr;opacity:0}
.nc{grid-column:4 / -1;align-self:center;justify-self:center;padding:0 6px}
.nc button,.st.reopen{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:11px;border-radius:99px;padding:6px 12px;min-height:32px;cursor:pointer;opacity:.75}
.nc button:hover,.st.reopen:hover{opacity:1;color:var(--text)}
.st.reopen{padding:2px 10px;min-height:0}
.editing .nc{display:none}
section.sec[data-id=parkedcards] .cell{opacity:.5}
section.sec[data-id=parkedcards] .led{display:none}
section.sec[data-id=parkedcards] .key{cursor:default}
.empty{font-size:12px;color:var(--muted);padding:10px 0;text-align:center}
.cell{position:relative;display:flex;justify-content:center}
.key{background:none;border:0;padding:3px 0 2px;min-height:44px;width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;color:inherit;font:inherit;cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.disc{position:relative;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--c);background:var(--open);box-shadow:0 2px 8px color-mix(in srgb,var(--c) 35%,transparent)}
/* the light-mode glow, used in dark too (Nov 11, 2026) */
.gly{width:62%;height:62%;display:block;color:var(--c);pointer-events:none}.gly svg{width:100%;height:100%;display:block}
.done .gly{filter:grayscale(1);opacity:.5}
.disc img{width:76%;height:76%;object-fit:contain;mix-blend-mode:multiply;display:block;pointer-events:none}
.led{position:absolute;top:1px;right:1px;width:26px;height:26px;transform:translate(50%,-50%);border-radius:50%;pointer-events:none;background:radial-gradient(circle closest-side,var(--c) 0,var(--c) 7%,color-mix(in srgb,var(--c) 60%,transparent) 22%,color-mix(in srgb,var(--c) 22%,transparent) 50%,color-mix(in srgb,var(--c) 6%,transparent) 78%,transparent 100%)}
.small .led{width:22px;height:22px}
.done .disc{background:var(--done);border-color:var(--doneb);box-shadow:none}
.done .disc img{filter:grayscale(1);opacity:.5}
.done .led{background:var(--doneb);box-shadow:none}
.lbl{overflow-wrap:break-word;font-size:10.5px;line-height:1.15;text-align:center;color:var(--text)}
.done .lbl{color:var(--muted)}
.lbl.tight{font-size:9.5px;letter-spacing:-.01em}
.lbl em{display:block;font-style:normal;color:var(--muted)}
.rm{display:none;position:absolute;top:-4px;left:0;width:30px;height:30px;border:0;background:none;padding:0;cursor:pointer;z-index:2}
.rm span{display:flex;width:18px;height:18px;border-radius:50%;background:var(--chip);color:var(--muted);align-items:center;justify-content:center;font-size:13px;line-height:1;border:1px solid var(--line);margin:6px 0 0 6px}
.rm:hover span{color:var(--text)}
.editing .rm{display:block}
.editing .key{cursor:grab;touch-action:pan-y}
.cell.ghost{opacity:.25}
.floating{position:fixed;z-index:50;pointer-events:none;opacity:.95;transform:scale(1.12);filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
.floating .rm{display:none}
#ind{position:fixed;display:none;width:3px;border-radius:2px;background:var(--text);z-index:40;pointer-events:none}
.note{font-size:12px;line-height:1.4;color:var(--muted);margin:8px 0 0}
.parked{margin-top:6px;border-top:1px solid var(--line)}
.shade{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--muted);font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;min-height:44px;padding:0;cursor:pointer;text-align:left}
.shade b{font-weight:600;background:var(--chip);border-radius:99px;padding:1px 8px;letter-spacing:0;color:var(--text)}
.shade i{margin-left:auto;display:block;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s;margin-right:4px}
.parked.open .shade i{transform:rotate(-135deg)}
.shadebody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.parked.open .shadebody{grid-template-rows:1fr}
.shadein{overflow:hidden;min-height:0}
.shadein .grid{padding:2px 0 4px}
.parked .disc{box-shadow:none}
.parked .led{display:none}
@media (prefers-reduced-motion:reduce){.shbody{transition:none}section.sec,.shadebody,.shade i{transition:none}}

.gate{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px}
.gate[hidden]{display:none}
.gate form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.gate h2{margin:0 0 2px;font:700 26px/1.1 Georgia,serif;color:var(--text)}
.gate p{margin:0;color:var(--muted);font:14px/1.4 -apple-system,Arial,sans-serif}
.gate input{font:16px -apple-system,Arial,sans-serif;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--text)}
.gate button{font:700 16px -apple-system,Arial,sans-serif;padding:13px;border-radius:12px;border:0;background:var(--gold);color:#1b1608}
.gate #gErr{color:#ff7a6b;min-height:18px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--chip);color:var(--text);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font:14px -apple-system,Arial,sans-serif;box-shadow:var(--shadow);transition:.25s;z-index:99999;max-width:88vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.app{padding-top:max(0px,env(safe-area-inset-top))}
#head,#sub{display:none}
</style>
</head>
<body>
<div class="pynav" style="display:none!important" aria-hidden="true"></div>
<div class="app" id="app">
  <div class="bar">
    <div class="eyebrow">Today &middot; Nov 11, 2026</div>
    <div class="tools">
      <button class="lnk" id="thDark" type="button" aria-pressed="true">Dark</button>
      <button class="lnk" id="thLight" type="button" aria-pressed="false">Light</button>
      <span class="sep"></span>
      <button class="lnk" id="edit" type="button" aria-pressed="false">Edit</button>
    </div>
  </div>
  <h1 id="head"></h1>
  <p class="sub" id="sub"></p>
  <div class="body" id="body"><aside id="rail" aria-label="Counters"></aside><div id="secs"></div></div>
  <div class="parked" id="parked">
    <button class="shade" id="shadeBtn" type="button" aria-expanded="false" aria-controls="shadeBody"><span>Parked</span><b id="pcount">0</b><i aria-hidden="true"></i></button>
    <div class="shadebody" id="shadeBody"><div class="shadein"><div id="pbox"></div></div></div>
  </div>
  <p class="note" id="hint"></p>
</div>
<div id="ind"></div>

function syncBoard(){
  var boardIds = BOARD_ALL.map(function(b){ return b[0]; });
  var on = boardIds.filter(function(id){ return BOARD_PARKED.indexOf(id) < 0; });
  var off = boardIds.filter(function(id){ return BOARD_PARKED.indexOf(id) > -1; });
  if (!S.layout.parkedcards) S.layout.parkedcards = [];
  /* anything not a known habit goes; a parked board card leaves every other section and waits in Parked cue cards */
  Object.keys(S.layout).forEach(function(s){
    S.layout[s] = S.layout[s].filter(function(id){ return ITEMS[id] && (s === 'parkedcards' ? off.indexOf(id) > -1 : off.indexOf(id) < 0); });
  });
  S.parked = (S.parked || []).filter(function(r){ return ITEMS[r.id] && boardIds.indexOf(r.id) < 0 || on.indexOf(r.id) > -1; });
  off.forEach(function(id){ if (S.layout.parkedcards.indexOf(id) < 0) S.layout.parkedcards.push(id); });
  /* add whatever the board shows that the remote does not have yet, in board order */
  on.forEach(function(id){
    var have = Object.keys(S.layout).some(function(s){ return S.layout[s].indexOf(id) > -1; }) || S.parked.some(function(r){ return r.id === id; });

}
function ensure(){

    Object.keys(S.layout).forEach(function(s){ S.layout[s] = S.layout[s].filter(function(x){ return x !== 'spark'; }); });
    S.parked = (S.parked || []).filter(function(r){ return r.id !== 'spark'; });

  syncBoard();

  if (!Object.keys(S.layout).some(function(s){ return S.layout[s].indexOf('photo') > -1; }) && !(S.parked || []).some(function(r){ return r.id === 'photo'; })) S.layout.counters.unshift('photo');

    S.layout.counters = ['photo','coffee','water','meetup','posture','bday','local'].filter(function(x){ return S.layout.counters.indexOf(x) > -1; }).concat(S.layout.counters.filter(function(x){ return ['coffee','diet','water','meetup','posture','bday','local'].indexOf(x) < 0; }));
    S.m310 = 1;
  }
  if (!S.m312) { /* v3.12: Diet moves to Bonus */
    Object.keys(S.layout).forEach(function(s){ S.layout[s] = S.layout[s].filter(function(x){ return x !== 'diet'; }); });

    S.layout.bonus = (S.layout.bonus || []).concat(['diet']);
    S.m312 = 1;
  }
  if (!S.m313) { /* v3.13: Photo Booth lives in the counters column */
    Object.keys(S.layout).forEach(function(s){ S.layout[s] = S.layout[s].filter(function(x){ return x !== 'photo'; }); });
    S.parked = (S.parked || []).filter(function(r){ return r.id !== 'photo'; });

    Object.keys(S.layout).forEach(function(s){ S.layout[s] = S.layout[s].filter(function(x){ return bonusIds.indexOf(x) < 0; }); });
    S.parked = (S.parked || []).filter(function(r){ return bonusIds.indexOf(r.id) < 0; });
    S.layout.bonus = bonusIds.slice();

}

function sectionOf(id){ var f = null; Object.keys(S.layout).forEach(function(s){ if (S.layout[s].indexOf(id) > -1) f = s; }); return f; }
function park(id){
  var s = sectionOf(id); if (!s) return;
  var idx = S.layout[s].indexOf(id);
  S.layout[s].splice(idx, 1);
  S.parked.push({id: id, from: s, idx: idx});
  save(); render();
}

  var rec = null; S.parked = S.parked.filter(function(p){ if (p.id === id) { rec = p; return false; } return true; });
  if (!rec) return;
  var arr = S.layout[rec.from] || (S.layout[rec.from] = []);

  save(); render();

/* ---- celebrations ---- */
function rowDone(sid){
  var items = (S.layout[sid] || []).filter(function(i){ return !hiddenNow(i); }).map(function(i){ return ITEMS[i]; }).filter(Boolean);
  return items.length > 0 && items.every(isDone);
}
function dayDone(){
  var n = 0, ok = true;
  S.order.forEach(function(id){
    if (id === 'bonus' || id === 'parkedcards' || isShut(id)) return;
    (S.layout[id] || []).forEach(function(i){ var it = ITEMS[i]; if (!it || hiddenNow(i)) return; n++; if (!isDone(it)) ok = false; });
  });

function fxBox(css, fade){
  var box = document.createElement('div');
  box.style.cssText = 'position:fixed;z-index:99990;opacity:0;transition:opacity .35s;overflow:hidden;' + css;
  var c = document.createElement('canvas'); c.style.cssText = 'display:block;width:100%;height:100%';
  box.appendChild(c); document.body.appendChild(box);
  requestAnimationFrame(function(){ box.style.opacity = '1'; });
  var gone = false;
  function bye(){ if (gone) return; gone = true; box.style.opacity = '0'; setTimeout(function(){ box.remove(); }, 400); }
  setTimeout(bye, fade);
  box.addEventListener('pointerdown', bye);
  return {canvas: c, box: box};
}
function celebrateRow(sid, itemId){

  var cell = document.querySelector('[data-cell="' + itemId + '"]'), cr = (cell || secEl).getBoundingClientRect();
  var x = cr.left + cr.width / 2, y = cr.top + cr.height / 2;
  if (Math.random() < 0.5 || !window.PYFireworks) { if (window.celebrate) celebrate({x: x, y: y, scale: 0.9}); return; }
  var r = secEl.getBoundingClientRect(), w = Math.min(window.innerWidth - 16, Math.max(r.width, 300)), h = 190;
  var left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)), top = Math.max(8, Math.min(window.innerHeight - h - 8, r.top + r.height / 2 - h / 2));
  var f = fxBox('left:' + left + 'px;top:' + top + 'px;width:' + w + 'px;height:' + h + 'px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.45)', 2900);

function dayKey(){ if (window.PY && PY.today) return PY.today(); var d = new Date(Date.now() - 2*3600*1000); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); } /* the day ends at 2am Eastern */

  if (!window.PYFireworks) return;

  var api = PYFireworks.attach(f.canvas);
  api.finale(7, {scale: 1.15});

var root = document.getElementById('app');
root.addEventListener('click', function(e){
  var nb = e.target.closest('[data-noc]');
  if (nb) {
    var secEl = nb.closest('section.sec') || document.querySelector('section.sec[data-id="commute"]');
    S.shut = S.shut || {};
    if (nb.getAttribute('data-noc') === 'close') {
      S.shut.commute = dayKey(); save();
      if (secEl) secEl.classList.add('shut');
      /* everything but the train platform moves into Habit Cue Cards for the day */
      setTimeout(function(){
        S.shut.moved = S.layout.commute.filter(function(id){ return id !== 'platform'; });
        S.layout.commute = S.layout.commute.filter(function(id){ return id === 'platform'; });
        S.shut.moved.forEach(function(id){ S.layout.cards.push(id); });
        save(); render();
      }, 330);
    } else { restoreCommute(); delete S.shut.commute; save(); render(); }
    return;
  }
  var pv = e.target.closest('[data-prev]');
  if (pv && pv.getAttribute('data-prev') === 'bday') { bdayPreview = !bdayPreview; editing = false; render(); return; }
  if (pv && pv.getAttribute('data-prev') === 'board') { var fp = BOARD_PARKED.indexOf('feed') < 0; BOARD_PARKED = fp ? PARKED_LIST.concat(READ_DECKS) : ['compass','bucket','social','creativity','env','rec','takeaways','openmode'].filter(function(x){ return x !== 'openmode'; }); render(); return; }
  if (pv) { if (pv.getAttribute('data-prev') === 'day') celebrateDay(); else { var first = document.querySelector('section.sec .cell'); var sid0 = first ? first.closest('section.sec').getAttribute('data-id') : 'morning'; celebrateRow(sid0, first ? first.getAttribute('data-cell') : ''); } return; }
  var rs = e.target.closest('[data-restore]');
  if (rs) { restore(rs.getAttribute('data-restore')); return; }
  var rm = e.target.closest('[data-rm]');
  if (rm) { park(rm.getAttribute('data-rm')); return; }
  var k = e.target.closest('[data-key]');
  if (k && !editing) {
    var it = ITEMS[k.getAttribute('data-key')];
    if (sectionOf(it[0]) === 'parkedcards') return;
    var sid = sectionOf(it[0]), rowBefore = rowDone(sid), dayBefore = dayDone();
    if (window.__lp) { window.__lp = 0; return; }
    var wasDone = isDone(it);
    if (it[5] || it[0] === 'coffee') { S.counts[it[0]] = (S.counts[it[0]] || 0) + 1; if (it[0] === 'coffee') S.done.coffee = 1; }
    else { if (S.done[it[0]]) delete S.done[it[0]]; else S.done[it[0]] = 1; }
    render();

      else if (rowDone(sid) && !rowBefore) celebrateRow(sid, it[0]);

});

/* ---- shared auto-scroll while dragging ---- */

function tick(){

  if (lastY < 90) window.scrollBy(0, -10); else if (lastY > window.innerHeight - 90) window.scrollBy(0, 10);
  scrollRaf = requestAnimationFrame(tick);

  if (v && v !== defTitle[n.getAttribute('data-name')]) S.names[n.getAttribute('data-name')] = v; else delete S.names[n.getAttribute('data-name')];
  save();
});

/* ---- drag sections into order ---- */
var drag = null;
function saveOrderFromDom(){
  S.order = Array.prototype.map.call(document.querySelectorAll('#secs > section.sec'), function(s){ return s.getAttribute('data-id'); });
  if (S.order.indexOf('counters') < 0) S.order.push('counters');
  save();
}
root.addEventListener('pointerdown', function(e){
  var g = e.target.closest('[data-grip]'); if (!g) return;
  e.preventDefault();
  var el = g.closest('section.sec');
  drag = {el: el, id: e.pointerId};
  g.setPointerCapture(e.pointerId); el.classList.add('dragging'); lastY = e.clientY; dragging = true;
  scrollRaf = requestAnimationFrame(tick);
});
root.addEventListener('pointermove', function(e){
  if (!drag || e.pointerId !== drag.id) return;
  lastY = e.clientY;
  var box = document.getElementById('secs'), el = drag.el;
  var sibs = Array.prototype.filter.call(box.children, function(s){ return s !== el; });
  var placed = false;
  for (var i = 0; i < sibs.length; i++) {
    var r = sibs[i].getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2) { if (el.nextElementSibling !== sibs[i]) box.insertBefore(el, sibs[i]); placed = true; break; }
  }
  if (!placed && box.lastElementChild !== el) box.appendChild(el);
});
function endDrag(e){
  if (!drag || (e && e.pointerId !== drag.id)) return;
  drag.el.classList.remove('dragging'); cancelAnimationFrame(scrollRaf); dragging = false; drag = null; saveOrderFromDom();
}
root.addEventListener('pointerup', endDrag);
root.addEventListener('pointercancel', endDrag);
root.addEventListener('keydown', function(e){
  var g = e.target.closest && e.target.closest('[data-grip]'); if (!g) return;
  var el = g.closest('section.sec');
  if (e.key === 'ArrowUp' && el.previousElementSibling) { e.preventDefault(); el.parentNode.insertBefore(el, el.previousElementSibling); saveOrderFromDom(); g.focus(); }
  if (e.key === 'ArrowDown' && el.nextElementSibling) { e.preventDefault(); el.parentNode.insertBefore(el.nextElementSibling, el); saveOrderFromDom(); g.focus(); }
});

/* ---- drag a habit to another section (press and drag) ---- */
var kd = null, ind = document.getElementById('ind');
function clearTarget(){
  ind.style.display = 'none';
  Array.prototype.forEach.call(document.querySelectorAll('section.sec.target'), function(s){ s.classList.remove('target'); });
}
function findTarget(x, y){
  var secs = Array.prototype.slice.call(document.querySelectorAll('#secs > section.sec, #rail > section.sec')), best = null, bd = 1e9;
  var railEl = document.getElementById('rail'), inRail = railEl.firstElementChild && x <= railEl.getBoundingClientRect().right + 3;
  if (inRail) secs = [railEl.firstElementChild]; else secs = secs.filter(function(s){ return s.parentNode.id !== 'rail'; });
  secs.forEach(function(s){
    var r = s.getBoundingClientRect(), d = y < r.top ? r.top - y : (y > r.bottom ? y - r.bottom : 0);
    if (d < bd) { bd = d; best = s; }
  });
  if (!best) return null;
  var sid = best.getAttribute('data-id');
  var cells = Array.prototype.filter.call(best.querySelectorAll('.cell'), function(c){ return c !== kd.cell; });
  if (!cells.length) return {sec: best, sid: sid, idx: 0, empty: true};
  var nearest = null, nd = 1e9;
  cells.forEach(function(c){
    var r = c.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var d = Math.pow(x - cx, 2) + Math.pow((y - cy) * 1.3, 2);
    if (d < nd) { nd = d; nearest = c; }

async function tickRow(id, on, o){

  var r = await sb.from('todos').select('id,task,tracker,done,skipped,actual_minutes').eq('is_habit', true).eq('for_date', day);
  if (r.error) throw r.error;
  var rows = rowsFor(id, r.data || []);
  if (on) {
    var mins = o.mins != null ? o.mins : sp.est;
    var base = {done:true, skipped:false, status:'done', done_at:now, completed_at:now, for_date:day, updated_at:now};
    if (o.count != null) { base.count_on = true; base.value = String(o.count); base.count_label = o.label || 'count'; }
    var open = rows.filter(function(x){ return !x.done || x.skipped; });
    if (!rows.length) {
      var ins = await sb.from('todos').insert(Object.assign({
        section:'Core To-Dos', subsection:'HABIT BANDIT', category:'HABIT BANDIT',
        task:sp.task, tracker:sp.tr, qs_group:sp.grp, is_habit:true, bucket:'today', est_minutes:sp.est, actual_minutes:mins
      }, base));
      if (ins.error) throw ins.error;
    } else {
      var targets = open.length ? open : (o.count != null ? rows.filter(function(x){ return x.done; }) : []);
      for (var i = 0; i < targets.length; i++) {
        var u = Object.assign({actual_minutes:targets[i].actual_minutes || mins}, base);
        var up = await sb.from('todos').update(u).eq('id', targets[i].id);
        if (up.error) throw up.error;
      }
    }
  } else {
    var ticked = rows.filter(function(x){ return x.done; });
    if (!ticked.length) return 'none';
    var off = await sb.from('todos').update({done:false, status:'todo', done_at:null, completed_at:null, started_at:null,
      actual_minutes:null, count_on:false, value:null, count_label:null, updated_at:now}).in('id', ticked.map(function(x){ return x.id; }));
    if (off.error) throw off.error;
    /* the trigger only writes on a tick, so an untick has to clear its own history row */
    await sb.from('qs_log').delete().eq('date', day).eq('tracker', sp.tr).eq('source', 'habit-bandit');

async function commit(id, mode){

  pending++;

    var day = PY.today();
    if (sp.table) {                                   /* Coffee and Water keep one row per cup or glass */

        var row = {day:day}; if (id === 'coffee') row.strength = 'full';
        var ins = await sb.from(sp.table).insert(row); if (ins.error) throw ins.error;
      } else {
        var last = await sb.from(sp.table).select('id').eq('day', day).order('at', {ascending:false}).limit(1);
        if (last.data && last.data[0]) { var del = await sb.from(sp.table).delete().eq('id', last.data[0].id); if (del.error) throw del.error; }
      }
      var n = S.counts[id] || 0;
      if (id === 'coffee') { if (n > 0) await tickRow(id, true, {mins:1, count:n, label:'cups'}); else await tickRow(id, false); }
      else { if (n >= sp.goal) await tickRow(id, true, {mins:1, count:n, label:'glasses'}); else await tickRow(id, false); }
    } else {
      var want = !!S.done[id];

    }

}
