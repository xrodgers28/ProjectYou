<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="py-version" content="v1.0">
<title>Slide: Why Project YOU Exists · Project YOU</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;display=swap">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1f2a44}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;width:1920px;height:1080px;box-sizing:border-box;background:#ffffff;color:#1f2a44;font-family:Roboto,Arial,sans-serif;border-top:14px solid #3f6f8f;display:grid;grid-template-columns:760px 1160px}
.left{padding:120px 40px 70px 110px;display:flex;flex-direction:column;gap:34px}
.kick{font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#3f6f8f}
.head{font-size:96px;font-weight:900;line-height:1.02;letter-spacing:-.02em;margin:0}
.head span{color:#3f6f8f}
.body{font-size:34px;line-height:1.45;color:#3a4660;margin:0}
.foot{margin-top:auto;font-size:18px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#5b6680}
.right{position:relative;background:#f8f4e8}
.right svg{position:absolute;inset:0;width:100%;height:100%}
.ver{position:absolute;right:22px;bottom:14px;font-size:14px;font-weight:500;letter-spacing:.08em;color:#8a8470}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 50s linear infinite;transform-origin:600px 540px}@keyframes sp{to{transform:rotate(360deg)}}}
</style>
</head>
<body>
<!-- Slide: Why Project YOU exists (purpose flywheel), v1.0, Nov 26 2026. A single 16:9 slide for Presentation Mode. Scales to fit any window.
     Add #pages to the address to show the Project YOU page behind each step. -->
<div id="stage">
  <div class="left">
    <div class="kick">Why Project YOU exists</div>
    <h1 class="head">Do more of <span>what you want.</span></h1>
    <p class="body">A productivity tool that keeps you motivated in what you're building, tracks your time and your outputs, and turns them into creativity insights that help you focus.</p>
    <div class="foot">Project YOU · The flywheel</div>
  </div>
  <div class="right"><svg id="wheel" viewBox="0 0 1160 1080" role="img" aria-label="Flywheel: get motivated, build, track time and outputs, see insights, focus, then back to motivated."></svg><div class="ver">v1.0</div></div>
</div>
<script>
(function(){
  var st=document.getElementById('stage');
  function fit(){
    var w=window.innerWidth,h=window.innerHeight,k=Math.min(w/1920,h/1080);
    st.style.transform='translate('+((w-1920*k)/2)+'px,'+((h-1080*k)/2)+'px) scale('+k+')';
  }
  window.addEventListener('resize',fit);fit();

  var STEPS=[
    ['Get motivated','Cue cards and daily wins','HABIT CUE CARDS','#c2476b'],
    ['Build','Make the thing','TODAYS TASKS','#c98a12'],
    ['Track','Time and outputs','CALENDAR + WINS LOG','#2f8f5b'],
    ['See insights','Your best work, revealed','HABIT DASHBOARD','#3b7bbf'],
    ['Focus','More of what works','WEEKLY REVIEW','#7a54b8']];
  var svg=document.getElementById('wheel');
  function draw(){
    var pages=location.hash==='#pages';
    var cx=600,cy=540,R=240,NR=58,n=5,h='';
    h+='<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#45525b"/></marker></defs>';
    h+='<g class="spin"><circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#45525b" stroke-opacity=".25" stroke-width="4" stroke-dasharray="6 16"/></g>';
    for(var i=0;i<n;i++){
      var a0=(-90+i*72+17)*Math.PI/180,a1=(-90+(i+1)*72-17)*Math.PI/180;
      h+='<path d="M'+(cx+R*Math.cos(a0)).toFixed(1)+','+(cy+R*Math.sin(a0)).toFixed(1)+' A'+R+','+R+' 0 0 1 '+(cx+R*Math.cos(a1)).toFixed(1)+','+(cy+R*Math.sin(a1)).toFixed(1)+'" fill="none" stroke="#45525b" stroke-width="5" marker-end="url(#ah)"/>';
    }
    h+='<circle cx="'+cx+'" cy="'+cy+'" r="118" fill="#1f2a44"/>';
    h+='<text x="'+cx+'" y="'+(cy-8)+'" text-anchor="middle" font-family="Roboto,Arial" font-weight="900" font-size="38" fill="#fff">Project</text>';
    h+='<text x="'+cx+'" y="'+(cy+36)+'" text-anchor="middle" font-family="Roboto,Arial" font-weight="900" font-size="38" fill="#fff">YOU</text>';
    STEPS.forEach(function(s,i){
      var a=(-90+i*72)*Math.PI/180,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
      h+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+NR+'" fill="'+s[3]+'"/>';
      h+='<text x="'+x.toFixed(1)+'" y="'+(y+14).toFixed(1)+'" text-anchor="middle" font-family="Roboto,Arial" font-weight="900" font-size="40" fill="#fff">'+(i+1)+'</text>';
      var lines=pages?3:2,lx=x,ly,anc='middle';
      if(i===0){ly=y-NR-22-(pages?78:40)}
      else if(i===2||i===3){ly=y+NR+44}
      else{anc=i===1?'start':'end';lx=x+(i===1?84:-84);ly=y-6-(pages?16:0)}
      h+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anc+'" font-family="Roboto,Arial" font-weight="900" font-size="38" fill="#1f2a44">'+s[0]+'</text>';
      h+='<text x="'+lx.toFixed(1)+'" y="'+(ly+40).toFixed(1)+'" text-anchor="'+anc+'" font-family="Roboto,Arial" font-size="27" fill="#3a4660">'+s[1]+'</text>';
      if(pages)h+='<text x="'+lx.toFixed(1)+'" y="'+(ly+76).toFixed(1)+'" text-anchor="'+anc+'" font-family="Roboto,Arial" font-weight="700" font-size="21" letter-spacing="2" fill="'+s[3]+'">'+s[2]+'</text>';
    });
    svg.innerHTML=h;
  }
  window.addEventListener('hashchange',draw);draw();
})();
</script>
<script src="nav-config.js"></script><script src="navpatch.js"></script></body>
</html>
