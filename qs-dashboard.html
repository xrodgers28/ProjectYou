<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouMatics · ProjectYou</title>
<style>
  :root{
    --ink:#1f2a44; --muted:#5b6472; --line:#e3e7ee; --bg:#eef1f6; --card:#fff;
    --accent:#3f6f8f; --green:#1e8e5a; --gold:#c68a2e; --hot:#c0453b;
    --shadow:0 14px 40px rgba(31,42,68,.10);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--ink);
        -webkit-font-smoothing:antialiased; line-height:1.5}
  a{color:inherit}

  /* ---------- shared ProjectYou nav ---------- */
  .pynav{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #e3e7ee;display:flex;align-items:center;flex-wrap:nowrap;overflow-x:auto;padding:6px 12px;gap:1px}
  .pynav::-webkit-scrollbar{height:0}
  .pn-logo{display:flex;align-items:center;margin-right:5px;flex:none}
  .pn-logo img{height:28px;width:auto;display:block}
  .pn-group{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;padding:2px 7px;margin:2px 0;border-left:1px solid #edf0f4;flex:none}
  .pn-group.first{border-left:none}
  .pn-label{font-size:8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#aab2bd;white-space:nowrap;padding-left:3px}
  a.pn-label{text-decoration:none;cursor:pointer}
  a.pn-label:hover{color:var(--accent)}
  a.pn-label.on{color:var(--accent)}
  .pn-links{display:flex;gap:1px;align-items:stretch}
  .pn-link{font-size:11.5px;font-weight:700;color:#5b6472;text-decoration:none;padding:3px 6px;border-radius:7px;white-space:normal;text-align:center;line-height:1.08;display:inline-flex;align-items:center;flex:none}
  .pn-link:hover{background:#eef2f8;color:#3f6f8f}
  .pn-link.on{background:#3f6f8f;color:#fff}
  .pn-link.pn-solo{min-height:31px}
  .pn-ver{margin-left:auto;font-size:10.5px;font-weight:700;color:#9aa6b4;font-variant-numeric:tabular-nums;padding:0 6px;flex:none}
  .pn-user{display:flex;align-items:center;gap:8px;background:#f4f6f9;border:1px solid #e3e7ee;border-radius:999px;padding:3px 11px 3px 3px;margin-left:6px;flex:none}
  .pn-ava{width:30px;height:30px;border-radius:50%;overflow:hidden;border:2px solid #4cc07a;flex:none;background:#dfe7f0}
  .pn-ava img{width:100%;height:100%;object-fit:cover;display:block}
  .pn-uinfo{display:flex;flex-direction:column;line-height:1.05}
  .pn-uname{font-size:12px;font-weight:800;color:#1f2a44}
  .pn-usub{font-size:8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#2f8f5b}
  .pn-dot{width:9px;height:9px;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 2px #d7f0e0}
  .pn-drop{position:relative;display:inline-flex;align-items:stretch}
  .pn-dropbtn{cursor:pointer;user-select:none}
  .pn-menu{position:fixed;background:#fff;border:1px solid #e3e7ee;border-radius:9px;box-shadow:0 10px 28px rgba(31,42,68,.16);padding:5px;display:none;flex-direction:column;min-width:200px;z-index:60}
  .pn-menu.open{display:flex}
  .pn-menu .pn-link{white-space:nowrap;text-align:left;justify-content:flex-start;padding:6px 9px}

  .stage{max-width:900px; margin:0 auto; padding:26px 18px 90px}

  /* ---------- Header ---------- */
  .pagehead{text-align:center; margin-bottom:22px}
  .pagehead .greet{font-size:11.5px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-weight:800}
  .pagehead h1{font-size:31px; margin:6px 0 2px; letter-spacing:.2px}
  .pagehead h1 .em{color:var(--accent)}
  .inspire{max-width:620px; margin:12px auto 0; font-size:14.5px; color:#46516a; line-height:1.62}
  .inspire .k{font-weight:800; color:var(--accent)}

  /* ---------- View-card grid, SPLIT layout (Option C) ---------- */
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-top:26px}
  .vcard{background:var(--card); border:1px solid var(--line); border-radius:20px; position:relative; overflow:hidden;
        display:flex; flex-direction:row; align-items:stretch; min-height:160px; cursor:pointer; text-decoration:none; color:inherit;
        box-shadow:var(--shadow); transition:transform .18s, box-shadow .18s, filter .4s, opacity .4s}
  .vcard:hover{transform:translateY(-3px); box-shadow:0 20px 48px rgba(31,42,68,.16)}
  .vcard .thumb{width:134px; flex:none; background:var(--hcb); position:relative}
  .vcard .thumb svg{display:block; width:100%; height:100%}
  .vcard .body{padding:16px 18px; flex:1; display:flex; flex-direction:column}
  .vcard .kick{font-size:10.5px; font-weight:800; letter-spacing:1.1px; text-transform:uppercase; color:var(--hc)}
  .vcard .nm{font-size:17px; font-weight:800; color:var(--ink); margin-top:2px}
  .vcard .tg{font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.45}
  .vcard .stat{align-self:flex-start; margin-top:auto; background:var(--hcb); color:var(--hc); font-size:12.5px;
        font-weight:800; border-radius:999px; padding:6px 13px}
  .vcard .cta{font-size:12px; font-weight:800; color:var(--hc); letter-spacing:.3px; margin-top:10px}

  .addcard{border:2px dashed #cdd5e2; background:transparent; border-radius:20px; min-height:160px;
        display:flex; flex-direction:column; align-items:center; justify-content:center; color:#9aa6b4; gap:8px; cursor:default}
  .addcard .plus{font-size:32px; font-weight:300; line-height:1}
  .addcard .t{font-size:12.5px; font-weight:700; text-align:center; padding:0 16px; line-height:1.4}

  /* ---------- Edit order (v3.1, Sep 6 2026) ---------- */
  .editbar{display:flex; align-items:center; justify-content:center; gap:14px; margin-top:18px; flex-wrap:wrap}
  .editbtn{font:inherit; font-size:12.5px; font-weight:800; letter-spacing:.3px; color:var(--accent); background:#fff;
        border:1.5px solid var(--accent); border-radius:999px; padding:7px 16px; cursor:pointer}
  .editbtn:hover{background:#eef2f8}
  .editbtn.done{background:var(--accent); color:#fff}
  .resetlink{font-size:12px; font-weight:700; color:#9aa6b4; background:none; border:none; cursor:pointer; font-family:inherit; text-decoration:underline; padding:4px}
  .resetlink:hover{color:var(--hot)}
  .editnote{width:100%; text-align:center; font-size:12.5px; color:var(--muted); min-height:18px}
  .editnote.bad{color:var(--hot); font-weight:700}
  .editnote.good{color:var(--green); font-weight:700}
  body.editing .vcard{cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; border:1.5px dashed var(--accent)}
  body.editing .vcard:hover{transform:none}
  body.editing .vcard .cta{visibility:hidden}
  .vcard .grip{display:none; position:absolute; top:10px; right:12px; color:#9aa6b4; font-size:18px; letter-spacing:1px; line-height:1}
  body.editing .vcard .grip{display:block}
  .vcard .arrows{display:none; position:absolute; right:10px; bottom:10px; gap:4px}
  body.editing .vcard .arrows{display:flex}
  .arrows button{width:34px; height:30px; border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--accent);
        font-size:15px; font-weight:800; cursor:pointer; touch-action:manipulation}
  .arrows button:hover{background:#eef2f8}
  .arrows button:disabled{opacity:.3; cursor:default}
  .vcard.lifted{opacity:.35}
  .ghost{position:fixed; z-index:500; pointer-events:none; opacity:.92; transform:rotate(1.5deg); box-shadow:0 24px 60px rgba(31,42,68,.28)}
  body.editing .addcard{opacity:.45}

  @media(max-width:640px){ .grid{grid-template-columns:1fr} .pagehead h1{font-size:26px} }
</style>

<script>
/* ---------- live mini-visual thumbnails ---------- */
function tWheel(){
  const segs=[['#B5651D',55],['#3f6f8f',46],['#4E6E2E',50],['#c68a2e',37.5]]; let off=0, ring='';
  segs.forEach(([c,len])=>{ ring+=`<circle r="30" fill="none" stroke="${c}" stroke-width="15" stroke-dasharray="${len} ${188.5-len}" stroke-dashoffset="${-off}" transform="rotate(-90)"/>`; off+=len; });
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#f6ede2"/><g transform="translate(50,50)">${ring}<circle r="14" fill="#fff"/><circle r="14" fill="none" stroke="#e3d6c4" stroke-width="1"/><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#B5651D" font-family="Arial">41</text></g></svg>`;
}
function tHabits(){
  const cols=8, rows=5, cell=8, gap=3, w=cols*cell+(cols-1)*gap, h=rows*cell+(rows-1)*gap, x0=(100-w)/2, y0=(100-h)/2; let cells='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ const i=r*cols+c; const filled=((i*7+3)%10)>2; const op=(0.4+((i*5)%5)*0.12).toFixed(2);
    const x=x0+c*(cell+gap), y=y0+r*(cell+gap);
    cells+= filled ? `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="2" fill="#4E6E2E" opacity="${op}"/>`
      : `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="2" fill="none" stroke="#cfd8c6" stroke-width="1"/>`; }
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#eef3e6"/>${cells}</svg>`;
}
function tCompass(){
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#faf3e4"/><g transform="translate(50,50)">
    <circle r="33" fill="#fff" stroke="#c68a2e" stroke-width="3"/><circle r="27" fill="none" stroke="#e7d3ab" stroke-width="1"/>
    <g stroke="#c68a2e" stroke-width="2"><path d="M0,-33 V-27"/><path d="M0,33 V27"/><path d="M-33,0 H-27"/><path d="M33,0 H27"/></g>
    <g transform="rotate(38)"><polygon points="0,-26 5.5,0 0,4" fill="#C0392B"/><polygon points="0,26 -5.5,0 0,-4" fill="#9aa6b4"/></g>
    <circle r="3.2" fill="#c68a2e"/></g></svg>`;
}
/* ===== Cue Cards streak, live, Aug 26 2026 =====
   The number and the squares are read from the database every time this page
   loads. Nothing here is typed in: if the read fails the card says so rather
   than showing a figure that might be wrong.
   The day runs 2am to 2am Eastern, the same definition the rest of the site uses. */
const CUE_SB='https://arnjntspmrhigodlssbn.supabase.co';
const CUE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFybmpudHNwbXJoaWdvZGxzc2JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMTQ0NTgsImV4cCI6MjEwMTg5MDQ1OH0.UN4JMuoKaAWQfhiCstuoOJQ1sVU2hU5pK0tLBY60dfM';
let CUE_DAYS={}, CUE_STREAK=null, CUE_STATE='loading';
function cueToday(){
  const d=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}));
  d.setHours(d.getHours()-2);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function cueKeys(){
  const p=cueToday().split('-');
  const end=Date.UTC(+p[0],+p[1]-1,+p[2]);
  const out=[];
  for(let i=27;i>=0;i--){ out.push(new Date(end-i*864e5).toISOString().slice(0,10)); }
  return out;
}
function tCue(){
  const cols=14, rows=2, cell=5.4, gap=2.2;
  const w=cols*cell+(cols-1)*gap, h=rows*cell+(rows-1)*gap, x0=(100-w)/2, y0=(100-h)/2;
  const keys=cueKeys(); let cells='';
  for(let i=0;i<cols*rows;i++){
    const r=Math.floor(i/cols), c=i%cols, x=x0+c*(cell+gap), y=y0+r*(cell+gap);
    const on=CUE_DAYS[keys[i]];
    const last=(i===cols*rows-1);
    cells+=`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="1.5" fill="${on?'#2f8f7a':'#d9e5e1'}"${last&&!on?' stroke="#2f8f7a" stroke-width="1"':''}/>`;
  }
  return `<svg viewBox="0 0 100 100">${cells}</svg>`;
}
async function loadCue(){
  try{
    const H={apikey:CUE_KEY,Authorization:'Bearer '+CUE_KEY};
    const since=cueKeys()[0];
    const [a,b]=await Promise.all([
      fetch(CUE_SB+'/rest/v1/v_cue_streak?select=streak',{headers:H}).then(r=>r.json()),
      fetch(CUE_SB+'/rest/v1/v_cue_card_day?select=day,cards&day=gte.'+since,{headers:H}).then(r=>r.json())
    ]);
    CUE_STREAK=(a&&a[0]&&typeof a[0].streak==='number')?a[0].streak:0;
    CUE_DAYS={}; (b||[]).forEach(r=>{CUE_DAYS[r.day]=r.cards;});
    CUE_STATE='ok';
  }catch(e){ CUE_STATE='err'; }
  const v=VIEWS.find(x=>x.id==='cuecards');
  if(v){
    v.thumb=tCue();
    v.stat = CUE_STATE==='ok'
      ? (CUE_STREAK===1?'1-day streak':CUE_STREAK+'-day streak')
      : 'Could not read the streak';
    const el=document.querySelector('.vcard[data-id="cuecards"]');
    if(el){ el.querySelector('.thumb').innerHTML=v.thumb; el.querySelector('.stat').textContent=v.stat; }
  }
}

function tWeeks(){
  const cols=16, rows=10, cell=4.2, gap=1.4, w=cols*cell+(cols-1)*gap, h=rows*cell+(rows-1)*gap, x0=(100-w)/2, y0=(100-h)/2, cur=Math.floor(cols*rows*0.54); let cells='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ const i=r*cols+c; const x=x0+c*(cell+gap), y=y0+r*(cell+gap);
    if(i===cur) cells+=`<rect x="${x-0.6}" y="${y-0.6}" width="${cell+1.2}" height="${cell+1.2}" rx="1" fill="#C0392B"/>`;
    else if(i<cur) cells+=`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="1" fill="#C0392B" opacity="0.22"/>`;
    else cells+=`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="1" fill="none" stroke="#e2c9c5" stroke-width="0.8"/>`; }
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#f8ebe9"/>${cells}</svg>`;
}

function tMap(){
  const pts=[[24,34],[30,40],[22,52],[34,62],[47,30],[50,36],[52,44],[54,28],[62,33],[70,38],[78,44],[80,58],[86,62],[44,58],[58,56],[68,26]];
  let dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.1" fill="#2E6E8E" opacity="0.9"/>`).join('');
  let ghost=[[16,28],[38,24],[66,50],[74,66],[90,40],[28,66],[56,68]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="none" stroke="#9fb9c9" stroke-width="1"/>`).join('');
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#e9f0f5"/>${ghost}${dots}</svg>`;
}
function tCoffee(){
  /* a mini year-grid in coffee brown behind a cup, echoing coffee-days.html */
  const cols=14, rows=9, cell=4.4, gap=1.5, w=cols*cell+(cols-1)*gap, h=rows*cell+(rows-1)*gap, x0=(100-w)/2, y0=12; let cells='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ const i=r*cols+c; const on=((i*11+5)%10)>6;
    const x=x0+c*(cell+gap), y=y0+r*(cell+gap);
    cells+= on ? `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="1.2" fill="#7B4B2A" opacity="0.85"/>`
      : `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="1.2" fill="#e6d5c6"/>`; }
  const cup = `<g transform="translate(50,78)">
    <path d="M-15,-9 h26 a3,3 0 0 1 3,3 v6 a13,13 0 0 1 -13,13 h-6 a13,13 0 0 1 -13,-13 v-6 a3,3 0 0 1 3,-3 z" fill="#5A3419"/>
    <path d="M14,-6 a7,7 0 0 1 0,13" fill="none" stroke="#5A3419" stroke-width="3"/>
    <rect x="-21" y="13" width="42" height="3.4" rx="1.7" fill="#5A3419"/>
    <g stroke="#a9835f" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".9">
      <path d="M-7,-14 c3,-4 -3,-7 0,-11"/><path d="M1,-14 c3,-4 -3,-7 0,-11"/><path d="M9,-14 c3,-4 -3,-7 0,-11"/></g></g>`;
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#f6efe8"/>${cells}${cup}</svg>`;
}
function tDecade(){
  /* ten years of steps, sleep and HRV climbing across the tile, in the same
     colours decade.html uses. Decorative, not the real numbers. */
  var X=function(i){return 10+i*8.9;};
  var line=function(vals,col,w){
    var pts=vals.map(function(v,i){return X(i)+','+v;}).join(' ');
    return '<polyline fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linejoin="round" stroke-linecap="round" points="'+pts+'"/>';
  };
  var grid=[0,3,6,9].map(function(i){
    return '<line x1="'+X(i)+'" y1="16" x2="'+X(i)+'" y2="86" stroke="#d5d8ea" stroke-width="1"/>';
  }).join('');
  var steps=[70,64,66,57,61,52,55,47,44,38];
  var sleep=[80,79,81,77,78,74,76,72,71,68];
  var hrv=[52,50,53,45,48,42,44,37,35,30];
  var dots=steps.map(function(v,i){
    return '<circle cx="'+X(i)+'" cy="'+v+'" r="1.9" fill="#c07a3b"/>';
  }).join('');
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">'
    + '<rect width="100" height="100" fill="#eef0f7"/>' + grid
    + '<line x1="6" y1="88" x2="94" y2="88" stroke="#c3c8de" stroke-width="1.2"/>'
    + line(sleep,'#3f6f8f',2.4) + line(hrv,'#2f8f5b',2.4) + line(steps,'#c07a3b',3)
    + dots + '</svg>';
}
function tBody(){
  /* four readings against their own baselines: a tall bar per metric in the
     tone that metric wears everywhere else, with the 30-day average as a
     faint tick across each one. Decorative, not the real numbers. */
  var bars=[['#3f6f8f',62,44],['#2f8f5b',40,52],['#c07a3b',52,60],['#b8860b',70,50]];
  var w=13, gap=9, x0=(100-(bars.length*w+(bars.length-1)*gap))/2, base=82;
  var out='';
  bars.forEach(function(b,i){
    var x=x0+i*(w+gap), h=b[1], y=base-h;
    out+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3.5" fill="'+b[0]+'"/>';
    out+='<line x1="'+(x-2.5)+'" y1="'+(base-b[2])+'" x2="'+(x+w+2.5)+'" y2="'+(base-b[2])+'" stroke="#8e9bab" stroke-width="1.4" stroke-linecap="round" opacity=".75"/>';
  });
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">'
    + '<rect width="100" height="100" fill="#eaf0f4"/>' + out
    + '<line x1="8" y1="'+base+'" x2="92" y2="'+base+'" stroke="#c3ccd6" stroke-width="1.4"/></svg>';
}
function tWL(){
  /* dots above and below a zero line, echoing winners-losers.html. Decorative, not the real numbers. */
  var cols=[['#c6a63f',5,1],['#c05f7a',4,2],['#c6a63f',6,0],['#5b8fce',3,3],['#c6a63f',5,1],['#7d81c2',4,0],['#cf9088',6,2]];
  var out='',x0=15,step=11.5,zero=56;
  cols.forEach(function(c,i){var x=x0+i*step;for(var j=0;j<c[1];j++)out+='<circle cx="'+x+'" cy="'+(zero-6-j*8)+'" r="3.3" fill="'+c[0]+'"/>';
    for(var k=0;k<c[2];k++)out+='<circle cx="'+x+'" cy="'+(zero+6+k*8)+'" r="3.3" fill="'+(k===0?'#f2cf5b':'#c0453b')+'"/>';});
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#f2efe6"/>'+out+'<line x1="8" y1="'+zero+'" x2="92" y2="'+zero+'" stroke="#1f2a44" stroke-width="1.4"/></svg>';
}
function tStack(){

  return '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#f4eef1"/>'+out+'</svg>';
}

const INSPIRE = `The moment you measure something, it starts to change, that's the <span class="k">Hawthorne effect</span>, and it's the whole engine here. Every tracker is a nudge; every logged day is a small n=1 experiment. One master log feeds every view below, so your scattered tracking becomes one coherent picture. <span class="k">Measure it, and it changes. Your data becomes your coach.</span>`;

/* ===== Edit order, v3.1, Sep 6 2026 =====
   "Edit order" lets Scott drag the cards into any order, or nudge them with the
   arrows. The order is saved in the database (page_prefs) so every device shows
   the same one. Cards this page does not know about are ignored; cards added
   later land at the end. "Reset to original order" removes the saved order. */
const DEFAULT_ORDER = VIEWS.map(v=>v.id);
let ORDER = null;          /* null = the original order above */
let EDITING = false;

function orderedViews(){
  if(!ORDER) return VIEWS.slice();
  const known = ORDER.filter(id=>VIEWS.some(v=>v.id===id));
  const rest = VIEWS.map(v=>v.id).filter(id=>!known.includes(id));
  return known.concat(rest).map(id=>VIEWS.find(v=>v.id===id));
}
async function loadOrder(){
  try{
    const H={apikey:CUE_KEY,Authorization:'Bearer '+CUE_KEY};
    const r=await fetch(CUE_SB+'/rest/v1/page_prefs?select=value&page=eq.qs-dashboard&key=eq.card_order',{headers:H});
    const rows=await r.json();
    const ids=rows&&rows[0]&&rows[0].value&&rows[0].value.ids;
    if(Array.isArray(ids)&&ids.length){ ORDER=ids; if(!EDITING) render(); }
  }catch(e){ /* no saved order, or offline: the original order stands */ }
}
async function saveOrder(ids){
  const H={apikey:CUE_KEY,Authorization:'Bearer '+CUE_KEY,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'};
  const r=await fetch(CUE_SB+'/rest/v1/page_prefs',{method:'POST',headers:H,
    body:JSON.stringify({page:'qs-dashboard',key:'card_order',value:{ids:ids},updated_at:new Date().toISOString()})});
  if(!r.ok) throw new Error('save failed '+r.status);
}
async function clearOrder(){
  const H={apikey:CUE_KEY,Authorization:'Bearer '+CUE_KEY};
  const r=await fetch(CUE_SB+'/rest/v1/page_prefs?page=eq.qs-dashboard&key=eq.card_order',{method:'DELETE',headers:H});
  if(!r.ok) throw new Error('reset failed '+r.status);
}
function note(msg,cls){ const n=document.getElementById('editnote'); if(!n) return; n.textContent=msg||''; n.className='editnote'+(cls?' '+cls:''); }
function domOrder(){ return Array.from(document.querySelectorAll('.grid .vcard')).map(el=>el.dataset.id); }
function refreshArrows(){
  const cards=Array.from(document.querySelectorAll('.grid .vcard'));
  cards.forEach((el,i)=>{ el.querySelector('.up').disabled=(i===0); el.querySelector('.down').disabled=(i===cards.length-1); });
}
async function toggleEdit(){
  const btn=document.getElementById('editbtn');
  if(!EDITING){
    EDITING=true; document.body.classList.add('editing');
    btn.textContent='Done'; btn.classList.add('done');
    document.getElementById('resetlink').style.display='inline';
    note('Drag a card where you want it, or use the arrows. Tap Done to save.');
    refreshArrows();
    return;
  }
  const ids=domOrder();
  btn.textContent='Saving…';
  try{
    await saveOrder(ids);
    ORDER=ids;
    EDITING=false; document.body.classList.remove('editing');
    btn.textContent='Edit order'; btn.classList.remove('done');
    document.getElementById('resetlink').style.display='none';
    note('Order saved. Every device will show it this way.','good');
    setTimeout(()=>{ if(!EDITING) note(''); },4000);
  }catch(e){
    btn.textContent='Done';
    note('Could not save the order (no connection to the database). Your new order is still on screen; tap Done to try again.','bad');
  }
}
async function resetOrder(){
  const btn=document.getElementById('editbtn');
  try{
    await clearOrder();
    ORDER=null; EDITING=false; document.body.classList.remove('editing');
    render();
    note('Back to the original order.','good');
    setTimeout(()=>{ if(!EDITING) note(''); },4000);
  }catch(e){ note('Could not reset (no connection to the database). Try again in a moment.','bad'); }
}
function nudge(el,dir){
  const grid=el.parentNode;
  if(dir<0 && el.previousElementSibling && el.previousElementSibling.classList.contains('vcard')) grid.insertBefore(el,el.previousElementSibling);
  if(dir>0 && el.nextElementSibling && el.nextElementSibling.classList.contains('vcard')) grid.insertBefore(el.nextElementSibling,el);
  refreshArrows();
}
/* finger and mouse drag, one code path (pointer events) */
let DRAG=null;
function onPointerDown(e){
  if(!EDITING) return;
  if(e.target.closest('.arrows')) return;
  const el=e.target.closest('.vcard'); if(!el) return;
  e.preventDefault();
  DRAG={el:el, x0:e.clientX, y0:e.clientY, ghost:null, moved:false, pid:e.pointerId};
  document.addEventListener('pointermove',onPointerMove);
  document.addEventListener('pointerup',onPointerUp);
  document.addEventListener('pointercancel',onPointerUp);
}
function onPointerMove(e){
  if(!DRAG || e.pointerId!==DRAG.pid) return;
  const dx=e.clientX-DRAG.x0, dy=e.clientY-DRAG.y0;
  if(!DRAG.moved){ if(Math.abs(dx)<6&&Math.abs(dy)<6) return; DRAG.moved=true;
    const r=DRAG.el.getBoundingClientRect();
    const g=DRAG.el.cloneNode(true); g.classList.add('ghost'); g.classList.remove('lifted');
    g.style.width=r.width+'px'; g.style.height=r.height+'px'; g.style.left=r.left+'px'; g.style.top=r.top+'px';
    document.body.appendChild(g); DRAG.ghost=g; DRAG.gx=r.left; DRAG.gy=r.top;
    DRAG.el.classList.add('lifted'); }
  DRAG.ghost.style.left=(DRAG.gx+dx)+'px'; DRAG.ghost.style.top=(DRAG.gy+dy)+'px';
  /* which card is the pointer over? swap places with it */
  const cards=Array.from(document.querySelectorAll('.grid .vcard'));
  const over=cards.find(c=>{ if(c===DRAG.el) return false; const b=c.getBoundingClientRect();
    return e.clientX>=b.left&&e.clientX<=b.right&&e.clientY>=b.top&&e.clientY<=b.bottom; });
  if(over){
    const grid=over.parentNode;
    const from=cards.indexOf(DRAG.el), to=cards.indexOf(over);
    if(from<to) grid.insertBefore(DRAG.el,over.nextSibling); else grid.insertBefore(DRAG.el,over);
    refreshArrows();
  }
  /* keep the page scrolling when the finger nears the top or bottom */
  const m=60, vh=window.innerHeight;
  if(e.clientY<m) window.scrollBy(0,-12); else if(e.clientY>vh-m) window.scrollBy(0,12);
}
function onPointerUp(e){
  if(!DRAG || e.pointerId!==DRAG.pid) return;
  if(DRAG.ghost) DRAG.ghost.remove();
  DRAG.el.classList.remove('lifted');
  DRAG=null;
  document.removeEventListener('pointermove',onPointerMove);
  document.removeEventListener('pointerup',onPointerUp);
  document.removeEventListener('pointercancel',onPointerUp);
}
function onCardClick(e){
  if(!EDITING) return;
  e.preventDefault();
  const a=e.target.closest('.arrows button'); const el=e.target.closest('.vcard');
  if(a&&el) nudge(el, a.classList.contains('up')?-1:1);
}

function render(){
  const cards = orderedViews().map(v=>{
    return `<a class="vcard" href="${v.opens}" data-id="${v.id}" style="--hc:${v.color}; --hcb:${v.bg}">
      <div class="thumb">${v.thumb}</div>
      <div class="body">
        <div class="kick">${v.kick}</div>
        <div class="nm">${v.name}</div>
        <div class="tg">${v.tag}</div>
        <span class="stat">${v.stat}</span>
        <span class="cta">open →</span>
      </div>
      <span class="grip" aria-hidden="true">⋮⋮</span>
      <span class="arrows"><button type="button" class="up" aria-label="Move up">↑</button><button type="button" class="down" aria-label="Move down">↓</button></span></a>`;
  }).join('');
  const add = `<div class="addcard"><span class="plus">+</span><span class="t">More views land here, Monthly Grid, Annual Dot-Grids, Living Ecosystem map</span></div>`;
  document.getElementById('stage').innerHTML = `
    <div class="pagehead">
      <div class="greet">Quantified Self</div>
      <h1><span class="em">Measure It</span>, and It Changes</h1>
      <p class="inspire">${INSPIRE}</p>
      <div class="editbar">
        <button type="button" class="editbtn${EDITING?' done':''}" id="editbtn">${EDITING?'Done':'Edit order'}</button>
        <button type="button" class="resetlink" id="resetlink" style="display:${EDITING?'inline':'none'}">Reset to original order</button>
        <div class="editnote" id="editnote"></div>
      </div>
    </div>
    <div class="grid">${cards}${add}</div>`;
  document.getElementById('editbtn').addEventListener('click',toggleEdit);
  document.getElementById('resetlink').addEventListener('click',resetOrder);
  const grid=document.querySelector('.grid');
  grid.addEventListener('pointerdown',onPointerDown);
  grid.addEventListener('click',onCardClick);
  if(EDITING) refreshArrows();
}
render();
loadOrder();
loadCue();
</script>
