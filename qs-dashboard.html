<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouMatics · ProjectYou</title>
<style>
  :root{
    --ink:#1f2a44; --muted:#5b6472; --line:#e3e7ee; --bg:#eef1f6; --card:#fff;
    --accent:#3f6f8f; --green:#1e8e5a; --gold:#c68a2e; --hot:#c0453b;
    --shadow:0 14px 40px rgba(31,42,68,.10);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--ink);
        -webkit-font-smoothing:antialiased; line-height:1.5}
  a{color:inherit}

  /* ---------- shared ProjectYou nav ---------- */
  .pynav{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #e3e7ee;display:flex;align-items:center;flex-wrap:nowrap;overflow-x:auto;padding:6px 12px;gap:1px}
  .pynav::-webkit-scrollbar{height:0}
  .pn-logo{display:flex;align-items:center;margin-right:5px;flex:none}
  .pn-logo img{height:28px;width:auto;display:block}
  .pn-group{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;padding:2px 7px;margin:2px 0;border-left:1px solid #edf0f4;flex:none}
  .pn-group.first{border-left:none}
  .pn-label{font-size:8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#aab2bd;white-space:nowrap;padding-left:3px}
  a.pn-label{text-decoration:none;cursor:pointer}
  a.pn-label:hover{color:var(--accent)}
  a.pn-label.on{color:var(--accent)}
  .pn-links{display:flex;gap:1px;align-items:stretch}
  .pn-link{font-size:11.5px;font-weight:700;color:#5b6472;text-decoration:none;padding:3px 6px;border-radius:7px;white-space:normal;text-align:center;line-height:1.08;display:inline-flex;align-items:center;flex:none}
  .pn-link:hover{background:#eef2f8;color:#3f6f8f}
  .pn-link.on{background:#3f6f8f;color:#fff}
  .pn-link.pn-solo{min-height:31px}
  .pn-ver{margin-left:auto;font-size:10.5px;font-weight:700;color:#9aa6b4;font-variant-numeric:tabular-nums;padding:0 6px;flex:none}
  .pn-user{display:flex;align-items:center;gap:8px;background:#f4f6f9;border:1px solid #e3e7ee;border-radius:999px;padding:3px 11px 3px 3px;margin-left:6px;flex:none}
  .pn-ava{width:30px;height:30px;border-radius:50%;overflow:hidden;border:2px solid #4cc07a;flex:none;background:#dfe7f0}
  .pn-ava img{width:100%;height:100%;object-fit:cover;display:block}
  .pn-uinfo{display:flex;flex-direction:column;line-height:1.05}
  .pn-uname{font-size:12px;font-weight:800;color:#1f2a44}
  .pn-usub{font-size:8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#2f8f5b}
  .pn-dot{width:9px;height:9px;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 2px #d7f0e0}
  .pn-drop{position:relative;display:inline-flex;align-items:stretch}
  .pn-dropbtn{cursor:pointer;user-select:none}
  .pn-menu{position:fixed;background:#fff;border:1px solid #e3e7ee;border-radius:9px;box-shadow:0 10px 28px rgba(31,42,68,.16);padding:5px;display:none;flex-direction:column;min-width:200px;z-index:60}
  .pn-menu.open{display:flex}
  .pn-menu .pn-link{white-space:nowrap;text-align:left;justify-content:flex-start;padding:6px 9px}

  .stage{max-width:900px; margin:0 auto; padding:26px 18px 90px}

  /* ---------- Header ---------- */
  .pagehead{text-align:center; margin-bottom:22px}
  .pagehead .greet{font-size:11.5px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); font-weight:800}
  .pagehead h1{font-size:31px; margin:6px 0 2px; letter-spacing:.2px}
  .pagehead h1 .em{color:var(--accent)}
  .inspire{max-width:620px; margin:12px auto 0; font-size:14.5px; color:#46516a; line-height:1.62}
  .inspire .k{font-weight:800; color:var(--accent)}

  /* ---------- View-card grid, SPLIT layout (Option C) ---------- */
  .grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-top:26px}
  .vcard{background:var(--card); border:1px solid var(--line); border-radius:20px; position:relative; overflow:hidden;
        display:flex; flex-direction:row; align-items:stretch; min-height:160px; cursor:pointer; text-decoration:none; color:inherit;
        box-shadow:var(--shadow); transition:transform .18s, box-shadow .18s, filter .4s, opacity .4s}
  .vcard:hover{transform:translateY(-3px); box-shadow:0 20px 48px rgba(31,42,68,.16)}
  .vcard .thumb{width:134px; flex:none; background:var(--hcb); position:relative}
  .vcard .thumb svg{display:block; width:100%; height:100%}
  .vcard .body{padding:16px 18px; flex:1; display:flex; flex-direction:column}
  .vcard .kick{font-size:10.5px; font-weight:800; letter-spacing:1.1px; text-transform:uppercase; color:var(--hc)}
  .vcard .nm{font-size:17px; font-weight:800; color:var(--ink); margin-top:2px}
  .vcard .tg{font-size:12.5px; color:var(--muted); margin-top:6px; line-height:1.45}
  .vcard .stat{align-self:flex-start; margin-top:auto; background:var(--hcb); color:var(--hc); font-size:12.5px;
        font-weight:800; border-radius:999px; padding:6px 13px}
  .vcard .cta{font-size:12px; font-weight:800; color:var(--hc); letter-spacing:.3px; margin-top:10px}

  .addcard{border:2px dashed #cdd5e2; background:transparent; border-radius:20px; min-height:160px;
        display:flex; flex-direction:column; align-items:center; justify-content:center; color:#9aa6b4; gap:8px; cursor:default}
  .addcard .plus{font-size:32px; font-weight:300; line-height:1}
  .addcard .t{font-size:12.5px; font-weight:700; text-align:center; padding:0 16px; line-height:1.4}

  @media(max-width:640px){ .grid{grid-template-columns:1fr} .pagehead h1{font-size:26px} }
</style>
</head>
<body>

  <div class="pynav">
    <a href="mission.html" class="pn-logo"><img src="project-you-logo.png" alt="Project YOU"></a>
    <span class="pn-group first"><span class="pn-label">To Do List</span><span class="pn-links"><a href="index.html" class="pn-link">Todays<br>Tasks</a><a href="all-todos.html" class="pn-link">All<br>ToDos</a><a href="staging-area.html" class="pn-link">Staging<br>Area</a></span></span>
    <span class="pn-group"><span class="pn-label">Habit Modules</span><span class="pn-links"><a href="habit-modules.html" class="pn-link">Cue Cards</a></span></span>
    <span class="pn-group"><span class="pn-label">Quantified Self</span><span class="pn-links"><a href="qs-dashboard.html" class="pn-link">QS Dashboard</a></span></span>
    <span class="pn-group"><span class="pn-label">Operating System</span><span class="pn-links"><a href="build.html" class="pn-link">Components</a><a href="automated-tracking.html" class="pn-link">Automated<br>Tracking</a><span class="pn-drop"><span class="pn-link pn-dropbtn" tabindex="0">Maps &#9662;</span><span class="pn-menu"><a href="maps.html" class="pn-link">Overview</a><a href="dfd.html" class="pn-link">Data Flow Diagram</a><a href="blueprint.html" class="pn-link">Knowledge Graph</a><a href="knowledge-graph.html" class="pn-link">Interactive Knowledge Graph</a><a href="architecture-map.html" class="pn-link">Architecture Map</a></span></span><a href="mission.html" class="pn-link">Mission<br>Control</a><a href="library.html" class="pn-link">Docs<br>Library</a></span></span>
    <span class="pn-ver">v2.9</span>
    <div class="pn-user"><div class="pn-ava"><img src="scott-avatar.jpg" alt="Scott"></div><div class="pn-uinfo"><div class="pn-uname">Scott</div><div class="pn-usub">Signed in</div></div><span class="pn-dot"></span></div>
  </div>

  <div class="stage" id="stage"></div>

<script>
/* ---------- live mini-visual thumbnails ---------- */
function tWheel(){
  const segs=[['#B5651D',55],['#3f6f8f',46],['#4E6E2E',50],['#c68a2e',37.5]]; let off=0, ring='';
  segs.forEach(([c,len])=>{ ring+=`<circle r="30" fill="none" stroke="${c}" stroke-width="15" stroke-dasharray="${len} ${188.5-len}" stroke-dashoffset="${-off}" transform="rotate(-90)"/>`; off+=len; });
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#f6ede2"/><g transform="translate(50,50)">${ring}<circle r="14" fill="#fff"/><circle r="14" fill="none" stroke="#e3d6c4" stroke-width="1"/><text x="0" y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#B5651D" font-family="Arial">41</text></g></svg>`;
}
function tHabits(){
  const cols=8, rows=5, cell=8, gap=3, w=cols*cell+(cols-1)*gap, h=rows*cell+(rows-1)*gap, x0=(100-w)/2, y0=(100-h)/2; let cells='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ const i=r*cols+c; const filled=((i*7+3)%10)>2; const op=(0.4+((i*5)%5)*0.12).toFixed(2);
    const x=x0+c*(cell+gap), y=y0+r*(cell+gap);
    cells+= filled ? `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="2" fill="#4E6E2E" opacity="${op}"/>`
      : `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="2" fill="none" stroke="#cfd8c6" stroke-width="1"/>`; }
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#eef3e6"/>${cells}</svg>`;
}
function tCompass(){
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#faf3e4"/><g transform="translate(50,50)">
    <circle r="33" fill="#fff" stroke="#c68a2e" stroke-width="3"/><circle r="27" fill="none" stroke="#e7d3ab" stroke-width="1"/>
    <g stroke="#c68a2e" stroke-width="2"><path d="M0,-33 V-27"/><path d="M0,33 V27"/><path d="M-33,0 H-27"/><path d="M33,0 H27"/></g>
    <g transform="rotate(38)"><polygon points="0,-26 5.5,0 0,4" fill="#C0392B"/><polygon points="0,26 -5.5,0 0,-4" fill="#9aa6b4"/></g>
    <circle r="3.2" fill="#c68a2e"/></g></svg>`;
}
function tWeeks(){
  const cols=16, rows=10, cell=4.2, gap=1.4, w=cols*cell+(cols-1)*gap, h=rows*cell+(rows-1)*gap, x0=(100-w)/2, y0=(100-h)/2, cur=Math.floor(cols*rows*0.54); let cells='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ const i=r*cols+c; const x=x0+c*(cell+gap), y=y0+r*(cell+gap);
    if(i===cur) cells+=`<rect x="${x-0.6}" y="${y-0.6}" width="${cell+1.2}" height="${cell+1.2}" rx="1" fill="#C0392B"/>`;
    else if(i<cur) cells+=`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="1" fill="#C0392B" opacity="0.22"/>`;
    else cells+=`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="1" fill="none" stroke="#e2c9c5" stroke-width="0.8"/>`; }
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#f8ebe9"/>${cells}</svg>`;
}

function tMap(){
  const pts=[[24,34],[30,40],[22,52],[34,62],[47,30],[50,36],[52,44],[54,28],[62,33],[70,38],[78,44],[80,58],[86,62],[44,58],[58,56],[68,26]];
  let dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.1" fill="#2E6E8E" opacity="0.9"/>`).join('');
  let ghost=[[16,28],[38,24],[66,50],[74,66],[90,40],[28,66],[56,68]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="none" stroke="#9fb9c9" stroke-width="1"/>`).join('');
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#e9f0f5"/>${ghost}${dots}</svg>`;
}
function tCoffee(){
  /* a mini year-grid in coffee brown behind a cup, echoing coffee-days.html */
  const cols=14, rows=9, cell=4.4, gap=1.5, w=cols*cell+(cols-1)*gap, h=rows*cell+(rows-1)*gap, x0=(100-w)/2, y0=12; let cells='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ const i=r*cols+c; const on=((i*11+5)%10)>6;
    const x=x0+c*(cell+gap), y=y0+r*(cell+gap);
    cells+= on ? `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="1.2" fill="#7B4B2A" opacity="0.85"/>`
      : `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="1.2" fill="#e6d5c6"/>`; }
  const cup = `<g transform="translate(50,78)">
    <path d="M-15,-9 h26 a3,3 0 0 1 3,3 v6 a13,13 0 0 1 -13,13 h-6 a13,13 0 0 1 -13,-13 v-6 a3,3 0 0 1 3,-3 z" fill="#5A3419"/>
    <path d="M14,-6 a7,7 0 0 1 0,13" fill="none" stroke="#5A3419" stroke-width="3"/>
    <rect x="-21" y="13" width="42" height="3.4" rx="1.7" fill="#5A3419"/>
    <g stroke="#a9835f" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".9">
      <path d="M-7,-14 c3,-4 -3,-7 0,-11"/><path d="M1,-14 c3,-4 -3,-7 0,-11"/><path d="M9,-14 c3,-4 -3,-7 0,-11"/></g></g>`;
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice"><rect width="100" height="100" fill="#f6efe8"/>${cells}${cup}</svg>`;
}
function tDecade(){
  /* ten years of steps, sleep and HRV climbing across the tile, in the same
     colours decade.html uses. Decorative, not the real numbers. */
  var X=function(i){return 10+i*8.9;};
  var line=function(vals,col,w){
    var pts=vals.map(function(v,i){return X(i)+','+v;}).join(' ');
    return '<polyline fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linejoin="round" stroke-linecap="round" points="'+pts+'"/>';
  };
  var grid=[0,3,6,9].map(function(i){
    return '<line x1="'+X(i)+'" y1="16" x2="'+X(i)+'" y2="86" stroke="#d5d8ea" stroke-width="1"/>';
  }).join('');
  var steps=[70,64,66,57,61,52,55,47,44,38];
  var sleep=[80,79,81,77,78,74,76,72,71,68];
  var hrv=[52,50,53,45,48,42,44,37,35,30];
  var dots=steps.map(function(v,i){
    return '<circle cx="'+X(i)+'" cy="'+v+'" r="1.9" fill="#c07a3b"/>';
  }).join('');
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">'
    + '<rect width="100" height="100" fill="#eef0f7"/>' + grid
    + '<line x1="6" y1="88" x2="94" y2="88" stroke="#c3c8de" stroke-width="1.2"/>'
    + line(sleep,'#3f6f8f',2.4) + line(hrv,'#2f8f5b',2.4) + line(steps,'#c07a3b',3)
    + dots + '</svg>';
}
function tBody(){
  /* four readings against their own baselines: a tall bar per metric in the
     tone that metric wears everywhere else, with the 30-day average as a
     faint tick across each one. Decorative, not the real numbers. */
  var bars=[['#3f6f8f',62,44],['#2f8f5b',40,52],['#c07a3b',52,60],['#b8860b',70,50]];
  var w=13, gap=9, x0=(100-(bars.length*w+(bars.length-1)*gap))/2, base=82;
  var out='';
  bars.forEach(function(b,i){
    var x=x0+i*(w+gap), h=b[1], y=base-h;
    out+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3.5" fill="'+b[0]+'"/>';
    out+='<line x1="'+(x-2.5)+'" y1="'+(base-b[2])+'" x2="'+(x+w+2.5)+'" y2="'+(base-b[2])+'" stroke="#8e9bab" stroke-width="1.4" stroke-linecap="round" opacity=".75"/>';
  });
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">'
    + '<rect width="100" height="100" fill="#eaf0f4"/>' + out
    + '<line x1="8" y1="'+base+'" x2="92" y2="'+base+'" stroke="#c3ccd6" stroke-width="1.4"/></svg>';
}
const VIEWS = [
  {id:'body', name:'YouMatics Dashboard', kick:'Your body', color:'#3f6f8f', bg:'#eaf0f4', thumb:tBody(),
   opens:'ym-dashboard.html', tag:'Sleep, HRV, steps and daylight, each against your own 30 days.', stat:'Updated daily'},
  {id:'wheel', name:'Time Bandit Wheel', kick:'Your day', color:'#B5651D', bg:'#f6ede2', thumb:tWheel(),
   opens:'index.html#wheel', tag:'Where the day actually went, in 10-minute blocks.', stat:'41 / 96 blocks'},
  {id:'habits', name:'Habits Tracker', kick:'The year in habits', color:'#4E6E2E', bg:'#eef3e6', thumb:tHabits(),
   opens:'qs-log.html', tag:'The master daily habit grid, one dot a day.', stat:'142-day streak'},
  {id:'compass', name:'Clarity Compass', kick:'Reflection', color:'#c68a2e', bg:'#faf3e4', thumb:tCompass(),
   opens:'qs-wheel.html', tag:'Your daily question and captured energy.', stat:'Answered today ✓'},
  {id:'snapshot', name:'Life Snapshot', kick:'The big picture', color:'#C0392B', bg:'#f8ebe9', thumb:tWeeks(),
   opens:'life-snapshot.html', tag:'Your life in weeks, 52 across, one year per row.', stat:'Week 2,187'},
  {id:'travel', name:'Travel Dashboard', kick:'Where you have been', color:'#2E6E8E', bg:'#e9f0f5', thumb:tMap(),
   opens:'where-ive-been.html', tag:'Every country, place and trip you actually went to.', stat:'41 / 193 countries'},
  {id:'coffee', name:'Coffee Days', kick:'What you drink', color:'#7B4B2A', bg:'#f6efe8', thumb:tCoffee(),
   opens:'coffee-days.html', tag:'Every day you had coffee, back to 2009. Check-ins, never card data.', stat:'588 days on record'},
  {id:'decade', name:'Decade View', kick:'The long arc', color:'#4B4E8C', bg:'#eef0f7', thumb:tDecade(),
   opens:'decade.html', tag:'Ten years of steps, sleep and HRV, one point a year.', stat:'Steps back to 2016'}
];

const INSPIRE = `The moment you measure something, it starts to change, that's the <span class="k">Hawthorne effect</span>, and it's the whole engine here. Every tracker is a nudge; every logged day is a small n=1 experiment. One master log feeds every view below, so your scattered tracking becomes one coherent picture. <span class="k">Measure it, and it changes. Your data becomes your coach.</span>`;

function render(){
  const cards = VIEWS.map(v=>{
    return `<a class="vcard" href="${v.opens}" style="--hc:${v.color}; --hcb:${v.bg}">
      <div class="thumb">${v.thumb}</div>
      <div class="body">
        <div class="kick">${v.kick}</div>
        <div class="nm">${v.name}</div>
        <div class="tg">${v.tag}</div>
        <span class="stat">${v.stat}</span>
        <span class="cta">open →</span>
      </div></a>`;
  }).join('');
  const add = `<div class="addcard"><span class="plus">+</span><span class="t">More views land here, Monthly Grid, Annual Dot-Grids, Living Ecosystem map</span></div>`;
  document.getElementById('stage').innerHTML = `
    <div class="pagehead">
      <div class="greet">Quantified Self</div>
      <h1><span class="em">Measure It</span>, and It Changes</h1>
      <p class="inspire">${INSPIRE}</p>
    </div>
    <div class="grid">${cards}${add}</div>`;
}
render();
</script>
