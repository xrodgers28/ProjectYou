<style>
:root{--bg:#ffffff;--ink:#1d2127;--mut:#8a919b;--line:#eceef1;--acc:#2f7d5b;--star:#f0b429;--red:#d9483a;--pink:#fdf5f4;--chip:#f3f4f6;--sheet:#ffffff}
@media (prefers-color-scheme: dark){:root{--bg:#14161a;--ink:#e9ecf0;--mut:#8b929c;--line:#252932;--acc:#5cc08f;--star:#f0b429;--red:#ef6b5d;--pink:#2a1b1a;--chip:#20242b;--sheet:#1b1f25}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
header h1 small{display:block;font-size:12px;font-weight:500;color:var(--mut);letter-spacing:0}
.hb{border:0;background:var(--chip);color:var(--ink);font:600 14px inherit;font-family:inherit;padding:8px 12px;border-radius:99px}
.hb:active{opacity:.6}
main{padding:4px 0 0}
.sec{margin:14px 0 0}
.sec>h2{display:flex;align-items:center;gap:6px;margin:0;padding:6px 16px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.sec>h2 .n{font-weight:500;letter-spacing:0}
.sec>h2 .car{display:inline-block;transition:transform .15s}
.sec.fold>h2 .car{transform:rotate(-90deg)}
.sec.fold .rows{display:none}
.sec.must>h2{color:var(--red)}
.row{display:flex;align-items:flex-start;gap:12px;padding:9px 16px;border-bottom:1px solid var(--line)}
.row.red{background:var(--pink)}
.row .cb{flex:none;width:24px;height:24px;margin-top:1px;border-radius:50%;border:2px solid var(--mut);background:transparent;padding:0}
.row .cb:active{background:var(--acc);border-color:var(--acc)}
.row .t{flex:1;min-width:0;word-wrap:break-word}
.row .t .sub{display:block;font-size:13px;color:var(--mut);margin-top:1px}
.row .st{flex:none;border:0;background:none;font-size:22px;line-height:1;color:var(--line);padding:0 2px;margin-top:-1px}
.row .st.on{color:var(--star)}
.row .st.on.red{color:var(--red)}
.row.open .tx{display:none}
.det{display:none;padding:2px 0 4px;font-size:14px;color:var(--mut)}
.row.open .det{display:block}
.det .kv{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pill{background:var(--chip);color:var(--ink);border-radius:99px;padding:3px 10px;font-size:13px}
.det input.edit{width:100%;font:inherit;color:var(--ink);background:var(--chip);border:0;border-radius:8px;padding:8px 10px;margin-top:4px}
.det .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.det .acts button,.det .acts a{border:0;background:var(--chip);color:var(--ink);font:600 13px inherit;font-family:inherit;padding:7px 12px;border-radius:99px;text-decoration:none}
.empty{padding:28px 16px;color:var(--mut);text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--bg);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px}
.bar select{flex:none;max-width:34%;font:14px inherit;font-family:inherit;color:var(--ink);background:var(--chip);border:0;border-radius:10px;padding:0 8px}
.bar input{flex:1;min-width:0;font:17px inherit;font-family:inherit;color:var(--ink);background:var(--chip);border:0;border-radius:10px;padding:11px 12px}
.bar button{flex:none;border:0;background:var(--acc);color:#fff;font:700 17px inherit;font-family:inherit;border-radius:10px;padding:0 16px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--sheet);border-radius:18px 18px 0 0;max-height:78vh;overflow:auto;padding:14px 0 calc(20px + env(safe-area-inset-bottom));display:none}
body.sh .shade,body.sh .sheet{display:block}
.sheet h3{margin:0;padding:4px 16px 8px;font-size:17px}
.sheet .x{position:absolute;right:12px;top:10px;border:0;background:var(--chip);color:var(--ink);border-radius:99px;padding:6px 12px;font:600 13px inherit;font-family:inherit}
.sheet .big{display:block;margin:10px 16px;padding:14px;border-radius:12px;background:var(--acc);color:#fff;text-align:center;font-weight:700;text-decoration:none}
.sheet .note{padding:0 16px;color:var(--mut);font-size:14px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:30;background:#23272e;color:#fff;border-radius:12px;padding:12px 14px;display:none;align-items:center;gap:12px}
.toast.on{display:flex}
.toast span{flex:1}
.toast button{border:0;background:none;color:#8fd8b3;font:700 15px inherit;font-family:inherit}
.gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px}.gate[hidden]{display:none}.gate form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}.gate h2{margin:0;font-size:26px}.gate p{margin:0;color:var(--mut);font-size:14px}.gate input{font:17px inherit;font-family:inherit;color:var(--ink);background:var(--chip);border:0;border-radius:10px;padding:13px 12px}.gate button{border:0;background:var(--acc);color:#fff;font:700 17px inherit;font-family:inherit;border-radius:10px;padding:13px}
footer{color:var(--mut);font-size:12px;text-align:center;padding:24px 0 8px}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Today<small id="dt"></small></h1>
  <button class="hb" id="bCal">Calendar</button>
  <button class="hb" id="bMore">More</button>
</header>
<main id="main"><div class="empty">Loading your list...</div></main>
<footer>Todays Tasks (phone) &middot; v1.0 &middot; Nov 25, 2026</footer>

<div class="bar">
  <select id="addSec" aria-label="List"></select>
  <input id="addIn" placeholder="Add a task" enterkeyhint="done" autocomplete="off">
  <button id="addBt">+</button>
</div>

<div class="gate" id="gate" hidden><form id="gateForm"><h2>Sign in</h2><p>Once on this phone. It remembers you after that.</p><input type="email" id="gEmail" autocomplete="username" placeholder="Email" autocapitalize="off" required><input type="password" id="gPass" autocomplete="current-password" placeholder="Password" required><button type="submit">Sign in</button><p id="gErr"></p></form></div>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"><span id="toastT"></span><button id="toastU">Undo</button></div>

<script>
(function(){
var SB_URL='https://arnjntspmrhigodlssbn.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFybmpudHNwbXJoaWdvZGxzc2JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMTQ0NTgsImV4cCI6MjEwMTg5MDQ1OH0.UN4JMuoKaAWQfhiCstuoOJQ1sVU2hU5pK0tLBY60dfM';
var sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY):null;
var COMPLETED='✓ Completed Tasks', WAIT='⏳ Waiting On', SCHED='Need to Schedule', APPT='Coming Appointments';
var MORE=[WAIT,SCHED,APPT];
var COLS='id,section,subsection,task,est_minutes,my_minutes,starred,star_color,star_position,done,done_at,is_habit,tracker,staged,bucket,position,tags,link,owner,due_date,due_label,archived,origin_section,origin_subsection,status';
var todos=[], openIds={}, folded={};
try{ folded=JSON.parse(localStorage.getItem('ttp-folded')||'{}'); }catch(e){}
var $=function(i){return document.getElementById(i);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* the day runs 2am to 2am Eastern */
function nyParts(d){var f=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(d),o={};f.forEach(function(p){o[p.type]=p.value;});return o;}
function dayKey(d){var p=nyParts(d),dt=new Date(Date.UTC(+p.year,+p.month-1,+p.day));if(+p.hour<2)dt=new Date(dt.getTime()-864e5);return dt.toISOString().slice(0,10);}
function niceDate(){var k=dayKey(new Date()).split('-');var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return m[+k[1]-1]+' '+(+k[2])+', '+k[0];}
function niceDue(t){if(t.due_label)return t.due_label;if(!t.due_date)return '';var k=t.due_date.split('-');var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return m[+k[1]-1]+' '+(+k[2])+', '+k[0];}

function isOpenList(t){return !t.done&&!t.is_habit&&!t.tracker&&!t.staged&&!t.archived&&t.section&&t.section!==COMPLETED&&MORE.indexOf(t.section)<0&&String(t.task||'').trim();}
function load(cb){
  if(!sb){$('main').innerHTML='<div class="empty">Cannot reach your list. Check your connection.</div>';return;}
  sb.from('todos').select(COLS).eq('bucket','today').or('archived.is.null,archived.eq.false').limit(3000).then(function(r){
    if(r.error){$('main').innerHTML='<div class="empty">Could not load. Pull down to retry.</div>';return;}
    todos=r.data||[];render();if(cb)cb();
  });
}
function rowHTML(t,must){
  var sc=t.star_color, open=openIds[t.id];
  var bits=[];if(niceDue(t))bits.push('Due '+niceDue(t));
  var est=t.my_minutes||t.est_minutes;if(est)bits.push('['+est+']');
  var sub=bits.length&&!open?'<span class="sub">'+esc(bits.join(' · '))+'</span>':'';
  var tags=(t.tags||[]).map(function(x){return '<span class="pill">#'+esc(x)+'</span>';}).join('');
  var det='<div class="det"><input class="edit" data-edit="'+t.id+'" value="'+esc(t.task)+'">'+
    '<div class="kv">'+(niceDue(t)?'<span class="pill">Due '+esc(niceDue(t))+'</span>':'')+(est?'<span class="pill">Est ['+est+']</span>':'')+tags+'<span class="pill">'+(t.owner==='claude'?'Claude has it':'Mine')+'</span></div>'+
    '<div class="acts">'+(t.link?'<a href="'+esc(t.link)+'" target="_blank" rel="noopener">Open link</a>':'')+
    '<button data-own="'+t.id+'">'+(t.owner==='claude'?'Take it back':'Send to Claude')+'</button>'+
    (sc?'<button data-unstar="'+t.id+'">Remove star</button>':'')+'</div></div>';
  return '<div class="row'+(sc==='red'?' red':'')+(open?' open':'')+'" data-id="'+t.id+'"><button class="cb" data-done="'+t.id+'" aria-label="Done"></button>'+
    '<div class="t" data-open="'+t.id+'"><span class="tx">'+esc(t.task)+'</span>'+sub+det+'</div>'+
    '<button class="st'+(sc?' on '+sc:'')+'" data-star="'+t.id+'" aria-label="Star">★</button></div>';
}
function render(){
  var open=todos.filter(isOpenList);
  var must=open.filter(function(t){return t.star_color;}).sort(function(a,b){var ra=a.star_color==='red'?0:1,rb=b.star_color==='red'?0:1;return ra-rb||(a.star_position||0)-(b.star_position||0);});
  var rest=open.filter(function(t){return !t.star_color;});
  var groups={},order=[];
  rest.sort(function(a,b){return (a.position||0)-(b.position||0);}).forEach(function(t){if(!groups[t.section]){groups[t.section]=[];order.push(t.section);}groups[t.section].push(t);});
  var h='';
  if(must.length)h+='<div class="sec must"><h2>Todays must dos <span class="n">'+must.length+'</span></h2><div class="rows">'+must.map(function(t){return rowHTML(t,true);}).join('')+'</div></div>';
  order.forEach(function(s){var key='s:'+s;h+='<div class="sec'+(folded[key]?' fold':'')+'" data-sec="'+esc(s)+'"><h2 data-fold="'+esc(key)+'"><span class="car">▾</span>'+esc(s)+' <span class="n">'+groups[s].length+'</span></h2><div class="rows">'+groups[s].map(function(t){return rowHTML(t,false);}).join('')+'</div></div>';});
  if(!h)h='<div class="empty">Nothing open. Nice.</div>';
  $('main').innerHTML=h;
  var sel=$('addSec'),cur=sel.value;sel.innerHTML=(order.length?order:['Core To-Dos']).map(function(s){return '<option>'+esc(s)+'</option>';}).join('');
  if(cur&&order.indexOf(cur)>=0)sel.value=cur;
  $('dt').textContent=niceDate();
}
function patch(id,p,cb){p.updated_at=new Date().toISOString();var t=todos.find(function(x){return x.id===id;});if(t)Object.assign(t,p);render();sb.from('todos').update(p).eq('id',id).then(function(r){if(r.error){toast('Could not save. Try again.');load();}else if(cb)cb();});}
var undo=null,tt;
function toast(msg,fn){$('toastT').textContent=msg;undo=fn||null;$('toastU').style.display=fn?'':'none';$('toast').classList.add('on');clearTimeout(tt);tt=setTimeout(function(){$('toast').classList.remove('on');},5000);}
$('toastU').onclick=function(){if(undo)undo();undo=null;$('toast').classList.remove('on');};

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-done],[data-star],[data-open],[data-fold],[data-own],[data-unstar]');
  if(!el)return;
  if(el.dataset.done){var t=todos.find(function(x){return x.id===el.dataset.done;});if(!t)return;
    var back={done:false,status:'todo',done_at:null,section:t.section,subsection:t.subsection,origin_section:t.origin_section,origin_subsection:t.origin_subsection};
    patch(t.id,{done:true,status:'done',done_at:new Date().toISOString(),origin_section:t.section,origin_subsection:t.subsection,section:COMPLETED,subsection:null});
    toast('Done: '+String(t.task).slice(0,40),function(){patch(t.id,back);});return;}
  if(el.dataset.star){var s=todos.find(function(x){return x.id===el.dataset.star;});if(!s)return;var p;
    if(!s.star_color){var mx=Math.max.apply(null,[0].concat(todos.filter(function(x){return x.star_color==='yellow';}).map(function(x){return x.star_position||0;})));p={star_color:'yellow',star_position:mx+1,starred:true};}
    else if(s.star_color==='yellow')p={star_color:'red',starred:true};else p={star_color:'yellow',starred:true};
    patch(s.id,p);return;}
  if(el.dataset.unstar){patch(el.dataset.unstar,{star_color:null,starred:false});return;}
  if(el.dataset.own){var o=todos.find(function(x){return x.id===el.dataset.own;});patch(o.id,{owner:o.owner==='claude'?null:'claude'});return;}
  if(el.dataset.fold){var k=el.dataset.fold;folded[k]=!folded[k];try{localStorage.setItem('ttp-folded',JSON.stringify(folded));}catch(x){}el.parentNode.classList.toggle('fold',!!folded[k]);return;}
  if(el.dataset.open){if(e.target.closest('input,button,a'))return;var id=el.dataset.open;openIds[id]=!openIds[id];var row=el.closest('.row');row.classList.toggle('open',!!openIds[id]);var tt2=todos.find(function(x){return x.id===id;});if(tt2)row.querySelector('.sub')&&(row.querySelector('.sub').style.display=openIds[id]?'none':'');}
});
document.addEventListener('change',function(e){var i=e.target.closest('input[data-edit]');if(!i)return;var v=i.value.trim();if(!v)return;patch(i.dataset.edit,{task:v,task_html:null});});

function add(){var v=$('addIn').value.trim();if(!v)return;var sec=$('addSec').value||'Core To-Dos';
  var pos=Math.max.apply(null,[0].concat(todos.filter(function(x){return x.section===sec;}).map(function(x){return x.position||0;})))+1;
  $('addIn').value='';
  sb.from('todos').insert({section:sec,task:v,bucket:'today',position:pos,done:false,status:'todo',is_habit:false}).select().single().then(function(r){if(r.error){toast('Could not add. Try again.');return;}todos.push(r.data);render();});
}
$('addBt').onclick=add;$('addIn').addEventListener('keydown',function(e){if(e.key==='Enter')add();});

function sheet(html){$('sheet').innerHTML='<button class="x" id="xx">Close</button>'+html;document.body.classList.add('sh');$('xx').onclick=closeSheet;}
function closeSheet(){document.body.classList.remove('sh');}
$('shade').onclick=closeSheet;
$('bCal').onclick=function(){sheet('<h3>Calendar</h3><p class="note">The full calendar, drag-to-schedule and time pills live on the big Todays Tasks page.</p><a class="big" href="index.html">Open full Todays Tasks page</a>');};
$('bMore').onclick=function(){
  var dk=dayKey(new Date());
  function grp(name,items){return '<div class="sec"><h2>'+esc(name)+' <span class="n">'+items.length+'</span></h2><div class="rows">'+(items.length?items.map(function(t){return '<div class="row"><div class="t">'+esc(t.task)+(niceDue(t)?'<span class="sub">Due '+esc(niceDue(t))+'</span>':'')+'</div></div>';}).join(''):'<div class="row"><div class="t" style="color:var(--mut)">Nothing here</div></div>')+'</div></div>';}
  function by(sec){return todos.filter(function(t){return !t.done&&!t.archived&&t.section===sec&&String(t.task||'').trim();}).sort(function(a,b){return (a.position||0)-(b.position||0);});}
  var done=todos.filter(function(t){return t.done&&!t.is_habit&&!t.tracker&&t.done_at&&dayKey(new Date(t.done_at))===dk;}).sort(function(a,b){return new Date(b.done_at)-new Date(a.done_at);});
  sheet('<h3>More</h3>'+grp('Waiting on',by(WAIT))+grp('Need to schedule',by(SCHED))+grp('Coming appointments',by(APPT))+grp('Done today',done));
};
document.addEventListener('visibilitychange',function(){if(!document.hidden&&$('gate').hidden)load();});
setInterval(function(){if(!document.hidden&&$('gate').hidden&&!document.body.classList.contains('sh')&&!document.activeElement.matches('input,select'))load();},30000);
function start(){load();try{sb.auth.getSession().then(function(x){if(x.data.session)sb.realtime.setAuth(x.data.session.access_token);sb.channel('todays-tasks-phone').on('postgres_changes',{event:'*',schema:'public',table:'todos'},function(){if(!document.body.classList.contains('sh')&&!document.activeElement.matches('input,select'))load();}).subscribe();});}catch(e){}}
$('gateForm').addEventListener('submit',function(e){e.preventDefault();sb.auth.signInWithPassword({email:$('gEmail').value.trim(),password:$('gPass').value}).then(function(r){if(r.error){$('gErr').textContent=r.error.message;return;}$('gate').hidden=true;start();});});
if(!sb){$('main').innerHTML='<div class="empty">Cannot reach your list. Check your connection.</div>';}
else sb.auth.getSession().then(function(x){if(!x.data.session){$('gate').hidden=false;$('main').innerHTML='';}else start();});
})();
</script>
<script src="nav-config.js"></script><script src="navpatch.js"></script></body>
