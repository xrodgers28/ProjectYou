<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="pn-ver" content="v1.0">
<title>Three New Things</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">

<style>
:root{
  --bg:#14110f;
  --bg-2:#1e1915;
  --bg-3:#272019;
  --line:#372d25;
  --ink:#f5efe8;
  --ink-2:#b6a99e;
  --ink-3:#7d7168;
  --ember:#e07b41;
  --ember-deep:#c25f2c;
  --peri:#98a0f0;
  --on-ember:#1a120c;
  --q-yellow:#e8b93f;
  --q-red:#d8604f;
  --q-green:#5fae7e;
  --q-blue:#5b8ec4;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100%;
  -webkit-tap-highlight-color:transparent;
}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.app{
  position:relative;z-index:1;max-width:600px;margin:0 auto;
  min-height:100vh;display:flex;flex-direction:column;padding:26px 22px 40px;
}
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);
  padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:26px;
}
.prog{display:flex;gap:5px;align-items:center}
.sd{width:8px;height:8px;border-radius:99px;background:var(--line)}
.sd.on{background:var(--ember)}
.sd.now{background:var(--peri)}

.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:6px 0 16px}
.stage.top{justify-content:flex-start}

h1{
  font-family:"Fraunces",Georgia,serif;font-weight:600;
  font-size:clamp(29px,7.2vw,42px);line-height:1.06;letter-spacing:-.02em;margin:0;text-wrap:balance;
}
h1 em{font-style:italic;color:var(--ember)}
h2{
  font-family:"Fraunces",Georgia,serif;font-weight:600;
  font-size:clamp(23px,5.4vw,31px);line-height:1.14;letter-spacing:-.015em;margin:0;text-wrap:balance;
}
.kick{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ember);margin:0;
}
.sub{color:var(--ink-2);margin:0;font-size:16px;max-width:44ch}
.sub b{color:var(--ink);font-weight:600}
.tiny{color:var(--ink-3);font-size:13.5px;margin:0}

/* ---------- the field ---------- */
.field{
  position:relative;width:100%;aspect-ratio:1;max-height:56vh;margin:0 auto;
  border-radius:18px;border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:crosshair;
  background:
    radial-gradient(circle at 78% 22%, rgba(232,185,63,.30), transparent 62%),
    radial-gradient(circle at 22% 22%, rgba(216,96,79,.30), transparent 62%),
    radial-gradient(circle at 78% 78%, rgba(95,174,126,.30), transparent 62%),
    radial-gradient(circle at 22% 78%, rgba(91,142,196,.30), transparent 62%),
    var(--bg-2);
}
.field .axis{position:absolute;background:rgba(245,239,232,.10)}
.field .axis.h{left:0;right:0;top:50%;height:1px}
.field .axis.v{top:0;bottom:0;left:50%;width:1px}
.field .lab{
  position:absolute;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);pointer-events:none;
}
.field .lab.t{top:9px;left:50%;transform:translateX(-50%)}
.field .lab.b{bottom:9px;left:50%;transform:translateX(-50%)}
.field .lab.l{left:9px;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:left center}
.field .lab.r{right:9px;top:50%;transform:translateY(-50%) rotate(90deg);transform-origin:right center}
.knob{
  position:absolute;width:34px;height:34px;border-radius:99px;transform:translate(-50%,-50%);
  background:rgba(245,239,232,.94);box-shadow:0 0 0 8px rgba(245,239,232,.14),0 6px 18px rgba(0,0,0,.5);
  pointer-events:none;transition:box-shadow .2s;
}
.knob.big{box-shadow:0 0 0 14px rgba(245,239,232,.16),0 6px 18px rgba(0,0,0,.5)}
.fieldout{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);
}
.fieldout b{font-family:"Fraunces",Georgia,serif;font-size:20px;letter-spacing:0;text-transform:none;font-weight:600}

/* ---------- floating words ---------- */
.wordfield{
  position:relative;height:min(60vh,440px);border-radius:18px;border:1px solid var(--line);
  background:var(--bg-2);overflow:hidden;touch-action:manipulation;
}
.fw{
  position:absolute;left:0;top:0;padding:9px 14px;border-radius:99px;cursor:pointer;
  background:rgba(245,239,232,.05);border:1px solid rgba(245,239,232,.18);
  color:var(--ink-2);font-family:inherit;font-size:15px;white-space:nowrap;
  will-change:transform;
}
.fw:hover{color:var(--ink);border-color:rgba(245,239,232,.45)}
.fw.on{
  background:var(--ember);border-color:var(--ember);color:var(--on-ember);font-weight:600;
  box-shadow:0 0 26px rgba(224,123,65,.55);
}
.fw:focus-visible{outline:2px solid var(--peri);outline-offset:2px}
.wordbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wordbar .mini{
  font-size:13.5px;padding:8px 13px;border-radius:99px;cursor:pointer;font-family:inherit;
  background:transparent;border:1px solid var(--line);color:var(--ink-2);
}
.wordbar .mini:hover{border-color:var(--ink-3);color:var(--ink)}
.wordbar .mini:focus-visible{outline:2px solid var(--peri);outline-offset:2px}
.ownrow{display:flex;gap:8px}
.own{
  flex:1;background:var(--bg-2);border:1px solid var(--line);border-radius:99px;
  color:var(--ink);padding:10px 15px;font-family:inherit;font-size:15px;
}
.own::placeholder{color:#6b5f56}
.own:focus-visible{outline:2px solid var(--ember);outline-offset:1px;border-color:var(--ember)}

/* ---------- the fan ---------- */
.arcwrap{position:relative;width:100%;height:238px;margin:6px 0 0;touch-action:none;cursor:pointer}
.arcwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.fthr line{transition:stroke .12s, stroke-width .12s}
.fthr circle.eye{transition:r .12s, fill .12s}
@media (prefers-reduced-motion: reduce){.fthr line,.fthr circle.eye{transition:none}}
.arcnum{
  position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);
  font-family:"Fraunces",Georgia,serif;font-size:40px;font-weight:600;color:var(--ink);
  pointer-events:none;line-height:1;
}
.arcnum.ghost{color:var(--ink-3)}
.arcends{
  display:flex;justify-content:space-between;font-family:"IBM Plex Mono",monospace;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:4px;
}

/* ---------- launch ---------- */
.launch{
  position:relative;height:min(46vh,320px);border-radius:18px;border:1px solid var(--line);
  background:linear-gradient(to top, var(--bg-3), var(--bg-2));overflow:hidden;touch-action:none;cursor:grab;
}
.launch .tick{position:absolute;left:0;right:0;height:1px;background:rgba(245,239,232,.07)}
.launch .tno{
  position:absolute;right:9px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--ink-3);
  transform:translateY(-50%);
}
.launch .seedball{
  position:absolute;left:50%;width:22px;height:22px;border-radius:99px;background:var(--ink);
  transform:translate(-50%,50%);box-shadow:0 0 22px rgba(245,239,232,.5);
}
.launch .hint{
  position:absolute;left:0;right:0;bottom:12px;text-align:center;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);pointer-events:none;
}
.launch .power{position:absolute;left:0;bottom:0;height:4px;background:var(--ember);width:0}

/* ---------- baskets ---------- */
.bskcard{
  background:var(--bg-2);border:1px solid var(--line);border-radius:14px;padding:16px 16px;
  font-family:"Fraunces",Georgia,serif;font-size:19px;text-align:center;cursor:grab;
  touch-action:none;user-select:none;position:relative;z-index:3;
}
.bskcard.drag{cursor:grabbing;box-shadow:0 14px 30px rgba(0,0,0,.6);border-color:var(--ember)}
.bsks{display:grid;gap:9px;margin-top:12px}
.bsk{
  border:1px dashed var(--line);border-radius:14px;padding:15px 14px;text-align:center;
  color:var(--ink-2);font-size:15.5px;transition:border-color .15s,background .15s,color .15s;
}
.bsk.hot{border-color:var(--ember);background:rgba(224,123,65,.12);color:var(--ink)}
.bsk.picked{border-style:solid;border-color:var(--ember);background:rgba(224,123,65,.16);color:var(--ink);font-weight:600}
@media (prefers-reduced-motion: reduce){.bsk{transition:none}}

/* ---------- generic bits ---------- */
.grid{display:grid;gap:9px}
@media(min-width:420px){.grid{grid-template-columns:1fr 1fr}}
.cat{
  text-align:left;background:var(--bg-2);border:1px solid var(--line);border-radius:13px;
  padding:14px 15px;cursor:pointer;color:var(--ink);font-family:inherit;font-size:16px;
  transition:border-color .15s,transform .15s;
}
.cat:hover:not(:disabled){border-color:var(--ember);transform:translateY(-2px)}
.cat:focus-visible{outline:2px solid var(--peri);outline-offset:2px}
.cat:disabled{opacity:.32;cursor:default}
.cat .nm{font-family:"Fraunces",Georgia,serif;font-size:18px;font-weight:600;display:block;line-height:1.2}
.cat .ct{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;color:var(--ink-3);margin-top:5px}
@media (prefers-reduced-motion: reduce){.cat{transition:none}.cat:hover:not(:disabled){transform:none}}

.prompts{margin:0;padding:0;list-style:none;display:grid;gap:7px}
.prompts li{color:var(--ink-2);font-size:15.5px;padding-left:16px;position:relative;line-height:1.45}
.prompts li::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:99px;background:var(--ember-deep)}

textarea.box{
  width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:13px;
  color:var(--ink);padding:14px 15px;font-family:inherit;font-size:17px;line-height:1.5;
  resize:none;min-height:96px;
}
textarea.box::placeholder{color:#6b5f56}
textarea.box:focus-visible{outline:2px solid var(--ember);outline-offset:1px;border-color:var(--ember)}

.btn{
  font-family:inherit;font-size:16.5px;font-weight:600;cursor:pointer;
  background:var(--ember);color:var(--on-ember);border:1px solid var(--ember);
  padding:14px 20px;border-radius:12px;width:100%;
}
.btn:disabled{opacity:.28;cursor:not-allowed}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:focus-visible{outline:2px solid var(--peri);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink-3);border-color:var(--line);font-weight:500;font-size:15px;padding:11px 18px}
.btn.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--ink-3);filter:none}
.foot{margin-top:auto;padding-top:22px;display:flex;flex-direction:column;gap:9px}

.said{
  font-family:"Fraunces",Georgia,serif;font-size:clamp(22px,5.2vw,29px);line-height:1.28;
  font-weight:400;font-style:italic;color:var(--ink);margin:0;text-wrap:balance;
}
.breathe{
  width:74px;height:74px;border-radius:99px;margin:6px auto;
  background:radial-gradient(circle at 50% 50%, rgba(224,123,65,.55), rgba(224,123,65,0) 70%);
  border:1px solid rgba(224,123,65,.45);animation:pulse 4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(.82);opacity:.65}50%{transform:scale(1.12);opacity:1}}
@media (prefers-reduced-motion: reduce){.breathe{animation:none}}

.note{
  border-left:2px solid var(--ember);padding:10px 13px;background:rgba(224,123,65,.09);
  border-radius:0 11px 11px 0;font-size:14.5px;color:#f0c7ab;line-height:1.5;
}
.note b{color:var(--ink)}
.note.blue{border-color:var(--peri);background:rgba(152,160,240,.09);color:#ccd0f7}

.log{display:grid;gap:9px}
.item{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.item .c{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px;
}
.item .t{font-size:15.5px;color:var(--ink);line-height:1.45}

.head{position:relative;height:190px;margin:2px 0}
.head canvas{width:100%;height:100%;display:block}

.tally{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg-2)}
.tally div{flex:1;padding:12px 6px;text-align:center;border-right:1px solid var(--line)}
.tally div:last-child{border-right:0}
.tally b{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:20px;font-weight:500;
  color:var(--ember);font-variant-numeric:tabular-nums;line-height:1.15;
}
.tally span{display:block;font-size:10.5px;color:var(--ink-3);letter-spacing:.03em;margin-top:3px}

.chiprow{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font-size:14px;padding:10px 15px;border-radius:99px;cursor:pointer;
  background:var(--bg-2);border:1px solid var(--line);color:var(--ink-2);font-family:inherit;
}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip.on{background:var(--ember);border-color:var(--ember);color:var(--on-ember);font-weight:600}
.chip.peri.on{background:var(--peri);border-color:var(--peri);color:#14110f}
.chip:focus-visible{outline:2px solid var(--peri);outline-offset:2px}

.spark{display:flex;align-items:flex-end;gap:3px;height:44px}
.spark i{flex:1;background:var(--ember);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.spark i.b{background:var(--peri)}

.tell{
  margin-top:30px;padding-top:18px;border-top:1px solid var(--line);
  font-size:14px;color:var(--ink-3);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.tell .mono{font-family:"IBM Plex Mono",monospace}

/* ---------- sign in ---------- */
.gate{
  background:var(--bg-2);border:1px solid var(--line);border-radius:16px;
  padding:20px 18px;margin:0 0 22px;
}
.gate h3{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:20px;margin:0 0 4px}
.gate p{font-size:14.5px;color:var(--ink-3);margin:0 0 14px}
.gate input{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  font-size:16px;margin-bottom:9px;background:var(--bg-3);color:var(--ink);font-family:inherit;
}
.gate input:focus-visible{outline:2px solid var(--ember);outline-offset:1px;border-color:var(--ember)}
.gate .msg{color:var(--ember);font-size:13.5px;margin-top:9px;min-height:18px}
.hidden{display:none !important}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="app">
  <div class="bar">
    <span id="when">Tonight</span>
    <span class="prog" id="prog"></span>
  </div>
  <div class="gate hidden" id="gate">
    <h3>Sign in first</h3>
    <p>Same as the other cue cards. Without it tonight only lives in this browser.</p>
    <input type="email" id="email" placeholder="Email" autocomplete="username">
    <input type="password" id="pass" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="signin">Sign in</button>
    <div class="msg" id="gateMsg"></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="tell">
    <span>Three New Things</span>
    <span class="mono">v2</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ==========================================================
   THE SEVEN, straight off the routine card
   ========================================================== */
var CATS=[
  {k:'moments', n:'Moments', p:['that made you smile','unexpected ones that surprised you','that felt genuinely good']},
  {k:'people', n:'People', p:['human interactions that lifted you','conversations that left you feeling good','moments when someone showed up for you']},
  {k:'body', n:'Body & Health', p:['times when your body felt good','meals','movements you genuinely enjoyed']},
  {k:'work', n:'Work & Accomplishment', p:['problems you solved','progress you made','decisions that felt right','things you completed that moved you forward']},
  {k:'senses', n:'Environment & Senses', p:['beautiful or pleasing things you noticed','moments of calm or quiet you appreciated']},
  {k:'wins', n:'Small Unexpected Wins', p:['things that went better than expected','small strokes of luck you almost missed','things that could have gone wrong but didn’t']},
  {k:'growth', n:'Personal Growth', p:['a moment you handled something better than you used to','a time you showed patience, kindness or courage today','something you learned about yourself','a moment you chose well under pressure']}
];

var EXTRAS=[
  {k:'wonder', kick:'Wonder', q:'What made you stop and look today?', ph:'Anything. The sky, a face, a sound.', btn:'Done'},
  {k:'thanks', kick:'Someone', q:'Who showed up for you?', sub:'Say thank you in one line. You can send it now.', ph:'Thanks for…', btn:'Send it', alt:'Keep it to myself'},
  {k:'bright', kick:'The bright side', q:'What could have gone wrong today, and didn’t?', ph:'The near miss you barely noticed.', btn:'Done'},
  {k:'help', kick:'Tomorrow', q:'Who could you help tomorrow?', sub:'Planning it is enough. It counts on its own.', ph:'One person, one small thing.', btn:'Done'},
  {k:'letter', kick:'The letter', q:'Someone who changed things for you, and never got told.', letter:true, btn:'Ready to read it to them'}
];

/* ==========================================================
   THE CHECK-IN
   ========================================================== */
var WORDS={
  yellow:['Excited','Playful','Energised','Proud','Hopeful','Cheerful','Inspired','Motivated',
    'Thrilled','Upbeat','Alive','Amused','Buzzing','Eager','Enthusiastic','Optimistic',
    'Delighted','Elated','Joyful','Exhilarated','Curious','Determined','Confident','Empowered',
    'Fired up','Giddy','Lively','Passionate','Surprised','Triumphant','Ready','Bold',
    'Chuffed','Restive','Sparky','Wired','Productive','Effective','Accomplished',
    'Got things done','Useful','Sharp','Focused','Purposeful','On top of it','Capable'],
  red:['Stressed','Frustrated','Anxious','Irritated','Restless','Tense','Worried','Annoyed',
    'Overwhelmed','Rushed','Angry','On edge','Jittery','Pressured','Impatient','Defensive',
    'Embarrassed','Fed up','Livid','Nervous','Panicked','Scattered','Snappy','Uneasy',
    'Wound up','Apprehensive','Exposed','Torn','Guilty','Envious','Indignant','Shocked',
    'Cornered','Prickly','Braced','Hunted','Stretched','Snowed under','Wrung out',
    'Short-tempered','Second-guessing','Dreading something'],
  green:['Calm','Content','Grateful','Relaxed','Peaceful','Easy','Satisfied','Warm',
    'Loving','Settled','Comfy','Balanced','At ease','Carefree','Fulfilled','Mellow',
    'Restored','Safe','Secure','Serene','Soft','Steady','Tender','Thankful',
    'Thoughtful','Tranquil','Trusting','Unhurried','Full','Quietly happy','Unbothered','Rooted',
    'Cosy','Forgiving','Open','Still','Quietly pleased','Done for the day','Relieved',
    'Looked after','Held','Unpressured'],
  blue:['Tired','Flat','Wistful','Lonely','Disappointed','Drained','Bored','Low',
    'Heavy','Withdrawn','Deflated','Quiet','Apathetic','Discouraged','Disconnected','Empty',
    'Fragile','Glum','Homesick','Hollow','Listless','Melancholy','Numb','Nostalgic',
    'Resigned','Sad','Sluggish','Spent','Subdued','Unmotivated','Weary','Adrift',
    'Foggy','Small','Tender-sore','Far away','Tearful','Disheartened','Missing someone',
    'Let down','Not myself','Doubting myself','Fed up with myself','Sore about something']
};

/* From Scott's own ADHD Characteristics sheet. Mixed into every hand,
   never labelled as a separate group. */
var ADHD={
  yellow:['In the zone','Ideas everywhere','Switched on','On a roll','Lit up','Gripped',
          'Fizzing','Full throttle','Off to the races','Can\u2019t wait to start'],
  red:['Racing','Can\u2019t switch off','Too many tabs','Rushing','Behind the clock',
       'Bursting to speak','Itchy','Overloaded','Overstimulated','Wired and stuck',
       'Mind won\u2019t stop','Half a dozen half-starts'],
  green:['Slowed right down','Quiet mind','One thing at a time','Off duty','Clear-headed',
         'Actually relaxed','Present','Not chasing anything'],
  blue:['Underachieving','Stalled','Can\u2019t get started','Browned out','Behind',
        'Unfinished','Bored stiff','Blank','Scattered and flat','Lost the thread']
};

var QUAD={
  yellow:{n:'High energy, pleasant',c:'--q-yellow'},
  red:{n:'High energy, unpleasant',c:'--q-red'},
  green:{n:'Low energy, pleasant',c:'--q-green'},
  blue:{n:'Low energy, unpleasant',c:'--q-blue'}
};

/* the rotating pool. type: 'n10' = 0-10, 'freq3' = three baskets, 'agree' = five baskets */
var POOL=[
  {k:'anxious', t:'n10', q:'How anxious did you feel today?', lo:'Not at all', hi:'Completely'},
  {k:'worthwhile', t:'n10', q:'How worthwhile did the things you did today feel?', lo:'Not at all', hi:'Completely'},

function newNight(){
  /* four rotating questions, favouring the ones asked least */
  var seen={};
  S.checks.forEach(function(c){ Object.keys(c.a||{}).forEach(function(k){ seen[k]=(seen[k]||0)+1; }); });
  var ranked=POOL.slice().sort(function(a,b){ return (seen[a.k]||0)-(seen[b.k]||0) || Math.random()-0.5; });
  var picks=shuffle(ranked.slice(0,7)).slice(0,4);
  return {
    px:0, py:0, quad:null, placed:false,
    words:[], shown:[], deal:null, narrow:false, qs:picks, qi:0, a:{}, styles:shuffle(['arc','launch','arc','launch']),
    withw:[], wherew:null,
    items:[], cat:null, text:'', extra:null, etext:''

}

function usedTonight(k){return N.items.some(function(x){return x.k===k;});}
function countIn(k){return S.hist.filter(function(x){return x.k===k;}).length;}
function seenBefore(t){
  var n=t.toLowerCase().replace(/[^a-z0-9 ]/g,'').split(/\s+/).filter(function(w){return w.length>3;});
  if(n.length<2) return null;
  for(var i=S.hist.length-1;i>=0;i--){
    var o=S.hist[i].t.toLowerCase().replace(/[^a-z0-9 ]/g,''); var hit=0;
    for(var j=0;j<n.length;j++){ if(o.indexOf(n[j])>-1) hit++; }
    if(hit>=Math.max(2,Math.ceil(n.length*0.6))) return S.hist[i];
  }
  return null;
}

(function ambient(){
  var c=document.getElementById('sky'), ctx=c.getContext('2d'), P=[];
  function size(){c.width=innerWidth;c.height=innerHeight;}
  size(); addEventListener('resize',size);
  for(var i=0;i<18;i++){
    P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
      vx:.06+Math.random()*.12, vy:-.04-Math.random()*.1, s:.6+Math.random()*1.3, o:.05+Math.random()*.12});
  }
  function loop(){
    ctx.clearRect(0,0,c.width,c.height);
    for(var i=0;i<P.length;i++){
      var p=P[i]; p.x+=p.vx; p.y+=p.vy;
      if(p.y<-10){p.y=c.height+10;p.x=Math.random()*c.width;}
      if(p.x>c.width+10)p.x=-10;
      ctx.beginPath(); ctx.fillStyle='rgba(245,239,232,'+p.o+')';
      ctx.arc(p.x,p.y,p.s,0,6.284); ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  if(!reduce) loop();
})();

function burst(n){
  if(reduce) return;
  var c=document.createElement('canvas');
  c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:9';
  c.width=innerWidth; c.height=innerHeight; document.body.appendChild(c);
  var ctx=c.getContext('2d'), P=[], t=0;
  for(var i=0;i<(n||30);i++){
    P.push({x:innerWidth/2+(Math.random()-.5)*130, y:innerHeight*.62+(Math.random()-.5)*70,
      vx:(Math.random()-.4)*1.1, vy:-.5-Math.random()*1.1, s:1+Math.random()*2.1});
  }
  (function go(){
    t++; ctx.clearRect(0,0,c.width,c.height);
    for(var i=0;i<P.length;i++){
      var p=P[i]; p.x+=p.vx+Math.sin((t+i*8)/32)*.5; p.y+=p.vy;
      var a=t<20?t/20:Math.max(0,1-(t-20)/110);
      ctx.beginPath(); ctx.fillStyle='rgba(245,239,232,'+(a*.9)+')';
      ctx.arc(p.x,p.y,p.s,0,6.284); ctx.fill();
    }
    if(t<140) requestAnimationFrame(go); else c.remove();
  })();
}

function drawHead(cv,total){
  var ctx=cv.getContext('2d');
  var w=cv.width=cv.clientWidth*2, h=cv.height=cv.clientHeight*2;
  var cx=w/2, cy=h*.42, R=Math.min(w,h)*.30, n=Math.min(130,18+total*2);
  ctx.strokeStyle='rgba(224,123,65,.75)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx,cy+R*0.1); ctx.quadraticCurveTo(cx-8,h*.78,cx+4,h); ctx.stroke();
  for(var i=0;i<n;i++){
    var a=(i/n)*6.2832+(i%3)*0.05, r=R*(0.55+((i*37)%100)/100*0.45);
    var x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r*0.94;
    ctx.beginPath(); ctx.strokeStyle='rgba(245,239,232,.22)'; ctx.lineWidth=1.6;
    ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
    ctx.beginPath(); ctx.fillStyle='rgba(245,239,232,.85)'; ctx.arc(x,y,2.6,0,6.284); ctx.fill();
  }
  ctx.beginPath(); ctx.fillStyle='rgba(224,123,65,.9)'; ctx.arc(cx,cy,5,0,6.284); ctx.fill();
}

      h+='<div class="item"><span class="c">'+catOf(it.k).n+'</span><span class="t">'+esc(it.t)+'</span></div>';
    });
    h+='</div>';
    h+='<div class="item"><span class="c">Tonight you were</span><span class="t">'+N.words.join(' &middot; ')+'</span></div>';
    h+='<div class="tally">';
    h+='<div><b>'+S.hist.length+'</b><span>things noticed</span></div>';
    h+='<div><b>'+S.nights+'</b><span>nights</span></div>';
    h+='<div><b>'+S.told+'</b><span>people told</span></div>';
    h+='</div>';
    if(S.checks.length>2){
      h+='<div class="item"><span class="c">How pleasant the days have felt</span><div class="spark">'+sparkFor('pleasant')+'</div></div>';
      h+='<div class="item"><span class="c">And how much energy</span><div class="spark">'+sparkFor('energy')+'</div></div>';
      var w=topWords();
      if(w) h+='<p class="tiny">Most caught word so far: <b style="color:var(--ink-2)">'+w+'</b>.</p>';
    }else{
      h+='<p class="tiny">A few more nights and the shapes start showing up here.</p>';
    }
    var thin=CATS.slice().sort(function(a,b){return countIn(a.k)-countIn(b.k);})[0];
    h+='<p class="tiny">Thinnest corner so far: <b style="color:var(--ink-2)">'+thin.n+'</b>. Have a look there tomorrow.</p>';
    h+='<p class="tiny" id="tickline">Saving\u2026</p>';
    h+='<div class="foot"><button class="btn" data-go="board">Back to the cue cards</button>';
    h+='<button class="btn ghost" data-go="restart">Do another night</button></div>';
  }

  stopWords();
  stage.innerHTML=h;
  paintProg();
  bind();
  if(view==='field') wireField();
  if(view==='q'){
    var q=N.qs[N.qi];
    if(q.t==='n10'){ if(N.styles[N.qi]==='launch') wireLaunch(q); else wireArc(q); }
    else wireBaskets(q);
  }
  if(view==='done'){ var cv=document.getElementById('hd'); if(cv) setTimeout(function(){drawHead(cv,S.hist.length);},30); }
  var t=document.getElementById('tx'); if(t) t.focus();
}

function fmt(v){ return (v>0?'+':'')+v.toFixed(1); }

function sparkFor(kind){
  var last=S.checks.slice(-20), h='';
  last.forEach(function(c){
    var v=(kind==='pleasant')?c.px:c.py;
    var pct=Math.round(((v+5)/10)*100);
    h+='<i class="'+(kind==='energy'?'b':'')+'" style="height:'+Math.max(4,pct)+'%"></i>';
  });
  return h;
}
function topWords(){
  var c={}; S.checks.forEach(function(x){(x.w||[]).forEach(function(w){c[w]=(c[w]||0)+1;});});
  var best=null,n=0; Object.keys(c).forEach(function(k){if(c[k]>n){n=c[k];best=k;}});
  return best;
}

/* ==========================================================
   the field
   ========================================================== */
function wireField(){
  var f=document.getElementById('fld'), k=document.getElementById('knb');
  if(!f) return;
  function place(e){
    var r=f.getBoundingClientRect();
    var x=Math.min(Math.max(e.clientX-r.left,0),r.width);
    var y=Math.min(Math.max(e.clientY-r.top,0),r.height);
    k.style.left=(x/r.width*100)+'%'; k.style.top=(y/r.height*100)+'%';
    N.px=((x/r.width)*10)-5;
    N.py=5-((y/r.height)*10);
    var was=N.quad;
    N.quad=quadOf(N.px,N.py); N.placed=true;
    var q=document.getElementById('qname'), num=document.getElementById('qnum');
    if(q) q.innerHTML='<b style="color:var(--'+QUAD[N.quad].c.slice(2)+')">'+QUAD[N.quad].n+'</b>';
    if(num) num.textContent=fmt(N.px)+' / '+fmt(N.py);
    if(N.quad!==was){ N.deal=null; N.shown=[]; }
    var b=stage.querySelector('[data-go="words"]'); if(b) b.disabled=false;
  }
  var down=false;
  f.addEventListener('pointerdown',function(e){down=true;k.classList.add('big');try{f.setPointerCapture(e.pointerId);}catch(err){}place(e);});
  f.addEventListener('pointermove',function(e){if(down)place(e);});
  f.addEventListener('pointerup',function(){down=false;k.classList.remove('big');});
  f.addEventListener('pointercancel',function(){down=false;k.classList.remove('big');});
  if(N.placed){
    k.style.left=(((N.px+5)/10)*100)+'%';
    k.style.top=(((5-N.py)/10)*100)+'%';
  }
}

/* ==========================================================
   floating words - real drift, tap on pointerdown so a
   moving word is still easy to catch
   ========================================================== */
var wordRAF=null;
function stopWords(){ if(wordRAF){cancelAnimationFrame(wordRAF); wordRAF=null;} }

function adhdPool(){
  var all=[]; ['yellow','red','green','blue'].forEach(function(q){ all=all.concat(ADHD[q]); });
  if(N.narrow) return ADHD[N.quad]||ADHD.green;
  /* his own words too, weighted to the corner he landed on but never locked to it */
  return (ADHD[N.quad]||[]).concat(shuffle(all).slice(0,10));
}
function wcountText(){
  return N.words.length?N.words.join(', '):'nothing caught yet';
}
function pick(list,n,used){
  return shuffle(list.filter(function(w){ return used.indexOf(w)<0 && N.shown.indexOf(w)<0; })).slice(0,n);
}
function dealWords(){
  var quads=['yellow','red','green','blue'];
  var others=quads.filter(function(q){ return q!==N.quad; });
  var take=[], used=[];

  function add(list,n){
    var got=pick(list,n,used);
    if(got.length<n){ /* pool ran dry, allow repeats of unseen-this-hand */
      got=got.concat(shuffle(list.filter(function(w){return used.indexOf(w)<0&&got.indexOf(w)<0;})).slice(0,n-got.length));
    }
    take=take.concat(got); used=used.concat(got);
  }

  if(N.narrow){
    add(ADHD[N.quad]||[],4);
    add(WORDS[N.quad]||[],10);
  }else{
    add(ADHD[N.quad]||[],2);                                  /* his own, from where he landed */
    add(WORDS[N.quad]||[],5);                                 /* and the rest of that corner */
    var spread=shuffle(others);
    add(WORDS[spread[0]],3);                                  /* the other three corners, because a day */
    add(WORDS[spread[1]],2);                                  /* is several things at once */
    add(WORDS[spread[2]],2);
    var allAdhd=[]; quads.forEach(function(q){ if(q!==N.quad) allAdhd=allAdhd.concat(ADHD[q]); });
    add(allAdhd,2);
  }

  N.words.forEach(function(w){ if(take.indexOf(w)<0) take.unshift(w); });
  take=shuffle(take).slice(0,16);
  N.shown=N.shown.concat(take.filter(function(w){return N.shown.indexOf(w)<0;}));
  if(N.shown.length>60) N.shown=N.words.slice();
  return take;
}

function startWords(){
  stopWords();
  var wf=document.getElementById('wf'); if(!wf) return;
  wf.innerHTML='';
  var W=wf.clientWidth, H=wf.clientHeight;
  var list=(N.deal&&N.deal.length)?N.deal:(N.deal=dealWords());
  var items=[];

  list.forEach(function(w,i){
    var b=document.createElement('button');
    b.className='fw'+(N.words.indexOf(w)>-1?' on':'');
    b.textContent=w; b.type='button';
    wf.appendChild(b);
    var bw=b.offsetWidth, bh=b.offsetHeight;
    var col=i%2, row=Math.floor(i/2), rows=Math.ceil(list.length/2);
    var o={
      el:b, w:bw, h:bh,
      x:Math.min(Math.max(col*(W/2)+8+Math.random()*Math.max(6,(W/2-bw-16)), 4), Math.max(4,W-bw-4)),
      y:Math.min(row*((H-bh-8)/Math.max(1,rows-1))+4+(Math.random()*10-5), H-bh-4),
      vx:(Math.random()<0.5?-1:1)*(0.16+Math.random()*0.26),
      vy:(Math.random()<0.5?-1:1)*(0.12+Math.random()*0.22),
      ph:Math.random()*6.28
    };
    if(o.y<4) o.y=4;
    o.el.style.transform='translate('+o.x+'px,'+o.y+'px)';
    items.push(o);

    function toggle(ev){
      ev.preventDefault();
      var at=N.words.indexOf(w);
      if(at>-1){ N.words.splice(at,1); b.classList.remove('on'); }
      else if(N.words.length<5){ N.words.push(w); b.classList.add('on'); burst(6); }
      var c=document.getElementById('wcount'); if(c) c.textContent=wcountText();
      var nx=stage.querySelector('[data-go="q"]'); if(nx) nx.disabled=(N.words.length===0);
    }
    b.addEventListener('pointerdown',toggle);
    b.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' ') toggle(ev); });
  });

  if(reduce) return;
  var t=0;
  (function tick(){
    t++;
    for(var i=0;i<items.length;i++){
      var o=items[i];
      if(o.el.classList.contains('on')){
        o.el.style.transform='translate('+o.x+'px,'+o.y+'px) scale(1.04)';
        continue;
      }
      o.x+=o.vx; o.y+=o.vy+Math.sin((t+o.ph*60)/150)*0.06;
      if(o.x<2){o.x=2;o.vx=Math.abs(o.vx);}
      if(o.x>W-o.w-2){o.x=W-o.w-2;o.vx=-Math.abs(o.vx);}
      if(o.y<2){o.y=2;o.vy=Math.abs(o.vy);}
      if(o.y>H-o.h-2){o.y=H-o.h-2;o.vy=-Math.abs(o.vy);}
      o.el.style.transform='translate('+o.x+'px,'+o.y+'px)';
    }
    wordRAF=requestAnimationFrame(tick);
  })();
}

/* ==========================================================
   the fan - eleven feathers from the bottom centre.
   Drag across them, the value follows your finger.
   ========================================================== */
function wireArc(q){
  var w=document.getElementById('arcw'); if(!w) return;
  var W=w.clientWidth||320, H=w.clientHeight||238;
  var cx=W/2, cy=H-6, R=Math.min(W*0.47,H*0.90), INNER=R*0.26;
  var hover=null;

  var svg='<svg viewBox="0 0 '+W+' '+H+'">';
  for(var i=0;i<=10;i++){
    var a=Math.PI-(i/10)*Math.PI;
    var mid=1-Math.abs(i-5)/5;              /* longest in the middle, like a fan */
    var len=R*(0.86+mid*0.14);
    var x1=cx+Math.cos(a)*INNER, y1=cy-Math.sin(a)*INNER;
    var x2=cx+Math.cos(a)*len,  y2=cy-Math.sin(a)*len;
    var ex=cx+Math.cos(a)*(len+9), ey=cy-Math.sin(a)*(len+9);
    svg+='<g class="fthr" data-v="'+i+'">';
    svg+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="rgba(245,239,232,.20)" stroke-width="2" stroke-linecap="round"/>';
    svg+='<circle class="eye" cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="5" fill="rgba(245,239,232,.28)"/>';
    svg+='</g>';
  }
  svg+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="4.5" fill="rgba(224,123,65,.85)"/>';
  svg+='</svg>';
  w.innerHTML=svg+'<span class="arcnum" id="arcn"></span>';

  var gs=[].slice.call(w.querySelectorAll('.fthr'));
  function paint(){
    var show=(hover!==null)?hover:N.a[q.k];
    gs.forEach(function(g,i){
      var ln=g.querySelector('line'), ey=g.querySelector('.eye');
      var picked=(N.a[q.k]===i), lit=(show!==undefined&&show!==null&&i<=show);
      ln.setAttribute('stroke', picked?'#e07b41':(lit?'rgba(224,123,65,.5)':'rgba(245,239,232,.20)'));
      ln.setAttribute('stroke-width', picked?'4':(lit?'2.6':'2'));
      ey.setAttribute('r', picked?'11':(lit?'6.5':'5'));
      ey.setAttribute('fill', picked?'#e07b41':(lit?'rgba(224,123,65,.6)':'rgba(245,239,232,.28)'));
    });
    var n=document.getElementById('arcn');
    if(n){
      n.textContent=(show===undefined||show===null)?'':show;
      n.className='arcnum'+((hover!==null&&N.a[q.k]!==hover)?' ghost':'');
    }
  }
  function at(e){
    var r=w.getBoundingClientRect();
    var dx=(e.clientX-r.left)-cx, dy=cy-(e.clientY-r.top);
    var ang=Math.atan2(Math.max(dy,0),dx);            /* pi (left) .. 0 (right) */
    var v=Math.round((1-(ang/Math.PI))*10);
    return Math.min(Math.max(v,0),10);
  }
  function set(e){
    N.a[q.k]=at(e); hover=null; paint();
    var b=stage.querySelector('[data-go="qnext"]'); if(b) b.disabled=false;
  }
  var down=false;
  w.addEventListener('pointerdown',function(e){
    down=true; try{w.setPointerCapture(e.pointerId);}catch(err){}
    set(e); e.preventDefault();
  });
  w.addEventListener('pointermove',function(e){
    if(down){ set(e); }
    else if(e.pointerType==='mouse'){ hover=at(e); paint(); }
  });
  w.addEventListener('pointerup',function(e){ down=false; set(e); });
  w.addEventListener('pointercancel',function(){ down=false; hover=null; paint(); });
  w.addEventListener('pointerleave',function(){ if(!down){ hover=null; paint(); } });
  paint();
}

/* ==========================================================
   launch
   ========================================================== */
function wireLaunch(q){
  var l=document.getElementById('lch'), ball=document.getElementById('ball'),
      pw=document.getElementById('pw'), hint=document.getElementById('lhint');
  if(!l) return;
  if(N.a[q.k]!==undefined){ ball.style.bottom=(N.a[q.k]*10)+'%'; if(hint) hint.textContent=N.a[q.k]+' of 10'; }
  var down=false, startY=0, power=0;
  l.addEventListener('pointerdown',function(e){
    down=true; startY=e.clientY; power=0;
    try{l.setPointerCapture(e.pointerId);}catch(err){}
    ball.style.bottom='0%'; ball.style.transition='none';
  });
  l.addEventListener('pointermove',function(e){
    if(!down) return;
    var r=l.getBoundingClientRect();
    power=Math.min(Math.max((e.clientY-startY)/(r.height*0.55),0),1);
    pw.style.width=(power*100)+'%';
    ball.style.bottom=(-power*6)+'%';
    if(hint) hint.textContent='Let go';
  });
  function release(){
    if(!down) return;
    down=false;
    var v=Math.round(power*10);
    N.a[q.k]=v;
    pw.style.width='0%';
    ball.style.transition='bottom .75s cubic-bezier(.2,.9,.25,1)';
    ball.style.bottom=(v*10)+'%';
    if(hint) hint.textContent=v+' of 10';
    var b=stage.querySelector('[data-go="qnext"]'); if(b) b.disabled=false;
    if(v>=8) burst(14);
  }
  l.addEventListener('pointerup',release);
  l.addEventListener('pointercancel',release);
}

/* ==========================================================
   baskets
   ========================================================== */
function wireBaskets(q){
  var card=document.getElementById('card'), zone=document.getElementById('bsks');
  if(!card||!zone) return;
  var bs=[].slice.call(zone.querySelectorAll('.bsk'));
  bs.forEach(function(b){
    b.addEventListener('click',function(){ setVal(parseInt(b.getAttribute('data-b'),10)); });
  });
  function setVal(v){
    N.a[q.k]=v;
    bs.forEach(function(b,i){ b.classList.toggle('picked', i===v); b.classList.remove('hot'); });
    var btn=stage.querySelector('[data-go="qnext"]'); if(btn) btn.disabled=false;
  }
  /* drag: pure delta from where the pointer went down, so the card sits
     exactly under the finger instead of a card-height behind it */
  var down=false, sx=0, sy=0;
  function moveTo(dx,dy){ card.style.transform='translate('+dx+'px,'+dy+'px)'; }
  function overIdx(e){
    var hit=-1;
    bs.forEach(function(b,i){
      var r=b.getBoundingClientRect();
      if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom) hit=i;
    });
    return hit;
  }
  card.addEventListener('pointerdown',function(e){
    down=true; sx=e.clientX; sy=e.clientY;
    card.classList.add('drag');
    try{card.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
  });
  card.addEventListener('pointermove',function(e){
    if(!down) return;
    moveTo(e.clientX-sx, e.clientY-sy);
    var h=overIdx(e);
    bs.forEach(function(b,i){ b.classList.toggle('hot', i===h); });
  });
  function drop(e){
    if(!down) return;
    down=false; card.classList.remove('drag');
    var h=overIdx(e);
    card.style.transition='transform .22s ease';
    moveTo(0,0);
    setTimeout(function(){ card.style.transition=''; },240);
    bs.forEach(function(b){ b.classList.remove('hot'); });
    if(h>-1){ setVal(h); burst(10); }
  }
  card.addEventListener('pointerup',drop);
  card.addEventListener('pointercancel',function(){
    down=false; card.classList.remove('drag'); moveTo(0,0);
    bs.forEach(function(b){ b.classList.remove('hot'); });
  });
}

function addOwn(){
  var i=document.getElementById('ownw'); if(!i) return;
  var w=i.value.trim().replace(/\s+/g,' ');
  if(!w) return;
  w=w.charAt(0).toUpperCase()+w.slice(1);
  if(N.words.indexOf(w)>-1||N.words.length>=5){ i.value=''; return; }
  N.words.push(w);
  if(N.quad&&WORDS[N.quad].indexOf(w)<0&&ADHD[N.quad].indexOf(w)<0) WORDS[N.quad].push(w);
  N.deal=null; i.value='';
  burst(8);
  var c=document.getElementById('wcount'); if(c) c.textContent=wcountText();
  startWords();
  var nx=stage.querySelector('[data-go="q"]'); if(nx) nx.disabled=false;
}

/* ==========================================================
   wiring
   ========================================================== */
function bind(){
  stage.querySelectorAll('[data-cat]').forEach(function(b){
    b.addEventListener('click',function(){ N.cat=b.getAttribute('data-cat'); N.text=''; view='write'; render(); });
  });
  stage.querySelectorAll('[data-w]').forEach(function(b){
    b.addEventListener('click',function(){
      var i=parseInt(b.getAttribute('data-w'),10), at=N.withw.indexOf(i);
      if(at>-1) N.withw.splice(at,1); else N.withw.push(i);
      b.classList.toggle('on');
    });
  });
  stage.querySelectorAll('[data-p]').forEach(function(b){
    b.addEventListener('click',function(){
      var i=parseInt(b.getAttribute('data-p'),10);
      N.wherew=(N.wherew===i)?null:i;
      stage.querySelectorAll('[data-p]').forEach(function(x){x.classList.remove('on');});
      if(N.wherew!==null) b.classList.add('on');
    });
  });
  var shuf=stage.querySelector('[data-shuf]');
  if(shuf) shuf.addEventListener('click',function(){ N.deal=null; startWords(); });
  var wide=stage.querySelector('[data-wide]');
  if(wide) wide.addEventListener('click',function(){ N.narrow=!N.narrow; N.deal=null; N.shown=N.words.slice(); render(); });
  var ownb=stage.querySelector('[data-own]');
  if(ownb) ownb.addEventListener('click',addOwn);
  var owni=document.getElementById('ownw');
  if(owni) owni.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();addOwn();} });

  stage.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click',function(){ act(b.getAttribute('data-go')); });
  });
  var t=document.getElementById('tx');
  if(t){
    t.addEventListener('input',function(){
      if(view==='extra'){
        N.etext=t.value;
        var btn=stage.querySelector('[data-go="edone"]'); if(btn) btn.disabled=(t.value.trim().length<3);
        return;
      }
      var had=stage.querySelector('.note')!==null;
      N.text=t.value;
      var want=t.value.trim().length>6 && !!seenBefore(t.value);
      if(want!==had){
        var pos=t.selectionStart; render();
        var n=document.getElementById('tx');
        if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}
      }else{
        var btn=stage.querySelector('[data-go="savor"]'); if(btn) btn.disabled=(t.value.trim().length<3);
      }
    });
  }
}

function act(a){
  if(a==='begin'){ N=newNight(); view='field'; render(); return; }
  if(a==='field'){ view='field'; render(); return; }
  if(a==='words'){ view='words'; render(); return; }
  if(a==='q'){ N.qi=0; view='q'; render(); return; }
  if(a==='qnext'){
    if(N.qi<N.qs.length-1){ N.qi++; view='q'; }
    else view='tags';
    render(); return;
  }
  if(a==='things'){ view='pick'; render(); return; }
  if(a==='pick'){ view='pick'; render(); return; }
  if(a==='undo'){ N.items.pop(); view='pick'; render(); return; }
  if(a==='savor'){ view='savor'; render(); return; }

  if(a==='keep'){
    var it={k:N.cat,t:N.text.trim()};
    N.items.push(it);
    S.hist.push({k:it.k,t:it.t,d:Date.now()});
    save(); saveThing(it,N.items.length); burst(16);
    if(N.items.length<3){ N.cat=null; N.text=''; view='pick'; }
    else{
      N.extra=EXTRAS[S.nights%EXTRAS.length];
      N.etext=''; view='extra';
    }
    render(); return;
  }

  if(a==='edone'||a==='skip'){
    if(a==='edone'&&(N.extra.k==='thanks'||N.extra.k==='letter')){ S.told++; N.a.__told=1; }
    S.checks.push({
      d:Date.now(), px:+N.px.toFixed(2), py:+N.py.toFixed(2), q:N.quad,
      w:N.words.slice(), a:Object.assign({},N.a),
      with:N.withw.map(function(i){return WITH[i];}), where:(N.wherew!==null?WHERE[N.wherew]:null)
    });
    S.nights++; save(); burst(46); view='done'; render();
    saveCheckin();
    tickHabit().then(function(ok){
      var f=document.getElementById('tickline');
      if(f) f.textContent = ok ? 'Ticked on the board.' : (cloud?'Saved here, but the board tick did not land.':'Saved in this browser only.');
    });
    return;
  }

  if(a==='board'){ location.href='habit-modules.html?done=tnt'; return; }
  if(a==='restart'){ N=null; view='start'; render(); return; }
}

    if(b) b.addEventListener('click',doSignIn);
    var pw=document.getElementById('pass');
    if(pw) pw.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); doSignIn(); } });
  }
  render();
})();
</script>
