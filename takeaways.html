<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takeaways &middot; ProjectYou</title>
<style>
  :root{--ink:#1f2a44;--muted:#5b6472;--line:#e3e7ee;--bg:#eef1f6;--card:#fff;--key:#c2c8d1;--accent:#3f6f8f}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;display:flex;flex-direction:column;overflow:hidden}
  a{color:inherit}
  /* shared ProjectYou nav */
  .pynav{flex:none;background:#fff;border-bottom:1px solid #e3e7ee;display:flex;align-items:center;flex-wrap:nowrap;overflow-x:auto;padding:6px 12px;gap:1px;z-index:30}
  .pynav::-webkit-scrollbar{height:0}
  .pn-logo{display:flex;align-items:center;margin-right:5px;flex:none}
  .pn-logo img{height:28px;width:auto;display:block}
  .pn-group{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;padding:2px 7px;margin:2px 0;border-left:1px solid #edf0f4;flex:none}
  .pn-group.first{border-left:none}
  .pn-label{font-size:8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#aab2bd;white-space:nowrap;padding-left:3px}
  a.pn-label{text-decoration:none;cursor:pointer}a.pn-label:hover{color:var(--accent)}a.pn-label.on{color:var(--accent)}
  .pn-links{display:flex;gap:1px;align-items:stretch}
  .pn-link{font-size:11.5px;font-weight:700;color:#5b6472;text-decoration:none;padding:3px 6px;border-radius:7px;white-space:normal;text-align:center;line-height:1.08;display:inline-flex;align-items:center;flex:none}
  .pn-link:hover{background:#eef2f8;color:#3f6f8f}.pn-link.on{background:#3f6f8f;color:#fff}.pn-link.pn-solo{min-height:31px}
  .pn-ver{margin-left:auto;font-size:10.5px;font-weight:700;color:#9aa6b4;font-variant-numeric:tabular-nums;padding:0 6px;flex:none}
  .pn-user{display:flex;align-items:center;gap:8px;background:#f4f6f9;border:1px solid #e3e7ee;border-radius:999px;padding:3px 11px 3px 3px;margin-left:6px;flex:none}
  .pn-ava{width:30px;height:30px;border-radius:50%;overflow:hidden;border:2px solid #4cc07a;flex:none;background:#dfe7f0}
  .pn-ava img{width:100%;height:100%;object-fit:cover;display:block}
  .pn-uinfo{display:flex;flex-direction:column;line-height:1.05}
  .pn-uname{font-size:12px;font-weight:800;color:#1f2a44}
  .pn-usub{font-size:8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#2f8f5b}
  .pn-dot{width:9px;height:9px;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 2px #d7f0e0}
  .pn-drop{position:relative;display:inline-flex;align-items:stretch}.pn-dropbtn{cursor:pointer;user-select:none}
  .pn-menu{position:fixed;background:#fff;border:1px solid #e3e7ee;border-radius:9px;box-shadow:0 10px 28px rgba(31,42,68,.16);padding:5px;display:none;flex-direction:column;min-width:200px;z-index:60}
  .pn-menu.open{display:flex}.pn-menu .pn-link{white-space:nowrap;text-align:left;justify-content:flex-start;padding:6px 9px}

  /* the tile IS the card. no wrapper, no second frame. */
  .shell{flex:1;min-height:0;display:flex;flex-direction:column}
  .picker{flex:none;display:flex;gap:6px;overflow-x:auto;padding:9px 14px 8px;scrollbar-width:none;background:transparent}
  .picker::-webkit-scrollbar{height:0}
  .pk{flex:none;font-size:11.5px;font-weight:800;color:#7b8593;background:none;border:none;border-bottom:2px solid transparent;padding:3px 4px 4px;cursor:pointer;font-family:inherit;white-space:nowrap;line-height:1.2}
  .pk:hover{color:var(--accent)}
  .pk.on{color:var(--ink);border-bottom-color:var(--ink)}

  .frame{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:4px 62px 4px}
  /* size to the artwork itself, so the shadow hugs the tile and never leaves
     pale bands above and below it on a narrow screen */
  .tile{max-height:100%;max-width:100%;height:auto;width:auto;display:block;border-radius:14px;box-shadow:0 10px 34px rgba(31,42,68,.14);cursor:zoom-in}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:74px;border:none;border-radius:12px;background:rgba(255,255,255,.86);color:#5b6472;font-size:24px;font-weight:400;cursor:pointer;box-shadow:0 4px 14px rgba(31,42,68,.13);font-family:inherit}
  .arrow:hover{background:#fff;color:var(--accent)}
  .arrow:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .arrow.l{left:10px}.arrow.r{right:10px}

  .bar{flex:none;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 14px 14px;flex-wrap:wrap}
  .dots{display:flex;gap:7px}
  .dot{width:8px;height:8px;border-radius:50%;background:#d3d9e2;cursor:pointer;border:none;padding:0}
  .dot.on{background:var(--accent);width:22px;border-radius:5px}
  .cnt{font-size:11.5px;font-weight:800;color:#9aa6b4;font-variant-numeric:tabular-nums}
  .nowcard{font-size:12.5px;font-weight:800;color:var(--ink)}
  .nowcard .cat{font-weight:700;color:#9aa6b4;font-size:10px;letter-spacing:.9px;text-transform:uppercase;margin-left:7px}

  .zoom{position:fixed;inset:0;background:rgba(20,26,40,.92);display:none;align-items:center;justify-content:center;z-index:90;padding:14px;cursor:zoom-out}
  .zoom.on{display:flex}
  .zoom img{max-width:97vw;max-height:96vh;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  @media(max-width:640px){
    .frame{padding:2px 8px}
    .arrow{display:none}
    .picker{padding:7px 12px 6px}
  }
</style>
</head>
<body>
  <div class="pynav">
    <a href="mission.html" class="pn-logo"><img src="project-you-logo.png" alt="Project YOU"></a>
    <span class="pn-group first"><span class="pn-label">To Do List</span><span class="pn-links"><a href="index.html" class="pn-link">Todays<br>Tasks</a><a href="all-todos.html" class="pn-link">All<br>ToDos</a><a href="staging-area.html" class="pn-link">Staging<br>Area</a></span></span>
    <span class="pn-group"><span class="pn-label">Habit Modules</span><span class="pn-links"><a href="habit-modules.html" class="pn-link on">Cue Cards</a></span></span>
    <span class="pn-group"><span class="pn-label">Quantified Self</span><span class="pn-links"><a href="qs-dashboard.html" class="pn-link">QS Dashboard</a></span></span>
    <span class="pn-group"><span class="pn-label">Operating System</span><span class="pn-links"><a href="build.html" class="pn-link">Components</a><a href="automated-tracking.html" class="pn-link">Automated<br>Tracking</a><span class="pn-drop"><span class="pn-link pn-dropbtn" tabindex="0">Maps &#9662;</span><span class="pn-menu"><a href="maps.html" class="pn-link">Overview</a><a href="dfd.html" class="pn-link">Data Flow Diagram</a><a href="blueprint.html" class="pn-link">Knowledge Graph</a><a href="knowledge-graph.html" class="pn-link">Interactive Knowledge Graph</a><a href="architecture-map.html" class="pn-link">Architecture Map</a></span></span><a href="mission.html" class="pn-link">Mission<br>Control</a><a href="library.html" class="pn-link">Docs<br>Library</a></span></span>
    <span class="pn-ver">v1.2</span>
    <div class="pn-user"><div class="pn-ava"><img src="scott-avatar.jpg" alt="Scott"></div><div class="pn-uinfo"><div class="pn-uname">Scott</div><div class="pn-usub">Signed in</div></div><span class="pn-dot"></span></div>
  </div>

  <div class="shell">
    <div class="picker" id="picker"></div>
    <div class="frame">
      <button class="arrow l" id="btnBack" aria-label="Previous tile">&#8249;</button>
      <img class="tile" id="tileimg" alt="">
      <button class="arrow r" id="btnNext" aria-label="Next tile">&#8250;</button>
    </div>
    <div class="bar">
      <span class="nowcard" id="nowcard"></span>
      <span class="dots" id="dots"></span>
      <span class="cnt" id="cnt"></span>
    </div>
  </div>

  <div class="zoom" id="zoom"><img id="zoomimg" alt=""></div>

<script>
/* ===== Takeaways v1.2 =====
   The tile IS the card. No wrapper card, no second frame: the artwork fills
   the window between the nav and the control bar. One tile at a time, the
   same reading rhythm as the AI Insights deck. Moving past the last tile of a
   card rolls into the next card, so the whole library reads as one run of 58.
   Every tile is the artwork exactly as it appears in the Gold Standard Master
   Cue Cards Library PDF, cropped to the tile border. Nothing outside a tile
   border in that PDF is used. */
const CARDS=[
 {slug:"stability",           name:"Stability",             cat:"Physical Health",      tiles:5},
 {slug:"sleep",               name:"Sleep",                 cat:"Physical Health",      tiles:5},
 {slug:"meditation",          name:"Meditation",            cat:"Mental Fitness",       tiles:5},
 {slug:"creativity-movement", name:"Creativity & Movement", cat:"Physical Health",      tiles:5},
 {slug:"cathedral-effect",    name:"The Cathedral Effect",  cat:"Environmental Health", tiles:5},
 {slug:"standing-desk",       name:"Standing Desk",         cat:"Environmental Health", tiles:5},
 {slug:"focus-mode",          name:"Focus Mode",            cat:"Environmental Health", tiles:5},
 {slug:"power-of-play",       name:"The Power of Play",     cat:"Recreational Health",  tiles:4},
 {slug:"standing-desk-2",     name:"Standing Desk",         cat:"Environmental Health", tiles:5},
 {slug:"sense-of-purpose",    name:"Sense of Purpose",      cat:"Sense of Purpose",     tiles:5},
 {slug:"helping-others",      name:"Helping Others",        cat:"Sense of Purpose",     tiles:4},
 {slug:"practice-gratitude",  name:"Practice Gratitude",    cat:"Emotional Health",     tiles:5}
];
const BASE="assets/takeaways/";
function url(slug,t){return BASE+slug+'-'+t+'.webp';}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let ci=0, ti=1;

document.getElementById('picker').innerHTML=CARDS.map(function(x,i){
  return '<button class="pk" data-c="'+i+'">'+esc(x.name)+'</button>';
}).join('');

function render(){
  const c=CARDS[ci];
  document.querySelectorAll('.pk').forEach(function(b,i){b.classList.toggle('on',i===ci);});
  let d='';
  for(let j=1;j<=c.tiles;j++) d+='<button class="dot'+(j===ti?' on':'')+'" data-t="'+j+'" aria-label="Tile '+j+' of '+c.tiles+'"></button>';
  document.getElementById('dots').innerHTML=d;
  document.getElementById('nowcard').innerHTML=esc(c.name)+'<span class="cat">'+esc(c.cat)+'</span>';
  document.getElementById('cnt').textContent=ti+' / '+c.tiles;
  const im=document.getElementById('tileimg');
  im.src=url(c.slug,ti);
  im.alt=c.name+', tile '+ti+' of '+c.tiles;
  const on=document.querySelector('.pk.on');
  if(on&&on.scrollIntoView) on.scrollIntoView({block:'nearest',inline:'center'});
  const n=step(1,true);
  if(n){const pre=new Image(); pre.src=url(CARDS[n.ci].slug,n.ti);}
}
/* where a move lands. peek=true means work it out but do not apply it */
function step(d,peek){
  let nc=ci, nt=ti+d;
  if(nt<1){ nc=ci-1; if(nc<0)nc=CARDS.length-1; nt=CARDS[nc].tiles; }
  if(nt>CARDS[nc].tiles){ nc=ci+1; if(nc>=CARDS.length)nc=0; nt=1; }
  if(!peek){ ci=nc; ti=nt; render(); }
  return {ci:nc,ti:nt};
}

document.getElementById('picker').addEventListener('click',function(e){
  const b=e.target.closest('.pk'); if(!b)return; ci=parseInt(b.dataset.c,10); ti=1; render();
});
document.getElementById('dots').addEventListener('click',function(e){
  const b=e.target.closest('.dot'); if(!b)return; ti=parseInt(b.dataset.t,10); render();
});
document.getElementById('btnBack').onclick=function(){step(-1);};
document.getElementById('btnNext').onclick=function(){step(1);};
document.getElementById('tileimg').onclick=function(){
  document.getElementById('zoomimg').src=this.src;
  document.getElementById('zoomimg').alt=this.alt;
  document.getElementById('zoom').classList.add('on');
};
document.getElementById('zoom').onclick=function(){this.classList.remove('on');document.getElementById('zoomimg').src='';};
document.addEventListener('keydown',function(e){
  const z=document.getElementById('zoom');
  if(e.key==='Escape'&&z.classList.contains('on')){z.classList.remove('on');return;}
  if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}
  else if(e.key==='ArrowRight'){e.preventDefault();step(1);}
});
(function(){
  let x0=null,y0=null;
  const st=document.querySelector('.shell');
  st.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  st.addEventListener('touchend',function(e){
    if(x0===null)return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>44&&Math.abs(dx)>Math.abs(dy)) step(dx<0?1:-1);
    x0=null;y0=null;
  },{passive:true});
})();

render();
</script>
<script src="nav-config.js"></script><script src="navpatch.js"></script>
</body>
</html>
