name: Publish pages from Supabase

on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub throttles this to roughly hourly. The repository_dispatch below is what makes a publish land immediately.
  workflow_dispatch:         # lets you run it on demand from the Actions tab
  repository_dispatch:
    types: [publish-pages]   # fired the moment a page is written to the Supabase pages table

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull changed pages from Supabase and write files
        env:
          SB_URL: https://arnjntspmrhigodlssbn.supabase.co
          SB_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFybmpudHNwbXJoaWdvZGxzc2JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMTQ0NTgsImV4cCI6MjEwMTg5MDQ1OH0.UN4JMuoKaAWQfhiCstuoOJQ1sVU2hU5pK0tLBY60dfM
        run: |
          set -e
          curl -s "$SB_URL/rest/v1/pages?select=path,gzb64" \
            -H "apikey: $SB_ANON" -H "Authorization: Bearer $SB_ANON" > pages.json
          node -e '
            const fs=require("fs"), zlib=require("zlib");
            const rows=JSON.parse(fs.readFileSync("pages.json","utf8"));

            // ---- version guard -------------------------------------------------
            // Reads the visible version marker out of a page. Checks the three
            // places these pages carry it, in the order they are most reliable.
            function verOf(html){
              if(!html) return null;
              const pats=[/<div class="badge">[^<]*?v(\d+)\.(\d+)/,
                          /class="ver">\s*v(\d+)\.(\d+)/,
                          /class="pn-ver">\s*v(\d+)\.(\d+)/];
              for(const p of pats){ const m=html.match(p); if(m) return [ +m[1], +m[2] ]; }
              return null;
            }
            const older=(a,b)=> a[0]<b[0] || (a[0]===b[0] && a[1]<b[1]);   // a is older than b
            // --------------------------------------------------------------------

            let n=0; const blocked=[];
            for (const r of rows){
              if(!r || !r.path || !r.gzb64) continue;
              if(r.path.includes("/") || r.path.includes("..") || r.path.startsWith("__")) continue;
              if(!/^[A-Za-z0-9._-]+$/.test(r.path)) continue;
              let html; try { html=zlib.gunzipSync(Buffer.from(r.gzb64,"base64")).toString("utf8"); } catch (e) { console.log("SKIP corrupt", r.path, e.code||e.message); continue; }

              // Refuse to overwrite a newer published page with an older one.
              const incoming=verOf(html);
              const current= fs.existsSync(r.path) ? verOf(fs.readFileSync(r.path,"utf8")) : null;
              if(incoming && current && older(incoming,current)){
                const msg=`${r.path}: incoming v${incoming.join(".")} is OLDER than published v${current.join(".")}`;
                console.log("BLOCKED", msg);
                blocked.push(msg);
                continue;
              }

              fs.writeFileSync(r.path, html);
              console.log("wrote", r.path, html.length, incoming?("v"+incoming.join(".")):"(no version marker)");
              n++;
            }
            console.log("total files written:", n);

            // Leave a visible, self-clearing record of anything the guard stopped.
            if(blocked.length){
              fs.writeFileSync("PUBLISH-BLOCKED.md",
                "# Publish blocked\n\nThe version guard refused to overwrite newer published pages with older ones.\n\n"+
                blocked.map(b=>"- "+b).join("\n")+
                "\n\nThis usually means something published from a stale copy. Republish from the current version to clear this file.\n");
              console.log("::warning::Version guard blocked "+blocked.length+" page(s). See PUBLISH-BLOCKED.md");
            } else if (fs.existsSync("PUBLISH-BLOCKED.md")) {
              fs.unlinkSync("PUBLISH-BLOCKED.md");
              console.log("cleared PUBLISH-BLOCKED.md");
            }

            for(const fp of fs.readdirSync(".")){if(!fp.endsWith(".html"))continue;let h=fs.readFileSync(fp,"utf8");if(h.indexOf("navpatch.js")===-1&&h.indexOf("</body>")!==-1){fs.writeFileSync(fp,h.replace("</body>","<script src=\"nav-config.js\"></script><script src=\"navpatch.js\"></script></body>"));console.log("navpatch+",fp);}}
          '
          rm -f pages.json

      - name: Commit and push if anything changed
        run: |
          git config user.name "supabase-publish-bot"
          git config user.email "supabase-publish-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish pages from Supabase [skip ci]"
            git push
          fi
