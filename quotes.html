<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clever Phrases · ProjectYou</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--ink:#1f2a44;--muted:#5b6472;--line:#e3e7ee;--bg:#eef1f6;--card:#fff;--accent:#3f6f8f;--accent2:#2f5a74;--chip:#eef2f8;--gold:#d9a400;--hot:#c0453b;--green:#1e8e5a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
  .nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;align-items:center;padding:9px 14px;flex-wrap:wrap}
  .nav .brand{font-weight:800;color:var(--accent);margin-right:8px;font-size:14px}
  .nav a{font-size:12.5px;font-weight:700;color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px}
  .nav a:hover{background:var(--chip);color:var(--accent)} .nav a.on{background:var(--accent);color:#fff}
  .nav .who{margin-left:auto;font-size:11.5px;color:var(--muted)}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 50px}
  .tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .tools input,.tools select{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
  #q{flex:1;min-width:180px}
  .btn{font-family:inherit;font-weight:700;border:none;border-radius:10px;padding:10px 14px;cursor:pointer;font-size:14px;background:var(--accent);color:#fff}
  .count{font-size:12px;color:var(--muted);margin-bottom:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;position:relative;box-shadow:0 6px 16px rgba(31,42,68,.06)}
  .qcard .txt{font-size:15.5px;font-weight:700;line-height:1.3;padding-right:22px}
  .qcard .mean{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}
  .qcard .tag{display:inline-block;margin-top:9px;font-size:11px;font-weight:700;color:var(--accent);background:var(--chip);border-radius:999px;padding:3px 9px}
  .star{position:absolute;top:11px;right:12px;font-size:17px;cursor:pointer;color:var(--line)} .star.on{color:var(--gold)}
  .add{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:14px 15px;margin-bottom:16px}
  .add .r{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .add input{font-family:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:10px}
  .add #nt{flex:2;min-width:180px}.add #nm{flex:2;min-width:180px}.add #ng{flex:1;min-width:120px}
  #login{max-width:340px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 14px 40px rgba(31,42,68,.16)}
  #login h1{font-size:18px;color:var(--accent);margin-bottom:4px}#login p{font-size:12.5px;color:var(--muted);margin-bottom:14px}
  #login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;font-size:14px;font-family:inherit}
  #login .err{color:var(--hot);font-size:12.5px;min-height:16px}
  .badge{position:fixed;right:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:11px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}.toast.show{opacity:1}
  .hidden{display:none}
</style>
</head>
<body>
<div id="login">
  <h1>Clever Phrases</h1><p>Sign in to your ProjectYou account.</p>
  <input id="email" type="email" placeholder="email"><input id="pass" type="password" placeholder="password">
  <button class="btn" style="width:100%" onclick="signIn()">Sign in</button><div class="err" id="loginErr"></div>
</div>

<div id="app" class="hidden">
  <div class="nav"><span class="brand">SER</span>
    <a href="index.html">CrushingIt</a><a href="ai.html">AI Deck</a>
    <a href="quotes.html" class="on">Clever Phrases</a><a href="mission.html">Mission Control</a>
    <span class="who" id="who"></span></div>
  <div class="wrap">
    <div class="add">
      <b>Add a phrase</b>
      <div class="r">
        <input id="nt" placeholder="the phrase or quote">
        <input id="nm" placeholder="what it means (optional)">
        <input id="ng" placeholder="category">
        <button class="btn" onclick="addQuote()">Add</button>
      </div>
    </div>
    <div class="tools">
      <input id="q" placeholder="Search phrases…" oninput="draw()">
      <select id="tag" onchange="draw()"><option value="">All categories</option></select>
      <button class="btn" style="background:var(--green)" onclick="markDone()">Done today ✓</button>
    </div>
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="badge">Clever Phrases v1.1</div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL="https://arnjntspmrhigodlssbn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFybmpudHNwbXJoaWdvZGxzc2JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMTQ0NTgsImV4cCI6MjEwMTg5MDQ1OH0.UN4JMuoKaAWQfhiCstuoOJQ1sVU2hU5pK0tLBY60dfM";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let ALL=[];
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(session)onLogin(session);}
async function signIn(){const email=document.getElementById('email').value.trim();const pass=document.getElementById('pass').value;
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){document.getElementById('loginErr').textContent=error.message;return;}onLogin(data.session);}
async function onLogin(session){try{await sb.realtime.setAuth(session.access_token);}catch(e){}
  document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');
  document.getElementById('who').textContent=session.user.email;load();}
async function load(){
  const {data}=await sb.from('quotes').select('*').order('created_at',{ascending:false});
  ALL=data||[];
  const tags=[...new Set(ALL.flatMap(q=>q.tags||[]))].sort();
  const sel=document.getElementById('tag');
  sel.innerHTML='<option value="">All categories</option>'+tags.map(t=>'<option>'+esc(t)+'</option>').join('');
  draw();
}
function draw(){
  const term=document.getElementById('q').value.toLowerCase();
  const tag=document.getElementById('tag').value;
  const list=ALL.filter(q=>{
    const hit=(q.text||'').toLowerCase().includes(term)||(q.meaning||'').toLowerCase().includes(term);
    const tg=!tag||(q.tags||[]).includes(tag);
    return hit&&tg;
  });
  document.getElementById('count').textContent=list.length+' of '+ALL.length+' phrases';
  document.getElementById('grid').innerHTML=list.map(q=>{
    const tag=(q.tags&&q.tags[0])?'<span class="tag">'+esc(q.tags[0])+'</span>':'';
    return '<div class="qcard"><span class="star '+(q.favorite?'on':'')+'" onclick="fav(\''+q.id+'\','+(!q.favorite)+')">★</span>'+
      '<div class="txt">'+esc(q.text)+'</div>'+(q.meaning?'<div class="mean">'+esc(q.meaning)+'</div>':'')+tag+'</div>';
  }).join('');
}
async function fav(id,val){await sb.from('quotes').update({favorite:val}).eq('id',id);
  const q=ALL.find(x=>x.id===id);if(q)q.favorite=val;draw();}
async function addQuote(){
  const t=document.getElementById('nt').value.trim();if(!t)return;
  const m=document.getElementById('nm').value.trim();const g=document.getElementById('ng').value.trim();
  const {error}=await sb.from('quotes').insert({text:t,meaning:m||null,tags:g?[g]:[],source_module:'manual'});
  if(error){toast('Error: '+error.message);return;}
  document.getElementById('nt').value='';document.getElementById('nm').value='';document.getElementById('ng').value='';
  toast('Added.');load();
}
async function markDone(){
  const today=new Date().toISOString().slice(0,10);
  const {data}=await sb.from('todos').select('id').eq('is_habit',true).eq('bucket','today').ilike('task','%Clever Phrases%').limit(1);
  if(data&&data.length){await sb.from('todos').update({done:true,done_at:new Date().toISOString(),status:'done',for_date:today}).eq('id',data[0].id);toast('Clever Phrases habit ticked in CrushingIt. ✓');}
  else{toast('Marked done. (No Clever Phrases habit row found.)');}
}
boot();
</script>
</body>
</html>
