<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Fitness</title>
<meta name="pn-ver" content="v1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --ground:#f0eeea; --surface:#ffffff; --surface-2:#f7f5f2;
  --line:#e0dcd6; --line-soft:#ebe7e2;
  --ink:#26313a; --ink-2:#4d5a64; --muted:#848d95;
  --blue:#3f6f8f; --blue-soft:#e3ecf2;
  --warm:#c06a35; --warm-soft:#f8e9dd;
  --good:#3f7d5f; --good-soft:#e2efe8;
  --on-dark:#ffffff;
  --shadow:0 1px 2px rgba(38,49,58,.05), 0 14px 38px -24px rgba(38,49,58,.55);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#16191c; --surface:#1e2328; --surface-2:#242a30;
    --line:#333a41; --line-soft:#2b3138;
    --ink:#e8eaec; --ink-2:#bcc3c9; --muted:#8b949b;
    --blue:#8bbad8; --blue-soft:#22303a;
    --warm:#e29a63; --warm-soft:#33251a;
    --good:#7ec09a; --good-soft:#1d2b24;
    --on-dark:#14181b;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 38px -24px rgba(0,0,0,.95);
  }
}
:root[data-theme="dark"]{
  --ground:#16191c; --surface:#1e2328; --surface-2:#242a30;
  --line:#333a41; --line-soft:#2b3138;
  --ink:#e8eaec; --ink-2:#bcc3c9; --muted:#8b949b;
  --blue:#8bbad8; --blue-soft:#22303a;
  --warm:#e29a63; --warm-soft:#33251a;
  --good:#7ec09a; --good-soft:#1d2b24;
  --on-dark:#14181b;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 38px -24px rgba(0,0,0,.95);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:calc(var(--navh,0px) + 34px) 20px 80px}

.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 20px;flex-wrap:wrap}
.head h1{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:800;font-size:26px;
  letter-spacing:-.02em;margin:0}
.head .date{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);letter-spacing:.04em}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.art{background:var(--surface-2);border-bottom:1px solid var(--line-soft);padding:14px 0 6px;
  display:flex;align-items:center;justify-content:center}
.art svg{width:100%;max-width:280px;height:auto;display:block}
.art .ln{fill:none;stroke:var(--ink-2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.art .ac{fill:none;stroke:var(--warm);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.art .fillsoft{fill:var(--blue-soft);stroke:none}
.art .fillwarm{fill:var(--warm-soft);stroke:none}
.art .dot{fill:var(--warm);stroke:none}

.body{padding:24px 24px 22px}
.chips{display:flex;gap:8px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
.chip{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;padding:4px 11px;border-radius:99px}
.chip.dare{background:var(--warm-soft);color:var(--warm)}
.chip.thought{background:var(--blue-soft);color:var(--blue)}
.mins{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}
h2{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;
  font-size:clamp(23px,5.2vw,30px);line-height:1.14;letter-spacing:-.022em;margin:0 0 12px;text-wrap:balance}
.txt{font-size:17px;color:var(--ink-2);margin:0}

.acts{display:flex;gap:10px;padding:0 24px 22px;flex-wrap:wrap}
.b{font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;border-radius:11px;padding:13px 20px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:transform .08s ease,filter .12s ease}
.b:active{transform:scale(.97)}
.b:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.b.did{flex:1 1 auto;background:var(--good);border-color:var(--good);color:var(--on-dark)}
.b.did:hover{filter:brightness(1.07)}
.b.did[disabled]{opacity:.55;cursor:default}
.b.kill{color:var(--muted)}
.b.kill:hover{border-color:var(--warm);color:var(--warm)}

.state{padding:0 24px 22px;margin:-8px 0 0;font-size:14.5px;color:var(--good);font-weight:600;min-height:22px}
.state.warn{color:var(--warm)}
.state.muted{color:var(--muted);font-weight:400}

.foot{margin:22px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  font-size:13.5px;color:var(--muted)}
.foot .pill{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px;
  font-family:"IBM Plex Mono",monospace;font-size:12px}
.foot a{color:var(--blue);text-decoration:none;font-weight:600}
.foot a:hover{text-decoration:underline}

.load{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:40px 24px;
  text-align:center;color:var(--muted);font-size:15px}
.err{background:var(--warm-soft);border:1px solid var(--warm);color:var(--ink);border-radius:var(--r);
  padding:18px 20px;font-size:15px}
.hidden{display:none}
</style>
</head>

  </div>

  <div class="foot" id="foot"></div>
</div>

path:'<svg viewBox="0 0 260 150" role="img" aria-label="The same path walked again and again"><path class="ln" d="M24 122c40 0 44-32 84-32s44-32 84-32 40-16 44-16" stroke-dasharray="2 10"/><ellipse class="dot" cx="52" cy="118" rx="6" ry="9" transform="rotate(-18 52 118)"/><ellipse class="dot" cx="86" cy="106" rx="6" ry="9" transform="rotate(-18 86 106)" opacity=".8"/><ellipse class="dot" cx="122" cy="92" rx="6" ry="9" transform="rotate(-18 122 92)" opacity=".62"/><ellipse class="dot" cx="158" cy="78" rx="6" ry="9" transform="rotate(-18 158 78)" opacity=".44"/><ellipse class="dot" cx="196" cy="64" rx="6" ry="9" transform="rotate(-18 196 64)" opacity=".26"/></svg>',
mirror:'<svg viewBox="0 0 260 150" role="img" aria-label="A thought circling in a head"><path class="fillsoft" d="M96 128V104c-16-10-26-28-26-46a48 48 0 0 1 96 0c0 10-4 16-4 24 0 6 8 8 8 14s-10 6-10 12 4 8 4 14-8 10-20 10z"/><path class="ln" d="M96 128V104c-16-10-26-28-26-46a48 48 0 0 1 96 0c0 10-4 16-4 24 0 6 8 8 8 14s-10 6-10 12 4 8 4 14-8 10-20 10z"/><path class="ac" d="M96 62c0-12 10-20 22-20s22 8 22 20-10 20-22 20c-6 0-11-2-15-5"/><path class="ac" d="M103 71l-4 10 11 1"/></svg>',
voice:'<svg viewBox="0 0 260 150" role="img" aria-label="A voice carrying"><circle class="fillwarm" cx="84" cy="76" r="26"/><circle class="ln" cx="84" cy="76" r="26"/><path class="ln" d="M84 62v28M76 70v12M92 70v12"/><path class="ac" d="M124 52a34 34 0 0 1 0 48"/><path class="ac" d="M148 38a58 58 0 0 1 0 76"/><path class="ac" d="M172 24a82 82 0 0 1 0 104" opacity=".5"/></svg>',

};
function art(k){ return ART[k]||ART.thread; }

/* ---------- helpers ---------- */
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pretty(d){
  var p=d.split('-'); var dt=new Date(+p[0],+p[1]-1,+p[2]);
  return dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
}
el('date').textContent=pretty(DAY);

var current=null, ticked=false;

/* ---------- pick today's card ---------- */
async function todaysCard(){
  var served=await sb.from('deck_progress').select('tile_key').eq('deck',DECK).eq('served_on',DAY);
  if(served.error) throw served.error;
  var live=await sb.from('sf_cards').select('*').eq('active',true).eq('killed',false);
  if(live.error) throw live.error;
  var pool=live.data||[];
  if(!pool.length) return null;

  var todayKeys=(served.data||[]).map(function(r){return String(r.tile_key);});
  if(todayKeys.length){
    var already=pool.filter(function(c){return todayKeys.indexOf(String(c.id))>-1;});
    if(already.length) return already[already.length-1];
  }

  var all=await sb.from('deck_progress').select('tile_key').eq('deck',DECK);
  var seen=((all.data)||[]).map(function(r){return String(r.tile_key);});
  var fresh=pool.filter(function(c){return seen.indexOf(String(c.id))===-1;});
  var from=fresh.length?fresh:pool;

  /* Mostly dares, sometimes a thought - roughly two dares to one thought. */
  var dares=from.filter(function(c){return c.kind==='dare';});
  var thoughts=from.filter(function(c){return c.kind==='thought';});
  var wantThought=(hash(DAY)%3===2);
  var bucket=(wantThought&&thoughts.length)?thoughts:(dares.length?dares:from);
  var pick=bucket[hash(DAY+'|'+bucket.length)%bucket.length];

  await sb.from('deck_progress').insert({deck:DECK,tile_key:String(pick.id),served_on:DAY});
  sb.from('sf_cards').update({shown_count:(pick.shown_count||0)+1}).eq('id',pick.id).then(function(){},function(){});
  return pick;
}
function hash(s){ var h=0; for(var i=0;i<s.length;i++){ h=((h<<5)-h+s.charCodeAt(i))|0; } return Math.abs(h); }

/* ---------- render ---------- */
function render(c){
  current=c;
  if(!c){
    el('mount').innerHTML='<div class="err">Every card has been killed. Ask Claude for a fresh batch.</div>';
    return;
  }
  el('mount').innerHTML=
    '<div class="card">'+
      '<div class="art">'+art(c.art)+'</div>'+
      '<div class="body">'+
        '<div class="chips"><span class="chip '+c.kind+'">'+(c.kind==='dare'?'Today&rsquo;s dare':'Something to sit with')+'</span>'+
          '<span class="mins">'+c.minutes+' min</span></div>'+
        '<h2>'+esc(c.title)+'</h2>'+
        '<p class="txt">'+esc(c.body)+'</p>'+
      '</div>'+
      '<div class="state muted" id="state"></div>'+
      '<div class="acts">'+
        '<button class="b did" id="did">'+(c.kind==='dare'?'I did it':'Read and taken in')+'</button>'+
        '<button class="b kill" id="kill">Not for me</button>'+
      '</div>'+
    '</div>';
  el('did').addEventListener('click',doTick);
  el('kill').addEventListener('click',doKill);
  drawFoot();
}

function say(msg,cls){ var s=el('state'); if(s){ s.textContent=msg; s.className='state '+(cls||''); } }

/* ---------- tick: insert then update, never insert already-done ---------- */
async function doTick(){
  if(!current||ticked) return;
  el('did').disabled=true;
  say('Saving...','muted');
  try{
    var found=await sb.from('todos').select('id,done')
      .eq('for_date',DAY).eq('tracker','Social Fitness').limit(1);
    var id=(found.data&&found.data[0])?found.data[0].id:null;

    if(!id){
      var ins=await sb.from('todos').insert({
        task:'Social Fitness - '+current.title,
        section:'Social Well-Being',
        subsection:'Social Fitness',
        category:'Social Well-Being',
        qs_group:'Social Well-Being',
        tracker:'Social Fitness',
        is_habit:true, done:false, staged:false,
        for_date:DAY, est_minutes:current.minutes,
        ws_id:WS_ID, source_project:'social-fitness'
      }).select('id').single();
      if(ins.error) throw ins.error;
      id=ins.data.id;
    }
    var up=await sb.from('todos').update({
      done:true, done_at:new Date().toISOString(),
      actual_minutes:current.minutes, completed_at:new Date().toISOString()
    }).eq('id',id);
    if(up.error) throw up.error;

    ticked=true;
    say('Logged. That is on the wheel and the worksheet.','');
    el('did').textContent='Done today';
    drawFoot();
  }catch(e){
    el('did').disabled=false;
    say('That did not save. Try again in a moment.','warn');
  }
}

/* ---------- kill: retire it and deal a replacement ---------- */
async function doKill(){
  if(!current) return;
  var gone=current;
  el('kill').disabled=true;
  say('Retiring that one...','muted');
  try{
    var r=await sb.from('sf_cards').update({killed:true,killed_on:DAY}).eq('id',gone.id);
    if(r.error) throw r.error;
    await sb.from('deck_progress').delete().eq('deck',DECK).eq('served_on',DAY).eq('tile_key',String(gone.id));
    ticked=false;
    var next=await todaysCard();
    render(next);
    say('Gone for good. Here is another.','');
  }catch(e){
    el('kill').disabled=false;
    say('Could not retire that one. Try again in a moment.','warn');
  }
}

/* ---------- footer ---------- */
async function drawFoot(){
  try{
    var live=await sb.from('sf_cards').select('id',{count:'exact',head:true}).eq('killed',false).eq('active',true);
    var dead=await sb.from('sf_cards').select('id',{count:'exact',head:true}).eq('killed',true);
    var did=await sb.from('todos').select('id',{count:'exact',head:true})
      .eq('tracker','Social Fitness').eq('done',true);
    el('foot').innerHTML=
      '<span class="pill">'+(live.count||0)+' cards live</span>'+
      ((dead.count||0)?'<span class="pill">'+dead.count+' retired</span>':'')+
      '<span class="pill">'+(did.count||0)+' done so far</span>'+
      '<a href="habit-modules.html">All modules</a>';
  }catch(e){ }
}

/* ---------- go ---------- */
(async function(){
  try{ render(await todaysCard()); }
  catch(e){
    el('mount').innerHTML='<div class="err">Could not reach your cards just now. Refresh in a moment.</div>';
  }
})();
})();
</script>
