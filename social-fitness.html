<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --ground:#f0eeea; --surface:#ffffff; --surface-2:#f7f5f2;
  --line:#e0dcd6; --line-soft:#ebe7e2;
  --ink:#26313a; --ink-2:#4d5a64; --muted:#848d95;
  --blue:#3f6f8f; --blue-soft:#e3ecf2;
  --warm:#c06a35; --warm-soft:#f8e9dd;
  --good:#3f7d5f; --good-soft:#e2efe8;
  --on-dark:#ffffff;
  --shadow:0 1px 2px rgba(38,49,58,.05), 0 14px 38px -24px rgba(38,49,58,.55);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#16191c; --surface:#1e2328; --surface-2:#242a30;
    --line:#333a41; --line-soft:#2b3138;
    --ink:#e8eaec; --ink-2:#bcc3c9; --muted:#8b949b;
    --blue:#8bbad8; --blue-soft:#22303a;
    --warm:#e29a63; --warm-soft:#33251a;
    --good:#7ec09a; --good-soft:#1d2b24;
    --on-dark:#14181b;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 38px -24px rgba(0,0,0,.95);
  }
}
:root[data-theme="dark"]{
  --ground:#16191c; --surface:#1e2328; --surface-2:#242a30;
  --line:#333a41; --line-soft:#2b3138;
  --ink:#e8eaec; --ink-2:#bcc3c9; --muted:#8b949b;
  --blue:#8bbad8; --blue-soft:#22303a;
  --warm:#e29a63; --warm-soft:#33251a;
  --good:#7ec09a; --good-soft:#1d2b24;
  --on-dark:#14181b;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 38px -24px rgba(0,0,0,.95);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:calc(var(--navh,0px) + 34px) 20px 80px}

.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 20px;flex-wrap:wrap}
.head h1{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:800;font-size:26px;
  letter-spacing:-.02em;margin:0}
.head .date{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);letter-spacing:.04em}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.art{background:var(--surface-2);border-bottom:1px solid var(--line-soft);padding:14px 0 6px;
  display:flex;align-items:center;justify-content:center}
.art svg{width:100%;max-width:280px;height:auto;display:block}
.art .ln{fill:none;stroke:var(--ink-2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.art .ac{fill:none;stroke:var(--warm);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.art .fillsoft{fill:var(--blue-soft);stroke:none}
.art .fillwarm{fill:var(--warm-soft);stroke:none}
.art .dot{fill:var(--warm);stroke:none}

.body{padding:24px 24px 20px}
.body .src{font-size:11px;color:#8a93a0;margin-top:16px;font-style:italic}
.chips{display:flex;gap:8px;align-items:center;margin:0 0 14px;flex-wrap:wrap}
.chip{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;padding:4px 11px;border-radius:99px}
.chip.dare{background:var(--warm-soft);color:var(--warm)}
.chip.thought{background:var(--blue-soft);color:var(--blue)}
.mins{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}
h2{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;font-weight:700;
  font-size:clamp(23px,5.2vw,30px);line-height:1.14;letter-spacing:-.022em;margin:0 0 12px;text-wrap:balance}
.txt{font-size:17px;color:var(--ink-2);margin:0}

.took{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 24px 4px;
  font-size:14.5px;color:var(--ink-2)}
.took input{width:66px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;
  font-size:15px;font-family:inherit;text-align:center;background:var(--surface-2);color:var(--ink)}
.took input:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}

.acts{display:flex;gap:10px;padding:14px 24px 22px;flex-wrap:wrap}
.b{font-family:inherit;font-size:16px;font-weight:600;cursor:pointer;border-radius:11px;padding:13px 18px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  transition:transform .08s ease,filter .12s ease}
.b:active{transform:scale(.97)}
.b:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.b[disabled]{opacity:.5;cursor:default}
.b.did{flex:1 1 150px;background:var(--good);border-color:var(--good);color:var(--on-dark)}
.b.did:hover{filter:brightness(1.07)}
.b.another{color:var(--blue);border-color:var(--line)}
.b.another:hover{border-color:var(--blue)}
.b.kill{color:var(--muted)}
.b.kill:hover{border-color:var(--warm);color:var(--warm)}

.state{padding:0 24px 20px;margin:-10px 0 0;font-size:14.5px;color:var(--good);font-weight:600;min-height:22px}
.state.warn{color:var(--warm)}
.state.muted{color:var(--muted);font-weight:400}

.foot{margin:22px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted)}
.foot .pill{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 12px;
  font-family:"IBM Plex Mono",monospace;font-size:12px}
.foot a{color:var(--blue);text-decoration:none;font-weight:600}
.foot a:hover{text-decoration:underline}

.load{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:40px 24px;
  text-align:center;color:var(--muted);font-size:15px}
.err{background:var(--warm-soft);border:1px solid var(--warm);color:var(--ink);border-radius:var(--r);
  padding:18px 20px;font-size:15px}
.hidden{display:none!important}

.gate{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:24px;margin:0 0 16px}
.gate h2{font-size:20px;margin:0 0 4px}
.gate p{font-size:14.5px;color:var(--ink-2);margin:0 0 16px}
.gate input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:16px;
  margin:0 0 10px;font-family:inherit;background:var(--surface-2);color:var(--ink)}
.gate button{width:100%;padding:12px;border:1px solid var(--blue);border-radius:10px;background:var(--blue);
  color:var(--on-dark);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.gate .msg{color:var(--warm);font-size:13.5px;margin-top:10px;min-height:18px}

.hist{margin:26px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.hist h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:16px;margin:0 0 3px;letter-spacing:-.01em}
.hist .sub{font-size:13.5px;color:var(--muted);margin:0 0 14px}
.dots{display:grid;grid-template-columns:repeat(15,1fr);gap:6px;margin:0 0 14px}
.dots i{aspect-ratio:1;border-radius:5px;background:var(--line-soft);display:block}
.dots i.on{background:var(--good)}
.dots i.today{outline:2px solid var(--warm);outline-offset:1px}
.hist .tot{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.hist .tot b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;color:var(--ink);line-height:1}
.hist .tot span{font-size:13.5px;color:var(--ink-2)}
.hist .due{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line-soft);font-size:13.5px;color:var(--muted)}

/* ---- keep it / how was it ---- */
.starbtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  background:none;border:1px solid var(--line);border-radius:99px;padding:4px 11px 4px 9px;
  font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted)}
.starbtn svg{width:15px;height:15px;display:block}
.starbtn svg path{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.starbtn:hover{color:var(--warm);border-color:var(--warm)}
.starbtn.on{color:var(--warm);border-color:var(--warm);background:var(--warm-soft)}
.starbtn.on svg path{fill:currentColor}
.rate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 24px 22px}
.rate .lbl{font-size:15px;color:var(--ink-2)}
.rate .stars{display:inline-flex;gap:2px}
.rate .s{background:none;border:0;cursor:pointer;padding:2px;line-height:0;color:var(--muted)}
.rate .s svg{width:29px;height:29px;display:block}
.rate .s svg path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.rate .s.lit{color:var(--warm)}
.rate .s.lit svg path{fill:currentColor}
.rate .skip{background:none;border:0;cursor:pointer;font:inherit;font-size:14px;color:var(--muted);
  text-decoration:underline;margin-left:auto}

/* ---- log a social thing ---- */
.log{margin:22px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:20px}
.log h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:19px;margin:0 0 3px;
  letter-spacing:-.015em}
.log .sub{font-size:14px;color:var(--muted);margin:0 0 16px}
.log label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:0 0 7px}
.log .fld{margin:0 0 15px}
.log input[type=text],.log input[type=date]{width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;font-size:16px;font-family:inherit;background:var(--surface-2);color:var(--ink)}
.log input:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.log .picks{display:flex;gap:7px;flex-wrap:wrap}
.log .p{font-family:inherit;font-size:14px;cursor:pointer;border:1px solid var(--line);border-radius:99px;
  padding:7px 13px;background:var(--surface);color:var(--ink-2)}
.log .p:hover{border-color:var(--blue)}
.log .p.on{background:var(--blue);border-color:var(--blue);color:var(--on-dark);font-weight:600}
.log .recent .p{color:var(--blue)}
.log .tags .p.on{background:var(--ink-2);border-color:var(--ink-2);color:var(--on-dark);font-weight:600}
.log .tags .p.tag{padding:7px 12px}
.tell{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 6px;
  padding-top:12px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--muted);
  font-family:"IBM Plex Mono",monospace;letter-spacing:.04em}
.log .go{width:100%;padding:14px;border-radius:11px;border:1px solid var(--good);background:var(--good);
  color:var(--on-dark);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.log .go.plan{background:var(--blue);border-color:var(--blue)}
.log .why{font-size:13.5px;color:var(--muted);margin:10px 0 0;min-height:19px}
.log .why.warn{color:var(--warm)}
.log .why.ok{color:var(--good);font-weight:600}
.log .soon{margin:18px 0 0;padding-top:15px;border-top:1px solid var(--line-soft)}
.log .soon h4{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:14px;margin:0 0 8px}
.log .row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);
  font-size:15px;flex-wrap:wrap}
.log .row:last-child{border-bottom:0}
.log .row .when{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);
  background:var(--surface-2);border-radius:99px;padding:3px 9px}
.log .row .sp{margin-left:auto;display:flex;gap:6px}
.log .row button{font:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);border-radius:99px;
  padding:5px 11px;background:var(--surface);color:var(--ink-2)}
.log .row .yes:hover{border-color:var(--good);color:var(--good)}
.log .row .no:hover{border-color:var(--warm);color:var(--warm)}
</style>
</head>

  <div class="foot" id="foot"></div>

function art(k){ return ART[k]||ART.thread; }

/* ---------- helpers ---------- */
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pretty(d){
  var p=d.split('-'); var dt=new Date(+p[0],+p[1]-1,+p[2]);
  return dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
}
function key(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function longDate(s){
  var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2])
    .toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
}
el('date').textContent=pretty(DAY);

var current=null, ticked=false, pool=[], passedToday=[];

/* ---------- pick today's card ---------- */
async function loadPool(){
  var live=await sb.from('sf_cards').select('*').eq('active',true).eq('killed',false);
  if(live.error) throw live.error;
  pool=live.data||[];
}
function hash(s){ var h=0; for(var i=0;i<s.length;i++){ h=((h<<5)-h+s.charCodeAt(i))|0; } return Math.abs(h); }

async function todaysCard(){
  if(!pool.length) await loadPool();
  if(!pool.length) return null;

  var served=await sb.from('deck_progress').select('tile_key').eq('deck',DECK).eq('served_on',DAY);
  var todayKeys=((served.data)||[]).map(function(r){return String(r.tile_key);});
  var standing=pool.filter(function(c){
    return todayKeys.indexOf(String(c.id))>-1 && passedToday.indexOf(c.id)===-1;
  });
  if(standing.length) return standing[standing.length-1];

  var all=await sb.from('deck_progress').select('tile_key').eq('deck',DECK);
  var seen=((all.data)||[]).map(function(r){return String(r.tile_key);});
  var avail=pool.filter(function(c){ return passedToday.indexOf(c.id)===-1; });
  if(!avail.length){ passedToday=[]; avail=pool.slice(); }
  /* Ones you rated one or two stars step aside. They only come back if nothing else is left. */
  var liked=avail.filter(function(c){ return !(c.rating>0&&c.rating<=2); });
  if(liked.length) avail=liked;

  var fresh=avail.filter(function(c){return seen.indexOf(String(c.id))===-1;});
  var from=fresh.length?fresh:avail;

  /* Mostly dares, sometimes a thought - roughly two dares to one thought. */
  var dares=from.filter(function(c){return c.kind==='dare';});
  var thoughts=from.filter(function(c){return c.kind==='thought';});
  var wantThought=(hash(DAY+'|'+passedToday.length)%3===2);
  var bucket=(wantThought&&thoughts.length)?thoughts:(dares.length?dares:from);
  var wb=weighted(bucket);
  var pick=wb[hash(DAY+'|'+passedToday.length+'|'+wb.length)%wb.length];

  await sb.from('deck_progress').upsert([{deck:DECK,tile_key:String(pick.id),served_on:DAY}],{onConflict:'deck,tile_key'});
  sb.from('sf_cards').update({shown_count:(pick.shown_count||0)+1}).eq('id',pick.id).then(function(){},function(){});
  return pick;
}

/* ---------- render ---------- */
function render(c){
  current=c;
  if(!c){
    el('mount').innerHTML='<div class="err">Every card has been retired. Ask Claude for a fresh batch.</div>';
    return;
  }
  el('mount').innerHTML=
    '<div class="card">'+
      '<div class="art">'+art(c.art)+'</div>'+
      '<div class="body">'+
        '<div class="chips"><span class="chip '+c.kind+'">'+(c.kind==='dare'?'Today&rsquo;s dare':'Something to sit with')+'</span>'+
          '<span class="mins">about '+c.minutes+' min</span>'+
          '<button class="starbtn'+(c.starred?' on':'')+'" id="star" aria-pressed="'+(c.starred?'true':'false')+'">'+
            STAR_SVG+'<span>'+(c.starred?'Kept':'Keep')+'</span></button></div>'+
        '<h2>'+esc(c.title)+'</h2>'+
        '<p class="txt">'+esc(c.body)+'</p>'+
        /* THE SOURCE LINE. The dares are not lifted from a book, they were written
           for this system, and saying so is more honest than borrowing a name. */
        '<div class="src">Source &middot; Written for Project YOU</div>'+
      '</div>'+
      '<div class="took"><label for="mins">Took me</label>'+
        '<input type="number" id="mins" min="1" max="180" step="1" value="'+c.minutes+'" inputmode="numeric">'+
        '<span>minutes</span></div>'+
      '<div class="acts">'+
        '<button class="b did" id="did">'+(c.kind==='dare'?'I did it':'Read and taken in')+'</button>'+
        '<button class="b another" id="another">Try another</button>'+
        '<button class="b kill" id="kill">Not my style</button>'+
      '</div>'+
      '<div class="state muted" id="state"></div>'+
    '</div>';
  if(el('star')) el('star').addEventListener('click',toggleStar);
  el('did').addEventListener('click',finish);
  el('another').addEventListener('click',tryAnother);
  el('kill').addEventListener('click',notMyStyle);
  el('mins').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); finish(); } });
  drawFoot();
}
function say(msg,cls){ var s=el('state'); if(s){ s.textContent=msg; s.className='state '+(cls||''); } }

/* ---------- the row on the board, same contract as every other cue card ---------- */
async function ensureRow(){
  var r=await sb.from('todos').select('id,done,actual_minutes,for_date')
    .eq('for_date',DAY).eq('tracker','Social Fitness').limit(1);
  if(r.error) throw r.error;
  if(r.data&&r.data[0]) return r.data[0];

  var ins=await sb.from('todos').insert({
    task:HABIT,
    section:'Social Well-Being', subsection:'Social Fitness',
    category:'Social Well-Being', qs_group:'Social Well-Being',
    tracker:'Social Fitness',
    is_habit:true, done:false, staged:false,
    for_date:DAY, est_minutes:current?current.minutes:10,
    ws_id:WS_ID, source_project:'social-fitness'
  }).select('id,done,actual_minutes,for_date').single();
  if(ins.error) throw ins.error;
  return ins.data;
}

/* Insert first, THEN tick. The qs_log trigger is AFTER UPDATE only, so a row
   inserted already-done never reaches the wheel. */
async function finish(){
  if(!current||ticked) return;
  if(!signedIn){ say('Sign in above first, or the tick cannot reach the wheel.','warn'); return; }
  el('did').disabled=true;
  say('Saving...','muted');
  try{
    var row=await ensureRow();
    var v=parseInt((el('mins')||{}).value,10);
    var mins=(v>0&&v<=180)?v:(current.minutes||10);
    var now=new Date().toISOString();
    var up=await sb.from('todos').update({
      done:true, status:'done', done_at:now, completed_at:now,
      actual_minutes:mins, for_date:DAY, updated_at:now
    }).eq('id',row.id);
    if(up.error) throw up.error;

    ticked=true;
    el('did').textContent='Done today';
    say('Social Fitness → wheel ✓, '+mins+' min','');
    drawFoot(); drawHist();
    askRating();
  }catch(e){
    el('did').disabled=false;
    say('That did not save. Try again in a moment.','warn');
  }
}

/* ---------- not in the mood: keep the card, show a different one ---------- */
async function tryAnother(){
  if(!current) return;
  el('another').disabled=true;
  say('Finding another...','muted');
  try{
    if(passedToday.indexOf(current.id)===-1) passedToday.push(current.id);
    var next=await todaysCard();
    render(next);
    say('Not today then. That one comes back another time.','muted');
  }catch(e){
    el('another').disabled=false;
    say('Could not swap it. Try again in a moment.','warn');
  }
}

/* ---------- not my style: retire it for good ---------- */
async function notMyStyle(){
  if(!current) return;
  var gone=current;
  el('kill').disabled=true;
  say('Retiring that one...','muted');
  try{
    var r=await sb.from('sf_cards').update({killed:true,killed_on:DAY}).eq('id',gone.id);
    if(r.error) throw r.error;
    await sb.from('deck_progress').delete().eq('deck',DECK).eq('served_on',DAY).eq('tile_key',String(gone.id));
    pool=pool.filter(function(c){return c.id!==gone.id;});
    ticked=false;
    render(await todaysCard());
    say('Gone for good. Here is another.','');
  }catch(e){
    el('kill').disabled=false;
    say('Could not retire that one. Try again in a moment.','warn');
  }
}

/* ---------- footer ---------- */
async function drawFoot(){
  try{
    var live=await sb.from('sf_cards').select('id',{count:'exact',head:true}).eq('killed',false).eq('active',true);
    var dead=await sb.from('sf_cards').select('id',{count:'exact',head:true}).eq('killed',true);
    el('foot').innerHTML=
      '<span class="pill">'+(live.count||0)+' cards live</span>'+
      ((dead.count||0)?'<span class="pill">'+dead.count+' retired</span>':'')+
      '<a href="habit-modules.html">All modules</a>';
  }catch(e){ }

/* ---------- the last 30 days ---------- */
async function drawHist(){
  try{
    var from=new Date(); from.setDate(from.getDate()-29);
    var r=await sb.from('v_social_fitness').select('day,minutes').gte('day',key(from));
    var done={}; ((r.data)||[]).forEach(function(x){ done[x.day]=(x.minutes||0); });

    var cells=[], hit=0, mins=0, streak=0;
    for(var i=29;i>=0;i--){
      var d=new Date(); d.setDate(d.getDate()-i);
      var k=key(d), on=Object.prototype.hasOwnProperty.call(done,k);
      if(on){ hit++; mins+=done[k]; }
      cells.push('<i class="'+(on?'on':'')+(k===DAY?' today':'')+'" title="'+k+(on?' - done':'')+'"></i>');
    }
    var back=0;
    while(true){
      var d2=new Date(); d2.setDate(d2.getDate()-back);
      if(Object.prototype.hasOwnProperty.call(done,key(d2))){ streak++; back++; continue; }
      if(back===0){ back++; continue; }
      break;
    }
    var due='';
    try{
      var n=await sb.from('v_sf_next_checkin').select('due').single();
      if(n.data&&n.data.due){
        var left=Math.round((new Date(n.data.due)-new Date())/86400000);
        due='<p class="due">Next check-in '+longDate(n.data.due)+
            (left>0?' - '+left+' days away':' - due now')+'.</p>';
      }
    }catch(e){}

    el('hist').innerHTML=
      '<h3>The last thirty days</h3>'+
      '<p class="sub">One square a day. Filled means you did the thing.</p>'+
      '<div class="dots">'+cells.join('')+'</div>'+
      '<div class="tot">'+
        '<span><b>'+hit+'</b> of 30 days</span>'+
        '<span><b>'+streak+'</b> in a row</span>'+
        (mins?'<span><b>'+mins+'</b> minutes</span>':'')+
      '</div>'+due;
    el('hist').classList.remove('hidden');
  }catch(e){ }
}

/* ---------- the star, and how was it ---------- */
var STAR_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.3l2.65 5.55 5.95.82-4.3 4.25 1.05 6.03L12 17.1l-5.35 2.85 1.05-6.03-4.3-4.25 5.95-.82z"/></svg>';

/* Keep it: one tap, and it comes round more often. */
async function toggleStar(){
  if(!current) return;
  var b=el('star'); if(!b) return;
  var on=!current.starred;
  b.classList.toggle('on',on);
  b.setAttribute('aria-pressed',on?'true':'false');
  var lbl=b.querySelector('span'); if(lbl) lbl.textContent=on?'Kept':'Keep';
  current.starred=on;
  for(var i=0;i<pool.length;i++){ if(pool[i].id===current.id) pool[i].starred=on; }
  var r=await sb.from('sf_cards').update({starred:on,starred_on:on?DAY:null}).eq('id',current.id);
  if(r.error){ say('The star did not save. Tap it again.','warn'); return; }
  say(on?'Kept. This one will come round more often.':'No longer kept.','muted');
}

/* Kept ones get four chances instead of one; four and five star ones get three. */
function weighted(list){
  var out=[];
  list.forEach(function(c){
    var n=1;
    if(c.starred) n+=3;
    if(c.rating>=4) n+=2;
    for(var i=0;i<n;i++) out.push(c);
  });
  return out.length?out:list;
}

function goBack(){ location.href='habit-modules.html?done=social'; }

function askRating(){
  var acts=document.querySelector('.acts');
  if(!acts){ setTimeout(goBack,700); return; }
  var st='';
  for(var i=1;i<=5;i++) st+='<button class="s" data-n="'+i+'" aria-label="'+i+' out of five">'+STAR_SVG+'</button>';
  acts.outerHTML='<div class="rate" id="rate"><span class="lbl">How was that one?</span>'+
    '<span class="stars" id="stars">'+st+'</span>'+
    '<button class="skip" id="skipRate">Skip</button></div>';
  var stars=el('stars');
  function lightUp(n){
    Array.prototype.forEach.call(stars.children,function(b,i){ b.classList.toggle('lit',i<n); });
  }
  Array.prototype.forEach.call(stars.children,function(b){
    b.addEventListener('mouseenter',function(){ lightUp(+b.getAttribute('data-n')); });
    b.addEventListener('click',function(){
      var n=+b.getAttribute('data-n');
      lightUp(n);
      sb.from('sf_cards').update({rating:n,rated_on:DAY,rating_count:(current.rating_count||0)+1})
        .eq('id',current.id).then(function(){},function(){});
      say(n<=2?'Noted. You will not see that one again unless the deck runs dry.'
              :'Noted. More like that one.','');
      setTimeout(goBack,900);
    });
  });
  stars.addEventListener('mouseleave',function(){ lightUp(0); });
  el('skipRate').addEventListener('click',goBack);
}

/* ---------- log a social thing ---------- */
var KINDS=['Coffee','Lunch','Dinner','Drinks','Call','Text','Walk','Party','Meeting','Something else'];
var pickKind='', pickWhen=DAY, known=[], knownLoaded=false;
/* Who they are. Five of the nine things connections stores describe the PERSON,
   not the get-together, so they carry forward. These are the ones the form asks
   for, because a brand-new person has nothing to carry and used to save blank. */
var PLABELS=[['family','Family'],['colleague','Colleague'],['ex-colleague','Ex-Colleague'],['industry','Industry'],['group','Group']];
var pickLabels=[], labelsTouched=false;
function labelWord(v){ for(var i=0;i<PLABELS.length;i++){ if(PLABELS[i][0]===v) return PLABELS[i][1]; } return v; }
function labelList(a){ a=(a||[]).map(labelWord);
  return a.length<2?(a[0]||''):(a.slice(0,-1).join(', ')+' and '+a[a.length-1]); }

function att(s){ return esc(s).replace(/"/g,'&quot;'); }
function shiftDay(n){
  var p=DAY.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]);
  d.setDate(d.getDate()+n); return key(d);
}
function channelFor(k){ return k==='Call'?'phone':(k==='Text'?'text':'in person'); }
/* The Who box takes anything, so tidy it before it becomes a name.
   "Chat with Zolty" is Zolty. "Luca - new colleague from Milan" is Luca,
   and the rest of that line becomes the note. */
function tidyName(s){
  var t=String(s||'').trim(), note='';
  var d=t.split(/\s+[-–—]\s+/);
  if(d.length>1){ t=d[0].trim(); note=d.slice(1).join(' - ').trim(); }
  t=t.replace(/^(?:chat|call|ring|talk|catch\s*up|coffee|lunch|dinner|breakfast|drinks|walk|meeting|party|text|message|email)\s+with\s+/i,'');
  t=t.replace(/^(?:with|at|the)\s+/i,'');
  return { name:t.trim(), note:note };
}
function whenWords(d){
  if(d===DAY) return 'today';
  if(d===shiftDay(-1)) return 'yesterday';
  if(d===shiftDay(1)) return 'tomorrow';
  return 'on '+longDate(d);
}
async function loadKnown(){
  try{
    var r=await sb.from('connections')
      .select('person,person_key,circle,social_group,labels,age_band,entity_type,happened_on')
      .eq('superseded',false).order('happened_on',{ascending:false}).limit(400);
    known=(r.data)||[]; knownLoaded=true;
  }catch(e){ known=[]; }
}
function carryFor(name){
  var n=String(name||'').trim().toLowerCase();
  for(var i=0;i<known.length;i++){
    var k=known[i];
    if(String(k.person||'').trim().toLowerCase()===n) return k;
    if(String(k.person_key||'').trim().toLowerCase()===n) return k;
  }
  return null;
}
function recentNames(){
  var seen={}, out=[];
  for(var i=0;i<known.length&&out.length<6;i++){
    var p=String(known[i].person||'').trim();
    if(!p||seen[p]) continue;
    if(known[i].entity_type&&known[i].entity_type!=='person') continue;
    seen[p]=1; out.push(p);
  }
  return out;
}
function allNames(){
  var seen={}, out=[];
  known.forEach(function(k){
    var p=String(k.person||'').trim();
    if(p&&!seen[p]){ seen[p]=1; out.push(p); }
  });
  return out;
}
function refreshGo(){
  var g=el('lgGo'); if(!g) return;
  var future=pickWhen>DAY;
  g.textContent=future?'Add to what is coming up':'Log it';
  g.classList.toggle('plan',future);
}
function paintTags(){
  var box=el('lgTags'); if(!box) return;
  Array.prototype.forEach.call(box.children,function(b){
    b.classList.toggle('on', pickLabels.indexOf(b.getAttribute('data-l'))>-1);
  });
}
function showCarry(){
  var w=el('lgWho'), note=el('lgWhoNote'); if(!w||!note) return;
  note.className='why';
  var raw=String(w.value||'').trim();
  if(!raw){
    if(!labelsTouched){ pickLabels=[]; paintTags(); }
    note.textContent='Type a name. If they are new you tag them once, right below.';
    return;
  }
  var tn=tidyName(raw), c=carryFor(tn.name), line='';
  if(tn.name!==raw) line='Filing as '+tn.name+(tn.note?', with "'+tn.note+'" as the note':'')+'. ';
  if(labelsTouched&&pickLabels.length){
    note.textContent=line+'Filing '+(tn.name||'them')+' under '+labelList(pickLabels)+'.';
    return;
  }
  if(c){
    if(!labelsTouched){ pickLabels=(c.labels||[]).slice(); paintTags(); }
    if(!c.labels||!c.labels.length){
      line+='Known already, but never tagged. Say who '+tn.name+' is and it sticks.';
    } else {
      var bits=[labelList(c.labels)];
      if(c.social_group) bits.push(c.social_group);
      if(c.circle) bits.push(c.circle+' circle');
      line+='Known already \u2014 '+bits.join(', ')+'. Tap to change it.';
    }
  } else {
    if(!labelsTouched){ pickLabels=[]; paintTags(); }
    line+='New here. Say who '+(tn.name||'they')+' is once and it fills itself in every time after.';
  }
  note.textContent=line;
}

        '</div>':'')+
    '</div>'+
    '<div class="fld"><label>Who they are</label><div class="picks tags" id="lgTags">'+
      PLABELS.map(function(x){return '<button type="button" class="p tag" data-l="'+att(x[0])+'">'+esc(x[1])+'</button>';}).join('')+
    '</div><p class="why" id="lgWhoNote"></p></div>'+
    '<div class="fld"><label>What was it</label><div class="picks" id="lgKinds">'+
      KINDS.map(function(k){return '<button type="button" class="p k'+(pickKind===k?' on':'')+'" data-k="'+att(k)+'">'+esc(k)+'</button>';}).join('')+
    '</div></div>'+
    '<div class="fld"><label>When</label><div class="picks" id="lgWhen">'+
      '<button type="button" class="p w'+(pickWhen===DAY?' on':'')+'" data-w="today">Today</button>'+
      '<button type="button" class="p w'+(pickWhen===shiftDay(-1)?' on':'')+'" data-w="yest">Yesterday</button>'+
      '<button type="button" class="p w'+(pickWhen===shiftDay(1)?' on':'')+'" data-w="tom">Tomorrow</button>'+
      '<button type="button" class="p w" data-w="pick">Another day</button>'+
      '</div><input type="date" id="lgDate" value="'+pickWhen+'" style="margin-top:8px"></div>'+
    '<div class="fld"><label for="lgWith">Anyone else there</label>'+
      '<input type="text" id="lgWith" placeholder="Optional" autocomplete="off"></div>'+
    '<button class="go'+(future?' plan':'')+'" id="lgGo">'+(future?'Add to what is coming up':'Log it')+'</button>'+
    '<p class="why" id="lgWhy"></p>';

  if(soon.length){
    html+='<div class="soon"><h4>Coming up</h4>'+
      '<p class="sub" style="margin:-4px 0 10px">The open lines in Social Well-Being on your to-do board.</p>'+
      soon.map(function(r){
      var w=r.for_date?((r.for_date<DAY?'was ':'')+whenWords(r.for_date)):'no date';
      return '<div class="row" data-id="'+att(r.id)+'">'+
        '<span>'+esc(r.task||'')+'</span>'+
        '<span class="when">'+esc(w)+'</span>'+
        '<span class="sp"><button class="yes">It happened</button>'+
        '<button class="no">Did not</button></span></div>';
    }).join('')+'</div>';
  }
  box.innerHTML=html;

  var whoBox=el('lgWho'), dateBox=el('lgDate');
  if(el('lgRecent')) el('lgRecent').addEventListener('click',function(e){
    var b=e.target.closest('.who'); if(!b) return;
    whoBox.value=b.getAttribute('data-who'); labelsTouched=false; showCarry();
  });
  el('lgKinds').addEventListener('click',function(e){
    var b=e.target.closest('.k'); if(!b) return;
    pickKind=b.getAttribute('data-k');
    Array.prototype.forEach.call(el('lgKinds').children,function(x){ x.classList.remove('on'); });
    b.classList.add('on');
  });
  el('lgWhen').addEventListener('click',function(e){
    var b=e.target.closest('.w'); if(!b) return;
    var w=b.getAttribute('data-w');
    if(w==='today') pickWhen=DAY;
    else if(w==='yest') pickWhen=shiftDay(-1);
    else if(w==='tom') pickWhen=shiftDay(1);
    else { dateBox.focus(); if(dateBox.showPicker){ try{ dateBox.showPicker(); }catch(err){} } }
    Array.prototype.forEach.call(el('lgWhen').children,function(x){ x.classList.remove('on'); });
    if(w!=='pick'){ dateBox.value=pickWhen; b.classList.add('on'); }
    refreshGo();
  });
  dateBox.addEventListener('change',function(){
    if(dateBox.value){
      pickWhen=dateBox.value;
      Array.prototype.forEach.call(el('lgWhen').children,function(x){ x.classList.remove('on'); });
      refreshGo();
    }
  });
  el('lgTags').addEventListener('click',function(e){
    var b=e.target.closest('.tag'); if(!b) return;
    var v=b.getAttribute('data-l'), i=pickLabels.indexOf(v);
    if(i>-1) pickLabels.splice(i,1); else pickLabels.push(v);
    labelsTouched=true; paintTags();
    showCarry();
  });
  whoBox.addEventListener('change',function(){ labelsTouched=false; showCarry(); });
  whoBox.addEventListener('input',function(){ labelsTouched=false; showCarry(); });
  paintTags(); showCarry();
  el('lgGo').addEventListener('click',saveLog);
  if(soon.length) box.querySelector('.soon').addEventListener('click',onSoon);
}
async function saveLog(){
  var why=el('lgWhy'), who=String(el('lgWho').value||'').trim();
  if(!who){ why.textContent='Put a name in first. A first name is enough.'; why.className='why warn'; el('lgWho').focus(); return; }
  if(!pickKind){ why.textContent='Pick what it was, from the row above.'; why.className='why warn'; return; }
  var tn=tidyName(who); who=tn.name;
  if(!who){ why.textContent='Put a name in first. A first name is enough.'; why.className='why warn'; el('lgWho').focus(); return; }
  var future=pickWhen>DAY, carry=carryFor(who)||{}, others=String(el('lgWith').value||'').trim();
  var extraNote=[tn.note, others?('with '+others):''].filter(Boolean).join(' | ');
  el('lgGo').disabled=true;
  why.textContent='Saving...'; why.className='why';
  var r;
  if(future){
    /* Something coming up is a line on the to-do board, under Social Well-Being.
       One home for plans, not two. It files itself the day it is ticked. */
    r=await sb.from('todos').insert({
      task:pickKind+' with '+who+(others?' and '+others:''),
      section:'Social Well-Being', subsection:null,
      position:0, bucket:'today', status:'todo', done:false,
      for_date:pickWhen, source_project:'social-logger'
    });
  }else{
    /* A person with no tags is invisible to the map, so this is the one
       thing the form will not let through. It says so rather than greying out. */
    if(!pickLabels.length){
      el('lgGo').disabled=false;
      why.textContent='Say who '+who+' is first \u2014 Family, Colleague, Ex-Colleague, Industry or Group.';
      why.className='why warn'; return;
    }
    r=await sb.from('connections').insert({
      person:who, person_key:(carry.person_key||who), entity_type:'person',
      kind:pickKind, channel:channelFor(pickKind),
      happened_on:pickWhen, planned:false,
      notes:extraNote||null,
      circle:carry.circle||null, social_group:carry.social_group||null,
      age_band:carry.age_band||null, labels:pickLabels.slice(),
      source:'logged-by-hand', superseded:false
    });
  }
  el('lgGo').disabled=false;
  if(r.error){ why.textContent='That did not save. Try again in a moment.'; why.className='why warn'; return; }
  var said=pickKind+' with '+who+', '+whenWords(pickWhen)+'.';
  pickKind=''; pickLabels=[]; labelsTouched=false; knownLoaded=false;
  await drawLog();
  var w2=el('lgWhy');
  if(w2){ w2.textContent=(future?'On your board under Social Well-Being: ':'Logged: ')+said; w2.className='why ok'; }
}
/* The same reading of a line that Todays Tasks does, so a plan ticked here
   files exactly the same way as one ticked over there. */
function nameIn(s){
  var t=String(s||'').trim().replace(/\s*[-:]\s*/,' with ');
  var m=t.match(/\bwith\s+(.+)$/i);
  if(!m) m=t.match(/^(?:call|ring|text|email|message|meet|see|visit)\s+(.+)$/i);
  if(!m) m=t.match(/^(?:lunch|dinner|breakfast|coffee|drinks|walk|meeting|party)\s+(.+)$/i);
  if(!m) return {person:'',others:''};
  var rest=m[1].replace(/^\s*(?:at|the)\s+/i,'').replace(/[.;]+$/,'').trim();
  var parts=rest.split(/\s*(?:,|\band\b|&|\+)\s*/i).map(function(x){return x.trim();}).filter(Boolean);
  var VAGUE=/^(someone|somebody|anyone|anybody|people|a friend|friends|the team|everyone)$/i;
  var named=parts.filter(function(x){ return !VAGUE.test(x); });
  return {person:named[0]||'', others:named.slice(1).join(', ')};
}
function kindIn(s){
  var t=String(s||'');
  return /lunch/i.test(t)?'lunch':/coffee/i.test(t)?'coffee':/dinner/i.test(t)?'dinner'
    :/breakfast/i.test(t)?'breakfast':/drinks/i.test(t)?'drinks':/\bwalk\b/i.test(t)?'walk'
    :/\bparty\b/i.test(t)?'party':/\b(call|ring|zoom|phone)\b/i.test(t)?'call'
    :/\b(text|message|whatsapp)\b/i.test(t)?'text':'meeting';
}
async function onSoon(e){
  var b=e.target.closest('button'); if(!b) return;
  var row=b.closest('.row'); if(!row) return;
  var id=row.getAttribute('data-id');
  var text=(row.querySelector('span')||{}).textContent||'';
  b.disabled=true;
  try{
    if(b.classList.contains('yes')){
      var f=nameIn(text), k=kindIn(text);
      if(f.person){
        if(!knownLoaded) await loadKnown();
        var c=carryFor(f.person)||{};
        await sb.from('connections').insert({
          person:f.person, person_key:(c.person_key||f.person), entity_type:'person',
          kind:k, channel:(k==='call'?'phone':(k==='text'?'text':'in person')),
          happened_on:DAY, planned:false, notes:(f.others?('with '+f.others):text),
          circle:c.circle||null, social_group:c.social_group||null,
          age_band:c.age_band||null, labels:c.labels||[],
          source:'logged-by-hand', superseded:false
        });
      }
      var now=new Date().toISOString();
      await sb.from('todos').update({done:true,status:'done',done_at:now,completed_at:now,updated_at:now}).eq('id',id);
    } else {
      await sb.from('todos').delete().eq('id',id);
    }
    knownLoaded=false;
    await drawLog();
  }catch(err){ b.disabled=false; }
}

/* ---------- sign in, same gate as the other cue cards ---------- */
async function doSignIn(){
  var email=(el('email').value||'').trim(), pass=el('pass').value||'';
  el('gateMsg').textContent='';
  var r=await sb.auth.signInWithPassword({email:email,password:pass});
  if(r.error){ el('gateMsg').textContent=r.error.message; return; }
  signedIn=true;
  el('gate').classList.add('hidden');
  await start();
}
el('signin').addEventListener('click',doSignIn);
el('pass').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); doSignIn(); } });

/* ---------- go ---------- */
async function start(){
  try{
    await loadPool();
    var c=await todaysCard();
    render(c);
    if(signedIn){
      var r=await sb.from('todos').select('id,done').eq('for_date',DAY).eq('tracker','Social Fitness').limit(1);
      if(r.data&&r.data[0]&&r.data[0].done){
        ticked=true;
        if(el('did')){ el('did').disabled=true; el('did').textContent='Done today'; }
        say('Already ticked today.','muted');
      }
    }
    drawHist(); drawLog();
  }catch(e){
    el('mount').innerHTML='<div class="err">Could not reach your cards just now. Refresh in a moment.</div>';
  }
}

(async function(){
  try{
    var s=await sb.auth.getSession();
    signedIn=!!(s&&s.data&&s.data.session);
  }catch(e){ signedIn=false; }
  if(!signedIn) el('gate').classList.remove('hidden');
  await start();
})();
})();
</script>
