<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Library</title>
<link rel="modulepreload" href="https://esm.sh/@supabase/supabase-js@2" crossorigin>
<style>
:root{--ink:#1f2a44;--muted:#5b6472;--faint:#9aa6b4;--line:#e3e7ee;--chip:#eef2f8;--bg:#f4f6f9;--accent:#3f6f8f;--good:#1e8e5a;--amber:#a9741a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:1060px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:0}
h1 .ver{font-size:11px;color:var(--faint);font-weight:400;margin-left:7px}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 14px}
.banner{background:#fff6e5;border:1px solid #f0d9a8;border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:12.5px;display:none}
.banner.show{display:block}
.banner b{display:block;margin-bottom:3px}
/* ---- Rail Final: railwrap med mash cB rW ---- */
.railwrap{display:grid;grid-template-columns:238px 1fr;gap:14px;align-items:start;color:var(--ink)}
@media(max-width:760px){.railwrap{grid-template-columns:1fr}}
.rail{list-style:none;margin:0;padding:0}
.rail .rsec{display:block;padding:0;margin:0 0 2px;background:transparent}
.rail .rrow{position:relative;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer;background:var(--w,#eff0f2);border:1px solid transparent}
.rail .rsel>.rrow{background:var(--w);box-shadow:inset 3px 0 0 var(--c);border-color:transparent}
.rail .rsel>.rrow,.rail .rsel>.rrow *{color:var(--ink);font-weight:600}
.rail .rsel>.rrow .sm{color:var(--muted);font-weight:400}
.rail .grip{opacity:.5;color:#9aa6b4}
.rail .sm{color:var(--muted);font-size:11px;flex:none}
.rail .ico{width:15px;height:15px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--c,#8a93a1)}
.rail .ico svg{width:15px;height:15px}.rail .ico .emo{font-size:13px;line-height:1}
.rail .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsubs{overflow:hidden;max-height:1600px;transition:max-height .26s ease,opacity .18s ease;border-left:2px solid #e9edf1;margin:2px 0 5px 14px;padding-left:7px}
.rsubs.shut{max-height:0;opacity:0;margin-top:0;margin-bottom:0}
.rsub{position:relative;display:flex;gap:6px;align-items:center;margin:2px 0;padding:4px 8px;font-size:12.5px;border-radius:8px;cursor:pointer;color:#46505e;background:var(--hl,transparent)}
.rsub.sel{background:var(--hl,#dbe7f1);color:var(--ink);font-weight:700}
.rsubs2{overflow:hidden;max-height:1200px;transition:max-height .26s ease,opacity .18s ease;border-left:2px solid var(--h,#e3e7ee);margin:1px 0 4px 12px}
.rsubs2.shut{max-height:0;opacity:0}
.rsub2{position:relative;display:flex;gap:6px;align-items:center;margin:1px 0 1px 8px;padding:3px 8px;font-size:12px;border-radius:7px;cursor:pointer;color:#46505e;background:#fff}
.rsub2.sel{background:var(--hl,#dbe7f1);color:var(--ink);font-weight:700}
.rsub .grow,.rsub2 .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.car{border:0;background:transparent;padding:0 2px;font-size:11px;line-height:1;color:var(--muted);cursor:pointer;flex:none}
.car::before{content:'\25BE'}
.isshut>.rrow .car::before,.isshut>.rsub .car::before{content:'\25B8'}
.grip,.dg{cursor:grab;color:#9aa1ab;font-size:12px;user-select:none;touch-action:none;flex:none}
.dg{margin-top:1px}
.kebab{border:0;background:transparent;font-size:15px;line-height:1;color:#9aa1ab;cursor:pointer;padding:0 3px;border-radius:6px;flex:none;opacity:.5;transition:opacity .15s}
.rrow:hover .kebab,.rsub:hover .kebab,.rsub2:hover .kebab,.rsel>.rrow .kebab,.sel>.kebab,.shd:hover .kebab{opacity:1}
.kebab:hover{background:#e7eaef;color:var(--ink)}
@media(hover:none){.kebab{opacity:.6}}
.newtile{border:0;background:transparent;color:#9aa1ab;text-align:left;padding:4px 8px;font:inherit;font-size:12.5px;cursor:pointer;display:block;width:100%;border-radius:8px}
.newtile:hover{background:#e9edf1;color:var(--ink)}
/* right pane */
.sec{background:#fff;border:0;border-radius:12px;padding:12px 14px;box-shadow:none}
.hd{display:flex;align-items:center;gap:7px;min-height:26px}
.hd .pico{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--c,#8a93a1);cursor:pointer;border-radius:7px;background:var(--w,#f1f3f6);border:1px solid rgba(31,42,68,.06)}
.hd .pico svg{width:15px;height:15px}.hd .pico .emo{font-size:14px;line-height:1}
.hd .sn{font-size:18px;color:var(--ink);cursor:text;border-radius:5px;padding:0 3px;margin-left:-3px}
.hd .sn:hover{background:#f4f6f9}.hd .sn:focus{outline:2px solid var(--accent);outline-offset:1px;background:#fff}
.hd .cnt{margin-left:2px;font-size:13px;color:var(--muted)}
.sm{font-size:11px;color:var(--muted)}
.nt{margin:4px 0 8px;color:#9aa1ab;font-size:12px;max-width:72ch}
.crumb{font-size:12px;margin:0 0 8px;color:var(--ink)}
.lnk{font:inherit;font-size:11.5px;border:0;background:transparent;color:var(--accent);cursor:pointer;padding:2px 0}
.lnk:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:var(--chip);color:var(--muted);border-radius:6px;padding:0 6px;height:18px;white-space:nowrap;margin-right:3px}
.chipa[data-st="Parked"]{background:#fdf6e6;color:var(--amber)}
.chipa[data-st="Brand new"]{background:#e9f5ef;color:var(--good)}
.subl{border:0;background:#f4f6f9;border-radius:12px;padding:6px 11px 5px;margin:0 0 7px}
.shd{display:flex;align-items:center;gap:6px;margin:0 0 2px;min-height:22px}
.shd b{font-size:13px;color:var(--ink)}
.p2grid{display:grid;grid-template-columns:1fr;gap:4px;margin:3px 0}
.p2{border:0;background:#fff;border-radius:8px;padding:4px 10px 3px}
.p2 .shd{margin:0}
.p2 .shd b{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#7b828c}
.kind{display:inline-block;margin-left:8px;font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:8px;font-weight:700}
.p2[data-k="doing"] .kind{background:#eef4f8;color:#2f5a75}
.p2[data-k="wait"] .kind{background:#fbf3e4;color:#8a5e14}
.p2[data-k="later"] .kind{background:#edf0f4;color:#4d5663}
.p2[data-k="doing"] .shd .sm,.p2[data-k="wait"] .shd .sm,.p2[data-k="later"] .shd .sm{display:none}
.its{list-style:none;margin:0;padding:0;min-height:6px}
.its .r{position:relative;display:flex;align-items:flex-start;gap:6px;padding:2px 0 2px 8px;border-top:0;background:transparent}
.its .r .dg{position:absolute;left:-9px;top:0;bottom:0;width:17px;margin:0;display:flex;align-items:center;justify-content:center;opacity:.35}
.its .r:hover .dg{opacity:1}
.its .t{font-size:11.5px;line-height:1.35;color:var(--ink)}
.its .r.isdone .t{text-decoration:line-through;color:#7b828c}
.cb{flex:none;width:15px;height:15px;border:1px solid #aab0b8;border-radius:4px;margin-top:1px;cursor:pointer;background:#fff;position:relative;padding:0}
.cb.done{background:var(--good);border-color:var(--good)}
.cb.done::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.grow{flex:1;min-width:0}
.addrow{display:flex;gap:6px;margin-top:4px}
.addrow input{font:inherit;font-size:12px;border:1px solid #cfd3d9;border-radius:7px;padding:4px 8px;flex:1;min-width:80px;background:#fff;color:var(--ink)}
.btn{font:inherit;font-size:12px;border:1px solid #cfd3d9;background:#fff;color:var(--ink);border-radius:8px;padding:4px 11px;cursor:pointer}
.btn:hover{background:#f4f5f7}
.dragging{opacity:.4}
.dropline{outline:2px solid var(--accent);outline-offset:1px;border-radius:8px}
/* picker + menu */
.swbar{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(31,42,68,.18);padding:8px 10px;display:none;width:236px}
.swbar.show{display:block}
.swbar .sws{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.swbar .sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(31,42,68,.25);cursor:pointer;padding:0;flex:none;position:relative}
.swbar .sw.on{outline:2px solid var(--accent);outline-offset:1px}
.swbar .sw.plus{background:conic-gradient(#f66,#fd6,#6d6,#6df,#96f,#f66);display:flex;align-items:center;justify-content:center}
.swbar .sw.plus span{width:12px;height:12px;border-radius:50%;background:#fff;color:#1f2a44;font-size:12px;line-height:12px;font-weight:700;text-align:center}
.swbar .sw.tool{background:#f1f3f6;color:#1f2a44;font-size:12px;display:flex;align-items:center;justify-content:center}
.swbar .lab{font-size:10px;color:var(--muted);margin:7px 0 4px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.swbar input[type=color]{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.icrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.ic{position:relative;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:#f7f9fc;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-size:13px;font-weight:700;font-family:inherit}
.ic svg{width:14px;height:14px}.ic.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ic .emo{font-size:12px;line-height:1}
.emoin{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:12px;font-family:inherit}
[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#1f2a44;color:#fff;font-size:11px;font-weight:600;line-height:1.2;padding:5px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:90}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1}
.menu{position:fixed;z-index:72;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 8px 24px rgba(31,42,68,.18);padding:5px;display:none;min-width:176px}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;font:inherit;font-size:12.5px;padding:7px 9px;border-radius:7px;cursor:pointer;color:var(--ink)}
.menu button:hover{background:#f1f3f6}
.menu button.danger{color:#a3362c}
.menu .lab{font-size:10px;color:var(--muted);margin:6px 0 3px 9px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f2a44;color:#fff;font-size:12.5px;padding:9px 15px;border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:95;display:none}
.toast.show{display:block}
.toast button{margin-left:11px;border:0;background:#3f6f8f;color:#fff;font:inherit;font-size:12px;font-weight:700;border-radius:6px;padding:3px 9px;cursor:pointer}
</style></head><body>
<div class="wrap">
<h1>Task Library<span class="ver">v2.1</span></h1>
<p class="sub">Every list you work from, and the parts inside them. Tap any name to rename it. Tap the icon to change its colour or icon. Drag the handle to reorder.</p>
<div class="banner" id="bn"></div>
<div class="railwrap">
  <div><ul class="rail" id="rail"></ul><button class="newtile" id="addlist">+ New list</button></div>
  <div class="sec" id="pane"></div>
</div>
</div>
<div class="toast" id="toast"></div>
<script>
var ICONS={
 lodging:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h6v-6h2v6h6v-9h3z"/></svg>',
 activity:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4"/><g stroke="currentColor" stroke-width="2"><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></g></svg>',
 meal:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 2v8a2 2 0 0 1-2 2H5v10H3V2h1v8h1V2h1v8h1V2zm9 0c-2 0-4 2.5-4 6s1 5 2 6v8h2V2z"/></svg>',
 flight:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2.5 1.5V22l4-1 4 1v-1.5L13 19v-5.5z"/></svg>',
 drive:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 17h14v-5l-2-5H7L5 12v5zm2.5-1a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm9 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM7 7h10l1.5 4h-13z"/></svg>',
 mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
 other:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3"/></svg>'
};
function S(p){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+p+'"/></svg>'; }
var ICON_LIB=[
 ['flight','Plane',ICONS.flight],['drive','Car',ICONS.drive],['lodging','Home',ICONS.lodging],['meal','Food',ICONS.meal],['activity','Sun',ICONS.activity],
 ['beach','Beach',S('M3 12a9 9 0 0 1 18 0z M12 12v7a2 2 0 0 1-4 0')],
 ['waves','Waves',S('M2 9q2.5-3 5 0t5 0 5 0 5 0M2 15q2.5-3 5 0t5 0 5 0 5 0')],
 ['hike','Hike',S('M3 20l6-11 4 6 2-3 6 8z')],
 ['boat','Boat',S('M3 15h18l-2 5H5z M12 3v12 M12 4l6 9h-6')],
 ['music','Music',S('M9 18V5l11-2v13 M9 18a3 3 0 1 1-3-3 M20 16a3 3 0 1 1-3-3')],
 ['camera','Camera',S('M3 8h4l2-3h6l2 3h4v12H3z M12 10.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z')],
 ['drinks','Drinks',S('M4 4h16l-8 9z M12 13v7 M8 20h8')],
 ['star','Star',S('M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z')],
 ['heart','Heart',S('M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z')],
 ['ticket','Ticket',S('M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z')],
 ['tree','Tree',S('M12 3l6 9h-3l4 6H5l4-6H6z M12 18v3')],
 ['shop','Shop',S('M5 8h14l-1 12H6z M9 8a3 3 0 0 1 6 0')],
 ['gift','Gift',S('M3 9h18v4H3z M5 13h14v7H5z M12 9v11 M12 9S9 9 9 6.5 12 5 12 9z M12 9s3 0 3-2.5S12 5 12 9z')],
 ['mail','Mail',ICONS.mail]
];
var ICON_MAP={}; ICON_LIB.forEach(function(x){ ICON_MAP[x[0]]=x[2]; });
function iconHtml(ic){
  if(ic && ICON_MAP[ic]) return ICON_MAP[ic];
  if(ic && ic.indexOf('e:')===0) return '<span class="emo">'+esc(ic.slice(2))+'</span>';
  return ICONS.other;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function tip(el,t){ el.setAttribute('data-tip',t); el.setAttribute('aria-label',t); }
var KL={doing:'In progress',wait:'Waiting',later:'Not started'};
var STATUS_LIST=[['','No label'],['Parked','Parked'],['Brand new','Brand new']];
var KIND_LIST=[['','No label'],['doing','In progress'],['wait','Waiting'],['later','Not started']];

var NODES=[], TASKS=[], SEL=null, SHUT={}, LOCAL=true, sb=null, SIGNED=false;
var LKEY='py_tasklib_v2';
function uid(){ return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function saveLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify(NODES)); }catch(e){} }
function kids(id){ return NODES.filter(function(n){ return n.parent_id===id; }).sort(function(a,b){ return a.position-b.position; }); }
function node(id){ for(var i=0;i<NODES.length;i++) if(NODES[i].id===id) return NODES[i]; return null; }
function chain(id){ var c=[], n=node(id); while(n){ c.unshift(n); n=n.parent_id?node(n.parent_id):null; } return c; }
function tint(hex,a){ var m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return '#f1f3f6';
  var v=parseInt(m[1],16), r=v>>16&255, g=v>>8&255, b=v&255;
  return 'rgb('+Math.round(r+(255-r)*a)+','+Math.round(g+(255-g)*a)+','+Math.round(b+(255-b)*a)+')'; }

/* tasks: section is the top list name, subsection is the deepest node name */
function tasksFor(n){
  var top=chain(n.id)[0], sub = n.level==='list' ? '' : n.name;
  return TASKS.filter(function(t){ return t.section===top.name && ((t.subsection||'')===sub); });
}
function cz(n){ var v=countUnder(n); return v? String(v) : ''; }
function countUnder(n){
  var c=tasksFor(n).filter(function(t){return !t.done;}).length;
  kids(n.id).forEach(function(k){ c+=countUnder(k); });
  return c;
}

/* ---------- saving ---------- */
async function persist(n, fields){
  Object.assign(n, fields); saveLocal();
  if(LOCAL||!sb) return;
  try{ await sb.from('task_library').update(fields).eq('id', n.dbid); }catch(e){ console.warn(e); }
}
async function persistNew(n){
  saveLocal(); if(LOCAL||!sb) return;
  try{ var p=n.parent_id?node(n.parent_id):null;
    var r=await sb.from('task_library').insert({parent_id:p?p.dbid:null,level:n.level,name:n.name,color:n.color,icon:n.icon,status:n.status||null,position:n.position}).select().single();
    if(r.data) n.dbid=r.data.id; }catch(e){ console.warn(e); }
}
async function persistDel(n){ saveLocal(); if(LOCAL||!sb) return;
  try{ await sb.from('task_library').delete().eq('id', n.dbid); }catch(e){ console.warn(e); } }

/* ---------- rail ---------- */
function mkIco(n){ var d=document.createElement('span'); d.className='ico'; d.innerHTML=iconHtml(n.icon); return d; }
function mkGrip(n){ var g=document.createElement('span'); g.className='grip'; g.textContent='⋮⋮'; tip(g,'Drag to reorder'); dragHandle(g,n); return g; }
function mkKeb(n){ var b=document.createElement('button'); b.type='button'; b.className='kebab'; b.innerHTML='⋯'; tip(b,'Rename, recolour or delete');
  b.addEventListener('click',function(e){ e.stopPropagation(); openMenu(n,b); }); return b; }
function render(){
  var rail=document.getElementById('rail'); rail.innerHTML='';
  kids(null).forEach(function(L){
    var li=document.createElement('li'); li.className='rsec'+(SEL===L.id?' rsel':'')+(SHUT[L.id]?' isshut':'');
    li.dataset.nid=L.id;
    li.style.setProperty('--c',L.color||'#8a93a1');
    li.style.setProperty('--w',tint(L.color,.88));
    li.style.setProperty('--hl',tint(L.color,.9));
    var row=document.createElement('div'); row.className='rrow';
    row.appendChild(mkGrip(L)); row.appendChild(mkIco(L));
    var g=document.createElement('span'); g.className='grow'; g.textContent=L.name; g.title=L.name; row.appendChild(g);
    var ks=kids(L.id);
    if(ks.length){ var car=document.createElement('button'); car.type='button'; car.className='car'; tip(car,'Show or hide what is inside');
      car.addEventListener('click',function(e){ e.stopPropagation(); SHUT[L.id]=!SHUT[L.id]; render(); }); row.appendChild(car); }
    var sm=document.createElement('span'); sm.className='sm'; sm.textContent=countUnder(L)||''; row.appendChild(sm);
    row.appendChild(mkKeb(L));
    row.addEventListener('click',function(){ SEL=L.id; render(); });
    li.appendChild(row);
    if(ks.length){
      var box=document.createElement('div'); box.className='rsubs'+(SHUT[L.id]?' shut':''); box.dataset.par=L.id;
      ks.forEach(function(P){
        var wrap=document.createElement('div'); wrap.className=(SHUT['p'+P.id]?'isshut':''); wrap.dataset.nid=P.id;
        var hc=P.color||L.color;
        wrap.style.setProperty('--h',hc||'#cfd3d9'); wrap.style.setProperty('--hl',tint(hc,.9));
        var sr=document.createElement('div'); sr.className='rsub'+(SEL===P.id?' sel':'');
        sr.appendChild(mkGrip(P));
        if(P.icon) sr.appendChild(mkIco(P));
        var pg=document.createElement('span'); pg.className='grow'; pg.textContent=P.name; pg.title=P.name; sr.appendChild(pg);
        var cs=kids(P.id);

/* ---------- drag to reorder, mouse and touch ---------- */
var HOLD_MS=320, HOLD_SLOP=10;
function dragHandle(grip, n){
  grip.addEventListener('pointerdown', function(e){
    if(e.button && e.button!==0) return;
    e.preventDefault(); e.stopPropagation();
    var touch = e.pointerType!=='mouse';
    var sx=e.clientX, sy=e.clientY, started=false, holdT=null;
    var rowEl = grip.closest('.rsub2') || grip.closest('.rsub') || grip.closest('.rrow');
    var carrier = grip.closest('.rsub2') || grip.closest('[data-nid]');
    function begin(){ started=true; if(rowEl) rowEl.classList.add('dragging'); document.body.style.userSelect='none'; }
    if(touch){ holdT=setTimeout(begin, HOLD_MS); } else { begin(); }
    function move(ev){
      if(!started){ if(Math.abs(ev.clientX-sx)>HOLD_SLOP || Math.abs(ev.clientY-sy)>HOLD_SLOP){ clearTimeout(holdT); cleanup(); } return; }
      ev.preventDefault();
      var over=document.elementFromPoint(ev.clientX, ev.clientY); if(!over) return;
      var host = over.closest('.rsub2') || over.closest('.rsub') || over.closest('.rrow'); if(!host || host===rowEl) return;
      var hostNodeEl = host.closest('.rsub2') || host.closest('[data-nid]'); if(!hostNodeEl) return;
      var hid=hostNodeEl.dataset.nid, target=node(hid), me=n;
      if(!target || target.parent_id!==me.parent_id) return;
      swap(me, target);
      render();
      rowEl=null; carrier=null;
      var again=document.querySelector('[data-nid="'+me.id+'"]');
      if(again){ rowEl = again.querySelector('.rrow') || again.querySelector('.rsub') || again; rowEl.classList.add('dragging'); }
    }
    function up(){ clearTimeout(holdT); cleanup(); }
    function cleanup(){
      document.removeEventListener('pointermove', move, {passive:false});
      document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
      document.body.style.userSelect='';
      document.querySelectorAll('.dragging').forEach(function(x){ x.classList.remove('dragging'); });
      if(started) persistOrder(n.parent_id);
      started=false;
    }
    document.addEventListener('pointermove', move, {passive:false});
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });
}
function swap(a,b){ var p=a.position; a.position=b.position; b.position=p; }
function persistOrder(parentId){
  var sibs=kids(parentId); saveLocal();
  if(LOCAL||!sb) return;

    var q=await sb.from('task_library').select('*').order('position');
    if(q.error){ banner('<b>Cannot reach the Task Library in your system</b>Working on this device only for now.'); return; }
    LOCAL=false;
    NODES=q.data.map(function(r){ return {id:'db'+r.id,dbid:r.id,parent_id:r.parent_id?('db'+r.parent_id):null,level:r.level,name:r.name,color:r.color,icon:r.icon,status:r.status||null,position:r.position}; });
    saveLocal(); SEL=(kids(null)[0]||{}).id||null;
    var names=NODES.filter(function(n){ return !n.parent_id; }).map(function(n){ return n.name; });
    var t=await sb.from('todos').select('id,section,subsection,task,done,position').in('section', names).order('position');
    if(t.data) TASKS=t.data;
    render();
  }catch(e){ console.warn(e); render(); }
})();
</script><script src="nav-config.js"></script><script src="navpatch.js"></script></body></html>
