<title>Task Library</title>

<style>
:root{--ink:#1f2a44;--muted:#5b6472;--faint:#9aa6b4;--line:#e3e7ee;--chip:#eef2f8;--bg:#f4f6f9;--accent:#3f6f8f;--good:#1e8e5a;--amber:#a9741a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:none;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:0}
h1 .ver{font-size:11px;color:var(--faint);font-weight:400;margin-left:7px}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 14px}
.strength{display:inline-flex;gap:3px;vertical-align:middle;margin-left:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.strength button{width:15px;height:15px;border-radius:50%;border:1px solid rgba(31,42,68,.18);padding:0;cursor:pointer;flex:none}
.strength button.on{outline:2px solid var(--accent);outline-offset:1px}
.demo{font-size:12px;color:#7b828c;background:#eef2f8;border-radius:9px;padding:7px 11px;margin:0 0 10px;display:none}
.demo.show{display:block}
.demo button{margin-left:8px;font:inherit;font-size:11.5px;font-weight:700;border:0;background:#3f6f8f;color:#fff;border-radius:6px;padding:3px 9px;cursor:pointer}
.banner{background:#fff6e5;border:1px solid #f0d9a8;border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:12.5px;display:none}
.banner.show{display:block}
.banner b{display:block;margin-bottom:3px}
/* ---- Rail Final: railwrap med mash cB rW ---- */
.railwrap{display:grid;grid-template-columns:238px 1fr;gap:14px;align-items:start;color:var(--ink)}
@media(max-width:760px){.railwrap{grid-template-columns:1fr}}
.rail{list-style:none;margin:0;padding:0}
.rail .rsec{display:block;padding:0;margin:0 0 2px;background:transparent}
.rail .rrow{position:relative;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;cursor:pointer;background:var(--w,#eff0f2);border:1px solid transparent}
.rail .rsel>.rrow{background:var(--w);box-shadow:inset 3px 0 0 var(--c);border-color:transparent}
.rail .rsel>.rrow,.rail .rsel>.rrow *{color:var(--ink);font-weight:600}
.rail .rsel>.rrow .sm{color:#b2b8c1;font-weight:400}
.rail .grip{opacity:.5;color:#9aa6b4}
.rail .sm{color:#b2b8c1;font-size:11px;flex:none;font-weight:400}
.rsub .sm,.rsub2 .sm{color:#b2b8c1;font-size:11px;flex:none;font-weight:400}
.rsub.sel .sm,.rsub2.sel .sm{color:#b2b8c1;font-weight:400}
.rail .ico{width:15px;height:15px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--c,#8a93a1)}
.rail .ico svg{width:15px;height:15px}.rail .ico .emo{font-size:13px;line-height:1}
.rail .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rsubs{overflow:hidden;max-height:1600px;transition:max-height .26s ease,opacity .18s ease;margin:2px 0 5px 14px;padding-left:0}
.rsubs.shut{max-height:0;opacity:0;margin-top:0;margin-bottom:0}
.rsub,.rsub2{position:relative;display:flex;gap:6px;align-items:center;margin:2px 0;padding:4px 8px;font-size:12.5px;border-radius:8px;cursor:pointer;color:#46505e;background:#fff}
.rsub.rgroup,.rsub2.rgroup{background:var(--hl,#eef1f5);font-weight:600;color:var(--ink)}
.rsub.sel,.rsub2.sel{background:var(--hl,#dbe7f1);color:var(--ink);font-weight:700}
.rsubs2{overflow:hidden;max-height:1200px;transition:max-height .26s ease,opacity .18s ease;margin:1px 0 4px 12px}
.rsubs2.shut{max-height:0;opacity:0}
.rsub2{margin-left:10px}
.rsub .grow,.rsub2 .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .rrow,.rsub,.rsub2{user-select:none}
.car{border:0;background:transparent;padding:0 2px;font-size:11px;line-height:1;color:var(--muted);cursor:pointer;flex:none;opacity:.6}
.car::before{content:'\25BE'}
.isshut>.rrow .car::before,.isshut>.rsub .car::before{content:'\25B8'}
.rrow:hover .car,.rsub:hover .car{opacity:1}
.rsec.parked>.rrow{opacity:.55}
.rsec.parked>.rrow .pk{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;background:#fdf6e6;color:var(--amber);border-radius:5px;padding:1px 5px;flex:none}
.grip,.dg{cursor:grab;color:#9aa1ab;font-size:12px;user-select:none;touch-action:none;flex:none}
.dg{margin-top:1px}
.kebab{border:0;background:transparent;font-size:15px;line-height:1;color:#9aa1ab;cursor:pointer;padding:0 3px;border-radius:6px;flex:none;opacity:.5;transition:opacity .15s}
.rrow:hover .kebab,.rsub:hover .kebab,.rsub2:hover .kebab,.rsel>.rrow .kebab,.sel>.kebab,.shd:hover .kebab{opacity:1}
.kebab:hover{background:#e7eaef;color:var(--ink)}
@media(hover:none){.kebab{opacity:.6}}
.newtile{border:0;background:transparent;color:#9aa1ab;text-align:left;padding:4px 8px;font:inherit;font-size:12.5px;cursor:pointer;display:block;width:100%;border-radius:8px}
.newtile:hover{background:#e9edf1;color:var(--ink)}
/* right pane */
.sec{background:#fff;border:0;border-radius:12px;padding:12px 14px;box-shadow:none}
.hd{display:flex;align-items:center;gap:7px;min-height:26px}
.hd .sn{font-size:18px;color:var(--ink);cursor:text;border-radius:5px;padding:0 3px;margin-left:-3px}
.hd .sn:hover{background:#f4f6f9}.hd .sn:focus{outline:2px solid var(--accent);outline-offset:1px;background:#fff}
.hd .cnt{margin-left:2px;font-size:13px;color:var(--muted)}
.sm{font-size:11px;color:var(--muted)}
.nt{margin:4px 0 8px;color:#9aa1ab;font-size:12px;max-width:72ch}
.crumb{font-size:12px;margin:0 0 8px;color:var(--ink)}
.lnk{font:inherit;font-size:11.5px;border:0;background:transparent;color:var(--accent);cursor:pointer;padding:2px 0}
.lnk:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:var(--chip);color:var(--muted);border-radius:6px;padding:0 6px;height:18px;white-space:nowrap;margin-right:3px}
.chipa[data-st="Parked"]{background:#fdf6e6;color:var(--amber)}
.chipa[data-st="Brand new"]{background:#e9f5ef;color:var(--good)}
.subl{border:0;background:#f4f6f9;border-radius:12px;padding:6px 11px 5px;margin:0 0 7px}
/* ---- v3.7, Scott Nov 25: the right panel runs in two columns, with a bar you drag to set the widths ---- */
.pcols{display:grid;grid-template-columns:var(--sa,1fr) 7px var(--sb,1fr);gap:0 10px;align-items:start;margin:0 0 4px}
.pcol{min-width:0}
.pcol.empty{min-height:56px;border:1px dashed #dfe3ea;border-radius:12px;background:#fbfcfd;position:relative}
.pcol.empty::after{content:'Drag a section here';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:#aeb5bf}
.pcol.colover{outline:2px dashed var(--c,#8a93a1);outline-offset:3px;border-radius:12px}
.psplit{position:relative;cursor:col-resize;align-self:stretch;min-height:64px;touch-action:none}
.psplit::before{content:'';position:absolute;left:50%;top:2px;bottom:2px;width:3px;transform:translateX(-50%);background:#e3e7ee;border-radius:3px;transition:background .12s}
.psplit:hover::before,.psplit.on::before{background:var(--c,#8a93a1)}
.psplit::after{content:'';position:absolute;left:-8px;right:-8px;top:0;bottom:0}
.subl>.shd>.sg{cursor:grab;color:#b4bac3;font-size:12px;letter-spacing:-3px;margin:0 1px 0 -4px;user-select:none;flex:none;touch-action:none}
.subl>.shd>.sg:hover{color:#6f7681}
.subl>.shd>.sg:active{cursor:grabbing}
.subl.sdrag{opacity:.4}
.subl.dropline{box-shadow:0 0 0 2px var(--c,#8a93a1)}
/* v3.8: the line that shows where a dragged task will land inside a section */
.its .r.dropup{box-shadow:inset 0 2px 0 0 var(--c,#8a93a1)}
.its .r.dropdn{box-shadow:inset 0 -2px 0 0 var(--c,#8a93a1)}
@media(max-width:900px){.pcols{grid-template-columns:1fr}.psplit{display:none}.pcol.empty{display:none}}
.shd{display:flex;align-items:center;gap:6px;margin:0 0 2px;min-height:22px}
.shd b{font-size:13px;color:var(--ink)}
.p2grid{display:grid;grid-template-columns:1fr;gap:4px;margin:3px 0}
.p2{border:0;background:#fff;border-radius:8px;padding:4px 10px 3px}
.p2 .shd{margin:0}
.p2 .shd b{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#7b828c}
.kind{display:inline-block;margin-left:8px;font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:8px;font-weight:700}
.p2[data-k="doing"] .kind{background:#eef4f8;color:#2f5a75}
.p2[data-k="wait"] .kind{background:#fbf3e4;color:#8a5e14}
.p2[data-k="later"] .kind{background:#edf0f4;color:#4d5663}
.p2[data-k="doing"] .shd .sm,.p2[data-k="wait"] .shd .sm,.p2[data-k="later"] .shd .sm{display:none}
.its{list-style:none;margin:0;padding:0;min-height:6px}
.its .r{position:relative;display:flex;align-items:flex-start;gap:6px;padding:3px 0 3px 8px;border-top:0;background:transparent}
.its .r .dg{position:absolute;left:-9px;top:0;bottom:0;width:17px;margin:0;display:flex;align-items:center;justify-content:center;opacity:.35}
.its .r:hover .dg{opacity:1}
.its .t{font-size:13px;font-weight:400;line-height:1.3;color:#2b3137}
.its .r.isdone .t{text-decoration:line-through;color:#7b828c}
.its .mv{margin-left:auto;display:flex;gap:4px;flex:none;opacity:0;transition:opacity .15s}
.its .r:hover .mv{opacity:1}
.its .xdel{flex:none;margin-left:6px;border:0;background:none;color:#d3d7dd;font-size:15px;line-height:1;padding:2px 4px;cursor:pointer;align-self:flex-start;opacity:1}
.its .xdel:hover{color:#c0492f;opacity:1}
@media(hover:none){.its .mv{opacity:.55}}
.its .mv button{border:1px solid #dfe4ea;background:#fff;border-radius:5px;font:700 10px Roboto,Arial,sans-serif;color:#5b6472;padding:0 6px;line-height:15px;cursor:pointer;white-space:nowrap}
.its .mv button:hover{border-color:#3f6f8f;color:#3f6f8f}
.cb{flex:none;width:15px;height:15px;border:1px solid #aab0b8;border-radius:4px;margin-top:1px;cursor:pointer;background:#fff;position:relative;padding:0}
.cb.done{background:var(--good);border-color:var(--good)}
.cb.done::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.grow{flex:1;min-width:0}
.addrow{display:flex;gap:6px;margin-top:4px}
.addrow input{font:inherit;font-size:12px;border:1px solid #cfd3d9;border-radius:7px;padding:4px 8px;flex:1;min-width:80px;background:#fff;color:var(--ink)}
.btn{font:inherit;font-size:12px;border:1px solid #cfd3d9;background:#fff;color:var(--ink);border-radius:8px;padding:4px 11px;cursor:pointer}
.btn:hover{background:#f4f5f7}
.dragging{opacity:.4}
.dropline{outline:2px solid var(--accent);outline-offset:1px;border-radius:8px}
/* picker + menu */
.swbar{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(31,42,68,.18);padding:8px 10px;display:none;width:236px}
.swbar.show{display:block}
.swbar .sws{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.swbar .sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(31,42,68,.25);cursor:pointer;padding:0;flex:none;position:relative}
.swbar .sw.on{outline:2px solid var(--accent);outline-offset:1px}
.swbar .sw.plus{background:conic-gradient(#f66,#fd6,#6d6,#6df,#96f,#f66);display:flex;align-items:center;justify-content:center}
.swbar .sw.plus span{width:12px;height:12px;border-radius:50%;background:#fff;color:#1f2a44;font-size:12px;line-height:12px;font-weight:700;text-align:center}
.swbar .sw.tool{background:#f1f3f6;color:#1f2a44;font-size:12px;display:flex;align-items:center;justify-content:center}
.swbar .lab{font-size:10px;color:var(--muted);margin:7px 0 4px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.swbar input[type=color]{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
.icrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.ic{position:relative;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:#f7f9fc;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-size:13px;font-weight:700;font-family:inherit}
.ic svg{width:14px;height:14px}.ic.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ic .emo{font-size:12px;line-height:1}
.emoin{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:12px;font-family:inherit}
[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);background:#1f2a44;color:#fff;font-size:11px;font-weight:600;line-height:1.2;padding:5px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:90}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1}
.menu{position:fixed;z-index:72;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 8px 24px rgba(31,42,68,.18);padding:4px;display:none;min-width:176px}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;font:inherit;font-size:12.5px;padding:3px 9px;border-radius:6px;cursor:pointer;color:var(--ink);line-height:1.35}
.menu button:hover{background:#f1f3f6}
.menu button.danger{color:#a3362c}
.menu .lab{font-size:10px;color:#2f5a74;margin:5px 0 2px 9px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1f2a44;color:#fff;font-size:12.5px;padding:9px 15px;border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:95;display:none}
.toast.show{display:block}
.toast button{margin-left:11px;border:0;background:#3f6f8f;color:#fff;font:inherit;font-size:12px;font-weight:700;border-radius:6px;padding:3px 9px;cursor:pointer}
</style><style id="tlnav-css">

.tlnav a:hover{background:#fff;color:#2b4a63}
.tlnav .on{background:#fff;color:#2b4a63;border-top-color:#2b4a63}
.tlnav .soon{color:#c3cbd5}
.tlnav .soon em{font-style:normal;font-size:11px;font-weight:700;color:#d2d8e0}

function editable(el, n, key){
  el.contentEditable='true'; el.spellcheck=false;
  el.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } if(e.key==='Escape'){ el.textContent=n[key]; el.blur(); } });
  el.addEventListener('click',function(e){ e.stopPropagation(); });
  el.addEventListener('blur',function(){ var v=el.textContent.trim(); if(!v){ el.textContent=n[key]; return; }
    if(v!==n[key]){ var old=n[key]; renameEverywhere(n, old, v); } });
}
async function renameEverywhere(n, oldName, newName){
  var top=chain(n.id)[0];
  await persist(n,{name:newName});
  if(sb && !LOCAL){
    try{
      if(n.level==='list') await sb.from('todos').update({section:newName}).eq('section',oldName).eq('bucket','library');
      else await sb.from('todos').update({subsection:newName}).eq('section',top.name).eq('subsection',oldName).eq('bucket','library');
      TASKS.forEach(function(t){ if(n.level==='list'){ if(t.section===oldName) t.section=newName; }
        else if(t.section===top.name && t.subsection===oldName) t.subsection=newName; });
    }catch(e){ console.warn(e); }
  }
  render();
}

async function deleteTask(t){
  var snap=Object.assign({},t);
  TASKS=TASKS.filter(function(x){return x.id!==t.id;}); render();
  if(!LOCAL&&sb){ try{ var r=await sb.from('todos').delete().eq('id',t.id); if(r&&r.error) throw r.error; }catch(e){ TASKS.push(snap); render(); showToast('That did not delete. Try again.'); return; } }
  var short=t.task.length>40?t.task.slice(0,40)+'...':t.task;
  showToast('Deleted "'+short+'".','Undo',async function(){
    TASKS.push(snap); render();
    if(!LOCAL&&sb){ try{ var q=await sb.from('todos').insert(snap); if(q&&q.error) throw q.error; }catch(e){ TASKS=TASKS.filter(function(x){return x.id!==snap.id;}); render(); showToast('Could not bring that one back.'); } }
  });

async function sendOut(t, where){
  if(LOCAL||!window.PYMoves){ showToast('Sign in on Todays Tasks first, then this can move it.'); return; }
  var label=t.origin_section||PYMoves.labelForPlace(t.section,t.subsection);
  var was={staged:false,bucket:'library',section:t.section,subsection:t.subsection||null,origin_section:t.origin_section||null,position:t.position||0};
  /* v3.4: the screen moves first; the save runs in the background */
  TASKS=TASKS.filter(function(x){return x.id!==t.id;}); render();
  var job; try{ job = where==='today' ? PYMoves.toToday(t.id,label) : PYMoves.toStaging(t.id,label,'lib'); }catch(e){ job=Promise.reject(e); }
  job.catch(function(e){ TASKS.push(t); render(); showToast('That did not move. '+(e&&e.message&&e.message.length<120?e.message:'Check your connection and try again.')); });
  var short=t.task.length>40?t.task.slice(0,40)+'...':t.task;
  showToast('Sent "'+short+'" to '+(where==='today'?"Today's Todos":'the Staging Area')+'.','Undo',function(){
    TASKS.push(t); render();
    PYMoves.patch(t.id,was).then(function(){ if(where==='today') return PYMoves.lineBy(-1); }).catch(function(){ showToast('Could not undo that one.'); });
  });
}

/* ---- v3.7, Scott Nov 25: two columns in the right panel ----------------------------------
   Each section remembers which column it sits in, and each list remembers how wide its two
   columns are. Both are saved to your system, so a laptop and a phone agree. A section with
   no column saved yet is placed by size, so the two sides start roughly even. */
function secWeight(P){
  var w=2; kids(P.id).forEach(function(C){ w += 1 + tasksFor(C).length; });
  return w + tasksFor(P).length;
}
function assignCols(ks){
  var map={}, w1=0, w2=0;
  ks.forEach(function(P){ if(P.col===1||P.col===2){ map[P.id]=P.col; if(P.col===1) w1+=secWeight(P); else w2+=secWeight(P); } });
  ks.forEach(function(P){ if(map[P.id]) return; var w=secWeight(P);
    if(w1<=w2){ map[P.id]=1; w1+=w; } else { map[P.id]=2; w2+=w; } });
  return map;
}
function paneCols(n, ks, col){

function splitDrag(bar, box, n){

    if(e.button && e.button!==0) return;

    var cur=null;
    function move(ev){

      var pc=((ev.clientX-r.left)/r.width)*100;
      [33.3,50,66.7].forEach(function(sn){ if(Math.abs(pc-sn)<3) pc=sn; });
      pc=Math.max(25,Math.min(75,pc)); cur=Math.round(pc*10)/10;

  mine.splice(idx,0,P);

  var upd=[];

    if(x.col!==c || x.position!==pos){ x.col=c; x.position=pos; upd.push(x); } }); }
  if(target===1){ stamp(mine,1,1); stamp(other,2,1001); } else { stamp(other,1,1); stamp(mine,2,1001); }

function sectionDrag(grip, P){
  grip.addEventListener('pointerdown', function(e){
    if(e.button && e.button!==0) return;

    var wrap = grip.closest('.subl');
    var sx=e.clientX, sy=e.clientY, started=false, holdT=null, ghost=null, markEl=null, drop=null;
    function begin(){ started=true; if(wrap) wrap.classList.add('sdrag'); document.body.style.userSelect='none';
      ghost=document.createElement('div'); ghost.textContent=P.name;
      ghost.style.cssText='position:fixed;z-index:9999;pointer-events:none;background:#fff;border:1px solid #dfe3ea;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:5px 10px;font-size:13px;font-weight:600;color:#2b3137';
      document.body.appendChild(ghost); place(e); }
    function place(ev){ if(ghost){ ghost.style.left=(ev.clientX+14)+'px'; ghost.style.top=(ev.clientY+10)+'px'; } }
    if(touch){ holdT=setTimeout(begin, HOLD_MS); } else { begin(); }
    function clearMark(){ if(markEl){ markEl.classList.remove('dropline'); markEl.classList.remove('colover'); markEl=null; } }
    function move(ev){
      if(!started){ if(Math.abs(ev.clientX-sx)>HOLD_SLOP || Math.abs(ev.clientY-sy)>HOLD_SLOP){ clearTimeout(holdT); cleanup(false); } return; }
      ev.preventDefault(); place(ev);
      var over=document.elementFromPoint(ev.clientX, ev.clientY);
      clearMark(); drop=null;
      if(over && over.closest){
        var sub=over.closest('.subl');
        if(sub && sub!==wrap && sub.parentElement && sub.parentElement.classList.contains('pcol')){
          var r=sub.getBoundingClientRect();

function moveTaskNextTo(t, other, after){

  var idx=list.length;
  for(var i=0;i<list.length;i++){ if(list[i].id===other.id){ idx = after ? i+1 : i; break; } }

  var upd=[];

  render();

      /* v3.6, Scott Nov 23: any place that is a Library section can take the task, in the rail
         OR in the right-hand pane, so a task can go from one section straight to the next. */
      /* v3.8: a row under the pointer wins, so the task lands in an exact spot */
      var row = over && over.closest ? over.closest('.its .r[data-tid]') : null;
      if(row && row!==li){
        if(hostEl){ hostEl.classList.remove('dropline'); hostEl.classList.remove('dropup'); hostEl.classList.remove('dropdn'); }
        var rr=row.getBoundingClientRect(), aft = ev.clientY > rr.top + rr.height/2;
        row.classList.add(aft?'dropdn':'dropup');
        hostEl=row; target=null; rowTarget={id:row.dataset.tid, after:aft};
        edgeScroll(ev, row); openShut(null, null);
        return;
      }
      rowTarget=null;
      var nel = over && over.closest ? over.closest('[data-nid]') : null;
      var tn = nel ? node(nel.dataset.nid) : null;
      var host = nel;
      if(nel && nel.closest('#rail')) host = nel.querySelector(':scope > .rrow, :scope > .rsub') || nel;
      if(hostEl && hostEl!==host){ hostEl.classList.remove('dropline'); hostEl.classList.remove('dropup'); hostEl.classList.remove('dropdn'); }
      hostEl = host; target = tn;
      if(host && tn) host.classList.add('dropline');
      edgeScroll(ev, nel);
      openShut(nel, tn);
    }
    function up(){ clearTimeout(holdT); cleanup(true); }
    function cleanup(drop){
      document.removeEventListener('pointermove', move, {passive:false});
      document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', cancel);
      document.body.style.userSelect=''; li.classList.remove('dragging');
      stopEdge(); clearTimeout(OPEN_T); OPEN_ID=null;
      if(hostEl){ hostEl.classList.remove('dropline'); hostEl.classList.remove('dropup'); hostEl.classList.remove('dropdn'); }
      if(ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
      var tn=target, rt=rowTarget, was=started; started=false; hostEl=null; target=null; rowTarget=null;
      if(drop && was && rt){
        var other=null; for(var i=0;i<TASKS.length;i++) if(TASKS[i].id===rt.id){ other=TASKS[i]; break; }
        if(other) moveTaskNextTo(t, other, rt.after);
      }
      else if(drop && was && tn) moveTaskToNode(t, tn);
    }
    function cancel(){ clearTimeout(holdT); cleanup(false); }
    document.addEventListener('pointermove', move, {passive:false});
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', cancel);
  });
}

/* ---------- drag to reorder, mouse and touch ---------- */
var HOLD_MS=320, HOLD_SLOP=10;
function dragHandle(grip, n){
  grip.addEventListener('pointerdown', function(e){
    if(e.button && e.button!==0) return;
    e.preventDefault(); e.stopPropagation();
    var touch = e.pointerType!=='mouse';
    var sx=e.clientX, sy=e.clientY, started=false, holdT=null;
    var rowEl = grip.closest('.rsub2') || grip.closest('.rsub') || grip.closest('.rrow');
    var carrier = grip.closest('.rsub2') || grip.closest('[data-nid]');
    function begin(){ started=true; if(rowEl) rowEl.classList.add('dragging'); document.body.style.userSelect='none'; }
    if(touch){ holdT=setTimeout(begin, HOLD_MS); } else { begin(); }
    function move(ev){
      if(!started){ if(Math.abs(ev.clientX-sx)>HOLD_SLOP || Math.abs(ev.clientY-sy)>HOLD_SLOP){ clearTimeout(holdT); cleanup(); } return; }
      ev.preventDefault();
      var over=document.elementFromPoint(ev.clientX, ev.clientY); if(!over) return;
      var host = over.closest('.rsub2') || over.closest('.rsub') || over.closest('.rrow'); if(!host || host===rowEl) return;
      var hostNodeEl = host.closest('.rsub2') || host.closest('[data-nid]'); if(!hostNodeEl) return;
      var hid=hostNodeEl.dataset.nid, target=node(hid), me=n;
      if(!target || target.parent_id!==me.parent_id) return;
      swap(me, target);
      render();
      rowEl=null; carrier=null;
      var again=document.querySelector('[data-nid="'+me.id+'"]');
      if(again){ rowEl = again.querySelector('.rrow') || again.querySelector('.rsub') || again; rowEl.classList.add('dragging'); }
    }
    function up(){ clearTimeout(holdT); cleanup(); }
    function cleanup(){
      document.removeEventListener('pointermove', move, {passive:false});
      document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
      document.body.style.userSelect='';
      document.querySelectorAll('.dragging').forEach(function(x){ x.classList.remove('dragging'); });
      if(started) persistOrder(n.parent_id);
      started=false;
    }
    document.addEventListener('pointermove', move, {passive:false});
    document.addEventListener('pointerup', up);
    document.addEventListener('pointercancel', up);
  });
}
function swap(a,b){ var p=a.position; a.position=b.position; b.position=p; }
function persistOrder(parentId){
  var sibs=kids(parentId); saveLocal();
  if(LOCAL||!sb) return;
  sibs.forEach(function(s){ sb.from('task_library').update({position:s.position}).eq('id', s.dbid).then(function(){},function(){}); });
}

function mkSw(c,n){ var b=document.createElement('button'); b.type='button'; b.className='sw'; b.style.background=c;
  var i=PALETTE.indexOf(c); tip(b, i>=0?PALETTE_NAMES[i]:'Your color');

    window.addEventListener('scroll', hidePicker, true); window.addEventListener('resize', hidePicker); }
  var keep=swPicker; swBar.innerHTML=''; swBar.appendChild(keep);
  var l=document.createElement('div'); l.className='lab'; l.textContent='Color'; swBar.appendChild(l);

  if(customColors.length){
    var l2=document.createElement('div'); l2.className='lab'; l2.textContent='Your colors'; swBar.appendChild(l2);
    var r2=document.createElement('div'); r2.className='sws'; swBar.appendChild(r2);
    customColors.forEach(function(c){ r2.appendChild(mkSw(c,n)); });
  }
  var l3=document.createElement('div'); l3.className='lab'; l3.textContent='More'; swBar.appendChild(l3);
  var r3=document.createElement('div'); r3.className='sws'; swBar.appendChild(r3);
  var plus=document.createElement('button'); plus.type='button'; plus.className='sw plus'; tip(plus,'Pick any color'); plus.innerHTML='<span>+</span>';
  plus.addEventListener('click',function(e){ e.stopPropagation(); swPicker.value=(n.color&&/^#[0-9a-f]{6}$/i.test(n.color))?n.color:'#3f6f8f'; swPicker.click(); });
  r3.appendChild(plus);
  swPicker.onchange=function(){ var c=swPicker.value, t=swNode; if(!t) return;
    customColors=[c].concat(customColors.filter(function(x){return x.toLowerCase()!==c.toLowerCase();})).slice(0,6);
    try{ localStorage.setItem('py_tasklib_colors', JSON.stringify(customColors)); }catch(e){}
    applyColor(t,c); };
  var reset=document.createElement('button'); reset.type='button'; reset.className='sw tool'; tip(reset,'Back to no color'); reset.textContent='↺';
  reset.addEventListener('click',function(e){ e.stopPropagation(); applyColor(n,null); }); r3.appendChild(reset);
  var l4=document.createElement('div'); l4.className='lab'; l4.textContent='Icon in front'; swBar.appendChild(l4);
  var r4=document.createElement('div'); swBar.appendChild(r4);
  buildIconPicker(r4, n.icon, function(v){ hidePicker(); persist(n,{icon:v}); render(); });
  swBar.classList.add('show');
  var r=anchor.getBoundingClientRect(), w=swBar.offsetWidth, h=swBar.offsetHeight;
  swBar.style.left=Math.max(8, Math.min(r.left, window.innerWidth-w-8))+'px';
  var top=r.bottom+6; if(top+h>window.innerHeight-8) top=Math.max(8, r.top-h-6);
  swBar.style.top=top+'px';
}
function buildIconPicker(box,current,onPick){
  box.innerHTML='';
  var row=document.createElement('div'); row.className='icrow'; box.appendChild(row);
  var cur=current||'';
  function add(val,name,html){ var b=document.createElement('button'); b.type='button'; b.className='ic'+(cur===val?' on':''); tip(b,name); b.innerHTML=html;
    b.addEventListener('click',function(e){ e.stopPropagation(); onPick(val||null); }); row.appendChild(b); }
  add('','None','A');

  var emo=document.createElement('input'); emo.className='emoin'; emo.maxLength=8; emo.placeholder='Or type any emoji, then Enter';
  if(cur.indexOf('e:')===0) emo.value=cur.slice(2);
  emo.addEventListener('change',function(){ var v=emo.value.trim(); onPick(v?'e:'+v:null); });
  emo.addEventListener('mousedown',function(e){ e.stopPropagation(); });
  box.appendChild(emo);
}
