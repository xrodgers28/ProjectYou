<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved &middot; ProjectYou</title>
<script src="py-day.js"></script>
</head>
<body>
<div class="pynav"></div>
<style>
  :root{
    --ink:#1f2a44; --onbg:#1f2a44; --muted:#5b6472; --faint:#9aa6b4;
    --line:#e3e7ee; --bg:#eef1f6; --card:#fff; --key:#c2c8d1;
    --sunk:#f6f8fb; --accent:#3f6f8f; --acc:#a35a4e;
    --bad:#b8433a; --badbg:#f7e6e4; --star:#c98a1f;
    --shadow:0 12px 34px rgba(31,42,68,.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#1f2a44; --onbg:#e7eaf0; --muted:#5b6472; --faint:#8892a3;
      --line:#c9d0dc; --bg:#0f1420; --card:#e7eaf0; --key:#b7c0cf;
      --sunk:#d9dee8; --accent:#3f6f8f; --acc:#a35a4e;
      --bad:#b8433a; --badbg:#f2ddda; --star:#a9741a;
      --shadow:0 12px 34px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --ink:#1f2a44; --onbg:#e7eaf0; --muted:#5b6472; --faint:#8892a3;
    --line:#c9d0dc; --bg:#0f1420; --card:#e7eaf0; --key:#b7c0cf;
    --sunk:#d9dee8; --accent:#3f6f8f; --acc:#a35a4e;
    --bad:#b8433a; --badbg:#f2ddda; --star:#a9741a;
    --shadow:0 12px 34px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:Arial,Helvetica,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 14px 80px}
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .kick{font-size:10.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--acc)}
  h1{font-size:27px;margin:5px 0 0;letter-spacing:-.2px;color:var(--onbg)}
  .sub{font-size:12.5px;color:var(--onbg);opacity:.72;margin-top:5px}
  .tool{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
        padding:8px 12px;border-radius:8px;border:1px solid var(--key);background:var(--card);
        color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
  .tool:hover{border-color:var(--accent);color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px;margin-top:16px}
  .it{position:relative;background:var(--card);border:1px solid var(--key);border-radius:14px;
      overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .it img{width:100%;height:150px;object-fit:cover;display:block;background:var(--line)}
  .it .t{padding:10px 11px 6px;font-size:12px;line-height:1.4;flex:1}
  .it .t a{color:inherit;text-decoration:none}
  .it .t a:hover{text-decoration:underline}
  .it .m{padding:0 11px 10px;font-size:8.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
  .rm{position:absolute;top:7px;right:7px;width:28px;height:28px;border-radius:50%;
      border:0;background:var(--star);color:#fff;cursor:pointer;display:grid;place-items:center;padding:0;z-index:2}
  .rm svg{width:14px;height:14px;fill:currentColor;stroke:currentColor;stroke-width:1.9}
  .empty{background:var(--card);border:1px dashed var(--key);border-radius:14px;
         padding:30px 20px;text-align:center;color:var(--muted);margin-top:18px;font-size:14px}
  .err{background:var(--badbg);border:1px solid var(--bad);color:var(--bad);
       border-radius:12px;padding:12px 14px;margin-top:14px;font-size:13px}
  .stamp{margin-top:18px;font-size:10.5px;letter-spacing:.6px;color:var(--muted);text-align:center}
  .sec2{margin-top:26px}
  .sechd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .sechd h2{font-size:16px;margin:0;color:var(--onbg)}
  .sechd .n{font-size:11px;color:var(--muted)}
  .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .wit{position:relative;border-radius:12px;overflow:hidden;border:2px solid transparent;cursor:pointer;background:var(--card);box-shadow:var(--shadow)}
  .wit img{width:100%;height:110px;object-fit:cover;display:block;background:var(--line)}
  .wit.picked{border-color:var(--star)}
  .wit .pk{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;padding:0}
  .wit.picked .pk{background:var(--star)}
  .wit .pk svg{width:12px;height:12px;fill:currentColor;stroke:currentColor;stroke-width:1.9}
  .tally{display:flex;flex-wrap:wrap;gap:8px}
  .tchip{font-size:11px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--card);border:1px solid var(--key);color:var(--muted)}
  .tchip b{color:var(--ink);font-weight:800}
  .catsec{margin-top:20px}
  .catsec:first-child{margin-top:0}
  .cathd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 0 8px}
  .cathd h3{font-size:13.5px;margin:0;color:var(--onbg);text-transform:uppercase;letter-spacing:.4px}
  .cathd .n{font-size:11px;color:var(--muted)}
  .movesel{margin:0 11px 10px;font-size:10.5px;padding:5px 6px;border-radius:6px;border:1px solid var(--key);background:var(--sunk);color:var(--ink)}
</style>

<div class="wrap">
  <div class="head">
    <div>
      <div class="kick">Kept off the wall</div>
      <h1>Saved</h1>
    <!-- The ONLY place this page's version is written. The publish guard reads class="ver" and navpatch reads #ver, so both see this one literal. Do not add a second one anywhere. -->
    <span id="ver" class="ver">v1.2</span>
      <div class="sub" id="sub">Loading</div>
    </div>
    <a class="tool" href="wall.html">Back to the wall</a>
  </div>

  <div class="sec2">
    <div class="sechd"><h2>This week's picks</h2><span class="n" id="weekn"></span></div>
    <div id="weekbody"></div>
  </div>

  <div class="sec2">
    <div class="sechd"><h2>Where you keep going back</h2></div>
    <div class="tally" id="tally"></div>
  </div>

  <div class="sechd" style="margin-top:26px"><h2>Everything you've kept</h2></div>
  <div id="body"></div>
  <div id="err"></div>
  <div class="stamp" id="stamp">v1.2</div>
</div>

<script>
var SB="https://arnjntspmrhigodlssbn.supabase.co";
var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFybmpudHNwbXJoaWdvZGxzc2JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMTQ0NTgsImV4cCI6MjEwMTg5MDQ1OH0.UN4JMuoKaAWQfhiCstuoOJQ1sVU2hU5pK0tLBY60dfM";
function api(path,opts){
  opts=opts||{};
  var h={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
  return fetch(SB+"/rest/v1/"+path,{method:opts.method||"GET",headers:h,body:opts.body})
    .then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error(r.status+" "+t.slice(0,140)); });
      return r.status===204?null:r.json();
    });
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
var TICK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.85-4.2 4.1 1 5.75L12 16.9l-5.2 2.7 1-5.75-4.2-4.1 5.8-.85z" stroke-linejoin="round"/></svg>';
var ROWS=[];
var WK=null, WKEND=null, WROWS=[], FAVS={};

/* Everything you've kept, sorted into sections. Each source maps to one section;
   an item can override that with category_override (set via the Move to control
   on anything sitting in Other). Sections render biggest first, empty ones skipped. */
var CAT_ORDER=['Infographics','Data visualization','Ad concepts','Art & design','Maps','Other'];
var SOURCE_CAT={
  coolguides:'Infographics', infographics:'Infographics',
  visualization:'Data visualization', dataisbeautiful:'Data visualization', flowingdata:'Data visualization', visualcapitalist:'Data visualization',
  activationideas:'Ad concepts', luerzers:'Ad concepts',
  colossal:'Art & design', booooooom:'Art & design', sightunseen:'Art & design', yankodesign:'Art & design', yatzer:'Art & design', newyorker:'Art & design',
  mapporn:'Maps'
};
function catFor(r){
  if(r.category_override) return r.category_override;
  var it=r.wall_items||{};
  return SOURCE_CAT[it.source_key]||'Other';
}

function mondayOf(ymd){
  var p=ymd.split("-").map(Number);
  var d=new Date(Date.UTC(p[0],p[1]-1,p[2],12,0,0));
  var dow=d.getUTCDay();
  d.setUTCDate(d.getUTCDate()+(dow===0?-6:1-dow));
  return d.toLocaleDateString("en-CA",{timeZone:"UTC"});
}
function addDays(ymd,n){
  var p=ymd.split("-").map(Number);
  var d=new Date(Date.UTC(p[0],p[1]-1,p[2],12,0,0));
  d.setUTCDate(d.getUTCDate()+n);
  return d.toLocaleDateString("en-CA",{timeZone:"UTC"});
}

function paintWeek(){
  var b=document.getElementById("weekbody");
  var picked=Object.keys(FAVS).length;
  document.getElementById("weekn").textContent=picked+" of 3 picked · "+WK+" to "+WKEND;
  if(!WROWS.length){
    b.innerHTML='<div class="empty">Nothing starred this week yet.</div>';
    return;
  }
  var h='<div class="wgrid">';
  WROWS.forEach(function(r){
    var it=r.wall_items||{};
    var on=FAVS[r.item_id]!=null;
    h+='<div class="wit'+(on?" picked":"")+'" data-pick="'+r.item_id+'">'+
       '<img src="'+esc(it.img)+'" alt="" decoding="async">'+
       '<span class="pk">'+TICK+'</span></div>';
  });
  b.innerHTML=h+"</div>";
}

function paintTally(){
  var counts={};
  ROWS.forEach(function(r){
    var k=(r.wall_items&&r.wall_items.source_key)||"other";
    counts[k]=(counts[k]||0)+1;
  });
  var list=Object.keys(counts).map(function(k){return [k,counts[k]];})
    .sort(function(a,b){return b[1]-a[1];}).slice(0,6);
  var t=document.getElementById("tally");
  if(!list.length){ t.innerHTML='<span class="n">Nothing starred yet.</span>'; return; }
  t.innerHTML=list.map(function(p){return '<span class="tchip"><b>'+p[1]+'</b> '+esc(p[0])+'</span>';}).join("");
}

function paint(){
  var b=document.getElementById("body");
  if(!ROWS.length){
    b.innerHTML='<div class="empty">Nothing kept yet. Tap the star on anything on the wall and it lands here.</div>';
    document.getElementById("sub").textContent="Nothing kept yet";
    return;
  }
  var groups={};
  ROWS.forEach(function(r){
    var c=catFor(r);
    (groups[c]=groups[c]||[]).push(r);
  });
  var cats=Object.keys(groups).sort(function(a,b){ return groups[b].length-groups[a].length; });
  var h='';
  cats.forEach(function(cat){
    var rows=groups[cat];
    h+='<div class="catsec"><div class="cathd"><h3>'+esc(cat)+'</h3><span class="n">'+rows.length+(rows.length===1?" thing":" things")+'</span></div><div class="grid">';
    rows.forEach(function(r){
      var it=r.wall_items||{};
      h+='<div class="it"><button class="rm" type="button" data-rm="'+r.item_id+'" aria-label="Remove from saved">'+TICK+'</button>'+
         '<a href="'+esc(it.link)+'" target="_blank" rel="noopener noreferrer"><img src="'+esc(it.img)+'" alt="" decoding="async"></a>'+
         '<div class="t"><a href="'+esc(it.link)+'" target="_blank" rel="noopener noreferrer">'+esc(it.title)+'</a></div>'+
         '<div class="m">'+esc(it.source_key)+' · kept '+esc(String(r.saved_at).slice(0,10))+'</div>';
      if(cat==='Other'){
        h+='<select class="movesel" data-move="'+r.item_id+'"><option value="">Move to&hellip;</option>'+
           CAT_ORDER.filter(function(c){return c!=='Other';}).map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>';}).join('')+
           '</select>';
      }
      h+='</div>';
    });
    h+='</div></div>';
  });
  b.innerHTML=h;
  document.getElementById("sub").textContent=ROWS.length+(ROWS.length===1?" thing kept":" things kept");
}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-rm]");
  if(!b) return;
  e.preventDefault();
  var id=+b.getAttribute("data-rm");
  var keep=ROWS;
  ROWS=ROWS.filter(function(r){ return r.item_id!==id; });
  paint();
  api("wall_saved?item_id=eq."+id,{method:"DELETE"}).catch(function(err){
    ROWS=keep; paint();
    document.getElementById("err").innerHTML='<div class="err">Could not remove that one: '+esc(err.message)+'</div>';
  });
});

document.addEventListener("click",function(e){
  var w=e.target.closest("[data-pick]");
  if(!w) return;
  var id=+w.getAttribute("data-pick");
  var on=FAVS[id]!=null;
  if(!on && Object.keys(FAVS).length>=3) return;
  if(on){
    var rank=FAVS[id];
    delete FAVS[id];
    paintWeek();
    api("wall_favorites?item_id=eq."+id+"&week_start=eq."+WK,{method:"DELETE"}).catch(function(err){
      FAVS[id]=rank; paintWeek();
      document.getElementById("err").innerHTML='<div class="err">Could not un-pick that one: '+esc(err.message)+'</div>';
    });
  }else{
    var used=Object.keys(FAVS).map(function(k){return FAVS[k];});
    var rank=1; while(used.indexOf(rank)!==-1) rank++;
    FAVS[id]=rank;
    paintWeek();
    api("wall_favorites",{method:"POST",body:JSON.stringify({item_id:id,week_start:WK,rank:rank})}).catch(function(err){
      delete FAVS[id]; paintWeek();
      document.getElementById("err").innerHTML='<div class="err">Could not save that pick: '+esc(err.message)+'</div>';
    });
  }
});

document.addEventListener("change",function(e){
  var s=e.target.closest("[data-move]");
  if(!s || !s.value) return;
  var id=+s.getAttribute("data-move");
  var cat=s.value;
  var row=ROWS.filter(function(r){ return r.item_id===id; })[0];
  var prev=row?row.category_override:null;
  if(row) row.category_override=cat;
  paint();
  api("wall_saved?item_id=eq."+id,{method:"PATCH",body:JSON.stringify({category_override:cat})}).catch(function(err){
    if(row) row.category_override=prev;
    paint();
    document.getElementById("err").innerHTML='<div class="err">Could not move that one: '+esc(err.message)+'</div>';
  });
});

api("wall_saved?select=item_id,saved_at,category_override,wall_items(title,link,img,source_key)&order=saved_at.desc&limit=400")
  .then(function(rows){
    ROWS=rows||[];
    document.getElementById("stamp").textContent="v1.2 · this week's picks, your top sources & everything you've kept, sorted into sections";
    paint();
    WK=mondayOf(PY.today());
    WKEND=addDays(WK,7);
    WROWS=ROWS.filter(function(r){
      var d=PY.day(r.saved_at);
      return d>=WK && d<WKEND;
    });
    paintWeek();
    paintTally();
    api("wall_favorites?week_start=eq."+WK+"&select=item_id,rank")
      .then(function(favs){
        (favs||[]).forEach(function(f){ FAVS[f.item_id]=f.rank; });
        paintWeek();
      })
      .catch(function(){});
  })
  .catch(function(e){
    document.getElementById("err").innerHTML='<div class="err">Could not load what you saved: '+esc(e.message)+'</div>';
    document.getElementById("sub").textContent="";
  });
</script>

<script src="nav-config.js"></script><script src="navpatch.js"></script></body>
</html>
