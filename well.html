<style>
  :root{--ink:#1f2a44;--muted:#5b6472;--line:#e3e7ee;--bg:#eef1f6;--card:#fff;--accent:#3f6f8f;--accent2:#2f5a74}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
  .stage{max-width:560px;margin:0 auto;padding:22px 16px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 24px 20px;min-height:420px;display:flex;flex-direction:column;box-shadow:0 14px 40px rgba(31,42,68,.10)}
  .datestamp{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:#9aa6b4;margin-bottom:10px}
  .logo{display:block;width:100%;max-width:200px;height:auto;margin:0 0 18px}
  .kicker{font-size:11.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
  h2{font-size:23px;line-height:1.22;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
  .dek{font-size:15px;color:var(--muted);line-height:1.42;margin:0 0 6px}
  .byline{font-size:12px;color:#9aa6b4;margin:0 0 16px;font-style:italic}
  .rule{height:1px;background:var(--line);margin:6px 0 14px}
  .alsohead{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#9aa6b4;margin:0 0 10px}
  ul{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:11px}
  li{font-size:14.5px;line-height:1.35;display:flex;gap:9px}
  li .n{font-size:11px;color:#9aa6b4;flex:none;padding-top:2px;min-width:12px}
  li a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
  li .src{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .spacer{flex:1}
  .cta{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:16px;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:12px;padding:14px 18px}
  .alt{display:block;text-align:center;font-size:12.5px;color:var(--accent2);margin:12px 0 0}
  .foot{font-size:11.5px;color:#9aa6b4;margin:10px 0 0;text-align:center}
  .quiet{font-size:15px;color:var(--muted);line-height:1.45}
  .badge{position:fixed;right:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:11px;color:var(--muted)}
</style>
</head>

<script>
const SUPABASE_URL="https://arnjntspmrhigodlssbn.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFybmpudHNwbXJoaWdvZGxzc2JuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMTQ0NTgsImV4cCI6MjEwMTg5MDQ1OH0.UN4JMuoKaAWQfhiCstuoOJQ1sVU2hU5pK0tLBY60dfM";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const SECTION="https://www.nytimes.com/section/well";
const MAIL="https://mail.google.com/mail/u/0/#all/";

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function today(){ try{ if(window.PY&&PY.today) return PY.today(); }catch(e){} return new Date().toISOString().slice(0,10); }

function stamp(){
  var dt=new Date(today()+'T12:00:00');
  document.getElementById('dstamp').textContent=
    dt.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',year:'numeric',timeZone:'America/New_York'});
}

function render(iss){
  var slot=document.getElementById('slot');
  if(!iss){
    slot.innerHTML='<p class="kicker">Nothing waiting</p>'
      +'<p class="quiet">Every issue in hand has been read. The next one lands Tuesday or Thursday.</p>'
      +'<div class="spacer"></div>'
      +'<a class="alt" href="'+SECTION+'" target="_blank" rel="noopener">Browse Well at the Times instead</a>';
    return;
  }
  var roundup = iss.kind==='roundup';
  var stories = iss.stories||[];
  var list = stories.slice(0,5).map(function(s,i){
    var head = s.u ? '<a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.t)+'</a>' : esc(s.t);
    return '<li><span class="n">'+(i+1)+'</span><span>'+head
      +(s.s?'<span class="src">'+esc(s.s)+'</span>':'')+'</span></li>';
  }).join('');
  var when=new Date(iss.issue_date+'T12:00:00')
      .toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',timeZone:'America/New_York'});

  slot.innerHTML=
     '<p class="kicker">'+(roundup?'5 you might have missed':'This week’s essay')+'</p>'
    +'<h2>'+esc(iss.title)+'</h2>'
    +(iss.dek?'<p class="dek">'+esc(iss.dek)+'</p>':'')
    +(iss.byline?'<p class="byline">By '+esc(iss.byline)+'</p>':'')
    +(list?'<div class="rule"></div><p class="alsohead">'+(roundup?'The five':'Also in this issue')+'</p><ul>'+list+'</ul>':'')
    +'<div class="spacer"></div>'
    +'<a class="cta" id="open" href="'+esc(iss.issue_url||(iss.gmail_id?MAIL+iss.gmail_id:SECTION))+'" target="_blank" rel="noopener">'+(iss.issue_url?'Read this issue':'Open the email')+'</a>'
    +(iss.issue_url&&iss.gmail_id?'<a class="alt" href="'+MAIL+esc(iss.gmail_id)+'" target="_blank" rel="noopener">Or open the email in Gmail</a>':'')
    +'<p class="foot">'+when+' issue · 5 minutes · <a href="index.html" style="color:#2f5a74">tick Well off on today’s list</a></p>';

  var btn=document.getElementById('open');
  if(btn) btn.addEventListener('click', function(){
    sb.from('well_issues').update({shown_on: today()}).eq('issue_date', iss.issue_date)
      .then(function(r){ if(r.error) console.error('mark shown failed', r.error); });
  });
}

(async function(){
  stamp();
  try{
    var q = await sb.from('well_issues')
      .select('issue_date,weekday,kind,title,dek,byline,issue_url,gmail_id,stories')
      .is('shown_on', null).order('issue_date',{ascending:false}).limit(1);
    if(q.error) throw q.error;
    if(!q.data || !q.data.length){
      var all = await sb.from('well_issues')
        .select('issue_date,weekday,kind,title,dek,byline,issue_url,gmail_id,stories')
        .order('issue_date',{ascending:false}).limit(1);
      if(all.error) throw all.error;
      render(all.data && all.data.length ? all.data[0] : null);
      return;
    }
    render(q.data[0]);
  }catch(e){
    console.error('well_issues load failed', e);
    render(null);
  }
})();
</script>
